*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#boot{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;

<script>
"use strict";
var QS = __QS__;
var TR = __TR__;
var NOS = __NOS__;
var POINTS = __POINTS__;
var KB = __KB__;
var REL = __REL__;
var CLOZE = __CLOZE__;
var WRITING = __WRITING__;
var DICT_RAW = __DICT__;
var EX_RAW = __EX__;
var EX=null;
function getEx(){
  if(EX) return EX;
  try{ EX=JSON.parse(EX_RAW); EX_RAW=null; }catch(e){ EX={}; }
  return EX;
}
function formIPA(p){
  if(!p) return "";
  return String(p).replace(/:/g,"ː").replace(/'/g,"ˈ");
}
function posOf(text){
  var m=String(text||"").match(/^\s*([a-zA-Z]{1,5})\./);
  if(!m) return "";
  var p=m[1].toLowerCase();
  if(p==="v"||p==="vt"||p==="vi") return "v";
  if(p==="n") return "n";
  if(p==="a"||p==="adj"||p==="s") return "a";
  if(p==="ad"||p==="adv"||p==="r") return "r";
  return "";
}
function wordInfo(w){
  var d=lookup(w); if(!d) return null;
  var ex=getEx()[String(w).toLowerCase()]||{};
  var t0=d.d.t||"";
  var pm=t0.match(/^\s*([a-zA-Z]{1,5})\./);
  var posGuess=ex.pos||(pm? pm[1].toLowerCase():"");
  var myPos=posOf(t0);
  function samePos(sw){
    var sv=getDict()[String(sw).toLowerCase()];
    if(!sv) return false;
    var sp=posOf(sv.t||"");
    return !(myPos && sp && sp!==myPos);
  }
  var syn=(ex.syn&&ex.syn.length)? ex.syn : (d.d.s||[]).filter(samePos);
  return {w:d.w, t:t0, p:formIPA(d.d.p||""), e:d.d.e||"", syn:syn, de:ex.de||"", pos:posGuess, ant:(ex.a||[]).filter(samePos), ph:ex.ph||[]};
}
var DICT = null;
function getDict(){
  if(DICT) return DICT;
  try{ DICT=JSON.parse(DICT_RAW); DICT_RAW=null; }catch(e){ DICT={}; }
  return DICT;
}

// 自定义题库（可导入新题库而不重装 App）
function applyDataset(){
  try{
    if(typeof S!=="undefined" && S && S.dataset && S.dataset.QS && S.dataset.QS.length){
      QS=S.dataset.QS; TR=S.dataset.TR||{}; NOS=S.dataset.NOS||{};
      return true;
    }
  }catch(e){}
  return false;
}

var MODULES = ["时态","语态与一致","从句","非谓语","虚拟语气","情态动词","倒装与强调","词法与搭配"];
var REASONS = [["concept","概念不清"],["careless","粗心"],["reading","没看懂句子"]];
/* 复习间隔（天）：箱位 0–8；掌握后保留长间隔继续复习，而不是删除记录 */
var INT_MULT = { loose:[3,3,5,8,14,30,60,120,240], normal:[1,1,2,4,7,15,30,60,120], tight:[1,1,1,2,3,7,15,30,60] };
function intDays(box){ var m=INT_MULT[S.settings.reviewIntensity]||INT_MULT.normal; return m[Math.min(box,m.length-1)]; }
/* 难度/表现因子：正确率低、反复遗忘、概念性错误 → 缩短间隔 */
function daysBetween(a,b){ try{ return Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000); }catch(e){ return 0; } }
function easeFactor(i, reason){
  var q=S.q[i]||{n:0,right:0};
  var acc=q.n?q.right/q.n:0.75;

var SPEECH_WARMED=false;
function warmSpeech(){
  try{
    if(SPEECH_WARMED) return;
    if(window.speechSynthesis && window.speechSynthesis.getVoices){ window.speechSynthesis.getVoices(); SPEECH_WARMED=true; }
  }catch(e){}
}
function pronounce(text){
  text=String(text||"").trim();
  if(!text) return;
  warmSpeech();
  try{
    if(window.AndroidNative && typeof AndroidNative.available==="function" && AndroidNative.available()){
      AndroidNative.speak(text); return;
    }
  }catch(e){}
  try{
    if(window.speechSynthesis && typeof SpeechSynthesisUtterance!=="undefined"){
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang="en-US"; u.rate=0.9;
      // iOS 上部分版本需要 resume 才会真正出声
      try{ window.speechSynthesis.resume(); }catch(e){}
      window.speechSynthesis.speak(u);
      return;
    }
  }catch(e){}
  toast("此环境不支持朗读");
}

/* ---------- 薄弱知识点 ---------- */
function weakList(){
  var arr=[];
  for(var i=0;i<POINTS.length;i++){
    var p=POINTS[i][0], s=pointStats(p);
    if(s.total>0){
      var acc=s.acc===null?1:s.acc;
      // 贝叶斯平滑：样本少时向 50% 收缩，避免「答 1 题错 1 题」被误判为最薄弱
      var shrunk=(s.right+1.5)/(s.n+3);
      arr.push({p:p, mod:POINTS[i][7], acc:acc, shrunk:shrunk, n:s.n, attempted:s.attempted, done:s.done, total:s.total, mastery:pointMastery(p), low:s.n<3});
    }
  }
  // 有作答记录的知识点按平滑后正确率排序；没有记录的排在最后
  arr.sort(function(a,b){
    if(a.n===0 && b.n>0) return 1;
    if(b.n===0 && a.n>0) return -1;
    return a.shrunk-b.shrunk || a.mastery-b.mastery || b.n-a.n;
  });
  return arr;
}
/* 推荐练习用的薄弱程度：低正确率 + 低掌握度 + 有足够样本 */
function weakScore(x){
  var acc=x.shrunk!==undefined?x.shrunk:(x.acc||0);
  return (1-acc)*60 + (100-(x.mastery||0))*0.4;
}

/* ---------- 解析结构化：思路 / 步骤 / 选项排除 ---------- */
function stepsFor(item){
  var cat=item[0], point=item[7]||"";
  if(cat==="真题·阅读"||cat==="真题·七选五"){
    if(cat==="真题·七选五"){
      return ["看空位前后句，判断这里缺的是观点、例子还是过渡句",
              "找指代词、复现词和逻辑连接词，锁定语义方向",
              "代入选项读一遍，检查前后是否连贯",
              "排除只与局部词重合、但整体逻辑不通的选项"];
    }
    return ["读题干，圈出关键词（人名、时间、比较、程度）",
            "回原文定位对应句，必要时看上下文各一句",
            "逐项比对原文，警惕偷换概念、无中生有、以偏概全",
            "选出与原文信息完全一致、且回答所问的选项"];
  }
  return ["看空处所在句子，判断缺什么成分（主语 / 谓语 / 宾语 / 定语 / 状语）",
          "确定考查点"+(point?"："+point:"")+"，回忆对应规则",
          "按规则变形，先排除形式不对的选项",
          "把选项代回原句，检查时态、语气、搭配与语境是否通顺"];
}
function optionKeys(item){
  var out=[];
  for(var k=0;k<item[2].length;k++){
    if(k===item[3]) continue;
    var full=String(item[2][k]||"").trim();
    if(!full) continue;
    var words=full.split(/[\s（(\/]+/).filter(function(w){return w.length>=4;});
    words.sort(function(a,b){return b.length-a.length;});
    var tok=words[0]||"";
    out.push({k:k, full:full, tok:tok});
  }
  return out;
}
function explainWrongs(item){
  var exp=String(item[4]||"");
  var res={};
  var keys=optionKeys(item), hits=[];
  function push(pos,len,k,tok){ if(pos>=0) hits.push({pos:pos,len:len,k:k,tok:tok}); }
  keys.forEach(function(key){
    var i=exp.indexOf(key.full);
    if(i>=0){ push(i,key.full.length,key.k,key.full); return; }
    if(key.tok && key.tok.length>=4){
      var re=new RegExp("\\b"+key.tok.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i");
      var m=exp.match(re);
      if(m){ push(m.index,m[0].length,key.k,m[0]); }
    }
  });
  hits.sort(function(a,b){return a.pos-b.pos;});
  var ded=[];
  hits.forEach(function(h){
    var last=ded[ded.length-1];
    if(last && last.k===h.k && Math.abs(last.pos-h.pos)<=2){ if(h.len>last.len) ded[ded.length-1]=h; return; }
    ded.push(h);
  });
  for(var i=0;i<ded.length;i++){
    var st=ded[i].pos+ded[i].len;
    var en=(i+1<ded.length)? ded[i+1].pos : exp.length;
    var seg=exp.slice(st,en).replace(/^[\s，,、；;。：:]+/,"").replace(/[。；;]+$/,"").trim();
    if(seg.length>=3 && seg.length<=90 && !/^(故选|因此|所以|故答案|答案)/.test(seg)){
      var shared=/^(都|均|也都|同样|三者|这些|它们|全是)/.test(seg);
      if(shared){
        keys.forEach(function(kk){ if(!res[kk.k]) res[kk.k]="同其他错项："+seg; });
      } else if(!res[ded[i].k]) {
        var cut=seg.split(/[；;。]/)[0].replace(/^[a-zA-Z]{1,3}[，,、\s]+/,"").trim();
        if(cut.length>=3) res[ded[i].k]=cut.replace(/[，,、\s]+$/,"");
      }
    }
  }
  return res;
}
function explainBasis(item){
  var exp=String(item[4]||"");
  var m=exp.match(/依据[：:]\s*([^。]{4,60})/);
  if(m && !/^(考查|考点)/.test(m[1].trim())) return m[1].trim();
  var m2=exp.match(/考点[：:]\s*[^。]+\.([^。]{4,60})/);
  if(m2) return m2[1].trim();
  var first=exp.split(/[。；]/)[0].replace(/^\s+/,"");
  return (first.length>=6 && first.length<=60 && !/考点/.test(first))? first : "";
}
function optForm(o){
  var s=String(o||"").trim().toLowerCase();
  if(!s) return "";
  if(/^to\s+\w/.test(s)) return "to 不定式";
  if(/^(has|have|had)\s/.test(s)) return "完成时结构";
  if(/\b(been|being)\b/.test(s)) return "含 be 的被动/进行结构";
  if(/\b(is|are|was|were|am)\b/.test(s)) return "含 be 的谓语结构";
  var last=s.split(/\s+/).pop();
  if(/ing$/.test(last)) return "现在分词/动名词";
  if(/ed$/.test(last) || /^(went|came|took|made|knew|drew|began|did|was|were|had)\b/.test(s)) return "过去式/过去分词";
  if(/ly$/.test(last)) return "副词";
  if(/^(a|an|the)\b/.test(s)) return "冠词";
  return "原形/其他形式";
}
function explainHTML(item){
  var wrongs=explainWrongs(item), opts=item[2]||[];
  var point=(item[7]||""), basis=explainBasis(item);
  var wrongBrief=[];
  for(var k=0;k<opts.length;k++){
    if(k!==item[3] && wrongs[k]){
      var rs=String(wrongs[k]).replace(/[，,；;。\s]+$/,"").trim();
      var rs2=rs.length>26?rs.slice(0,26)+"…":rs;
      wrongBrief.push("ABCDEFG"[k]+"."+opts[k]+"："+rs2);
    }
  }
  var pointText=point;
  if(!pointText){ var m=String(item[4]||"").match(/考点[：:]\s*([^。]+)/); pointText=m?m[1].trim():(item[0]||"语法"); }
  if(pointText.indexOf("真题·")===0) pointText="阅读/题型理解";
  var step2 = basis? ("找依据："+basis.replace(/[，,；;。\s]+$/,"")) : "回到原句，找到与空格/题干相关的词或结构";
  var steps=[
    "判断考查点："+pointText,
    step2,
    wrongBrief.length? ("逐项排除：先看 "+wrongBrief.slice(0,2).join("； ")) : "对比选项：先排除形式上不符合规则的",
    "得出答案：选 "+"ABCDEFG"[item[3]]+"（"+(opts[item[3]]||"")+"）"
  ];
  var rows="";
  if(opts.length && opts.length<=7){
    rows='<div class="sec" style="padding:12px;margin-top:10px"><h3>选项排除</h3>'+
      opts.map(function(o,k){
        var correct=(k===item[3]);
        var reason=correct?"正确：符合上面的考点规则与依据":
          (wrongs[k]?wrongs[k]:("形式为「"+optForm(o)+"」，与正确项「"+optForm(opts[item[3]])+"」不同，见上方解析"));
        return '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)">'+
          '<b style="min-width:18px;color:'+(correct?"var(--good)":"var(--mute)")+'">'+"ABCDEFG"[k]+'</b>'+
          '<div style="flex:1;min-width:0"><div style="font-size:14px">'+esc(o)+'</div>'+
          '<div class="hint" style="color:'+(correct?"var(--good)":"var(--bad)")+'">'+esc(reason)+'</div></div></div>';
      }).join("")+'</div>';
  }
  return '<div class="sec" style="padding:12px;margin-top:12px"><h3>解题步骤</h3>'+
    '<ol style="margin:0 0 0 18px;padding:0;font-size:14px;line-height:1.75">'+steps.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ol>'+
    (item[7]?'<div class="hint" style="margin-top:6px">考点：'+esc(item[7])+'</div>':"")+'</div>'+
    '<div class="why"><b>解析：</b>'+esc(item[4])+'</div>'+rows;
}

/* ---------- 学习诊断 ---------- *//* ---------- 学习诊断 ---------- */
var REASON_LABEL={concept:"概念不清",careless:"粗心",reading:"没看懂句子"};
var REASON_ADVICE={
  concept:"概念不清为主：先看知识卡，再做 5 题验证",
  careless:"多因粗心：限时重练，做题前先圈出题干关键词",
  reading:"没看懂句子：先练长难句和翻译，再回来做这组题"
};
function pointReasonStats(p){
  var ids=pointIds(p), out={concept:0,careless:0,reading:0,total:0}, i, k, r;
  for(i=0;i<ids.length;i++){
    r=S.reason[ids[i]];
    if(!r) continue;
    for(k in r){ if(out[k]!==undefined) out[k]+=r[k]; out.total+=r[k]; }
  }
  return out;
}
function diagnosePoint(x){
  var rs=pointReasonStats(x.p), top=null, tn=0;
  ["concept","careless","reading"].forEach(function(k){ if(rs[k]>tn){ tn=rs[k]; top=k; } });
  var d={rs:rs, topReason:top, topCount:tn};
  if(x.n===0){
    d.level="none"; d.label="未练"; d.col="var(--mute)";
    d.advice="还没做过题，先练 5 题建立判断";
  } else if(x.n<3){
    d.level="sample"; d.label="样本不足"; d.col="var(--warn)";
    d.advice="只做了 "+x.n+" 题，再做几题才能准确判断";
  } else if(x.shrunk<0.6){
    d.level="weak"; d.label="明显薄弱"; d.col="var(--bad)";
    d.advice=top?REASON_ADVICE[top]:"先做一组题，对照解析找规律";
  } else if(x.shrunk<0.8){
    d.level="improve"; d.label="待巩固"; d.col="var(--warn)";
    d.advice=top?REASON_ADVICE[top]:"正确率一般，再练 5 题巩固";
  } else {
    d.level="stable"; d.label="较稳定"; d.col="var(--good)";
    d.advice="保持手感，隔几天复习一次即可";
  }
  d.score=(1-x.shrunk)*60 + (100-(x.mastery||0))*0.3 + (top==="concept"?8:0) + (top==="reading"?4:0);
  return d;
}
function diagnoseAll(){
  var arr=weakList();
  for(var i=0;i<arr.length;i++) arr[i].diag=diagnosePoint(arr[i]);
  return arr;
}
function moduleWeakSummary(n){
  var all=diagnoseAll(), byMod={};
  for(var i=0;i<all.length;i++){
    var m=all[i].mod; if(!byMod[m]) byMod[m]={mod:m,shrunk:0,w:0,weak:0,total:0};
    byMod[m].shrunk+=all[i].shrunk*(all[i].total||1); byMod[m].w+=(all[i].total||1);
    byMod[m].total++;
    if(all[i].diag.level==="weak"||all[i].diag.level==="improve") byMod[m].weak++;
  }
  var arr=[];
  for(var k in byMod){ var o=byMod[k]; arr.push({mod:o.mod,acc:o.w?o.shrunk/o.w:1,weak:o.weak,total:o.total}); }
  arr.sort(function(a,b){ return b.weak-a.weak || a.acc-b.acc; });
  return arr.slice(0,n||2);
}

/* ---------- 中文反查 ---------- */
var REVIDX=null;
function revIndex(){
  if(REVIDX) return REVIDX;
  REVIDX={};
  var keys=Object.keys(getDict());
  for(var i=0;i<keys.length;i++){
    var w=keys[i];
    if(w.indexOf("'")>=0 || w.indexOf('-')===0) continue;   // 跳过缩写/生僻连字符
    var t=(getDict()[w].t||'');
    // 去掉词性前缀与方括号里的领域标记（[计] [化] 等）
    t=t.replace(/^\s*[a-zA-Z]+\.\s*/,'').replace(/\[[^\]]*\]/g,' ').replace(/【[^】]*】/g,' ').replace(/（[^）]*）/g,' ');
    var segs=t.split(/[^\u4e00-\u9fff]+/);
    for(var j=0;j<segs.length;j++){
      var sg=segs[j];
      if(sg.length<2||sg.length>8) continue;
      var arr=REVIDX[sg]; if(!arr){ arr=REVIDX[sg]=[]; }
      if(arr.length<8 && !arr.some(function(x){return x[0]===w;})) arr.push([w,j]);
    }
  }
  return REVIDX;
}
function isCJK(q){ return /[\u4e00-\u9fff]/.test(q); }
function searchChinese(q,n){
  n=n||12;
  var idx=revIndex(), hit=[];
  var exact=idx[q];
  if(exact) for(var i=0;i<exact.length;i++) hit.push([exact[i][0], exact[i][1]]);   // 完全等于该段
  if(hit.length<n){
    for(var k in idx){
      if(k.length>q.length && k.indexOf(q)===0){
        var arr=idx[k];
        for(var j=0;j<arr.length;j++) hit.push([arr[j][0], 6]);
        if(hit.length>=n*3) break;
      }
    }
  }
  // 排序：译文里越靠前的义项越优先，其次词形短、短语优先
  var seen={}, res=[];
  hit.sort(function(a,b){
    if(a[1]!==b[1]) return a[1]-b[1];
    return a[0].length-b[0].length;
  });
  for(var z=0;z<hit.length;z++){
    var w=hit[z][0];
    if(seen[w]) continue; seen[w]=1; res.push(w);
    if(res.length>=n) break;
  }
  return res;
}

/* ---------- 查词联想 ---------- */
var WORDSORT=null;
function wordList(){ if(!WORDSORT){ WORDSORT=Object.keys(getDict()).sort(); } return WORDSORT; }
function suggestWords(q,n){
  q=String(q||"").toLowerCase().trim();
  if(!q) return [];
  n=n||12;
  var list=wordList(), pre=[], sub=[], near=[];
  for(var i=0;i<list.length;i++){
    var w=list[i];
    if(w.indexOf(q)===0) pre.push(w);
    else if(w.indexOf(q)>0){ if(sub.length<n) sub.push(w); }
    else if(q.length>=2 && w.indexOf(q.slice(0,2))===0 && Math.abs(w.length-q.length)<=2){ if(near.length<n) near.push(w); }
  }
  // 前缀结果不按字母序截断：长度最接近查询词的先出现（impr → improve 而不是 impractical）
  pre.sort(function(a,b){ return Math.abs(a.length-q.length)-Math.abs(b.length-q.length) || a.length-b.length || (a<b?-1:1); });
  return pre.concat(sub, near).slice(0,n);
}

var IDB=null, IDBP=null, IDB_DAY=null;
try{ IDB_DAY=localStorage.getItem("yuhuan_idb_day"); }catch(e){}
function idbOpen(){
  if(IDB) return Promise.resolve(IDB);
  if(IDBP) return IDBP;
  IDBP=new Promise(function(res,rej){
    if(!window.indexedDB) return rej("no idb");
    var r=indexedDB.open("yuhuan",1);
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("snap"); }catch(e){} };
    r.onsuccess=function(){ IDB=r.result; res(IDB); };
    r.onerror=function(){ IDBP=null; rej("idb error"); };
  });

}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction("snap","readwrite");
        tx.objectStore("snap").put(val,key);
        tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction("snap","readonly"), req=tx.objectStore("snap").get(key);
        req.onsuccess=function(){ res(req.result); }; req.onerror=function(){ rej(req.error); };
      }catch(e){ rej(e); }
    });
  });
}

/* ---------- 统计 ---------- */
function qs(i){ if(!S.q[i]) S.q[i]={n:0,right:0}; return S.q[i]; }
function isDone(i){ return !!(S.q[i]&&S.q[i].right>0); }
function pointIds(p){ var a=[]; for(var i=0;i<QS.length;i++){ if(QS[i][7]===p) a.push(i); } return a; }
function moduleIds(m){ var a=[]; for(var i=0;i<QS.length;i++){ if(QS[i][0]===m) a.push(i); } return a; }
function pointProgress(p){ var ids=pointIds(p), d=0; for(var i=0;i<ids.length;i++) if(isDone(ids[i])) d++; return {total:ids.length,done:d}; }
function moduleProgress(m){ var ids=moduleIds(m), d=0; for(var i=0;i<ids.length;i++) if(isDone(ids[i])) d++; return {total:ids.length,done:d}; }
var POINTMOD=null;
function pointMod(p){
  if(!POINTMOD){ POINTMOD={}; for(var i=0;i<POINTS.length;i++) POINTMOD[POINTS[i][0]]=POINTS[i][7]; }
  return POINTMOD[p]||"";
}
/* 知识点统计：真实正确率（不是覆盖率） */
function pointStats(p){
  var ids=pointIds(p), n=0, right=0, attempted=0, done=0;
  for(var i=0;i<ids.length;i++){
    var st=S.q[ids[i]];
    if(st && st.n>0){ n+=st.n; right+=st.right; attempted++; }
    if(isDone(ids[i])) done++;
  }
  return {p:p, mod:pointMod(p), total:ids.length, attempted:attempted, n:n, right:right, done:done, acc:n?right/n:null};
}
/* 掌握度 0–100：正确率 70% + 覆盖度 30% */
function pointBoxStats(p){
  var ids=pointIds(p), boxes=[], graduated=0;
  for(var i=0;i<ids.length;i++){
    var st=S.q[ids[i]];
    if(!st || !st.n) continue;
    var rv=S.rev[ids[i]];
    if(rv){ boxes.push(rv.box||0); }
    else if(st.right>=2 && st.n && st.right/st.n>=0.8){ boxes.push(3); graduated++; }  // 已毕业（box≥5 后移出复习队列）
    else boxes.push(0);
  }
  var sum=0;
  for(var j=0;j<boxes.length;j++) sum+=boxes[j];
  return {count:boxes.length, avg:boxes.length?sum/boxes.length:0, graduated:graduated};
}
/* 掌握度：平滑正确率 50% + 覆盖度 20% + 连续复习表现 30%，并对小样本封顶 */
function pointMastery(p){
  var s=pointStats(p);
  if(!s.n || !s.total) return 0;
  var acc=(s.right+1.5)/(s.n+3);            // 贝叶斯平滑：1 题正确不会直接算满分
  var coverage=s.done/s.total;
  var bs=pointBoxStats(p);
  var streak=Math.min(1, bs.avg/3);          // 平均复习箱到 3（连续答对约 3 次）才算满
  var raw=acc*0.5 + coverage*0.2 + streak*0.3;
  var cap=1;
  if(s.n<3 || s.attempted<2) cap=0.4;        // 样本太少：最多 40
  else if(s.n<6) cap=0.75;                   // 一般样本：最多 75
  if(coverage<0.1) cap=Math.min(cap,0.5);    // 只做过个别题：不能算掌握
  return Math.max(0,Math.min(100,Math.round(Math.min(cap,raw)*100)));
}
function masteryLevel(p){
  var s=pointStats(p), m=pointMastery(p);
  if(!s.n) return {score:0,label:"未练",col:"var(--mute)"};
  if(s.n<3 || s.attempted<2) return {score:m,label:"样本不足",col:"var(--warn)"};
  if(m>=80) return {score:m,label:"稳定掌握",col:"var(--good)"};
  if(m>=55) return {score:m,label:"初步掌握",col:"var(--acc)"};
  return {score:m,label:"未掌握",col:"var(--bad)"};
}
function moduleMastery(m){
  var totalW=0, sum=0;
  for(var i=0;i<POINTS.length;i++){
    if(POINTS[i][7]!==m) continue;
    var s=pointStats(POINTS[i][0]);
    if(!s.total) continue;
    sum+=pointMastery(POINTS[i][0])*s.total; totalW+=s.total;
  }
  return totalW?Math.round(sum/totalW):0;
}
function totalDone(){ var d=0; for(var i=0;i<QS.length;i++) if(isDone(i)) d++; return d; }
function masteredPoints(){ var n=0; for(var i=0;i<POINTS.length;i++){ if(pointMastery(POINTS[i][0])>=80) n++; } return n; }
/* 错题智能分类：用户标记的错因优先，未标记时按该知识点历史表现推断 */

}

function stageInfo(){

function paperDone(src){ var ids=[]; for(var i=0;i<QS.length;i++) if((QS[i][5]||"")===src) ids.push(i); if(!ids.length) return 0; var d=0; for(var k=0;k<ids.length;k++) if(isDone(ids[k])) d++; return d/ids.length; }

/* ---------- 间隔复习 ---------- */
function dueList(){
  var today=dateKey(), out=[];
  for(var k in S.rev){
    var rv=S.rev[k];
    if(rv && rv.due && rv.due<=today) out.push(parseInt(k,10));
  }
  return out.filter(function(i){ return i>=0 && i<QS.length; });
}
function dueCount(){ return dueList().length; }
function schedule(i, ok, reason){
  if(!validQ(i)) return;
  var rv=S.rev[i]||{box:0,due:dateKey(),err:0,lapses:0};
  if(ok){
    var hadErr=rv.err||0;
    rv.box=Math.min(8,(rv.box||0)+1);
    if(hadErr>0) rv.box=Math.min(8,rv.box+1);   // 错过又答对，加速恢复
    rv.err=0;
    var base=intDays(rv.box);
    rv.due=addDays(Math.max(1,Math.round(base*easeFactor(i))));
    rv.last=dateKey();
    S.rev[i]=rv;
  } else {
    rv.err=(rv.err||0)+1;
    if((rv.box||0)>=3) rv.lapses=(rv.lapses||0)+1;   // 已到高箱又错，记为遗忘
    rv.box=0;
    // 第一次错：今天再练一次；连续错两次：推到明天，避免原地打转
    // 概念不清 → 明天再看；粗心/没看懂 → 今天再练
    var nextToday = (reason==="concept")? false : (rv.err<2);
    rv.due = nextToday? dateKey() : addDays(1);
    S.rev[i]=rv;
  }
}

/* ---------- 计划 ---------- */
function weakPoints(n){
  // 至少作答 2 次才参与薄弱点推荐；用诊断综合分排序（正确率 + 掌握度 + 错因）
  var all=diagnoseAll();
  var arr=all.filter(function(x){ return x.n>=2 && (x.diag.level==="weak"||x.diag.level==="improve"); });
  arr.sort(function(a,b){ return b.diag.score-a.diag.score; });
  if(!arr.length) arr=all.filter(function(x){ return x.attempted<x.total; });
  return arr.slice(0,n||3);
}
/* 智能推荐练习：到期复习优先 → 薄弱知识点 → 新题补足 */
function recommendList(n){
  n=Math.max(5,n||15);
  var out=[], used={};
  function push(i){ if(!used[i]){ used[i]=1; out.push(i); } }
  var due=dueList().filter(function(i){ return !hasPassage(i); });
  shuffle(due);
  var dueCap=Math.max(1,Math.round(n*0.5));
  for(var i=0;i<due.length && out.length<dueCap;i++) push(due[i]);
  var ws=weakList().filter(function(x){ return x.n>=2 && (x.acc<0.85 || x.mastery<85); }).sort(function(a,b){ return weakScore(b)-weakScore(a); });
  for(var w=0;w<ws.length && out.length<n;w++){
    var ids=pointIds(ws[w].p), pool=ids.filter(function(x){ return !hasPassage(x) && !isDone(x); });
    if(!pool.length) pool=ids.filter(function(x){ return !hasPassage(x); });
    shuffle(pool);
    for(var j=0;j<pool.length && out.length<n;j++) push(pool[j]);
  }
  var fresh=freshList(n);
  for(var f=0;f<fresh.length && out.length<n;f++) push(fresh[f]);
  shuffle(out);
  return out;
}
function freshList(n){
  var pool=singles().filter(function(i){ return !isDone(i); });
  shuffle(pool);
  var out=[], mods={}, i, m;
  // 第一轮：每个模块最多先取 1 题，保证跨模块
  for(i=0;i<pool.length && out.length<n;i++){
    m=QS[pool[i]][0];
    if(!mods[m]){ mods[m]=1; out.push(pool[i]); }
  }
  // 第二轮：剩下的随机补满
  for(i=0;i<pool.length && out.length<n;i++){
    if(out.indexOf(pool[i])<0) out.push(pool[i]);
  }
  shuffle(out);
  return out;
}
function nextNewList(limit){
  var out=[];
  for(var m=0;m<MODULES.length;m++){
    for(var j=0;j<POINTS.length;j++){
      if(POINTS[j][7]!==MODULES[m]) continue;
      var ids=pointIds(POINTS[j][0]);
      for(var k=0;k<ids.length;k++){ if(!isDone(ids[k])) out.push(ids[k]); if(out.length>=limit) return out; }
    }
  }
  return out;
}

var REAL_INDEX=null;
function realIndex(){
  if(REAL_INDEX) return REAL_INDEX;
  REAL_INDEX={};

    if(!q[5]||!/^20\d\d/.test(q[5])) continue;

var DUPQ=null;

}

/* ---------- 每日学习计划 ---------- */
function dailyPlan(){
  var daily=Math.max(5,Math.min(60,S.settings.daily||10));
  var doneToday=todayCount();
  var remaining=Math.max(0,daily-doneToday);
  var stage=stageInfo().key;
  var dueSingles=dueList().filter(function(i){ return !hasPassage(i) && !isDoneToday(i); });
  var dueP=duePassageGroups().length;
  // 逾期过多的题（到期超过 3 天）优先
  var today=dateKey();
  var overdue=dueSingles.filter(function(i){ var rv=S.rev[i]; return rv&&rv.due&&rv.due<addDays(-3); }).length;
  var plan={ids:[],review:0,weak:0,fresh:0,dueTotal:dueSingles.length,overdue:overdue,duePassages:dueP,finished:false,daily:daily,doneToday:doneToday,note:""};
  if(remaining<=0){ plan.finished=true; return plan; }
  // 配比：复习 / 薄弱 / 新题
  var mix={review:0.45,weak:0.3,fresh:0.25};
  if(stage==="review") mix={review:0.8,weak:0.2,fresh:0};
  else if(stage==="sprint") mix={review:0.55,weak:0.35,fresh:0.10};
  else if(stage==="basic") mix={review:0.35,weak:0.25,fresh:0.40};
  if(overdue>=5){ mix.review=Math.min(0.85,mix.review+0.15); mix.fresh=Math.max(0,mix.fresh-0.15); }
  var used={};
  function push(i){ if(!used[i]&&plan.ids.length<remaining){ used[i]=1; plan.ids.push(i); } }
  // ① 到期复习
  var rv=shuffle(dueSingles.slice());
  var reviewTarget=Math.min(rv.length,Math.ceil(remaining*mix.review));
  for(var i=0;i<rv.length && plan.review<reviewTarget;i++){ push(rv[i]); plan.review++; }
  // ② 薄弱点（同知识点的其他题，不是刚做过的原题）
  var weakTarget=Math.ceil(remaining*mix.weak);
  var ws=weakList().filter(function(x){ return x.n>=2 && (x.diag? (x.diag.level==="weak"||x.diag.level==="improve") : x.shrunk<0.8); });
  for(var w=0;w<ws.length && plan.weak<weakTarget;w++){
    var cand=variantsFor(pointIds(ws[w].p)[0]||0,4);
    for(var c=0;c<cand.length && plan.weak<weakTarget;c++){ push(cand[c]); plan.weak++; }
  }
  // ③ 新题补足
  var freshTarget=remaining-plan.ids.length;
  if(freshTarget>0 && mix.fresh>0){
    var fl=freshList(freshTarget*3);
    for(var f=0;f<fl.length && plan.fresh<freshTarget;f++){ if(!used[fl[f]]){ push(fl[f]); plan.fresh++; } }
  }
  // 不够：只有在允许新题时才补新题；复习阶段不硬塞新题
  if(plan.ids.length<remaining && mix.fresh>0){
    var more=freshList(remaining*4);
    for(var m=0;m<more.length && plan.ids.length<remaining;m++){ if(!used[more[m]]){ used[more[m]]=1; plan.ids.push(more[m]); plan.fresh++; } }
  }
  // 复习阶段且完全没有任务时，用真题（语法填空等单题）兜底，而不是仿真新题
  if(!plan.ids.length && !dueSingles.length){
    var real=singles().filter(function(i){ return !isDone(i) && /^20\d\d/.test(QS[i][5]||""); });
    real=shuffle(real).slice(0,remaining);
    for(var r2=0;r2<real.length;r2++){ used[real[r2]]=1; plan.ids.push(real[r2]); }
    if(plan.ids.length) plan.fallback=true;
  }
  shuffle(plan.ids);
  plan.note=plan.fallback
    ? ("没有到期题，先做 "+plan.ids.length+" 道真题保持手感")
    : ("复习 "+plan.review+" 题 → 补 "+plan.weak+" 题薄弱 → 新学 "+plan.fresh+" 题");
  return plan;
}

function variantsFor(i, n){
  n=n||3;
  var item=QS[i]; if(!item) return [];
  var point=item[7], cat=item[0], out=[], seen={};

    if(id===i||seen[id]) return;
    var q=QS[id]; if(!q||hasPassage(id)) return;
    seen[id]=1; out.push(id);
  }
  if(point){ var pids=pointIds(point); for(var k=0;k<pids.length;k++) add(pids[k]); }
  if(out.length<n*2){
    for(var j=0;j<QS.length && out.length<n*2;j++){ if(QS[j][0]===cat) add(j); }
  }
  shuffle(out);
  out.sort(function(a,b){ return (isDone(a)?1:0)-(isDone(b)?1:0); });
  return out.slice(0,n);
}

function passGroups(cat,src){
  var g={};
  for(var i=0;i<QS.length;i++){

    if(cat && q[0]!==cat) continue;
    if(src && (q[5]||"")!==src) continue;

    if(!g[k]) g[k]=[];

/* 统一统计口径：报告与分析页共用，避免两边数字不一致（offset=0 本期，offset=span 上一期） */
function rangeStats(span, offset){
  span=Math.max(1,parseInt(span,10)||7); offset=Math.max(0,parseInt(offset,10)||0);
  var days=[], perDay=[], tot=0, rgt=0, mx=1;
  for(var k=span-1;k>=0;k--){
    var dt=new Date(); dt.setDate(dt.getDate()-k-offset);
    var key=dateKey(dt), l=S.log[key]||{};
    var n=Math.max(0,l.n||0), r=Math.min(n,Math.max(0,l.r||0));
    days.push(key); perDay.push({d:key,n:n,r:r}); tot+=n; rgt+=r; if(n>mx) mx=n;
  }
  return {span:span,offset:offset,days:days,perDay:perDay,tot:tot,rgt:rgt,acc:tot?Math.round(rgt/tot*100):0,mx:mx};
}

function setNav(){
  $("nav").innerHTML=[["home","✏️","练习"],["outline","📚","语法"],["mine","👤","我的"]].map(function(t){
    return '<button data-act="tab" data-tab="'+t[0]+'" class="'+(phase===t[0]?"on":"")+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
}
var navStack=[];
function hideToast(){ try{ var t=$("toast"); if(t){ t.className="toast"; t.textContent=""; } }catch(e){} }
function nav(p){
  hideToast();
  if(p===phase){ render(); return; }
  navStack.push(phase);
  phase=p; render();
  try{ history.pushState({d:navStack.length},""); }catch(e){}
}
function navRoot(p){ hideToast(); navStack=[]; phase=p; render(); try{ history.replaceState({d:0},""); }catch(e){} }
function backPage(){
  hideToast();
  if(navStack.length){ phase=navStack.pop(); render(); try{ history.pushState({d:navStack.length},""); }catch(e){} }
  else navRoot("home");
}

function pageReport(){

    var title=span===30?"最近 30 天报告":"每周学习报告";
    var cur=rangeStats(span,0), prev=rangeStats(span,span);
    var target=Math.max(10,Math.round((S.settings.weekly||70)*(span/7)));
    var tPct=target?Math.min(100,Math.round(cur.tot/target*100)):0;
    var delta=cur.tot-prev.tot, accDelta=cur.acc-prev.acc;
    var wrongAll=S.wrong.filter(validQ), wrongN=wrongAll.length;
    var catCnt={}; wrongAll.forEach(function(i){ var c=wrongCategory(i); catCnt[c]=(catCnt[c]||0)+1; });
    var catName={concept:"概念不清",careless:"粗心",reading:"没看懂句子",unknown:"未归因"};
    var catKeys=["concept","careless","reading","unknown"].filter(function(c){ return catCnt[c]; });
    // 薄弱点（带等级与错因）
    var diag=diagnoseAll();
    var weaks=diag.filter(function(x){ return x.diag.level==="weak"; })
                  .sort(function(a,b){ return b.diag.score-a.diag.score; }).slice(0,3);
    if(!weaks.length) weaks=diag.filter(function(x){ return x.diag.level==="improve"; }).slice(0,3);
    var lowSample=diag.filter(function(x){ return x.n>0 && x.n<3; }).length;

    // 掌握度增量（本期已答对题数变化）
    var tr=(S.trend||[]).filter(function(x){ return x.v>=0; });
    var trSpan=tr.slice(-span-1);
    var gained=trSpan.length>1? (trSpan[trSpan.length-1].v-trSpan[0].v) : 0;
    // 正确率折线
    var W2=760,H2=150,pad=14;
    var n2=Math.max(1,cur.perDay.length-1);
    var xOf=function(i){ return pad + i*(W2-2*pad)/n2; };
    var yOf=function(v){ return H2-pad-v*(H2-2*pad)/100; };
    var pts=[]; cur.perDay.forEach(function(e,i){ if(e.n) pts.push([i,Math.round(e.r/e.n*100)]); });
    var poly=pts.map(function(p){ return xOf(p[0])+","+yOf(p[1]); }).join(" ");
    var svg=pts.length>=2? '<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto">'+
        '<line x1="'+pad+'" y1="'+yOf(60)+'" x2="'+(W2-pad)+'" y2="'+yOf(60)+'" stroke="var(--line)" stroke-dasharray="4 6"/>'+
        '<polyline points="'+poly+'" fill="none" stroke="var(--acc)" stroke-width="3"/>'+
        pts.map(function(p){ return '<circle cx="'+xOf(p[0])+'" cy="'+yOf(p[1])+'" r="4" fill="var(--acc)"/>'; }).join("")+'</svg>'
      : '<div class="hint">本期只有 '+pts.length+' 天有记录，多练几天会出现趋势线</div>';
    // 每日题量柱状
    var mx=cur.mx||1;
    var bw=Math.max(6,(W2-2*pad)/Math.max(1,cur.perDay.length)-4);
    var bars=cur.perDay.map(function(e,i){
      var h=Math.max(2,Math.round(e.n/mx*(H2-2*pad)));
      var x=pad+i*((W2-2*pad)/Math.max(1,cur.perDay.length)) + 2;
      return '<rect x="'+x+'" y="'+(H2-pad-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="var(--acc)" opacity="'+(e.n?0.85:0.25)+'"/>';
    }).join("");
    var svgBars='<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto">'+bars+'</svg>';
    function arrow(v,unit,hasPrev){ if(!hasPrev) return '<span style="color:var(--mute)">首期</span>'; var up=v>=0; return '<span style="color:'+(up?"var(--good)":"var(--bad)")+'">'+(up?"↑":"↓")+Math.abs(v)+(unit||"")+'</span>'; }
    var stageActs={
      basic:"先把 51 个语法点过一遍，每天 "+((S.settings.daily||10))+" 题，优先补正确率最低的点。",
      strengthen:"按薄弱点专项练，配合真题语法填空；到期题优先清。",
      sprint:"每周至少 2 套真题（整卷 45 分钟），错题当天处理。",
      review:"只看错题和真题回顾，保持每天 "+((S.settings.daily||10))+" 题手感。"
    }[st.key]||"";
    var html='<div class="chips" style="margin-bottom:10px"><button class="chip'+(span===7?" on":"")+'" data-act="rspan" data-v="7">7 天</button><button class="chip'+(span===30?" on":"")+'" data-act="rspan" data-v="30">30 天</button></div>'+
      '<div class="hero"><div class="kicker">最近 '+span+' 天'+(dl!==null?" · 距考试 "+dl+" 天":"")+'</div><div class="big">'+cur.tot+' 题 · 正确率 '+cur.acc+'%</div>'+
        '<div class="sub">'+st.name+' · 连续学习 '+streak()+' 天</div></div>'+
      '<div class="tiles">'+
        '<div class="tile"><b>'+cur.tot+'</b><span>做题（'+arrow(delta,"",prev.tot>0)+'）</span></div>'+
        '<div class="tile"><b>'+cur.acc+'%</b><span>正确率（'+arrow(accDelta,"%",prev.tot>0)+'）</span></div>'+
        '<div class="tile"><b>'+(trSpan.length>1?Math.max(0,gained):"—")+'</b><span>新增掌握题</span></div>'+
      '</div>'+
      '<div class="sec"><h3>正确率趋势</h3>'+svg+
        '<div class="hint">虚线是 60% 及格线；只连有记录的天</div></div>'+
      '<div class="sec"><h3>每天做题量</h3>'+svgBars+
        '<div class="hint">'+cur.perDay[0].d.slice(5)+' — '+cur.perDay[cur.perDay.length-1].d.slice(5)+'，最高 '+mx+' 题/天</div></div>'+
      '<div class="sec"><h3>'+(span===30?"本期目标":"本周目标")+'</h3><div class="row"><span>完成 '+cur.tot+' / '+target+' 题</span><span class="v">'+tPct+'%</span></div>'+
        '<div class="bar"><i style="width:'+tPct+'%"></i></div>'+
        '<div class="hint" style="margin-top:8px">目标可在「我的 → 每周目标」调整；当前每周 '+(S.settings.weekly||70)+' 题。</div></div>'+
      '<div class="sec"><h3>错题分类</h3>'+(catKeys.length? catKeys.map(function(c){ var p2=wrongN?Math.round(catCnt[c]/wrongN*100):0; return '<div class="wbar"><span class="nm">'+catName[c]+'</span><span class="track"><i style="width:'+p2+'%;background:var(--acc2)"></i></span><span class="pc">'+catCnt[c]+' 题</span></div>'; }).join("") : '<div class="hint">错题本还是空的</div>')+'</div>'+
      '<div class="sec"><h3>薄弱点 Top3</h3>'+(weaks.length? weaks.map(function(w){ var d=w.diag;
          return '<div class="point" style="padding:9px 0;border:0"><div class="nm"><div><b>'+esc(w.p)+'</b> <span class="chip" style="padding:2px 8px;font-size:11px;color:'+d.col+'">'+d.label+'</span></div>'+
            '<div class="hint">正确率 '+Math.round(w.acc*100)+'% · 作答 '+w.n+' 次 · 掌握度 '+w.mastery+'%</div>'+
            '<div class="hint" style="color:var(--acc)">'+esc(d.advice)+'</div></div>'+
            '<button class="go" data-act="prac" data-p="'+esc(w.p)+'">练</button></div>';
        }).join("") : '<div class="hint">还没有足够作答数据，先做一轮「今日学习」</div>')+
        (lowSample?'<div class="hint" style="margin-top:6px">另有 '+lowSample+' 个知识点样本不足（少于 3 次作答），暂不参与薄弱判断。</div>':"")+'</div>'+
      '<div class="sec"><h3>下一阶段建议</h3><div class="hint" style="font-size:14px;line-height:1.8">'+
        '<b>'+st.name+'：</b>'+esc(stageActs)+'<br>'+
        (dueNow? "· 先清掉 "+dueNow+" 道到期复习题，避免遗忘。<br>":"")+
        (weaks.length? "· 重点补「"+esc(weaks[0].p)+"」等 "+weaks.length+" 个薄弱知识点。<br>":"")+
        (catCnt.careless? "· 粗心类错题 "+catCnt.careless+" 道，做题时先圈出关键词再选。<br>":"")+
        (catCnt.concept? "· 概念类错题 "+catCnt.concept+" 道，建议先看知识点卡片再练。<br>":"")+
        "· 每天保持 "+(S.settings.daily||10)+" 题左右，连续学习比突击更有效。</div>"+
        '<div class="btns" style="margin-top:10px"><button class="btn" data-act="today">开始今日学习</button><button class="btn ghost" data-act="weak">看学习诊断</button></div></div>'+
      '<div class="sec"><h3>进度</h3><div class="row"><span>已答对</span><span class="v">'+totalDone()+' / '+QS.length+'</span></div><div class="row"><span>待复习</span><span class="v">'+dueNow+' 题</span></div><div class="row"><span>错题本</span><span class="v">'+wrongN+' 题</span></div></div>';
    
  return {title:title, right:"", html:html};
}

function pageStats(){

    var title="学习分析";
    var span=(ui.statSpan||7);
    var rs=rangeStats(span);
    var days=rs.days, tot=rs.tot, rgt=rs.rgt, acc=rs.acc;
    var W2=760,H2=180,pad=16;
    var xOf=function(i){ return pad + i*(W2-2*pad)/Math.max(1,days.length-1); };
    var yOf=function(v){ return H2-pad-v*(H2-2*pad)/100; };
    // 正确率趋势：只连有记录的天，避免无记录日把曲线拉到 0
    var pts=[]; rs.perDay.forEach(function(e,i){ if(e.n) pts.push([i,Math.round(e.r/e.n*100)]); });
    var poly=pts.map(function(p){ return xOf(p[0])+","+yOf(p[1]); }).join(" ");
    var svg=pts.length>=2? '<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto"><polyline points="'+poly+'" fill="none" stroke="var(--acc)" stroke-width="3"/>'+
        pts.map(function(p){ return '<circle cx="'+xOf(p[0])+'" cy="'+yOf(p[1])+'" r="4" fill="var(--acc)"/>'; }).join("")+'</svg>'
      : '<div class="hint">多练几天后会显示正确率趋势</div>';
    // 掌握度曲线（每日快照）
    var tr=(S.trend||[]).slice(-Math.max(span,2));
    var tpts=tr.map(function(p,i){ return (pad+i*(W2-2*pad)/Math.max(1,tr.length-1))+","+(H2-pad-(QS.length?p.v/QS.length*100:0)*(H2-2*pad)/100); }).join(" ");
    var svg2=tr.length>1? '<svg viewBox="0 0 '+W2+' '+H2+'" style="width:100%;height:auto"><polyline points="'+tpts+'" fill="none" stroke="var(--good)" stroke-width="3"/></svg>' : '<div class="hint">多练几天后会显示掌握度曲线</div>';
    // 模块掌握度（真实正确率 × 覆盖度）
    var modHTML=MODULES.map(function(m){ var p=moduleMastery(m); return '<div class="wbar"><span class="nm">'+esc(m)+'</span><span class="track"><i style="width:'+p+'%;background:linear-gradient(90deg,var(--acc),var(--acc2))"></i></span><span class="pc">'+p+'%</span></div>'; }).join("");
    // 错因分布
    var rs={}; for(var qi in S.reason){ var rr=S.reason[qi]; for(var kk in rr){ rs[kk]=(rs[kk]||0)+rr[kk]; } }
    var rsTotal=0; for(var k3 in rs) rsTotal+=rs[k3];
    var wl=weakList().filter(function(x){ return x.n>=2; }).slice(0,5);
    var html='<div class="chips" style="margin-bottom:12px">'+
        '<button class="chip'+(span===7?" on":"")+'" data-act="sspan" data-v="7">近 7 天</button>'+
        '<button class="chip'+(span===30?" on":"")+'" data-act="sspan" data-v="30">近 30 天</button></div>'+
      '<div class="tiles"><div class="tile"><b>'+acc+'%</b><span>正确率</span></div><div class="tile"><b>'+tot+'</b><span>做题</span></div><div class="tile"><b>'+streak()+'</b><span>连续天数</span></div></div>'+
      '<div class="sec"><h3>各模块掌握度</h3>'+modHTML+'<div class="hint">正确率占 70%，已答对覆盖占 30%</div></div>'+
      '<div class="sec"><h3>正确率趋势</h3>'+svg+'<div class="hint">只统计有作答的日期</div></div>'+
      '<div class="sec"><h3>掌握度曲线</h3>'+svg2+'<div class="hint">已答对题数占总题库的比例</div></div>'+
      '<div class="sec"><h3>错因分布</h3>'+(rsTotal? REASONS.map(function(r){ var n2=rs[r[0]]||0; var p2=Math.round(n2/rsTotal*100); return '<div class="wbar"><span class="nm">'+r[1]+'</span><span class="track"><i style="width:'+p2+'%;background:var(--acc2)"></i></span><span class="pc">'+p2+'%</span></div>'; }).join("") : '<div class="hint">还没有标记过错因，答题答错时可选</div>')+'</div>'+
      '<div class="sec"><h3>最薄弱的 5 个知识点</h3>'+(wl.length? wl.map(function(w){ return '<div class="point" style="padding:8px 0;border:0"><div class="nm">'+esc(w.p)+'<div class="hint">真实正确率 '+Math.round(w.acc*100)+'% · 作答 '+w.n+' 次</div></div><div class="pg">'+w.mastery+'%</div><button class="go" data-act="prac" data-p="'+esc(w.p)+'">练</button></div>'; }).join("") : '<div class="hint">还没有作答数据</div>')+'</div>';
    
  return {title:(typeof title==="undefined"?"":title), right:(typeof right==="undefined"?"":right), html:html};
}

      var rsTxt=""; ["concept","careless","reading"].forEach(function(k){ if(d.rs[k]) rsTxt+=(rsTxt?" · ":"")+REASON_LABEL[k]+" "+d.rs[k]; });

        '<div class="nm" style="flex:1"><div><b>'+esc(x.p)+'</b> '+
          '<span class="chip" style="padding:2px 8px;font-size:11px;color:'+d.col+';border:1px solid '+d.col+'">'+d.label+'</span></div>'+
          '<div class="wbar" style="margin:6px 0 0"><span class="track"><i style="width:'+pct+'%;background:'+d.col+'"></i></span></div>'+
          '<div class="hint" style="margin-top:3px">'+esc(x.mod)+' · 正确率 '+pct+'%（作答 '+x.n+' 次）· 掌握度 '+x.mastery+'%（'+masteryLevel(x.p).label+'）</div>'+

    }

      (weak.length? '<h3 style="font-size:13px;color:var(--bad);margin:14px 0 8px">明显薄弱（先练这些）</h3>'+weak.slice(0,20).map(diagCard).join("") : "")+
      (improve.length? '<h3 style="font-size:13px;color:var(--warn);margin:16px 0 8px">待巩固</h3>'+improve.slice(0,15).map(diagCard).join("") : "")+

        return '<div class="point" style="background:var(--card);border-radius:16px;margin-bottom:10px;border:0"><div class="nm"><div>'+esc(x.p)+'</div><div class="hint">'+esc(x.mod)+' · 0 / '+x.total+' 题 · 建议先做 5 题看看</div></div><button class="go" data-act="prac" data-p="'+esc(x.p)+'">练</button></div>';
      }).join("") : "")+
      '<button class="btn" style="margin-top:12px" data-act="recommend">开始针对性练习（推荐）</button>';
    return;
  }

  if(phase==="errors"){
    $("ttl").textContent="错误日志"; $("right").textContent=(S.errors.length||0)+" 条";
    if(!S.errors.length){ v.innerHTML='<div class="hero center"><div class="big">没有错误记录</div><div class="sub">运行中如果出现异常，会自动记在这里</div></div>'; return; }
    v.innerHTML='<div class="hint" style="margin-bottom:10px">反馈问题时把这部分内容发给我，能快速定位。日志只存在本机，不会上传。</div>'+
      S.errors.slice().reverse().map(function(e){
        return '<div class="sec" style="padding:12px"><div class="hint">'+esc(new Date(e.t).toLocaleString())+' · '+esc(e.v)+' · '+esc(e.p)+'</div>'+
          '<div style="margin-top:6px;font-size:13px;word-break:break-all">'+esc(e.m)+'</div>'+
          (e.s?'<div class="hint" style="margin-top:6px;word-break:break-all;white-space:pre-wrap">'+esc(e.s)+'</div>':"")+'</div>';
      }).join("")+
      '<div class="btns"><button class="btn ghost" data-act="copyerr">复制全部</button><button class="btn bad" data-act="clearerr">清空</button></div>';
    return;
  }

  if(phase==="data"){ var pgD=pageData(); $("ttl").textContent=pgD.title; $("right").textContent=pgD.right; v.innerHTML=pgD.html; return; }
  if(phase==="guide"){
    $("ttl").textContent="怎么用";
    var lv=ui.level||S.settings.level||"normal";

      '<div class="sub">先选一个当前水平，做 20 题摸底，然后我们告诉你该练什么。</div></div>'+
      '<div class="sec"><h3>1 · 你的水平</h3><div class="chips">'+
        [["basic","基础：语法点还不太清"],["normal","中等：能做题但常错"],["advanced","冲刺：只差查漏补缺"]].map(function(x){
          return '<button class="chip'+(lv===x[0]?" on":"")+'" data-act="level" data-v="'+x[0]+'">'+x[1]+'</button>';
        }).join("")+'</div></div>'+
      '<div class="sec"><h3>2 · 20 题摸底</h3><div class="hint">覆盖 8 大语法模块，做完立刻看到薄弱点，并自动生成每日计划。</div></div>'+
      '<div class="sec"><h3>3 · 之后每天</h3><div class="hint">「开始今日学习」会先复习到期题、再出新题；答对过的不再重复。</div></div>'+
      '<button class="btn" data-act="diag">开始摸底（20 题）</button><button class="btn ghost" data-act="home" style="margin-top:10px">跳过，直接开始</button>';
    return;
  }

  v.innerHTML='<div class="hero center"><div class="big">页面不存在</div></div>';
}

/* ---------- 交互 ---------- */
document.addEventListener("click", function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el) return;
  var act=el.getAttribute("data-act");
  if(act==="tab"){ nav(el.getAttribute("data-tab")); return; }

  if(act==="extra"){ startExtra(); return; }
  if(act==="review"){ startReview(); return; }
  if(act==="revpassages"){ reviewPassages(); return; }
  if(act==="daily"){ startDaily(); return; }
  if(act==="papers"){ nav("papers"); return; }
  if(act==="cats"){ nav("cats"); return; }
  if(act==="paper"){ ui.psrc=el.getAttribute("data-s"); nav("sections"); return; }
  if(act==="sect"){ var sec=(document.getElementById("view")._secs||[])[parseInt(el.getAttribute("data-i"),10)]; if(!sec) return; if(sec.kind==="block"){ startBlock(sec.ids,sec.label); } else { begin("section",sec.label,sec.ids); } return; }
  if(act==="pcat"){ ui.pcat=el.getAttribute("data-c"); ui.psrc=""; nav("passages"); return; }
  if(act==="block"){ var g=(document.getElementById("view")._groups||[])[parseInt(el.getAttribute("data-i"),10)]; if(!g) return; startBlock(g.ids,g.src+" · "+g.cat.replace("真题·","")); return; }
  if(act==="bpick"){ if(!ses||ses.submitted) return; var qi=parseInt(el.getAttribute("data-q"),10); ses.answers[qi]=parseInt(el.getAttribute("data-k"),10); render(); return; }

    var unanswered=ses.list.filter(function(q){ return ses.answers[q]===undefined; });
    if(unanswered.length && !ses._warned){ ses._warned=true; toast("还有 "+unanswered.length+" 题未答，再点一次交卷"); return; }
    var ids2=ses.list, r2=0, w2=0;
    for(var k=0;k<ids2.length;k++){ var id2=ids2[k], pick=ses.answers[id2]; if(pick===undefined) continue; var ok= pick===QS[id2][3]; if(ok) r2++; else w2++; record(id2,ok); }
    ses.right=r2; ses.wrong=w2; ses.submitted=true; checkAch(); render(); return;
  }
  if(act==="blockdone"){ phase="result"; ses.label=ses.label; render(); return; }
  if(act==="catp"){ startRealCat(el.getAttribute("data-c")); return; }
  if(act==="timed"){ startTimed(); return; }
  if(act==="mock"){ startMock(); return; }
  if(act==="diag"){ startDiag(); return; }
  if(act==="wrong"){ startWrong(); return; }
  if(act==="wronglist"){ nav("wronglist"); return; }
  if(act==="showQ"){ ui.qid=parseInt(el.getAttribute("data-q"),10); nav("showQ"); return; }
  if(act==="writing"){ nav("writing"); return; }
  if(act==="essay"){ ui.essay=parseInt(el.getAttribute("data-k"),10); nav("essay"); return; }
  if(act==="words"){ nav("words"); return; }
  if(act==="lookup"){ openWordSheet(el.getAttribute("data-w"), ""); return; }
  if(act==="openupd"){ try{ window.open(UPD.url||"https://github.com/bhxcvb/yuhuan/releases","_blank"); }catch(e){ toast("请到 Releases 页面下载"); } return; }
  if(act==="weak"){ nav("weak"); return; }
  if(act==="variantPlan"){ startWrongPlan(el.getAttribute("data-r")||""); return; }
  if(act==="variantQ"){ startVariantFor(parseInt(el.getAttribute("data-q"),10)); return; }
  if(act==="variantPoint"){ startVariantPoint(el.getAttribute("data-p")||""); return; }
  if(act==="recommend"){ begin("recommend","推荐练习",recommendList(15)); return; }
  if(act==="path"){ nav("path"); return; }
  if(act==="stats"){ nav("stats"); return; }
  if(act==="pron"){ pronounce(el.getAttribute("data-w")||""); return; }
  if(act==="pron2"){ pronounce(el.getAttribute("data-w")||"", el.getAttribute("data-a")||"en-US"); return; }
  if(act==="word"){ var ww0=el.getAttribute("data-w")||""; closeSheet(); ui.word=ww0; ui.wshow=false; if(phase!=="word") nav("word"); else render(); return; }
  if(act==="fav"){ favWord(el.getAttribute("data-w")||""); return; }
  if(act==="addwrev"){ addWordReview(el.getAttribute("data-w")||""); return; }
  if(act==="wshow"){ ui.wshow=true; render(); return; }
  if(act==="wgrade"){ var g=parseInt(el.getAttribute("data-g"),10)||0; var wl=(ses&&ses.wlist)?ses.wlist:wordReviewDue(); var curW=wl[ui.wri||0]; if(curW){ var rv=S.wordRev[curW]||{box:0}; if(g===2){ rv.box=Math.min(5,(rv.box||0)+1); rv.due=addDays(intDays(rv.box)); } else if(g===1){ rv.due=addDays(1); } else { rv.box=0; rv.due=addDays(1); } S.wordRev[curW]=rv; }
    ui.wri=(ui.wri||0)+1; ui.wshow=false; save(); render(); return; }
  if(act==="wreview"){ ses={wlist:wordReviewDue().slice()}; ui.wri=0; ui.wshow=false; nav("wreview"); return; }

  if(act==="fontsize"){ S.settings.fontScale=el.getAttribute("data-v")||"normal"; save(); applyFont(); render(); return; }
  if(act==="sspan"){ ui.statSpan=parseInt(el.getAttribute("data-v"),10)||7; render(); return; }

  if(act==="idbrestoreprev"){ idbRestore("prev"); return; }
  if(act==="dataimport"){
    var inp=document.getElementById("fileInp");
    if(!inp){ inp=document.createElement("input"); inp.type="file"; inp.id="fileInp"; inp.accept=".json,application/json"; inp.style.display="none";
      inp.onchange=function(ev){
        var f=ev.target.files&&ev.target.files[0]; if(!f) return;
        var rd=new FileReader();
        rd.onload=function(){
          try{
            var o=JSON.parse(rd.result);
            if(!o || !Array.isArray(o.QS) || !o.QS.length) throw new Error("缺少 QS 数组");
            if(o.QS.length>8000) throw new Error("题量异常（"+o.QS.length+" 题）");
            for(var i=0;i<o.QS.length;i++){
              var q=o.QS[i];
              if(!Array.isArray(q) || q.length<5) throw new Error("第 "+(i+1)+" 题结构不对");
              if(typeof q[1]!=="string" || !q[1].trim()) throw new Error("第 "+(i+1)+" 题缺题干");
              if(!Array.isArray(q[2]) || q[2].length<2) throw new Error("第 "+(i+1)+" 题选项不足");
              if(typeof q[3]!=="number" || q[3]<0 || q[3]>=q[2].length) throw new Error("第 "+(i+1)+" 题答案下标越界");
            }
            var size=JSON.stringify({QS:o.QS,TR:o.TR||{},NOS:o.NOS||{}}).length;
            if(size>4200*1024) throw new Error("题库太大（"+Math.round(size/1024)+" KB），浏览器存储放不下");
            if(!autoBackup("pre-dataimport")) throw new Error("自动备份失败（存储空间不足），已取消导入");
            var ds={QS:o.QS,TR:o.TR||{},NOS:o.NOS||{}};
            ds.id=datasetHash(ds.QS);
            if(!switchDataset(ds)) throw new Error("写入存储失败（空间不足），题库未导入");
            toast("题库已导入，共 "+o.QS.length+" 题（独立进度）");
            setTimeout(function(){ location.reload(); }, 700);
          }catch(e){ toast("导入失败："+e.message); }
        };
        rd.readAsText(f);
      };
      document.body.appendChild(inp);
    }
    inp.value=""; inp.click(); return;
  }
  if(act==="dataexport"){
    var obj={version:VERSION,QS:QS,TR:TR,NOS:NOS};
    try{
      var blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="yuhuan-data-"+VERSION+".json";

    }catch(e){ toast("导出失败"); }
    return;
  }

    askConfirm("恢复内置题库","切回内置题库。自定义题库与内置题库的进度分别保存，不会互相覆盖（可撤销）。",'切换',function(){

    });

  }
  if(act==="savedatafile"){
    try{
      var blob=new Blob([progressDump()],{type:"application/json"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="yuhuan-progress-"+dateKey()+".json";

            askConfirm("从文件导入进度","会覆盖当前题库的进度（其他题库保留）。导入前会自动备份当前数据，可撤销。","导入",function(){

              catch(e){ toast("导入失败："+e.message); }
            });
          }catch(e){ toast("导入失败："+e.message); }
        };
        rr.readAsText(f2);
      };
      document.body.appendChild(fp);
    }
    fp.value=""; fp.click(); return;

  if(act==="undodataimport"){

      }catch(e){ toast("撤销失败"); }

  if(act==="makeplan"){
    var lv2=S.settings.level||"normal";

    var weakN=weakPoints(3).length;

    toast("已生成计划：每天 " + daily + " 题，每周 " + (daily*7) + " 题");

  }
  if(act==="rspan"){ ui.reportSpan=parseInt(el.getAttribute("data-v"),10)||7; render(); return; }
  if(act==="intensity"){ S.settings.reviewIntensity=el.getAttribute("data-v")||"normal"; save(); render(); toast("复习强度已改为"+({tight:"紧凑",normal:"标准",loose:"宽松"}[S.settings.reviewIntensity])); return; }
  if(act==="feedback"){ openFeedback(); return; }
  if(act==="toggleupd"){ S.settings.checkUpdate=!S.settings.checkUpdate; save(); render(); if(S.settings.checkUpdate) checkUpdate(true); return; }
  if(act==="errors"){ nav("errors"); return; }
  if(act==="installpwa"){
    if(!deferredPrompt){ toast("请用浏览器菜单里的「安装」"); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(c){ if(c.outcome==="accepted") toast("正在安装…"); deferredPrompt=null; render(); });
    return;
  }
  if(act==="clearerr"){ askConfirm("清空错误日志","只清空日志，不影响学习数据。","清空",function(){ S.errors=[]; save(); render(); }); return; }
  if(act==="copyerr"){ var t=errorDump(); if(!t){ toast("没有错误记录"); return; } copyText(t); return; }
  if(act==="delword"){ var k=parseInt(el.getAttribute("data-k"),10); var delW=S.words[k]&&S.words[k].w; if(S.words[k]){ S.words.splice(k,1); if(delW&&S.wordRev) delete S.wordRev[delW]; save(); render(); } return; }
  if(act==="report"){ nav("report"); return; }
  if(act==="home"){ navRoot("home"); return; }
  if(act==="guide"){ nav("guide"); return; }
  if(act==="pick"){
    if(!ses||ses.picked!==null) return;
    var k2=parseInt(el.getAttribute("data-k"),10), qi=current(); if(qi===null) return;
    ses.picked=k2;
    var ok=k2===QS[qi][3];
    if(ok) ses.right++; else ses.wrong++;
    record(qi, ok); if(ok) ses.done[qi]=1;
    checkAch(); render(); return;
  }
  if(act==="reason"){
    var r=el.getAttribute("data-r"), qi2=current();
    if(qi2!==null){ ses.reason=r; var st=S.reason[qi2]||(S.reason[qi2]={}); st[r]=(st[r]||0)+1; save(); render(); }
    return;
  }
  if(act==="next"){
    if(!ses) return;
    var qi3=current();
    if(qi3!==null && !ses.done[qi3]){
      ses.retry=ses.retry||{};
      var rc=ses.retry[qi3]||0;
      var cap=Math.max(20,(ses.baseLen||ses.list.length)*2);
      if(rc<1 && ses.list.length<cap){ ses.retry[qi3]=rc+1; ses.list.push(qi3); }
      else if(!ses.capped){ ses.capped=true; toast("这题先记进错题本，稍后再练"); }
    }
    ses.i++; ses.picked=null; ses.reason=null;
    if(ses.i>=ses.list.length){ stopTimer(); phase="result"; }
    render(); return;
  }
  if(act==="copydata"){ var t=$("dump"); if(t){ copyText(t.value||"", "已复制备份"); } return; }
  if(act==="importdata"){
    var ta=$("dump"); if(!ta) return;
    try{
      var o=JSON.parse(ta.value);
      if(!o || typeof o!=="object" || !o.q || typeof o.q!=="object") throw new Error("格式不对（缺少 q 字段）");
      askConfirm("导入数据","会覆盖当前题库的进度（其他题库的进度保留）。导入前会自动备份当前数据，可撤销。","导入",function(){
        if(!autoBackup("pre-import")) return;
        try{ adoptImportedStore(o, true); save(); navRoot("home"); toast("导入成功（可撤销）"); }
        catch(e){ toast("导入失败："+e.message); }
      });
    }catch(e){ toast("导入失败："+e.message); } return;
  }
  if(act==="undoclearwrong"){
    var rawW=lsGet("yuhuan_pre-clearwrong");
    if(!rawW){ toast("没有可恢复的错题备份"); return; }
    askConfirm("恢复错题本","恢复清空前的错题记录？","恢复",function(){
      try{ var st=S.settings; var o=normalizeStore(JSON.parse(rawW)); o.settings=st||o.settings; S=o; settleActive(); save(); navRoot("home"); toast("错题本已恢复"); }
      catch(e){ toast("恢复失败："+e.message); }
    });
    return;
  }
  if(act==="undoreset"){
    var rawR=lsGet("yuhuan_pre-reset");
    if(!rawR){ toast("没有可恢复的进度备份"); return; }
    askConfirm("恢复进度","恢复清空前的全部学习进度？","恢复",function(){
      try{ var st2=S.settings; var o2=normalizeStore(JSON.parse(rawR)); o2.settings=st2||o2.settings; S=o2; settleActive(); save(); navRoot("home"); toast("进度已恢复"); }
      catch(e){ toast("恢复失败："+e.message); }
    });
    return;
  }
  if(act==="undorestore"){
    var raw=lsGet("yuhuan_pre-import");
    if(!raw){ toast("没有可撤销的数据"); return; }
    try{
      askConfirm("撤销导入","恢复到最近一次导入前的数据（含各题库进度）？","撤销",function(){
        var st=S.settings;
        S=normalizeStore(JSON.parse(raw));
        if(st) S.settings=st;
        settleActive(); save(); navRoot("home"); toast("已撤销导入");
      });
    }catch(e){ toast("撤销失败"); }
    return;
  }
  if(act==="clearwrong"){ askConfirm("清空错题本","只清空错题记录，不影响已答对进度。","清空",function(){ if(!autoBackup("pre-clearwrong")) return; S.wrong=[]; save(); render(); toast("已清空"); }); return; }
  if(act==="reset"){ askConfirm("清空进度","所有题库的答题记录、错题、生词、成就都会删除（当前题库与题库文件保留）。清空前会自动备份，可在「备份 / 恢复」页找回。","清空",function(){
    if(!autoBackup("pre-reset")) return;
    var st=S.settings, ds=S.dataset;
    S=initStore();
    S.settings=st||S.settings;
    if(ds) S.dataset=ds;
    S.activeProfile=activeDatasetId();
    S.seenGuide=true; save(); navRoot("home"); toast("已清空（可从自动备份恢复）");
  }); return; }
  if(act==="sheetYes"){ var fn=pendingOk; closeSheet(); if(fn) fn(); return; }
  if(act==="sheetNo"){ closeSheet(); return; }
});

/* 长按取词：任意英文文本块 */
function openWordSheet(w, ctx){
  var f=lookup(w);
  var d=f?f.d:{};
  var mean=d.t||"词库未收录（可能是专有名词）";
  var ph=d.p? d.p+"\n" : "";
  var ex=d.e? "\n例："+d.e : "";
  var syn=(d.s&&d.s.length)? "\n近义："+d.s.join(" / ") : "";
  $("stitle").innerHTML=esc(w)+' <button class="chip" data-act="pron" data-w="'+esc(w)+'" style="margin-left:6px">🔊 朗读</button> <button class="chip" data-act="word" data-w="'+esc(w)+'">详细释义 →</button>';
  $("stext").textContent=ph+mean+ex+syn+(ctx?"\n\n"+ctx:"");
  $("sok").textContent="加入生词本";
  pendingOk=function(){
    if(S.words.some(function(x){return x.w===w;})){ toast("「"+w+"」已在生词本"); return; }
    S.words.push({w:w,ctx:ctx||"",ts:Date.now()}); save(); toast("已加入生词本："+w);
    if(phase==="words") render();
  };
  $("sheet").className="sheet on";
}

var lpTimer=null;
document.addEventListener("pointerdown", function(ev){
  var t=ev.target;
  if(!t||!t.closest) return;
  if(!t.closest("[data-word]")) return;
  lpTimer=setTimeout(function(){
    try{
      var range=null, pt=null;
      try{ if(document.caretRangeFromPoint) range=document.caretRangeFromPoint(ev.clientX,ev.clientY); }catch(e){}
      try{ if(!range && document.caretPositionFromPoint) pt=document.caretPositionFromPoint(ev.clientX,ev.clientY); }catch(e){}
      var node=range&&range.startContainer, off=range?range.startOffset:0;
      if(!node && pt){ node=pt.offsetNode; off=pt.offset; }
      if(!node) { toast("取词失败，请长按在英文单词上"); return; }
      var text=node.textContent||"";
      var start=off, end=off;
      while(start>0 && /[A-Za-z'-]/.test(text[start-1])) start--;
      while(end<text.length && /[A-Za-z'-]/.test(text[end])) end++;
      var w=text.slice(start,end).trim();
      if(!w || w.length<2){ toast("请长按在一个英文单词上"); return; }
      var ctx=text.slice(Math.max(0,start-50), Math.min(text.length,end+50)).replace(/\s+/g," ").trim();
      openWordSheet(w, ctx);
    }catch(e){ toast("取词失败，请再长按一次"); }
  },520);
}, {passive:true});
document.addEventListener("pointerup", function(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }, {passive:true});
document.addEventListener("pointercancel", function(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }, {passive:true});
document.addEventListener("contextmenu", function(ev){
  if(ev.target&&ev.target.closest&&ev.target.closest("[data-word]")) ev.preventDefault();
});
document.addEventListener("selectionchange", function(){
  try{ var sel=window.getSelection&&window.getSelection(); if(sel && sel.removeAllRanges && document.activeElement && document.activeElement.tagName!=="TEXTAREA" && document.activeElement.tagName!=="INPUT"){ /* 保留输入框选择 */ } }catch(e){}
});

document.addEventListener("focusin", function(ev){
  var t=ev.target;
  if(!t || (t.tagName!=="INPUT" && t.tagName!=="TEXTAREA")) return;
  setTimeout(function(){
    try{ if(t.scrollIntoView) t.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){ try{ t.scrollIntoView(); }catch(e2){} }
  },300);
});
window.addEventListener("popstate", function(ev){
  stopTimer();
  if(navStack.length){ phase=navStack.pop(); render(); try{ history.pushState({d:navStack.length},""); }catch(e){} }
  else if(phase!=="home"){ phase="home"; render(); try{ history.pushState({d:0},""); }catch(e){} }
});

/* ---------- 启动 ---------- */
loadStore();
applyDataset();
try{ history.replaceState({phase:phase},""); }catch(e){}
if(!S.seenGuide){ S.seenGuide=true; save(); phase="guide"; }
render();
if(typeof requestAnimationFrame==="function"){ requestAnimationFrame(function(){ setTimeout(bootDone, 60); }); }
else { setTimeout(bootDone, 60); }
setTimeout(bootDone, 1200);
setTimeout(function(){ checkUpdate(false); }, 1500);
setTimeout(autoRecover, 600);
/* PWA：安装提示 */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredPrompt=e; if(phase==="mine") render(); });
window.addEventListener("appinstalled", function(){ deferredPrompt=null; toast("已安装到桌面"); });

/* PWA：注册 Service Worker（仅当通过 http/https 打开） */
if(typeof navigator!=="undefined" && "serviceWorker" in navigator && typeof location!=="undefined" && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    try{ reg.update(); }catch(e){}
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    try{ toast("应用已更新，重新打开后生效"); }catch(e){}
  });
}
</script>
