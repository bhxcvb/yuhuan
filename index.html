var CATS = ["真题·阅读","真题·七选五","真题·完形","真题·语法填空","短文改错","时态","语态与一致","从句","非谓语","虚拟语气","情态动词","倒装与强调","词法与搭配"];

/* 仿真题：模块 / 题干 / 四个选项 / 答案下标 / 解析 */
var QS = [
["时态","By the time we got to the cinema, the film ____ for ten minutes.",["had begun","had been on","has begun","began"],1,"begin 是短暂动作，不能和 for ten minutes 连用；be on 表持续状态，用过去完成时 had been on。"],
["时态","I ____ in this school for three years and I love it here.",["study","studied","have studied","had studied"],2,"考点：现在完成时。for three years 表示从过去持续到现在、并且还在继续，用 have studied；study 是一般现在时，studied 与 for 连用需过去完成或完成时，had studied 表“过去的过去”。"],
["时态","Look! The little boy ____ a picture over there.",["draws","drew","is drawing","has drawn"],2,"考点：现在进行时。Look! 是“此刻正在发生”的信号，主语 the little boy 为单数，故用 is drawing；draws 表习惯、drew 表过去、has drawn 表完成，都与“此刻”冲突。"],
["时态","He ____ to Beijing twice this year.",["goes","went","has been","had gone"],2,"twice this year 强调到现在的经历，用 have/has been to。"],
["时态","It ____ when we left the house.",["rains","was raining","has rained","rain"],1,"考点：过去进行时。when we left 指过去的某一刻，强调那时正在下雨，用 was raining；rains 是一般现在时，has rained 表完成，都与“那一刻”不符。"],
["时态","She ____ her homework when I called her.",["does","did","was doing","has done"],2,"考点：过去进行时。when I called 是过去的时间点，从句表示“打电话时她正在做作业”，用 was doing；does/did/has done 都不能表示“正在进行”。"],
["语态与一致","Our classroom ____ every day.",["cleans","is cleaned","cleaned","is cleaning"],1,"考点：一般现在时的被动语态。教室是动作承受者，且 every day 表习惯，用 is cleaned；cleans 是主动，cleaned 缺 be 动词，is cleaning 表“正在打扫”。"],
["语态与一致","Neither he nor I ____ good at singing.",["am","is","are","be"],0,"考点：主谓一致的就近原则。neither…nor 连接主语时，谓语与最近的主语 I 一致，用 am；is/are 与 I 不匹配，be 是原形不能单独作谓语。"],
["语态与一致","The number of students in our school ____ increasing.",["are","is","were","have been"],1,"考点：主谓一致。the number of + 复数名词意为“……的数量”，中心词是 number，谓语用单数 is；复数意义的是 a number of。"],
["语态与一致","A new library ____ in our town next year.",["will build","will be built","is built","builds"],1,"考点：一般将来时的被动语态。图书馆是“被建造”，且 next year 表将来，用 will be built；will build 是主动，is built 是现在时，builds 时态语态都不对。"],
["语态与一致","Each of the boys ____ a football.",["have","has","are having","were"],1,"考点：主谓一致。each of + 复数名词作主语时谓语用单数，故选 has；have/are having/were 都是复数或时态不符。"],
["语态与一致","The old man ____ by the police yesterday.",["saved","was saved","is saved","saves"],1,"考点：一般过去时的被动语态。老人是“被救”，且有 yesterday，用 was saved；saved 是主动，is saved 是现在时，saves 时态语态都不对。"],
["从句","This is the village ____ I spent my childhood.",["which","that","where","when"],2,"考点：定语从句关系副词。从句 I spent my childhood 结构完整，缺的是地点状语，用 where；which/that 不能作状语，when 指时间。"],
["从句","The book ____ cover is red is mine.",["which","whose","that","who"],1,"考点：whose 引导定语从句。表示“书的封面”，先行词 the book 与 cover 是所属关系，用 whose cover；which/that/who 都不能直接修饰名词。"],
["从句","I don't know ____ he will come tomorrow.",["that","whether","what","which"],1,"考点：宾语从句引导词。句意为“我不知道他明天是否会来”，表“是否”用 whether；that 无实义，what/which 在从句中要作成分，此处不缺。"],
["从句","____ he said at the meeting surprised us all.",["That","What","Which","It"],1,"考点：主语从句。从句 he said 缺宾语，用 what 充当 said 的宾语并引导主语从句；that 不作成分，which 表“哪一个”不合语义，it 会造成结构重复。"],
["从句","The reason ____ he was late is that he missed the bus.",["why","which","that","what"],0,"考点：定语从句关系副词。the reason 后接 why 引导定语从句，why 在从句中作原因状语；which/that 需在从句中作主语或宾语，此处不缺。"],
["从句","____ you work harder, you will fail the exam.",["If","Unless","Although","Because"],1,"考点：条件状语从句。句意为“除非你更努力，否则考试会不及格”，用 Unless（= if not）；If 会使逻辑相反，Although/Because 与语义不符。"],
["从句","____ it was raining, we went out for a walk.",["Although","But","However","Because"],0,"考点：让步状语从句。although 引导让步，且英语中 although 与 but 不能同时使用；But/However 会造成双连接，Because 表原因与语义相反。"],
["从句","He is the only person ____ can solve the problem.",["who","which","whom","what"],0,"考点：定语从句关系代词。先行词 person 指人且在从句中作主语，用 who；whom 只作宾语，which 指物，what 不能引导定语从句。"],
["非谓语","____ from the top of the hill, the city looks beautiful.",["Seen","Seeing","To see","See"],0,"考点：过去分词作状语。逻辑主语 the city 与 see 是被动关系（城市被看），用 Seen；Seeing 表主动，To see 表目的，See 是谓语形式。"],
["非谓语","He got up early ____ the first bus.",["catch","catching","to catch","caught"],2,"考点：不定式表目的。早起是为了赶上头班车，用 to catch；catching 不作目的状语，caught 是谓语动词，catch 原形不能单独连接。"],
["非谓语","____ aloud every morning is a good way to learn English.",["Read","Reading","Reads","To reading"],1,"考点：动名词作主语。句子缺主语，动词作主语要用 -ing，且谓语 is 为单数，用 Reading；Read/Reads 是谓语形式，To reading 搭配错误。"],
["非谓语","The girl ____ under the tree is my sister.",["stands","standing","stood","to stand"],1,"考点：现在分词作定语。女孩是主动“站”，用 standing 修饰 the girl（相当于 who is standing）；stands 会形成两个谓语，stood 表被动，to stand 不表主动进行。"],
["非谓语","I'm sorry ____ you waiting for so long.",["keep","keeping","to keep","kept"],2,"考点：固定句式 be sorry to do sth。表示“很抱歉让你等这么久”，用 to keep；keep/keeping/kept 都不符合该句式。"],
["非谓语","Weather ____, we will have a picnic tomorrow.",["permits","permitting","permitted","to permit"],1,"考点：独立主格结构。Weather 与 permit 是主动关系，且与主句主语 we 不同，用现在分词 permitting；permits 会让句子出现两个谓语。"],
["虚拟语气","If I ____ you, I would take the job.",["am","were","had been","be"],1,"考点：虚拟语气（与现在事实相反）。if 从句用过去式，be 动词一律用 were，故 If I were you；am/had been/be 都不符合该规则。"],
["虚拟语气","If he ____ earlier, he would have caught the train.",["left","had left","leaves","has left"],1,"考点：虚拟语气（与过去事实相反）。主句 would have caught 表明是对过去的假设，从句用 had left；left 是过去式，只用于与现在相反。"],
["虚拟语气","I wish I ____ taller than I am.",["am","were","will be","be"],1,"考点：wish 后的虚拟语气。表示与现在事实相反的愿望，从句用过去式、be 用 were，故 I wish I were taller；am/will be/be 都不表虚拟。"],
["虚拟语气","The teacher suggested that we ____ more reading after class.",["do","did","doing","to do"],0,"考点：虚拟语气。suggest 表“建议”时，从句谓语用 (should) + 动词原形，故用 do；did/doing/to do 都不符合该结构。"],
["虚拟语气","He talks as if he ____ everything about it.",["knows","knew","know","has known"],1,"考点：as if 引导的虚拟语气。与现在事实相反（他并非什么都懂），从句用过去式 knew；knows 是陈述语气，know/be 形式不符。"],
["情态动词","— Must I finish it today? — No, you ____.",["mustn't","needn't","can't","shouldn't"],1,"考点：情态动词的问答。Must I…? 的否定回答用 needn't（不必），而不是 mustn't（禁止）；can't 表不可能，shouldn't 表不建议。"],
["情态动词","The light is on, so he ____ be at home.",["can't","must","may not","needn't"],1,"考点：情态动词表推测。灯亮着是“有把握的肯定推测”，用 must be；can't be 表否定推测，may not be 语气太弱，needn't 表“不必”。"],
["情态动词","You ____ have told me earlier; I could have helped you.",["must","should","can","may"],1,"考点：情态动词 + have done。should have done 表示“本该做而没做”，含责备；must have done 表肯定推测，can't have done 表否定推测，may have done 表可能。"],
["情态动词","He ____ swim when he was only five.",["can","could","may","must"],1,"考点：情态动词表过去能力。when he was only five 指过去，用 could；can 只表现在能力，may/must 不表能力。"],
["倒装与强调","Never ____ I seen such a beautiful place.",["have","had","did","was"],0,"考点：部分倒装。否定副词 never 置于句首时，主句要把助动词提到主语前，用 have I seen；had/did 时态不符，was 不能与 seen 搭配。"],
["倒装与强调","Only then ____ the importance of health.",["I realized","did I realize","I did realize","realized I"],1,"考点：only + 状语置于句首的部分倒装。主句需借助助动词 did 并前置，用 did I realize；其余选项均未倒装或时态/结构有误。"],
["倒装与强调","It was in 2010 ____ he graduated from college.",["when","that","which","where"],1,"考点：强调句。It was … that … 结构中被强调部分是 in 2010，用 that 连接；when/which/where 都不能用于强调句的连接。"],
["倒装与强调","So loudly ____ that everyone in the hall could hear him.",["he spoke","did he speak","he did speak","spoke he"],1,"考点：so + 副词置于句首的部分倒装。主句用助动词 did 前置，构成 did he speak；其余选项没有倒装。"],
["词法与搭配","He is ____ honest boy that everyone likes him.",["a","an","the","/"],1,"考点：不定冠词 a/an 的选择。honest 的 h 不发音，读音以元音音素开头，用 an；a 用于辅音音素开头，the 表特指，此处为泛指。"],
["词法与搭配","We will meet ____ Monday morning at the school gate.",["in","on","at","for"],1,"考点：时间介词。Monday morning 是具体某天的上午，用 on；in 用于月份/年份/季节，at 用于钟点，for 表持续。"],
["词法与搭配","Both Tom and Jim ____ interested in music.",["is","are","was","has"],1,"考点：主谓一致。both…and 连接两个主语时视为复数，用 are；is/was 是单数，has 不能与 interested 搭配。"],
["词法与搭配","Would you like ____ tea before we start?",["any","some","a","many"],1,"考点：some 与 any。表示邀请或请求的疑问句用 some，故 Would you like some tea；any 用于纯疑问或否定，a/many 与不可数名词 tea 不搭配。"],
["词法与搭配","I prefer tea ____ coffee in the morning.",["than","to","for","with"],1,"考点：固定搭配 prefer A to B。比较两物用 to，不用 than；for/with 都不构成该搭配。"],
["词法与搭配","She is ____ than her sister.",["more tall","taller","tallest","more taller"],1,"考点：比较级的构成。单音节形容词 tall 的比较级是 taller，不能再用 more；more taller 属双重比较，tallest 是最高级。"],
["真题·完形","I didn't come from a family connected to the ______ world.",["medical","artistic","scientific","literary"],3,"考查形容词辨析。作者从未想过能成为作家，因为出身于与“文学”无关的家庭，literary world 与 writer 同范畴，构成因果。medical、artistic、scientific 分别指医学、艺术、科学，都不能与“作家梦”呼应。","2026·全国二卷"],
["真题·完形","…which I perceived as a major ______.",["subject","problem","event","breakthrough"],1,"考查名词。作者把“家中无人从事文学”视为追求写作的一大障碍，perceive sth. as a major problem 即“视之为大问题”。subject 指主题，event 指事件，breakthrough 指突破，都不能表示“困难、障碍”。","2026·全国二卷"],
["真题·完形","After my undergraduate degree, convinced that writing wasn't for me, I ______ to study teaching.",["stepped aside","got up","went off","turned back"],2,"考查动词短语。作者认定写作不适合自己，于是“动身”去学教书，go off to do sth. 表示离开去从事某事。step aside 意为让位，get up 意为起身，turn back 意为折返，都不能接 to study teaching。","2026·全国二卷"],
["真题·完形","Then came an afternoon that ______ everything.",["changed","ruined","revealed","interrupted"],0,"考查分词作定语。学生的一句话点醒作者，那个下午成了改变他人生的一天，changed 修饰 afternoon，与后文重返大学相呼应。ruined 意为毁掉，revealed 意为揭示，interrupted 意为打断，语义均不合。","2026·全国二卷"],
["真题·完形","I was teaching poetry, encouraging students to write about their ______.",["hobbies","families","dreams","lessons"],2,"考查名词复现。后文学生质问“你教我们实现梦想，自己却没做到”，且空处与下文 dreams 原词复现，故作者让学生写的是自己的梦想。hobby 指爱好，family 指家庭，lesson 指课程，均与“追梦”主题无关。","2026·全国二卷"],
["真题·完形","“Have you always wanted to be a ______, Miss?”",["writer","teacher","reporter","publisher"],1,"考查名词。男孩问“您一直想当老师吗”，因为作者当时是教师，上文有 study teaching、teaching poetry 等提示。reporter 指记者，publisher 指出版人，都与作者身份不符，属同类职业词干扰。","2026·全国二卷"],
["真题·完形","I didn't think I quite had what it ______.",["kept","left","held","took"],3,"考查动词。take sb. to be... 意为“把某人当作、认为某人是”，作者说自己从不认为自己是个作家，与开篇 never thought I could be a writer 呼应；keep、leave、hold 都不能构成这一搭配。","2026·全国二卷"],
["真题·完形","The boy replied with a ______ look.",["satisfied","guilty","grateful","disapproving"],3,"考查形容词与态度。男孩紧接着反问“你自己都没做到”，显然是一副“不以为然”的神情，disapproving 与作者被问得哑口无言相呼应。satisfied、guilty、grateful 与质问、质疑的语气相反。","2026·全国二卷"],
["真题·完形","“Have you even ______?”",["tried","noticed","asked","waited"],0,"考查动词。男孩追问“您尝试过吗”，点出作者从未真正为作家梦努力过，与下文作者承认对方说得对相衔接。notice 意为注意到，ask 意为询问，wait 意为等待，都不能表达“尝试”。","2026·全国二卷"],
["真题·完形","I was struck speechless — he was ______.",["rude","right","shy","silent"],1,"考查形容词。作者被问得无言以对（struck speechless），说明他承认男孩说得对，right 在此意为“（话）有道理、正确”。rude 指粗鲁，shy 指害羞，silent 指沉默，都没抓住“被说中”的心理。","2026·全国二卷"],
["真题·完形","Who was I to ______ them on bravery and risk…?",["examine","congratulate","lecture","consult"],2,"考查熟词生义。lecture 在此不是“讲座”而是“说教、训诫”，指作者多年来对学生大讲追梦的道理却未践行。examine 意为审查，congratulate 意为祝贺，consult 意为咨询，都与“讲道理”不符。","2026·全国二卷"],
["真题·完形","…when I had never taken myself nor my own ______ seriously?",["values","imagination","inspiration","desires"],3,"考查名词。作者意识到自己从未认真对待内心对写作的渴望，desire 与前文 dreams 同义呼应。value 指价值，imagination 指想象力，inspiration 指灵感，都不能表示“内心强烈的愿望”。","2026·全国二卷"],
["真题·完形","On the basis of that ______, I applied to go back to university…",["cooperation","conversation","administration","explanation"],1,"考查名词。正是那次与学生的一番对话促使作者重返大学攻读创意写作，conversation 指课堂上的交谈。cooperation 指合作，administration 指管理，explanation 指解释，都与“被学生点醒”的语境不符。","2026·全国二卷"],
["真题·完形","I knew I needed nothing else to succeed but a bit of ______ and hard work.",["self-belief","know-how","brainstorming","teamwork"],0,"考查名词。回望过去，作者明白自己当年缺的是自信，如今懂得自信加努力才是成功的关键，self-belief 与开篇的不自信形成对照。know-how 指专门技能，brainstorming 指集思广益，teamwork 指协作，均不对应。","2026·全国二卷"],
["真题·完形","I ______ to find a way out of my shame and into a pattern of work that I loved.",["remembered","agreed","managed","hesitated"],2,"考查动词。结尾与开篇 never thought I could be a writer 遥相呼应，说明作者最终“设法做到了”，manage 表示勉力完成、成功做到。hesitate 意为犹豫，与“圆梦”的结果相反，属反向干扰。","2026·全国二卷"],
["真题·语法填空","For the first 15 minutes of my tai chi class, we remain ______ (entire) in one spot to warm up.",["entire","entirely","more entire","entireness"],1,"考查副词。空处修饰动词 remain，须用副词，entire 的副词形式为 entirely，意为“完全地”。填形容词 entire 不能修饰动词，属词性错误。句意：前十五分钟我们完全待在原地做热身。","2026·全国二卷"],
["真题·语法填空","Angela, a tai chi ______ (instruct) with twenty-eight years of experience…",["instruction","instructor","instructive","instructing"],1,"考查名词。空前有不定冠词 a，此处指人，即“有 28 年经验的太极教练”，instruct 的名词 instructor 表示“教练、导师”。instruct 是动词，instruction 指“指导、说明”，均不能指人。","2026·全国二卷"],
["真题·语法填空","“Your mind ______ body go together.”",["and","or","but","so"],0,"考查并列连词。空处连接 mind（头脑）与 body（身体）两个并列名词，表示“身心合一”，故用 and。or 表选择，but 表转折，so 表结果，都与“兼顾身心”的并列关系不符。","2026·全国二卷"],
["真题·语法填空","Put your ______ (foot) parallel…",["foot","foots","feet","feets"],2,"考查名词复数。foot 的复数形式为 feet，此处描述“双脚平行”的站姿，需用复数。单数 foot 与“双脚”不符，属忽略语境的形近错误；该句为动作要领，不能用所有格或其他形式。","2026·全国二卷"],
["真题·语法填空","Now, I ______ (suppose) to feel the weight on my legs.",["suppose","am supposed","was supposing","have supposed"],1,"考查固定搭配与主谓一致。be supposed to do sth. 意为“应该做某事”，全文以一般现在时叙述，主语为 I，故填 am supposed。写成 is supposed 或 supposed 都破坏主谓一致与系动词结构。","2026·全国二卷"],
["真题·语法填空","We move on to tai chi positions, of ______ there are forty-two.",["that","which","what","them"],1,"考查“介词＋关系代词”。先行词是 tai chi positions（事物），介词 of 之后只能用 which 引导非限制性定语从句，that、who 都不能放在介词后，属关系代词的选择错误。","2026·全国二卷"],
["真题·语法填空","The movements have ______ (describe) names like “holding the bowl”.",["describe","describing","descriptive","description"],2,"考查词性转换。空处修饰名词 names，须用形容词，describe 的形容词 descriptive 意为“描述性的、形象的”，说明招式名字生动。填 description（名词）或 describing 都不合此处修饰名词的需要。","2026·全国二卷"],
["真题·语法填空","I keep my eyes ______ a woman to my right.",["in","on","at","to"],1,"考查固定搭配。keep one's eye on sb./sth. 意为“留意、注视某人或某物”，此处指作者盯着右侧的女士模仿动作，介词只能用 on。用 at、to 等都不构成这一固定短语。","2026·全国二卷"],
["真题·语法填空","…despite it still ______ (be) early at 8am.",["be","was","being","been"],2,"考查非谓语。despite 后接“it being only 8 am”这一独立主格结构，it 与 be 是逻辑上的主谓关系，故用现在分词 being。用 to be 或 be 都不符合 despite 后接名词性结构的用法。","2026·全国二卷"],
["真题·语法填空","It's time for my dan tian ______ (meet) another life force.",["meet","meeting","to meet","met"],2,"考查固定句型。It's time for sb./sth. to do sth. 意为“到某人或某物做某事的时候了”，应用动词不定式 to meet。用 meeting 或 meet 都破坏该句型的固定结构，属非谓语形式的误选。","2026·全国二卷"],
["真题·完形","The village lay near some wetlands which became his second ______.",["dream","job","home","choice"],2,"考点：名词辨析。依据：首句说莫莱在小村庄长大，村边的湿地便成了他的第二个家，home 与 grew up 呼应。排除：dream 梦想、job 工作、choice 选择都不能与“第二个”搭配。","2020·新高考I卷"],
["真题·完形","He learned the value and beauty of ______ there from a very young age.",["nature","youth","culture","knowledge"],0,"考点：名词辨析。依据：上文点出湿地，下文写他为保护动物种树，故此处指幼年便懂得自然的价值与美。排除：youth 青春、culture 文化、knowledge 知识都与湿地语境不合。","2020·新高考I卷"],
["真题·完形","Molai began to notice something ______ happening around his home.",["precious","interesting","disturbing","awkward"],2,"考点：形容词辨析。依据：后文写洪水致鸟与蛇减少，属坏消息，disturbing“令人不安的”最贴切。排除：precious 珍贵的、interesting 有趣的、awkward 尴尬的都与灾害语境相悖。","2020·新高考I卷"],
["真题·完形","A flood had hit the area earlier that year and the ______ it caused had driven away a number of birds.",["waste","tension","pain","damage"],3,"考点：名词辨析。依据：空前是洪水，空后说它致使鸟离开，洪水带来的是破坏，damage 与 caused 搭配自然。排除：waste 浪费、tension 紧张、pain 疼痛都不指洪水造成的损毁。","2020·新高考I卷"],
["真题·完形","______, the number of snakes had declined as well.",["Besides","However","Therefore","Otherwise"],0,"考点：连接词辨析。依据：空前说鸟的数量减少，空后说蛇的数量也减少，是递进补充，用 Besides“此外”。排除：However 表转折、Therefore 表结果、Otherwise 表否则，逻辑都不通。","2020·新高考I卷"],
["真题·完形","He ______ that the birds had gone because there weren't enough trees to protect them.",["agreed","realized","remembered","predicted"],1,"考点：动词辨析。依据：他由鸟与蛇消失推断原因，即“意识到”没有足够的树，realized 与后面 that 从句搭配。排除：agreed 同意、remembered 记得、predicted 预测都不合发现原因之意。","2020·新高考I卷"],
["真题·完形","There weren't enough trees to protect the animals from the ______.",["noise","heat","disease","dust"],1,"考点：名词辨析。依据：下句说动物白天需要遮阴，可见受不了暑热，故为 heat。排除：noise 噪音、disease 疾病、dust 沙尘在文中都找不到对应信息支撑。","2020·新高考I卷"],
["真题·完形","The solution was to plant trees so the animals could seek ______ during the daytime.",["directions","partners","help","shelter"],3,"考点：名词辨析。依据：解决办法是种树，让动物白天有处遮蔽，seek shelter“寻求庇护”为固定搭配。排除：directions 方向、partners 伙伴不能与 seek 搭配表藏身，seek help 与种树遮阴无关。","2020·新高考I卷"],
["真题·完形","He turned to the ______ department for help but was told that nothing would grow there.",["labor","police","forest","finance"],2,"考点：名词辨析。依据：他要种树，自然向林业部门求助，forest 与下文“那里什么都长不出来”呼应。排除：labor 劳动、police 警察、finance 财政都与植树造林无关。","2020·新高考I卷"],
["真题·完形","Molai went looking on his own and ______ a nearby island where he began to plant trees.",["rebuilt","discovered","left","managed"],1,"考点：动词辨析。依据：空后是附近一座他着手种树的岛，说明他“发现”了这座岛才得以开工。排除：rebuilt 重建、left 留下、managed 管理都不能接 island 表示首次找到。","2020·新高考I卷"],
["真题·完形","______ young plants in the dry season was tough for a lone boy.",["Decorating","Observing","Watering","Guarding"],2,"考点：动名词辨析。依据：下句写陶罐接雨水再滴到苗上，可见此处指旱季给小树浇水，Watering 与 drip 呼应。排除：Decorating 装饰、Observing 观察、Guarding 守护都解释不了接雨水的做法。","2020·新高考I卷"],
["真题·完形","Watering young plants in the dry season was ______ for a lone boy.",["tough","illegal","fantastic","beneficial"],0,"考点：形容词辨析。依据：空后 for a lone boy 强调独自一人，独自在旱季浇灌幼苗自然艰难，tough 最贴切。排除：illegal 违法、fantastic 极好、beneficial 有益都与“孤身一人”的语感不符。","2020·新高考I卷"],
["真题·完形","Molai built at the ______ of each sapling a bamboo platform, where he placed earthen pots.",["back","top","foot","side"],1,"考点：名词辨析。依据：下句说水会滴到下面的植物上，说明竹台搭在每棵幼苗的顶部，top 正确。排除：back、foot、side 都无法让水“滴到下面的植物”。","2020·新高考I卷"],
["真题·完形","He placed earthen pots with small holes to ______ rainwater.",["cool down","keep off","purify","collect"],3,"考点：动词短语辨析。依据：陶罐有小孔，用来收集雨水再慢慢滴下，collect 与空后 rainwater 搭配。排除：cool down 降温、keep off 远离、purify 净化都解释不了小孔蓄水再滴落的用途。","2020·新高考I卷"],
["真题·完形","Molai ______ to plant trees for the next 37 years.",["returned","learned","failed","continued"],3,"考点：动词辨析。依据：空后写接下来 37 年他一直种树，最终形成 1,360 英亩林地，continued 正确。排除：returned 返回、learned 学会、failed 失败都与 37 年的成果矛盾。","2020·新高考I卷"],
["真题·语法填空","In the 18th and 19th centuries, ______ (wealth) people travelled and collected plants, historical objects and works of art.",["wealthy","wealth","wealthily","wealthier"],0,"考点：词性转换。依据：空后是名词 people，需用形容词修饰，wealth 加 y 构成 wealthy“富有的”。排除：wealth 是名词不能作定语，wealthily 是副词，wealthier 为比较级但无比较对象。","2020·新高考I卷"],
["真题·语法填空","They kept their collection at home until it got too big ______ until they died.",["and","or","but","then"],1,"考点：并列连词。依据：until it got too big 与 until they died 并列，表示“直到太大或直到去世”两种情形，用 or。排除：and 会让两种情形同时成立，but 表转折、then 表顺承，均不合逻辑。","2020·新高考I卷"],
["真题·语法填空","The 80,000 objects collected by Sir Hans Sloane, for example, ______ (form) the core collection of the British Museum.",["forms","formed","forming","have formed"],1,"考点：时态。依据：主语是 8 万件藏品，空处作谓语，斯隆的收藏与 1759 年开馆都属过去，用一般过去时 formed。排除：forms 现在时、forming 非谓语、have formed 与这一过去时间点不符。","2020·新高考I卷"],
["真题·语法填空","…the British Museum ______ opened in 1759.",["that","which","where","what"],1,"考点：定语从句。依据：先行词 the British Museum 指物，关系词在非限制性从句中作主语，用 which。排除：where 作地点状语，what 不引导定语从句，who 只指人，均可排除。","2020·新高考I卷"],
["真题·语法填空","The parts of a museum open to the public ______ (call) galleries or rooms.",["call","called","are called","are calling"],2,"考点：被动语态。依据：主语 the parts of a museum 与 call 是被动关系，且陈述客观事实，用一般现在时被动 are called。排除：call 主动、called 缺助动词、are calling 为进行时，都不合。","2020·新高考I卷"],
["真题·语法填空","Often, only a small part of a museum's collection ______ (be) on display.",["are","is","was","be"],1,"考点：主谓一致。依据：主语中心词是 a small part，为单数，谓语用 is。排除：are 用于复数，was 与时间状语 Often 所表的现在时不符，be 是原形不能单独作谓语。","2020·新高考I卷"],
["真题·语法填空","…visitors can imagine ______ (they) living at a different time in history.",["them","their","themselves","they"],2,"考点：反身代词。依据：imagine 的宾语与主语 visitors 同指，用反身代词 themselves，构成 imagine oneself doing。排除：them 是宾格，their 是形容词性物主代词，they 是主格，都不能作宾语。","2020·新高考I卷"],
["真题·语法填空","…or ______ (walk) through a rainforest.",["walk","to walk","walked","walking"],3,"考点：非谓语动词。依据：空处与前面的 living 并列，同作 imagine 的宾语，故用动名词 walking。排除：walk 原形、to walk 不定式、walked 过去分词都不能与 living 并列作宾语。","2020·新高考I卷"],
["真题·语法填空","Historical ______ (accurate) is important but so is entertainment.",["accurate","accuracy","accurately","accurateness"],1,"考点：词性转换。依据：空处作主语，前有形容词 Historical 修饰，需用名词 accuracy“准确性”。排除：accurate 是形容词，accurately 是副词，accurateness 虽为名词但罕用且不合此处搭配。","2020·新高考I卷"],
["真题·语法填空","Museums must compete ______ people's spare time.",["with","for","against","in"],1,"考点：介词搭配。依据：compete for sth 意为“争夺某物”，此处争夺的是人们的空闲时间与金钱。排除：compete with/against 后接对手，compete in 指参加比赛，都与“争夺时间”不符。","2020·新高考I卷"],
["真题·完形","When Jim Grant spotted black smoke coming out of a building on his way to work, he ______ his car to call 911.",["drove","stopped","reached","abandoned"],1,"考点：动词辨析。依据：看到冒烟后他需要报警，故先把车停下，stopped 与下文“掉头返回”呼应。排除：drove 开走、reached 到达、abandoned 弃车都不合停车打电话的语境。","2020·新高考II卷"],
["真题·完形","Then he ______ a U-turn, circling back to take another look.",["saw","made","missed","crossed"],1,"考点：动词搭配。依据：make a U-turn 意为掉头，空后“绕回来再看一眼”正是掉头返回的动作。排除：saw、missed、crossed 都不能与 a U-turn 构成“掉头”之意。","2020·新高考II卷"],
["真题·完形","Not seeing or hearing any fire engines ______, Grant rushed to a side entrance and ran up the stairs.",["burning","leaving","approaching","waiting"],2,"考点：动词辨析。依据：没看到也没听到消防车“驶近”，他才独自冲上楼，approaching 与 fire engines 搭配。排除：burning 燃烧、leaving 离开、waiting 等候都不合“听到消防车开来”的表达。","2020·新高考II卷"],
["真题·完形","Not seeing or hearing any fire engines approaching, Grant rushed to a side ______ and ran up the stairs.",["entrance","road","building","window"],0,"考点：名词辨析。依据：空后“跑上楼梯”，从侧门进去才能上楼，entrance 正确。排除：road 道路、building 建筑、window 窗户都不能与 side 搭配表示侧门。","2020·新高考II卷"],
["真题·完形","On the second floor, he ______ every apartment door.",["locked","kicked","counted","repaired"],1,"考点：动词辨析。依据：他逐户踹门喊人，与下文“一脚踹开”形成词汇复现。排除：locked 锁上、counted 数、repaired 修理都不符合火场救人的急切举动。","2020·新高考II卷"],
["真题·完形","\"Get out!\" Grant shouted. No one ______ and he assumed that people had already escaped.",["agreed","cared","responded","understood"],2,"考点：动词辨析。依据：他喊“快出来！”，无人应答才以为人都已逃走，responded 意为回应。排除：agreed 同意、cared 在意、understood 理解都不能表示对喊话作出回应。","2020·新高考II卷"],
["真题·完形","No one responded and he assumed that people had already ______.",["arrived","returned","hidden","escaped"],3,"考点：动词辨析。依据：没人应答，他推断人们已经逃出火场，escaped 与 fire 语境相符。排除：arrived 到达、returned 返回、hidden 躲藏都不如“逃出”贴合下文。","2020·新高考II卷"],
["真题·完形","Reaching the end of the hallway, though, Grant ______ a half-open door.",["skipped","closed","noticed","remembered"],2,"考点：动词辨析。依据：走到走廊尽头，他“注意到”一扇半开的门，才可能发现被困的母子。排除：skipped 跳过、closed 关上、remembered 想起都与“发现半开的门”矛盾。","2020·新高考II卷"],
["真题·完形","He kicked it wide open, finding a ______ woman in a wheelchair with a little boy and a tiny baby.",["frightened","curious","patient","grateful"],0,"考点：形容词辨析。依据：后文写那女士茫然地看着他，是被大火吓坏了，frightened 正确。排除：curious 好奇、patient 耐心、grateful 感激都不合“茫然看着”的表现。","2020·新高考II卷"],
["真题·完形","\"Let's ______!\" he screamed.",["turn back","go up","get out","lie down"],2,"考点：动词短语。依据：危急时刻他喊“我们快出去”，get out 与上文“快出来”形成复现。排除：turn back 折返、go up 上去、lie down 躺下都与逃生方向相反。","2020·新高考II卷"],
["真题·完形","Clutching the baby to his chest and ______ the boy alongside, Grant ran down the hallway.",["following","dragging","examining","passing"],1,"考点：动词辨析。依据：他一手把婴儿紧抱在胸前，一手拽着男孩往外跑，dragging 意为拖着走。排除：following 跟随、examining 检查、passing 经过都表现不出紧急撤离。","2020·新高考II卷"],
["真题·完形","When he was ______ outside, the only help in sight was a policeman.",["safely","secretly","suddenly","previously"],0,"考点：副词辨析。依据：把两个孩子安全带出来之后，他才看到唯一能帮忙的人，safely 与获救呼应。排除：secretly 秘密地、suddenly 突然、previously 先前都不合语境。","2020·新高考II卷"],
["真题·完形","When he was safely outside, the only ______ in sight was a policeman.",["witness","guide","service","help"],3,"考点：名词辨析。依据：此前无人相助，此时眼前唯一的“帮手”是警察，help 在此作名词指可求助的人。排除：witness 目击者、guide 向导、service 服务都不能指具体的人。","2020·新高考II卷"],
["真题·完形","Grant told him about the ______ and they rushed into the smoky building.",["woman","door","car","baby"],0,"考点：名词辨析。依据：他只救出两个孩子，还有一位女士被困在内，故向警察讲述那位女士的情况。排除：door、car、baby 都不是需要再次冲进楼里救的对象。","2020·新高考II卷"],
["真题·完形","Grant and the policeman were honored for their ______.",["wisdom","generosity","honesty","courage"],3,"考点：名词辨析。依据：两人冲进浓烟滚滚的大楼救人，受表彰是因为勇气，courage 最贴切。排除：wisdom 智慧、generosity 慷慨、honesty 诚实都不能概括火海救人的行为。","2020·新高考II卷"],
["真题·语法填空","These days, it is not unusual for 10- to 12-year-olds to publish their own websites or for second and third graders ______ (begin) computer classes.",["begin","to begin","beginning","began"],1,"考点：非谓语动词。依据：句中为 it is not unusual for sb. to do sth. 结构，for 后接名词再加不定式，故填 to begin。排除：begin 原形、beginning 分词、began 过去式都不能作 for 的宾语补足成分。","2020·新高考II卷"],
["真题·语法填空","At the same time, computer games are becoming increasingly popular as major publishing houses continue to develop ______ (education) computer programs for children in preschool.",["education","educational","educating","to educate"],1,"考点：词性转换。依据：空处修饰名词短语 computer programs，需用形容词 educational“教育的”。排除：education 是名词，educating 是动名词，to educate 是不定式，都不能作定语。","2020·新高考II卷"],
["真题·语法填空","Also, technological know-how has become a ______ (require) for most jobs in an increasingly digital world, as the computer has become a common tool in most professions.",["requirement","require","required","requirements"],0,"考点：词性转换。依据：空前有冠词 a、空后有 for，需填单数名词 requirement“要求”。排除：require 是动词，required 是形容词或过去分词，requirements 是复数与 a 冲突。","2020·新高考II卷"],
["真题·语法填空","Also, technological know-how has become a requirement for most jobs in an increasingly digital world, as the computer has become a common tool in most ______ (profession).",["profession","professional","professions","professionally"],2,"考点：名词单复数。依据：profession 是可数名词，most 后接复数表示“大多数行业”，故用 professions。排除：profession 单数与 most 搭配不当，professional 是形容词，professionally 是副词。","2020·新高考II卷"],
["真题·语法填空","The Digital World is a set of volumes ______ aim to describe how digital systems influence society and help readers understand the nature of digital systems and their many interacting parts.",["what","which","who","whose"],1,"考点：定语从句。依据：先行词 a set of volumes 指物，关系词在从句中作主语，用 which（也可用 that）。排除：what 不引导定语从句，who 只指人，whose 后须接名词。","2020·新高考II卷"],
["真题·语法填空","Each volume in the set explores ______ wide range of materials, explains the basic concepts of major applications of digital systems, and discusses the influences they have on everyday life.",["an","the","some","a"],3,"考点：冠词。依据：a wide range of 是固定搭配，意为“广泛的、大范围的”，故填 a。排除：an 用于元音音素前，the 表特指，some 不能构成这一固定短语。","2020·新高考II卷"],
["真题·语法填空","Each volume in the set explores a wide range of materials, explains the basic concepts of major applications of digital systems, ______ discusses the influences they have on everyday life.",["but","or","and","so"],2,"考点：并列连词。依据：句中 explores、explains、discusses 三个谓语并列，用 and 连接。排除：but 表转折、or 表选择、so 表结果，都与并列陈述的语义不符。","2020·新高考II卷"],
["真题·语法填空","Because the number of possible topics ______ (be) practically limitless, we focus on a sample of the most interesting and useful applications and tools and explain the basic principles of technology.",["is","are","was","were"],0,"考点：主谓一致。依据：the number of 加复数名词作主语时谓语用单数，且此处陈述客观情况用一般现在时，故填 is。排除：are 用于复数，was 与 were 与全文现在时不一致。","2020·新高考II卷"],
["真题·语法填空","Readers ______ (encourage) to continue exploring the digital world with the guidance of our Further Resources section featured in each volume.",["encourage","are encouraging","are encouraged","encouraged"],2,"考点：时态和语态。依据：主语 Readers 与 encourage 是被动关系，全文为一般现在时，故用 are encouraged。排除：encourage 是主动，are encouraging 是进行时，encouraged 缺助动词。","2020·新高考II卷"],
["真题·语法填空","Readers are encouraged to continue exploring the digital world with the guidance of ______ (we) Further Resources section featured in each volume.",["our","us","ours","we"],0,"考点：物主代词。依据：空处修饰名词短语 Further Resources section，需用形容词性物主代词 our。排除：us 是宾格，ours 是名词性物主代词，we 是主格，都不能作定语。","2020·新高考II卷"],
["真题·完形","Hough Bakeries, which, at Easter time, ______ little bunny cakes for all its stores throughout Cleveland.",["sold","ordered","made","reserved"],2,"考点：动词辨析。工厂要为全城门店供应小兔子蛋糕，后文贴糖霜眼睛、耳朵都是“制作”环节，C(made)对。sold 只讲卖出，与下文工序不符；ordered、reserved 是“订购、预留”，方向相反。","2021·新高考I卷"],
["真题·完形","Hough Bakeries, which, at Easter time, made little bunny cakes for all its ______ throughout Cleveland.",["stores","families","schools","citizens"],0,"考点：名词辨析。Hough 是烘焙厂，for all its stores throughout Cleveland 指供应给它遍及全城的分店，A(stores)对。families、schools、citizens 都不是“厂方所属”的对象，与 its 搭配不通。","2021·新高考I卷"],
["真题·完形","It happened that the plant downtown needed eight kids for ______ help during our spring break.",["generous","financial","technical","temporary"],3,"考点：形容词辨析。只干三天、又恰逢春假，属于“临时”帮工，D(temporary)对。generous、financial、technical 分别指慷慨、经济、技术，都不能与“春假短期打工”的语境对应。","2021·新高考I卷"],
["真题·完形","It happened that the plant downtown needed eight kids for temporary help during our spring break, for which I had no ______ beyond listening to my favorite records.",["plans","problems","excuses","hobbies"],0,"考点：名词辨析。have no plans 意为“没有安排”，与 beyond listening to my favorite records 呼应：春假无事可做才去打工，A(plans)对。problems、excuses、hobbies 与“闲着才去挣零花”的逻辑不合。","2021·新高考I卷"],
["真题·完形","I'd ______ minimum wage.",["offer","earn","set","suggest"],1,"考点：动词辨析。作者是去打工的中学生，能“挣到”最低工资，earn a wage 搭配得当，B(earn)对。offer 的主语应是雇主，set、suggest 与 wage 搭配均不能表达“挣工资”。","2021·新高考I卷"],
["真题·完形","I'd see how a factory ______.",["worked","closed","developed","survived"],0,"考点：动词辨析。作者想亲眼看看工厂是怎样“运转”的，how a factory worked 语义通顺，A(worked)对。closed、developed、survived 分别指关闭、发展、存活，都与“好奇工厂日常运作”的语境不符。","2021·新高考I卷"],
["真题·完形","My parents thought all of this was a grand idea and called Betsy's dad with their ______.",["ambition","permission","experience","invitation"],1,"考点：名词辨析。父母认为这是好主意，便打电话给贝齐的爸爸“表示同意”，B(permission)对。ambition、experience、invitation 分别指雄心、经验、邀请，都不能与“同意孩子去打工”对应。","2021·新高考I卷"],
["真题·完形","Our ______ in the factory were simple: Place cakes on a moving belt.",["joys","ideas","roles","choices"],2,"考点：名词辨析。冒号后“把蛋糕放上传送带”是在交代具体职责，role 除“角色”外还可表“职责”，C(roles)对。joys、ideas、choices 都无法概括后面列举的工序。","2021·新高考I卷"],
["真题·完形","Apply icing eyes and nose. ______ bunny from the belt.",["Save","Keep","Stop","Remove"],3,"考点：动词辨析。工序最后是把做好的蛋糕从传送带上“取下”，remove...from 符合流程，D(Remove)对。save、keep、stop 与 from the belt 搭配都不能表达“取下、拿走”之意。","2021·新高考I卷"],
["真题·完形","This was ______ than it sounds.",["harder","better","longer","cheaper"],0,"考点：比较级辨析。下文说稍一慢蛋糕就堆积、压力很大，可见活儿比听上去“更难”，A(harder)对。better、longer、cheaper 与后文描述的紧张忙乱都不相符。","2021·新高考I卷"],
["真题·完形","______ a bit and the cakes pile up.",["Calm down","Slow down","Stay on","Move on"],1,"考点：短语辨析。动作一“慢下来”蛋糕就堆积，slow down 与 pile up 构成因果，B(Slow down)对。calm down 指镇静，stay on、move on 指停留、继续，都不会导致蛋糕堆积。","2021·新高考I卷"],
["真题·完形","As I told my parents at dinner that first night, it was all a little more high-pressure than I'd ______.",["indicated","witnessed","expected","remembered"],2,"考点：动词辨析。工厂的压力比作者原先“预料”的更大，than I'd expected 是常见的比较结构，C(expected)对。indicated、witnessed、remembered 都不能与 than 构成“超出预期”之意。","2021·新高考I卷"],
["真题·完形","Dad ______.",["cried","smiled","hesitated","refused"],1,"考点：动词辨析。父亲也有过类似打工经历，听完会心一笑，B(smiled)对。cried、hesitated、refused 与下文他平静讲述自己暑假送食品的语气矛盾，也与“父子共鸣”的氛围不合。","2021·新高考I卷"],
["真题·完形","The son of a grocer, he'd spent the summers of his childhood ______ food in Bernardsville, New Jersey.",["tasting","finding","sharing","delivering"],3,"考点：动词辨析。杂货店老板的儿子，暑假要“送”食品，delivering food 与 grocer 的身份相符，D(delivering)对。tasting、finding、sharing 都不能体现这份体力活的辛苦。","2021·新高考I卷"],
["真题·完形","This was the sort of work that made you ______ the dollars you earned and respect those who did the work, he told me.",["withdraw","donate","receive","appreciate"],3,"考点：动词辨析。与 respect 并列，指这种劳动让人“珍惜”自己挣的每一块钱，appreciate 意为珍视，D 对。withdraw、donate、receive 分别指取出、捐赠、收到，都没有“珍惜”之义。","2021·新高考I卷"],
["真题·语法填空","______ is so breathtaking about the experience is the out-of-this-world scenes.",["That","It","What","Which"],2,"考点：主语从句。空处引导主语从句并在从句中作主语，指“……的事物”，用 What，C 对。That 只起连接作用、不作成分，It 不能引导该从句，Which 表“哪一个”，均不合。","2021·新高考I卷"],
["真题·语法填空","The rolling sea of clouds you see once you are at the top will remind you how tiny we ______ (human) are.",["human","humans","humanness","humans'"],1,"考点：名词单复数。空处作 we 的同位语，主语为复数，须用复数 humans，B 对。human 是单数，humanness 是抽象名词“人性”，humans' 是所有格，都不能作同位语。","2021·新高考I卷"],
["真题·语法填空","It will ______ (undoubted) help you get refreshed!",["undoubted","undoubtable","undoubtedly","undoubting"],2,"考点：词性转换。空处修饰动词 help，须用副词作状语，C(undoubtedly)对。undoubted、undoubtable 是形容词，undoubting 是分词，都不能修饰动词 help。","2021·新高考I卷"],
["真题·语法填空","The amazing thing about the spring is that the colder the temperature gets, the ______ (hot) the spring!",["hot","hottest","hotter","hotly"],2,"考点：比较级。the + 比较级, the + 比较级 表示“越……越……”，故用 hotter，C 对。hot 是原级，hottest 是最高级，hotly 是副词，都不能构成该句式。","2021·新高考I卷"],
["真题·语法填空","Strange, isn't it? But that's how nature is — always leaving us ______ (astonish).",["astonishing","astonishment","astonish","astonished"],3,"考点：非谓语作宾补。leave sb + 宾补，us 是“感到惊讶”的一方，用 -ed 形容词 astonished，D 对。astonishing 修饰令人惊讶的事物，astonishment 是名词，astonish 是动词。","2021·新高考I卷"],
["真题·语法填空","You can't help wondering how hard it ______ (be) for the people then to put all those rocks into place.",["is","was","were","been"],1,"考点：时态与主谓一致。时间状语 then 指过去，主语 it 为单数，用一般过去时 was，B 对。is 时态不符，were 与单数主语不一致，been 不能单独作谓语。","2021·新高考I卷"],
["真题·语法填空","Though it is the only unnatural thing on your way up the mountain, still it highlights the whole adventure ______ offers a place where you can sit down to rest your aching legs.",["but","and","or","so"],1,"考点：并列连词。空处连接并列谓语 highlights 与 offers，两者是顺接关系，用 and，B 对。but 表转折，or 表选择，so 表因果，都与“既突出全程又提供歇脚处”的并列不符。","2021·新高考I卷"],
["真题·语法填空","It highlights the whole adventure and offers a place where you can sit down to rest your ______ (ache) legs.",["ached","ache","aching","aches"],2,"考点：非谓语作定语。ache 与 legs 是主动关系，用现在分词 aching 修饰 legs，C 对。ached 是过去分词，表被动；ache 是原形，aches 是谓语形式，都不能作定语。","2021·新高考I卷"],
["真题·语法填空","As the song goes, this long and winding road will never disappear, and it will always stick in the visitor's memory. It sure does in ______ (I).",["my","me","mine","myself"],2,"考点：名词性物主代词。与 in the visitor's memory 呼应，指 stick in my memory，空后无名词，须用 mine 独立使用，C 对。my 后必须接名词，me 是人称代词，myself 是反身代词。","2021·新高考I卷"],
["真题·语法填空","While you're in China, Mount Huangshan is ______ must to visit!",["an","a","the","one"],1,"考点：冠词。must 此处作可数名词，表示“必须做的事”，泛指一件用不定冠词 a，B 对。an 用于元音音素前，the 表特指，one 与 must 搭配不自然。","2021·新高考I卷"],
["真题·完形","Over the past 38 years, Mr. Wang has pretended to be someone else many times, and has even learned to ______ different dialects (方言) leading to him being described as an \"Oscar-winning actor\".",["teach","compare","assess","speak"],3,"考点：动词辨析。speak a dialect 意为“会说某种方言”，与 dialects 搭配，D(speak)对。teach、compare、assess 分别指教、比较、评估，都不能表达“会讲多种方言”。","2021·新高考II卷"],
["真题·完形","The 60-year-old is not an actor, but a ______.",["lawyer","doctor","policeman","businessman"],2,"考点：名词辨析。后文写他伪装成乞丐协助破案，可见真实身份是警察，C(policeman)对。lawyer、doctor、businessman 与“卧底办案”的语境不符，也无法解释他为何要伪装。","2021·新高考II卷"],
["真题·完形","However, he is more devoted to his \"______\" than any real actor.",["role","study","family","audience"],0,"考点：名词辨析。他比任何真演员都更投入自己的“角色”，role 对，A。study、family、audience 都不能与 be devoted to 搭配表达“投入角色”，也与“像演员”呼应不上。","2021·新高考II卷"],
["真题·完形","To look into the ______, Wang disguised (伪装) himself and joined the beggars.",["mirror","case","future","question"],1,"考点：名词辨析。look into the case 意为“调查这起案件”，与后文伪装接近乞丐、套取线索呼应，B(case)对。mirror、future、question 与“伪装调查”的语境不符。","2021·新高考II卷"],
["真题·完形","To look into the case, Wang disguised (伪装) himself and ______ the beggars.",["interviewed","joined","arrested","assisted"],1,"考点：动词辨析。他伪装后“加入”乞丐群体，才能接近窃贼，B(joined)对。interviewed 是采访，arrested 是逮捕，assisted 是协助，都与“混入其中、暗中打探”相反。","2021·新高考II卷"],
["真题·完形","Dirty shorts and old shoes gave him the ______ of a real beggar and his convincing dialect soon won him the trust of the beggars.",["challenge","experience","appearance","freedom"],2,"考点：名词辨析。破短裤和旧鞋子让他有了真乞丐的“外表”，C(appearance)对。challenge、experience、freedom 分别指挑战、经验、自由，都与衣着给人的“样子”无关。","2021·新高考II卷"],
["真题·完形","Dirty shorts and old shoes gave him the appearance of a real beggar and his convincing dialect soon won him the ______ of the beggars.",["vote","sympathy","permission","trust"],3,"考点：名词辨析。令人信服的方言为他赢得乞丐的“信任”，win sb's trust 是固定搭配，D(trust)对。vote、sympathy、permission 都不能与 won him the...of 搭配表“取得信任”。","2021·新高考II卷"],
["真题·完形","\"I often ______ them to drink alcohol. Once they were drunk, they began to talk a lot,\" Wang said.",["invited","forced","helped","expected"],0,"考点：动词辨析。他常“邀请”乞丐喝酒，好让对方酒后多话，A(invited)对。forced 是强迫，helped 是帮助，expected 是期待，都不符合“请人喝酒套取信息”的做法。","2021·新高考II卷"],
["真题·完形","\"Once they were ______, they began to talk a lot,\" Wang said.",["drunk","deserted","bored","lost"],0,"考点：形容词辨析。喝“醉”之后乞丐话多，drunk 作表语，A 对。deserted、bored、lost 分别指被遗弃、无聊、迷失，都不能与“began to talk a lot”构成酒后吐言的因果。","2021·新高考II卷"],
["真题·完形","\"I'd then ______ myself to use the toilet, note down what the beggars said, and send the information to my teammates.\"",["guide","persuade","excuse","allow"],2,"考点：动词辨析。excuse oneself 是固定表达，意为“借故离开”，此处指借口上厕所，C(excuse)对。guide、persuade、allow 都不能构成“借故脱身”之意。","2021·新高考II卷"],
["真题·完形","\"I'd then excuse myself to use the toilet, ______ what the beggars said, and send the information to my teammates.\"",["refer to","note down","ask about","miss out"],1,"考点：短语辨析。把乞丐说的话“记下”再发给队友，note down 符合，B 对。refer to 是提及，ask about 是询问，miss out 是遗漏，都不能表示“记录信息”。","2021·新高考II卷"],
["真题·完形","\"I'd then excuse myself to use the toilet, note down what the beggars said, and send the ______ to my teammates.\"",["plan","agreement","direction","information"],3,"考点：名词辨析。他记下的是乞丐透露的“信息”，再发给队友，D(information)对。plan、agreement、direction 与“记录他人口中所言”的内容对不上。","2021·新高考II卷"],
["真题·完形","Wang, who is often in ______ situations, is also a judo (柔道) master.",["awkward","dangerous","unfortunate","strange"],1,"考点：形容词辨析。卧底抓贼常身处“危险”境地，B(dangerous)对。awkward、unfortunate、strange 分别指尴尬、不幸、奇怪，都不能概括卧底工作随时可能暴露的风险。","2021·新高考II卷"],
["真题·完形","\"As long as I get close enough, no criminal can ______ from me,\" he said.",["separate","recover","escape","hear"],2,"考点：动词辨析。只要离得足够近，罪犯就“逃”不掉，escape from 意为从……逃脱，C 对。separate、recover、hear 与 from me 搭配都没有“逃走”之义。","2021·新高考II卷"],
["真题·完形","Wang's ______ won him several honors, including a National May Day Labor Medal and 11 Citations of Merit.",["courage","honesty","kindness","optimism"],0,"考点：名词辨析。是他的“勇气”为他赢得诸多荣誉，courage 能概括全文，A 对。honesty、kindness、optimism 虽都是褒义词，却都不能概括多年卧底办案所依靠的品质。","2021·新高考II卷"],
["真题·语法填空","In the ______ (seven) grade, I started volunteering at the Monterey Bay Aquarium in California.",["seven","seventeen","seventh","seventy"],2,"考点：序数词。表示“七年级”须用序数词 seventh，C 对。seven 是基数词，seventeen、seventy 只是形近数词，都不能修饰 grade 表“第几年级”。","2021·新高考II卷"],
["真题·语法填空","I was upset to learn that many sea animals eat plastic garbage, ______ (think) it is food.",["think","thought","thinking","to think"],2,"考点：非谓语作状语。think 与主语 many sea animals 是主动关系，用现在分词 thinking 表伴随，C 对。thought 表被动，to think 表目的，think 原形不能作状语。","2021·新高考II卷"],
["真题·语法填空","I decided to do something ______ (educate) people about this problem.",["educate","educating","to educate","education"],2,"考点：非谓语作目的状语。表示“为了教育人们”用动词不定式 to educate，C 对。educate 原形不能作目的状语，educating 表伴随，education 是名词，均不合。","2021·新高考II卷"],
["真题·语法填空","I decided that if I learned of a company ______ used a lot of plastic, I'd send it an email urging it to cut back.",["that","what","who","whose"],0,"考点：定语从句。先行词 a company 在从句中作主语，用关系代词 that，A 对。what 不能引导定语从句，who 指人，whose 表所属，均与“公司”这一先行词不合。","2021·新高考II卷"],
["真题·语法填空","I found the contact information of the company ______ emailed its president.",["but","so","and","or"],2,"考点：并列连词。“找到联系方式”与“给总裁发邮件”是先后顺承的动作，用 and，C 对。but 表转折，so 表结果，or 表选择，都不合这两个动作的顺承关系。","2021·新高考II卷"],
["真题·语法填空","I told him how ______ (harm) plastic could be to the environment and asked him to consider using more eco-friendly options.",["harm","harmful","harmfully","harmed"],1,"考点：形容词作表语。how harmful plastic could be 中 be 后需形容词，B(harmful)对。harm 是名词或动词，harmfully 是副词，harmed 表被动，都不能作表语。","2021·新高考II卷"],
["真题·语法填空","I was so ______ (excite) when he wrote back to me.",["excite","excited","exciting","excitement"],1,"考点：-ed 形容词。主语是 I，表示“感到兴奋”用 excited，B 对。exciting 修饰令人兴奋的事物，excite 是动词，excitement 是名词，都不能作表语。","2021·新高考II卷"],
["真题·语法填空","One of the biggest companies I wrote to ______ (be) Alaska Airlines.",["is","was","were","being"],1,"考点：主谓一致与时态。主语 One of the biggest companies 为单数，且叙述过去的事，用 was，B 对。is 时态不符，were 与单数主语不一致，being 不能单独作谓语。","2021·新高考II卷"],
["真题·语法填空","A company ______ (represent) wrote back and told me the airline was switching over from plastic to paper cups on all of its 1,200 daily flights.",["represent","representative","representation","representing"],1,"考点：名词。指“一位公司代表”，用名词 representative 作同位语，B 对。represent 是动词，representation 是抽象名词，representing 是分词，都不能指人。","2021·新高考II卷"],
["真题·语法填空","A company representative wrote back and told me the airline was switching over ______ plastic to paper cups on all of its 1,200 daily flights.",["to","with","from","for"],2,"考点：介词搭配。switch over from A to B 意为“从 A 转换为 B”，空后已有 to，故填 from，C 对。with、for 不合该搭配，to 会与后面的 to 重复。","2021·新高考II卷"],
["真题·完形","Some of our ______ are funny, especially from the early years when our children were little.",["ideas","jokes","memories","discoveries"],2,"考点：名词词义辨析。空后「especially from the early years when our children were little」点明所谈是过去十年露营留下的往事，funny 也说明这是可回味的片段，故填 memories。ideas 指想法、discoveries 指发现，都不能与「早年」「有趣」搭配；jokes 指笑话，与全文讲述亲身经历的叙事不符。","2022·新高考I卷"],
["真题·完形","Once, we ______ along Chalk Creek.",["camped","drove","walked","cycled"],0,"考点：动词辨析。下文出现「the whole campground」「fall into the creek」等信息，说明一家人在溪边扎营，故 camped along Chalk Creek。drove、walked、cycled 只交代交通方式，无法解释孩子被拴在营地旁、全家被困湖中这些情节；camped 还与末段「pulls our camper out of the garage」呼应。","2022·新高考I卷"],
["真题·完形","I was ______ that our 15-month-old boy would fall into the creek.",["annoyed","surprised","disappointed","worried"],3,"考点：形容词辨析（情绪推断）。十五个月大的孩子在水边，母亲的直觉是担心，故 worried；下文「tied a rope around his waist」「kept a close eye on him」正是这种担心的具体行动。annoyed（恼火）会把母亲写成不耐烦，与守护行为矛盾；disappointed（失望）无对象；surprised 更缺乏依据。","2022·新高考I卷"],
["真题·完形","He was ______, and his crying let the whole campground know it.",["unhurt","unfortunate","uncomfortable","unafraid"],2,"考点：形容词辨析。空后「his crying let the whole campground know it」说明孩子因被绳子拴住而大哭，绳缚使他 uncomfortable（不舒服）。unhurt 指未受伤，与哭闹无因果；unafraid 与「大哭」正相反；unfortunate 指运气不好，不能描述身体感受，无法解释哭声。","2022·新高考I卷"],
["真题·完形","So ______ tying him up, I just kept a close eye on him.",["due to","instead of","apart from","as for"],1,"考点：介词短语辨析。孩子一哭，作者放弃拴绳、改用盯着看，「instead of」意为「而不是」，正好连接这组被替换的动作。due to 表原因、apart from 表「除……之外」、as for 表「至于」，都无法体现「不做前者、改做后者」的取舍关系，是本题主要干扰。","2022·新高考I卷"],
["真题·完形","It ______ — he didn't end up in the creek.",["worked","happened","mattered","changed"],0,"考点：动词辨析＋破折号解释。破折号后「he didn't end up in the creek」就是对空处的解释：盯人的办法奏效了，故 It worked。happened 只表示「发生了」，无法体现「办法有效」；mattered 意为「要紧」，changed 意为「改变」，都与后文结果搭不上。","2022·新高考I卷"],
["真题·完形","The sky was clear when we ______, but storms move in fast in the mountains, and this one quickly interrupted our peaceful morning trip.",["signed up","calmed down","checked out","headed off"],3,"考点：动词短语辨析。与后半句「storms move in fast... interrupted our peaceful morning trip」对照可知，天晴是出发那一刻的情形，故 headed off（动身）。signed up 指报名、checked out 指退房结账，都与露营出游不搭；calmed down 指人平静下来，主语不能是「我们出发」。","2022·新高考I卷"],
["真题·完形","The sky was clear when we headed off, but storms move in fast in the mountains, and this one quickly ______ our peaceful morning trip.",["arranged","interrupted","completed","recorded"],1,"考点：动词辨析。but 转折之后，暴风雨「quickly ___ our peaceful morning trip」，即打断了平静的晨间出游，interrupted 最贴切。completed（完成）、arranged（安排）与暴风雨的破坏性相反；recorded（记录）无法体现行程被迫中止，与 peaceful 形成不了反差。","2022·新高考I卷"],
["真题·完形","The ______ picked up and thunder rolled.",["wind","noise","temperature","speed"],0,"考点：名词辨析＋搭配。与「thunder rolled」并列描写风暴来临，「picked up」在此意为「变大、增强」，能这样搭配的主语是 wind（风越刮越大）。noise 不与 pick up 搭配表示变响；temperature 只会下降；speed 的「加快」在此没有具体对象，故三项均不成立。","2022·新高考I卷"],
["真题·完形","My husband stopped fishing to ______ the motor.",["find","hide","start","fix"],2,"考点：动词辨析。暴风雨将至，丈夫「stopped fishing」是要发动马达离开，故 start the motor；后文「a dead motor」「No luck」「stuck in the middle of the lake」都说明他想让马达转起来却不成。find、hide 与「马达熄火」的处境无关；fix 指修理，文中并无检查故障的情节。","2022·新高考I卷"],
["真题·完形","He tried again. No ______.",["luck","answer","wonder","signal"],0,"考点：固定表达。前文已说他停下钓鱼去发动马达，此处「He tried again. No ___ .」表示再试一次仍不成功，No luck 是英语中「没成功、不走运」的惯用说法。answer 指回答、signal 指信号、wonder 指惊奇，都不能与 No 构成这一含义，也无法与「船困湖心」衔接。","2022·新高考I卷"],
["真题·完形","As we all sat there ______, a fisherman pulled up, threw us a rope and towed us back.",["patiently","tirelessly","doubtfully","helplessly"],3,"考点：副词辨析。马达坏了、船困湖心，一家人只能坐着等救援，helplessly（无助地）最合境。patiently 强调有耐心，与危急气氛不符；tirelessly 指不知疲倦，此处并无持续劳作；doubtfully 指心存怀疑，文中没有可供怀疑的对象。","2022·新高考I卷"],
["真题·完形","A fisherman pulled up, threw us a rope and towed us back. We were ______.",["sorry","brave","safe","right"],2,"考点：形容词辨析。渔夫抛来绳子把一家人拖回岸边，结果是有惊无险，故 We were safe。sorry 表歉意或遗憾，brave 形容人的勇气（此处主语是「我们」的处境而非品格），right 意为「正确的」，都无法概括获救后的状态。","2022·新高考I卷"],
["真题·完形","Now, every year when my husband pulls our camper out of the garage, we are filled with a sense of ______, wondering what camping fun and adventure we will experience next.",["relief","duty","pride","excitement"],3,"考点：名词辨析（情感）。每年丈夫把房车开出车库时，一家人都满怀期待，「wondering what camping fun... we will experience next」正是兴奋之情，故 excitement。relief 是紧张过后的宽慰，duty 是责任，pride 是自豪，都不能解释「期待下一次」这种向前的情绪。","2022·新高考I卷"],
["真题·完形","Now, every year when my husband pulls our camper out of the garage, we are filled with a sense of excitement, wondering what camping fun and ______ we will experience next.",["failure","adventure","performance","conflict"],1,"考点：名词辨析。空处与 fun 并列，并与首段「美好露营经历」呼应，指下一次的乐趣与冒险，故 adventure。failure（失败）、conflict（冲突）带贬义，与全文温馨基调相反；performance（表演）用于演出，不能形容露营经历。","2022·新高考I卷"],
["真题·语法填空","______ an area about three times the size of Yellowstone National Park, the GPNP will be one of the first national parks in the country.",["Covered","Cover","Covering","Covers"],2,"考点：非谓语动词作状语。句中已有谓语「will be」，空处不能再出现谓语，须用非谓语；cover 与主语 the GPNP 是主动关系（公园占地多少），故用现在分词 Covering。B 项 Cover 为原形、D 项 Covers 为第三人称单数谓语，都会造成一句两谓语；A 项 Covered 表被动，与主动关系不符。","2022·新高考I卷"],
["真题·语法填空","Covering an area about three times ______ size of Yellowstone National Park, the GPNP will be one of the first national parks in the country.",["a","the","its","that"],1,"考点：冠词与倍数表达。倍数句型「倍数 + the size of + 名词」中，size 受 of 短语限定，须用定冠词 the。a 表泛指，与「特指黄石公园的面积」矛盾；its 会与后文 of 重复且指代不明；that 是代词，不能直接构成该倍数结构。","2022·新高考I卷"],
["真题·语法填空","The plan will extend protection to a significant number of areas that ______ previously unprotected, bringing many of the existing protected areas for giant pandas under one authority to increase effectiveness and reduce inconsistencies in management.",["was","is","are","were"],3,"考点：时态与主谓一致（定语从句）。关系代词 that 指代先行词 areas，为复数；「previously unprotected」表明说的是过去的状态，故用 were。was、is 单复数不符；are 虽是复数，但「previously」要求过去时，属时态错误，是本题最易误选项。","2022·新高考I卷"],
["真题·语法填空","The plan will extend protection to a significant number of areas that were previously unprotected, bringing many of the existing protected areas for giant pandas under one authority ______ effectiveness and reduce inconsistencies in management.",["to increase","increasing","increased","increase"],0,"考点：非谓语动词作目的状语。空处与后面的 reduce 并列，共同说明「把保护区统一管理」的目的，须用不定式 to increase（以提高有效性）。increasing 作伴随状语，表同时发生，与「以便」的目的含义不符；increased 是过去分词表被动；increase 原形不能作状语。","2022·新高考I卷"],
["真题·语法填空","The GPNP ______ to reflect the guiding principle of \"protecting the authenticity and integrity of natural ecosystems, preserving biological diversity, protecting ecological buffer zones, and leaving behind precious natural assets for future generations\".",["designs","has designed","is designed","is designing"],2,"考点：被动语态与时态。主语 The GPNP 与 design 是被动关系（公园「被设计成」），介绍公园定位用一般现在时，故 is designed。designs 是主动，has designed 是主动完成时，is designing 是主动进行时，三者语态均错，是本题主要干扰。","2022·新高考I卷"],
["真题·语法填空","The GPNP is designed to reflect the guiding principle of \"protecting the authenticity and integrity of natural ecosystems, preserving biological diversity, protecting ecological buffer zones, ______ leaving behind precious natural assets for future generations\".",["but","and","or","so"],1,"考点：并列连词。空前列出 protecting...、preserving...、protecting... 三个并列的动名词短语，最后一项前须用 and 收束这一串列举。but 表转折、or 表选择、so 表结果，都与「逐项列举指导原则」的并列关系不符，填后会使句子逻辑断裂。","2022·新高考I卷"],
["真题·语法填空","The GPNP's main goal is to improve connectivity between separate ______ and homes of giant pandas, and eventually achieve a desired level of population in the wild.",["population","populated","populating","populations"],3,"考点：名词单复数。population 在此意为「种群」，是可数名词；空前 separate（不同的）提示不止一个，故用复数 populations。population 单数、populated（动词过去式或形容词）、populating（现在分词）词性均不符，且都无法与 separate 及 homes 并列。","2022·新高考I卷"],
["真题·语法填空","The GPNP's main goal is to improve connectivity between separate populations and homes of giant pandas, and ______ achieve a desired level of population in the wild.",["eventual","eventually","event","events"],1,"考点：词性转换（副词）。空处修饰动词 achieve，须用副词 eventually（最终）。eventual 是形容词，不能修饰动词；event、events 是名词，更不能作状语，三者都不符合「修饰谓语动词」这一基本要求。","2022·新高考I卷"],
["真题·语法填空","Giant pandas also serve ______ an umbrella species, bringing protection to a host of plants and animals in the southwestern and northwestern parts of China.",["as","for","like","with"],0,"考点：固定搭配。serve as 意为「充当、起……作用」，句中「serve ___ an umbrella species」即「作为伞护物种」，故填 as。serve for、serve like、serve with 都不构成这一搭配，其中 like 虽表「像」，但会丢掉「实际起该作用」的含义。","2022·新高考I卷"],
["真题·语法填空","The GPNP is intended to provide stronger protection for all the species ______ live within the Giant Panda Range and significantly improve the health of the ecosystem in the area.",["what","who","that","whom"],2,"考点：定语从句关系代词。先行词 the species 指物，且被 all 修饰，关系词在从句「___ live within the Giant Panda Range」中作主语，故用 that。who、whom 只能指人；what 不能引导定语从句，是本题最常见的误选。","2022·新高考I卷"],
["真题·完形","Unlike most of them, this 25-year-old is doing it ______.",["indoors","online","single-handed","full-time"],3,"考查副词与对比。上文说同龄人多半只在假期出行，这位 25 岁的人却把旅行当成生活方式，full-time 意为“全职地”，与 Unlike most of them 形成对照。indoors、online 与旅行的持续性无关；single-handed 强调“独自”，文中是两人同行。","2022·新高考II卷"],
["真题·完形","It might sound like one long, expensive ______, but the couple has an unusual way to make their travel affordable.",["game","service","vacation","procedure"],2,"考查名词辨析。it 指两人两年环球旅行，听起来像一次漫长又昂贵的假期，后文 but 一转，引出省钱办法，vacation 与 travel 同属一个语义场。game、service、procedure 都无法与 one long, expensive 搭配来描述旅行。","2022·新高考II卷"],
["真题·完形","It might sound like one long, expensive vacation, but the couple has an unusual way to make their travel ______.",["safe","busy","helpful","affordable"],3,"考查形容词与逻辑。but 后说夫妇有“不同寻常的办法”，即靠替人看房换取免费住宿，使旅行开销负担得起，affordable 与下文 no-cost stays 呼应。safe、busy、helpful 都不能解释“如何让旅行省钱”这一转折。","2022·新高考II卷"],
["真题·完形","They're part of a new form of the ______ economy: an online group of house sitters.",["local","private","sharing","agricultural"],2,"考查名词作定语与话题词。房主外出、看房人免费入住并照看宠物和植物，正是共享经济的典型模式，the sharing economy 为固定说法。local、private、agricultural 都无法概括这种网络平台上的互换服务。","2022·新高考II卷"],
["真题·完形","Throughout their no-cost stays in ______ homes, they feed pets and water plants in the homeowner's absence.",["strangers'","parents'","co-workers'","neighbors'"],0,"考查名词所有格与语境。两人通过网上群组与房主配对，素不相识，故住进 strangers' homes。parents'、co-workers'、neighbors' 都与“在线群组匹配陌生人”这一信息矛盾，属想当然的干扰。","2022·新高考II卷"],
["真题·完形","Throughout their no-cost stays in strangers' homes, they feed pets and water plants in the homeowner's ______.",["favor","defense","honor","absence"],3,"考查固定搭配 in one's absence（某人不在时）。房主外出旅行，才需要有人喂宠物、浇花，absence 与 no-cost stays 对应。in one's favor（有利于）、in defense（防卫）、in honor（为纪念）均不合语境。","2022·新高考II卷"],
["真题·完形","The two travelers carefully ______ their trips, scheduling their days around the pets that are sometimes difficult to please.",["plan","explain","compare","complete"],0,"考查动词辨析。后半句 scheduling their days around the pets 说明他们围绕宠物安排每日行程，即仔细规划旅行，plan 与 schedule 语义一致。explain、compare、complete 都不能带 trips 表示“安排行程”。","2022·新高考II卷"],
["真题·完形","The two travelers carefully plan their trips, scheduling their days around the pets that are sometimes difficult to ______.",["buy","transport","choose","please"],3,"考查动词与搭配。difficult to please 意为“难以取悦”，说明有些宠物脾气难伺候，才需要围着它们安排时间，与上句 plan 构成因果。buy、transport、choose 都无法解释“为何要按宠物安排日程”。","2022·新高考II卷"],
["真题·完形","But house-sitting also offers a level of ______ they can't find in a hotel.",["support","comfort","control","attention"],1,"考查名词与对比。与酒店相比，住进别人家里更像住在朋友家，更自在舒适，紧接着 It's like staying at a friend's house 就是解释。support、control、attention 都不能体现住宿体验上的差别。","2022·新高考II卷"],
["真题·完形","\"It's like ______ at a friend's house,\" Jessica says.",["cooking","staying","waiting","studying"],1,"考查动词辨析与话题复现。前句说看房比住酒店更舒适，此处用类比“就像住在朋友家”，staying 与 house-sitting、hotel 同属住宿话题。cooking、waiting、studying 与“住宿体验”无关，属同类动作干扰。","2022·新高考II卷"],
["真题·完形","The couple has a high ______ rate in getting accepted as house sitters and they always go beyond the homeowner's expectations.",["success","survival","growth","unemployment"],0,"考查名词搭配。rate 前需要能与“被接受”搭配的名词，success rate 表示成功率高，与后半句 always go beyond the homeowner's expectations 并列说明他们很抢手。survival、growth、unemployment 与申请看房无关。","2022·新高考II卷"],
["真题·完形","The couple has a high success rate in getting accepted as house sitters and they always go beyond the homeowner's ______.",["budget","abilities","expectations","understanding"],2,"考查固定搭配 go beyond one's expectations（超出某人预期）。看房人不仅达标还做得更多，与前面的 high success rate 并列。budget、abilities、understanding 都不能与 go beyond 搭配表达“让房主满意”。","2022·新高考II卷"],
["真题·完形","For Jessica, that means ______ plenty of pictures of happy pets, keeping the house clean and leaving a nice small gift before heading to the next house.",["admiring","donating","sending","borrowing"],2,"考查动名词并列。that means 后接三个并列成分：sending pictures、keeping the house clean、leaving a gift，都是具体做法。admiring、donating、borrowing 与“给房主发宠物照片报平安”的语境不符。","2022·新高考II卷"],
["真题·完形","For Jessica, that means sending plenty of pictures of happy pets, keeping the house ______ and leaving a nice small gift before heading to the next house.",["clean","open","simple","empty"],0,"考查形容词与生活常识。看房人离开前要把房子保持干净整洁，与“留下小礼物”同属让房主满意的细节。open、simple、empty 都不能描述房屋的整洁状态，属形容词搭配不当。","2022·新高考II卷"],
["真题·完形","\"You want to make the homeowner feel that they made the right ______,\" she says.",["guess","decision","response","impression"],1,"考查名词搭配 make the right decision（做出正确决定）。房主选中他们看房是一次选择，看房人希望让房主觉得没选错人。guess、response、impression 都不能与 make the right 搭配来表达“选对人”。","2022·新高考II卷"],
["真题·语法填空","When he saw a young child hanging from a sixth-floor apartment balcony, Henry ran one hundred metres, jumped over a 1.2-metre fence, and held out his arms to catch the ______ child.",["fallen","falling","fell","fall"],1,"考查非谓语作定语。child 与 fall 是主动、进行的关系，即“正在坠落的孩子”，故用现在分词 falling。fallen 表完成被动，fell 是谓语动词，fall 为原形，均不能作后置定语修饰 child。","2022·新高考II卷"],
["真题·语法填空","______ Brown family live in an apartment building outside Toronto.",["The","A","This","That"],0,"考查冠词。the Brown family 特指“布朗一家”，姓氏复数前加定冠词表示某某一家人。a 表泛指，this、that 为指示代词，都不能与 family 构成这一固定指代，属冠词误用。","2022·新高考II卷"],
["真题·语法填空","On the day of the accident, Mrs. Brown was at work and Eric was at home with his father. They both fell ______ while watching TV.",["sleep","sleepy","asleep","sleeping"],2,"考查固定搭配 fall asleep（睡着）。空处作表语，需用形容词 asleep。sleep 是动词或名词，sleepy 意为“困倦的”但不与 fall 搭配，sleeping 不作此表语，三者均属形近词干扰。","2022·新高考II卷"],
["真题·语法填空","Eric woke up a little later when he heard children playing outside. He pushed a chair onto the balcony, and climbed up ______ them.",["seeing","seen","saw","to see"],3,"考查非谓语表目的。他搬椅子爬上阳台是为了看外面的孩子，不定式 to see 作目的状语。seeing、seen 不表目的；saw 是谓语形式，与前面的 climbed 冲突，破坏句子结构。","2022·新高考II卷"],
["真题·语法填空","When he looked down, he ______ slipped and fell over the edge.",["accidental","accidentally","accident","accidents"],1,"考查词性转换。空处修饰动词 slipped，须用副词。accident 是名词，accidental 是形容词，accidents 是复数名词，只有 accidentally 可作状语，表示“意外地滑了一下”。","2022·新高考II卷"],
["真题·语法填空","He hung on for a few minutes ______ screamed for his father, but his father didn't hear him.",["and","so","but","or"],0,"考查并列连词。hung on 与 screamed 是两个先后发生的并列谓语，用 and 连接。so 表结果、but 表转折、or 表选择，都与“坚持了几分钟，又大声呼喊父亲”的顺承关系不符。","2022·新高考II卷"],
["真题·语法填空","Henry ______ his car when he heard the screams.",["fixed","is fixing","was fixing","has fixed"],2,"考查过去进行时。when he heard the screams 指过去某一时刻，此时他“正在修车”，用 was fixing。fixed 表已完成，is fixing 时态不符，has fixed 与过去时间状语矛盾。","2022·新高考II卷"],
["真题·语法填空","He quickly ______ his tools aside, and started running, arms out.",["throw","thrown","throwing","threw"],3,"考查动词时态。空处与 started 并列，叙述过去接连发生的动作，须用一般过去时 threw。throw 是原形，thrown 是过去分词，throwing 不能单独作谓语，均属形式干扰。","2022·新高考II卷"],
["真题·语法填空","\"He saved my ______ life,\" Mrs. Brown said.",["son","son's","sons","sons'"],1,"考查名词所有格。“我儿子的生命”需用 son's 作定语修饰 life。son 不能直接修饰 life，sons 与 sons' 是复数形式，与下文的 my son 单数不一致。","2022·新高考II卷"],
["真题·语法填空","\"I don't know ______ to thank him,\" Mrs. Brown said.",["how","what","who","which"],0,"考查“疑问词＋不定式”。句意为“我不知道该如何感谢他”，how to thank him 表示方式。what、who、which 与 thank him 搭配会缺宾语或语义不通，属疑问词的误选。","2022·新高考II卷"],
["真题·完形","Melanie Bailey should have ______ the course earlier than she did.",["designed","followed","changed","finished"],3,"考点：动词辨析＋should have done。句中「should have ___ the course earlier than she did」是虚拟结构，意为「本该更早完成赛程」，course 指赛道，故填 finished。designed（设计）、followed（跟随）、changed（改变）都无法与「赛程」及 earlier 搭配，也不能解释下文她为何晚到。","2023·新课标I卷"],
["真题·完形","Her ______ came because she was carrying a competitor across the finish line.",["delay","chance","trouble","excuse"],0,"考点：名词辨析（因果）。空后「because she was carrying a competitor across the finish line」交代原因，背着对手过线必然耽误时间，故 delay，并与上一句「本该更早完成」互为呼应。chance（机会）、excuse（借口）与因果关系不符；trouble 泛指麻烦，无法具体说明「晚到」这件事。","2023·新课标I卷"],
["真题·完形","Her delay came because she was carrying a ______ across the finish line.",["judge","volunteer","classmate","competitor"],3,"考点：名词辨析。由第二段「a runner in front of her began crying in pain」及「her fellow runner, Danielle Lenoue」可知被背者同为参赛选手，故选 competitor。judge（裁判员）、volunteer（志愿者）身份不符，也解释不了她为何同样疲惫受伤；classmate 属无中生有。","2023·新课标I卷"],
["真题·完形","As reported by a local newspaper, Bailey was more than two-thirds of the way through her ______ when a runner in front of her began crying in pain.",["race","school","town","training"],0,"考点：名词辨析。空后「more than two-thirds of the way through」指赛程已过三分之二，故填 race，与首句 the course、末段「Neither won the race」一致。school、town 是地点名词，无法与 through the way 搭配；training 指训练，与「比赛中途救人」的现场情境矛盾。","2023·新课标I卷"],
["真题·完形","She ______ to help her fellow runner, Danielle Lenoue.",["agreed","returned","stopped","promised"],2,"考点：动词辨析。看到前面的跑者痛得哭出来，她「停下来」帮忙，stop to do 表示停下来去做某事，与后文「took her arm」「carried her」一气相承。agreed、promised 后面需要具体的承诺内容；returned 表返回，方向恰好相反。","2023·新课标I卷"],
["真题·完形","Bailey took her arm to see if she could walk forward with ______.",["courage","aid","patience","advice"],1,"考点：名词辨析（with + 抽象名词）。Bailey 抓住对方手臂，是想看她能否「借助搀扶」向前走，with aid 意为在帮助、辅助之下。courage（勇气）、patience（耐心）属心理品质，不能让人站起来走路；advice（建议）与行走能力毫无关系。","2023·新课标I卷"],
["真题·完形","Bailey then ______ to let Lenoue climb onto her back and carried her all the way to the finish line, then another 300 feet to where Lenoue could get medical attention.",["went away","stood up","stepped aside","bent down"],3,"考点：动词短语辨析。要让对方「climb onto her back」，Bailey 必须先弯下腰，故 bent down。went away（走开）、stepped aside（让到一边）与背人的动作相反；stood up（站起来）方向也不对，都无法接上「爬上她的背」。","2023·新课标I卷"],
["真题·完形","Bailey then bent down to let Lenoue climb onto her back and carried her all the way to the finish line, then another 300 feet to where Lenoue could get ______ attention.",["medical","public","constant","equal"],0,"考点：形容词辨析＋固定搭配。空后「later taken to a hospital」表明此处是接受医疗处理，medical attention 是固定说法。public attention 指公众关注，与送医无关；constant、equal 修饰 attention 时表示「持续关注／平等对待」，都不能体现救治含义。","2023·新课标I卷"],
["真题·完形","Once there, Lenoue was ______ and later taken to a hospital, where she learned that she had serious injuries in one of her knees.",["interrupted","assessed","identified","appreciated"],1,"考点：动词辨析（流程先后）。到救助点后先「被评估伤情」，随后才「later taken to a hospital」，assess 正合这一顺序。interrupted（打断）、appreciated（感激）与伤情无关；identified 侧重身份识别，而此处重点是伤势轻重，故不能选。","2023·新课标I卷"],
["真题·完形","She would have struggled with extreme ______ to make it to that aid checkpoint without Bailey's help.",["hunger","pain","cold","tiredness"],1,"考点：名词辨析。上文「crying in pain」与「serious injuries in one of her knees」反复点出疼痛，故没有 Bailey 相助，她要在剧痛中挣扎到救助点，选 pain。hunger（饥饿）、cold（寒冷）、tiredness（疲劳）在文中都没有任何依据，属凭空添加。","2023·新课标I卷"],
["真题·完形","As for Bailey, she is more ______ about why her act is considered a big deal.",["worried","ashamed","confused","discouraged"],2,"考点：形容词辨析（心理）。后文她认为这不过是「the right thing」，对被人当成大事感到不解，confused 最贴切。worried（担心）、ashamed（羞愧）、discouraged（气馁）都含自我否定色彩，与她坦然、不以为意的态度相反。","2023·新课标I卷"],
["真题·完形","As for Bailey, she is more confused about why her act is considered a big ______.",["game","problem","lesson","deal"],3,"考点：固定表达。a big deal 意为「了不起的大事」，与「why her act is considered a big ___」及下文「the right thing」相呼应。a big game、a big lesson 搭配不当；problem 会变成「大问题」，与全文赞扬她的基调相反，是主要干扰。","2023·新课标I卷"],
["真题·完形","\"She was just crying. I couldn't ______ her,\" Bailey told the reporter.",["leave","cure","bother","understand"],0,"考点：动词辨析。她说「She was just crying. I couldn't ___ her」，意思是看到对方哭，实在没法丢下不管，leave 最合境。cure（治愈）超出她的能力范围；bother（打扰）、understand（理解）与「不能丢下她」这一语境都不相符。","2023·新课标I卷"],
["真题·完形","Although the two young women were strangers before the ______, they've since become friends.",["ride","test","meet","show"],2,"考点：名词辨析（熟词生义）。meet 作名词意为「运动会、比赛」，此处指两人在这场越野赛相遇之前素不相识，与后半句「they've since become friends」形成对比。ride（骑行）、test（测试）、show（演出）都不能指这场赛事，也无法与 stranger 呼应。","2023·新课标I卷"],
["真题·完形","Neither won the race, but the ______ of human kindness won the day.",["secret","display","benefit","exchange"],1,"考点：名词辨析。全文写她放弃名次、背对手过线，「the ___ of human kindness won the day」指人性善良的「展现」赢得人心，display 合适。secret（秘密）与「赢得人心」不搭；exchange（交换）暗示功利往来；benefit（益处）无法表达「呈现出来」之意。","2023·新课标I卷"],
["真题·语法填空","Xiao long bao (soup dumplings), those amazing constructions of delicate dumpling wrappers encasing ______ soup and sweet, hot food.",["tasty","taste","tasted","tasting"],0,"考点：词性转换（形容词）。空处与前面的 hot 并列修饰 soup，须用形容词，taste 的形容词为 tasty（美味的）。tasteful 虽也是形容词，但意为「有品位的、格调高的」，不能形容食物味道；taste、tasted、tasting 词性不符，无法并列修饰名词。","2023·新课标I卷"],
["真题·语法填空","To eat one, you have to decide whether ______ a small hole in it first, releasing the steam and risking a spill, or to put the whole dumpling in your mouth, letting the hot soup explode on your tongue.",["to bite","biting","bitten","bit"],0,"考点：非谓语动词（whether + 不定式）。空处与后文「or to put the whole dumpling in your mouth」并列，构成 whether to do... or to do... 的选择结构，故用 to bite。biting、bitten、bit 都不能与 whether 连用，也无法与 or to put 保持形式一致。","2023·新课标I卷"],
["真题·语法填空","To eat one, you have to decide whether to bite a small hole in it first, releasing the steam and risking a spill, ______ to put the whole dumpling in your mouth, letting the hot soup explode on your tongue.",["or","and","but","so"],0,"考点：并列连词。空前是「whether to bite a small hole... risking a spill」，空后是「to put the whole dumpling in your mouth」，两者是「是先咬个小口，还是整个塞进嘴里」的选择，故用 or。and 表相加、but 表转折、so 表结果，都与 whether...or... 结构不符。","2023·新课标I卷"],
["真题·语法填空","Shanghai may be the ______ home of the soup dumpling, but food historians will actually point you to the neighboring ancient canal town of Nanxiang as xiao long bao's birthplace.",["recognized","recognizing","recognition","recognize"],0,"考点：非谓语动词作定语。空处修饰名词 home，home 与 recognize 是被动关系（「被公认的故乡」），故用过去分词 recognized。recognizing 表主动，recognition 是名词，recognize 是动词原形，三者都不能作前置定语修饰 home。","2023·新课标I卷"],
["真题·语法填空","There, you'll find them prepared differently — more dumpling and less soup — and the wrappers are pressed ______ hand rather than rolled.",["by","with","in","on"],0,"考点：介词固定搭配。by hand 意为「用手工」，与后半句「rather than rolled」（而不是擀出来的）形成对照。with hand、in hand、on hand 都不表示「手工制作」：in hand 指「在进行中／在手头」，on hand 指「在场、现有」，语义均不合。","2023·新课标I卷"],
["真题·语法填空","Nanxiang aside, the best xiao long bao have a fine skin, allowing them ______ out of the steamer basket without tearing or spilling any of their contents.",["to lift","lifting","lifted","lift"],0,"考点：非谓语动词＋被动语态。them 指小笼包，与 lift 是被动关系，allow sth to be done 表示「允许某物被……」，故完整答案应为 to be lifted。所给四项中 A 项 to lift 最接近，但严格说漏掉了被动，属选项设置瑕疵；lifting、lifted、lift 都不能用于 allow sb to do 结构。","2023·新课标I卷"],
["真题·语法填空","Nanxiang aside, the best xiao long bao have a fine skin, allowing them to lift out of the steamer basket without tearing or spilling any of ______ contents.",["their","them","theirs","themselves"],0,"考点：代词。空处修饰名词 contents，须用形容词性物主代词 their，指「小笼包里的汤汁和馅」。them 是宾格，不能作定语；theirs 是名词性物主代词，后面不能再接名词；themselves 是反身代词，与「包子的内容物」这一所属关系不符。","2023·新课标I卷"],
["真题·语法填空","The meat should be fresh with ______ touch of sweetness, and the surrounding soup hot, clear and delicious.",["a","an","the","some"],0,"考点：冠词与固定搭配。a touch of 意为「一点点、一丝」，此处修饰不可数名词 sweetness，表示肉馅带一丝甜味。an 只能用于元音音素前，且此处是固定短语；those、these 是复数指示代词，不能修饰 a touch of 这一单数结构。","2023·新课标I卷"],
["真题·语法填空","No matter where I buy them, though, one steamer basket is ______ enough, yet two seems greedy, and so I am always left wanting more next time.",["rarely","rarer","rarest","rarity"],0,"考点：词性转换（副词）。空处修饰形容词 enough，须用副词；rarely enough 意为「几乎从来不够吃」，与后文「yet two seems greedy」形成对照，故填 rarely。rarer、rarest 是比较级和最高级形容词，rarity 是名词，三者都不能修饰 enough。","2023·新课标I卷"],
["真题·语法填空","No matter where I buy them, though, one steamer basket is rarely enough, yet two seems greedy, and so I am always left ______ more next time.",["wanting","wanted","want","wants"],0,"考点：非谓语动词（leave sb doing）。be left doing 表示「处于某种持续状态」，left wanting more 即「总被留在还想再吃的状态」，意为意犹未尽。wanted 表被动，与「我一直想吃」的主动感受不符；want、wants 是谓语形式，不能用在 be left 之后。","2023·新课标I卷"],
["真题·完形","They had to move to Virginia but they were on a very tight ______.",["turn","budget","schedule","connection"],1,"考查名词辨析与搭配。上文 on a very tight ___ 与下句 could not afford to pay for 相呼应，on a tight budget 意为“预算紧张”，故选 B；tight turn、tight schedule、tight connection 都不表缺钱。","2023·新课标II卷"],
["真题·完形","They could not afford to pay for ______ for their dog, Tiffy, and desperately wanted to take her with them.",["food","shelter","medicine","transportation"],3,"考查语境推断。一家人要带狗从堪萨斯城迁往弗吉尼亚，此处指付不起狗的“运输费”，transportation 与后文 PNP 飞行运送吻合；food、shelter、medicine 与“坐飞机送走”无必然联系。","2023·新课标II卷"],
["真题·完形","They could not afford to pay for transportation for their dog, Tiffy, and ______ wanted to take her with them.",["desperately","temporarily","secretly","originally"],0,"考查副词辨析。and 后接 wanted to take her with them，与“付不起运费”形成对照，desperately 表“极其渴望”；temporarily（暂时）、secretly（偷偷）、originally（最初）都不能修饰渴望的程度。","2023·新课标II卷"],
["真题·完形","It just ______ that I was planning another PNP flight with another pilot, Karen, who offered to take Tiffy from Kansas City to Virginia.",["appeared","proved","happened","showed"],2,"考查动词辨析。It happened that... 是固定句式，意为“碰巧……”，说明作者恰好在安排另一趟 PNP 飞行；appear、prove、show 都不能构成这一表示巧合的句式。","2023·新课标II卷"],
["真题·完形","It just happened that I was planning another PNP flight with another pilot, Karen, who ______ to take Tiffy from Kansas City to Virginia.",["waited","offered","hurried","failed"],1,"考查动词辨析。Karen 愿把 Tiffy 从堪萨斯城送到弗吉尼亚，offer to do sth 意为“主动提出做某事”，与下文她接力运送相符；waited、hurried、failed 与“承接运送”的语境相悖。","2023·新课标II卷"],
["真题·完形","What I was to do was fly to Topeka to ______ Tiffy.",["see off","look for","hand over","pick up"],3,"考查动词短语。作者的任务是先飞到托皮卡把狗“接上”，再由 Karen 接力，pick up 意为“接（人、物）”；see off 是送行，look for 是寻找，hand over 是移交，方向都不对。","2023·新课标II卷"],
