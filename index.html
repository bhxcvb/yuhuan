["真题·阅读","Which of the following starts earliest?",["Harrogate Music Festival.","Jodie's Fitness Summer Classes.","Felt Picture Making.","Figure It Out! — Playing with Math."],3,"考点：细节比较。四项开始日期依次为 6 月 1 日、5 月 23 日、6 月 12 日、5 月 7 日，D 最早。A、B、C 都晚于 5 月 7 日，属把活动的“开始日”与“结束日”混淆。","2021·新高考II卷","Things to Do in Yorkshire This Summer\n\nHarrogate Music Festival\n\nSince its birth, Harrogate Music Festival has gone from strength to strength. This year, we are celebrating our 50th anniversary. We begin on 1st June with Manchester Camerata and Nicola Benedetti, presenting an amazing programme of Mozart pieces.\n\nDates: 1 June — 31 July\nTickets: £12 — £96\n\nJodie's Fitness Summer Classes\n\nAs the summer months roll in, our Georgian country estate makes the perfect setting for an outdoor fitness session. Come and work out with our qualified personal trainer, Jodie McGregor, on the grounds of the Middleton Lodge estate.\n\nWe will be holding a free taster session on 23rd May, at 10 am, to demonstrate the variety of effective and active exercises. There are eight spaces available for the taster session. Advance bookings are required (info@middletonlodge.co.uk).\n\nDates: 23 May — 11 July\nTickets: £7.50 per session\n\nFelt Picture Making\n\nWorking from an inspirational picture, this workshop at Helmsley Arts Centre will teach you the techniques you will need to recreate your picture in wool.\n\nWe will also discuss the origins of felt, what enables wool fibres to become felt and how the processes we use work.\n\nDates: 12 June — 12 July\nTickets: £40 including materials\n\nFigure It Out! — Playing with Math\n\nA new exhibition in Halifax uses everyday activities to explain the hidden math principles we all use on a regular basis. Pack a bag, cut a cake, guess which juice container holds the most liquid, and much more. Discover how architects, product designers and scientists use similar skills in their work.\n\nDates: 7 May — 10 June\nTickets: Free"],
["真题·阅读","Why did the author bring the tiger cubs home?",["To ensure their survival.","To observe their differences.","To teach them life skills.","To let them play with his kids."],0,"考点：细节理解。首段说动物园里三分之一的苏门答腊虎崽活不到成年，故“decided to give them round-the-clock care at home”，A 对。D 只是附带结果，凯南高兴并非动机，B、C 原文无据。","2021·新高考II卷","I have worked as a keeper at the National Zoo for 11 years. Spot and Stripe are the first tiger cubs that have ever been born here. Globally, a third of Sumatran cubs in zoos don't make it to adulthood, so I decided to give them round-the-clock care at home.\n\nI've got two children — the younger one, Kynan, was extremely happy about the tigers arriving — but all of us really looked forward to being part of their lives and watching them grow. I wasn't worried about bringing them into my home with my wife and kids. These were cubs. They weighed about 2.5 kg and were so small that there was absolutely no risk.\n\nAs they grew more mobile, we let them move freely around the house during the day, but when we were asleep we had to contain them in a large room, otherwise they'd get up to mischief. We'd come down in the morning to find they'd turned the room upside down, and left it looking like a zoo.\n\nThings quickly got very intense due to the huge amount of energy required to look after them. There were some tough times and I just felt extremely tired. I was grateful that my family was there to help. We had to have a bit of a production line going, making up 'tiger milk', washing baby bottles, and cleaning the floors.\n\nWhen Spot and Stripe were four months old, they were learning how to open doors and jump fences, and we knew it really was time for them to go. It was hard for us to finally part with them. For the first few days, Kynan was always a bit disappointed that the cubs weren't there.\n\nI'm not sad about it. I'm hands-on with them every day at the zoo, and I do look back very fondly on the time that we had them."],
["真题·阅读","What do the underlined words 'get up to mischief' mean in paragraph 3?",["Behave badly.","Lose their way.","Sleep soundly.","Miss their mom."],0,"考点：词义猜测。下文“turned the room upside down...looking like a zoo”写它们把房间翻乱，可见该短语指“胡闹、干坏事”，A 对。B、C、D 都与“关进大房间否则就……”及房间被弄乱的后果不符。","2021·新高考II卷","I have worked as a keeper at the National Zoo for 11 years. Spot and Stripe are the first tiger cubs that have ever been born here. Globally, a third of Sumatran cubs in zoos don't make it to adulthood, so I decided to give them round-the-clock care at home.\n\nI've got two children — the younger one, Kynan, was extremely happy about the tigers arriving — but all of us really looked forward to being part of their lives and watching them grow. I wasn't worried about bringing them into my home with my wife and kids. These were cubs. They weighed about 2.5 kg and were so small that there was absolutely no risk.\n\nAs they grew more mobile, we let them move freely around the house during the day, but when we were asleep we had to contain them in a large room, otherwise they'd get up to mischief. We'd come down in the morning to find they'd turned the room upside down, and left it looking like a zoo.\n\nThings quickly got very intense due to the huge amount of energy required to look after them. There were some tough times and I just felt extremely tired. I was grateful that my family was there to help. We had to have a bit of a production line going, making up 'tiger milk', washing baby bottles, and cleaning the floors.\n\nWhen Spot and Stripe were four months old, they were learning how to open doors and jump fences, and we knew it really was time for them to go. It was hard for us to finally part with them. For the first few days, Kynan was always a bit disappointed that the cubs weren't there.\n\nI'm not sad about it. I'm hands-on with them every day at the zoo, and I do look back very fondly on the time that we had them."],
["真题·阅读","What did the author think of raising the tiger cubs at home?",["Boring.","Tiring.","Costly.","Risky."],1,"考点：推理判断。第四段“huge amount of energy required”并直言“I just felt extremely tired”，可见养虎崽非常累人，B 对。D 与第二段“absolutely no risk”矛盾，A 与全文积极语气不符，C 原文未提花费。","2021·新高考II卷","I have worked as a keeper at the National Zoo for 11 years. Spot and Stripe are the first tiger cubs that have ever been born here. Globally, a third of Sumatran cubs in zoos don't make it to adulthood, so I decided to give them round-the-clock care at home.\n\nI've got two children — the younger one, Kynan, was extremely happy about the tigers arriving — but all of us really looked forward to being part of their lives and watching them grow. I wasn't worried about bringing them into my home with my wife and kids. These were cubs. They weighed about 2.5 kg and were so small that there was absolutely no risk.\n\nAs they grew more mobile, we let them move freely around the house during the day, but when we were asleep we had to contain them in a large room, otherwise they'd get up to mischief. We'd come down in the morning to find they'd turned the room upside down, and left it looking like a zoo.\n\nThings quickly got very intense due to the huge amount of energy required to look after them. There were some tough times and I just felt extremely tired. I was grateful that my family was there to help. We had to have a bit of a production line going, making up 'tiger milk', washing baby bottles, and cleaning the floors.\n\nWhen Spot and Stripe were four months old, they were learning how to open doors and jump fences, and we knew it really was time for them to go. It was hard for us to finally part with them. For the first few days, Kynan was always a bit disappointed that the cubs weren't there.\n\nI'm not sad about it. I'm hands-on with them every day at the zoo, and I do look back very fondly on the time that we had them."],
["真题·阅读","Why did the author decide to send Spot and Stripe back to the zoo?",["They frightened the children.","They became difficult to contain.","They annoyed the neighbours.","They started fighting each other."],1,"考点：原因推断。第五段说它们四个月大时学会开门、跳栅栏，“we knew it really was time for them to go”，即越来越难管束，B 对。A、C、D 原文均无依据。","2021·新高考II卷","I have worked as a keeper at the National Zoo for 11 years. Spot and Stripe are the first tiger cubs that have ever been born here. Globally, a third of Sumatran cubs in zoos don't make it to adulthood, so I decided to give them round-the-clock care at home.\n\nI've got two children — the younger one, Kynan, was extremely happy about the tigers arriving — but all of us really looked forward to being part of their lives and watching them grow. I wasn't worried about bringing them into my home with my wife and kids. These were cubs. They weighed about 2.5 kg and were so small that there was absolutely no risk.\n\nAs they grew more mobile, we let them move freely around the house during the day, but when we were asleep we had to contain them in a large room, otherwise they'd get up to mischief. We'd come down in the morning to find they'd turned the room upside down, and left it looking like a zoo.\n\nThings quickly got very intense due to the huge amount of energy required to look after them. There were some tough times and I just felt extremely tired. I was grateful that my family was there to help. We had to have a bit of a production line going, making up 'tiger milk', washing baby bottles, and cleaning the floors.\n\nWhen Spot and Stripe were four months old, they were learning how to open doors and jump fences, and we knew it really was time for them to go. It was hard for us to finally part with them. For the first few days, Kynan was always a bit disappointed that the cubs weren't there.\n\nI'm not sad about it. I'm hands-on with them every day at the zoo, and I do look back very fondly on the time that we had them."],
["真题·阅读","What will Zafirakou do with her prize money?",["Make a movie.","Build new schools.","Run a project.","Help local musicians."],2,"考点：细节理解。第二段“I've started a project to promote the teaching of the arts in our schools”，首段也说奖金用于把励志人物请进校园，C 对。A 把“movie star”误读为拍电影，B、D 均非奖金用途。","2021·新高考II卷","A British woman who won a $1 million prize after she was named the World's Best Teacher will use the cash to bring inspirational figures into UK schools.\n\nAndria Zafirakou, a north London secondary school teacher, said she wanted to bring about a classroom revolution. 'We are going to make a change,' she said. 'I've started a project to promote the teaching of the arts in our schools.'\n\nThe project results from the difficulties many schools have in getting artists of any sort — whether an up-and-coming local musician or a major movie star — into schools to work with and inspire children.\n\nZafirakou began the project at Alperton Community School, her place of work for the past twelve years. 'I've seen those magic moments when children are talking to someone they are inspired by — their eyes are shining and their faces light up,' she said. 'We need artists more than ever in our schools.'\n\nArtist Michael Craig-Martin said: 'Andria's brilliant project to bring artists from all fields into direct contact with children is particularly welcome at a time when the arts are being downgraded in schools.' It was a mistake to see the arts as unnecessary, he added.\n\nHistorian Sir Simon Schama is also a supporter of the project. He said that arts education in schools was not just an add-on.\n\n'It is absolutely necessary. The future depends on creativity and creativity depends on the young. What will remain of us when artificial intelligence takes over will be our creativity, and it is our creative spirit, our visionary sense of freshness, that has been our strength for centuries.'"],

["真题·阅读","Which of the following is a suitable title for the text?",["Bring Artists to Schools","When Historians Meet Artists","Arts Education in Britain","The World's Best Arts Teacher"],0,"考点：主旨归纳。全文围绕扎菲拉库用奖金推动“把各领域艺术家请进学校”的项目展开，A 对。B 只涉及末段一位历史学家，C 范围过大，D 侧重人物头衔而未抓住项目核心。","2021·新高考II卷","A British woman who won a $1 million prize after she was named the World's Best Teacher will use the cash to bring inspirational figures into UK schools.\n\nAndria Zafirakou, a north London secondary school teacher, said she wanted to bring about a classroom revolution. 'We are going to make a change,' she said. 'I've started a project to promote the teaching of the arts in our schools.'\n\nThe project results from the difficulties many schools have in getting artists of any sort — whether an up-and-coming local musician or a major movie star — into schools to work with and inspire children.\n\nZafirakou began the project at Alperton Community School, her place of work for the past twelve years. 'I've seen those magic moments when children are talking to someone they are inspired by — their eyes are shining and their faces light up,' she said. 'We need artists more than ever in our schools.'\n\nArtist Michael Craig-Martin said: 'Andria's brilliant project to bring artists from all fields into direct contact with children is particularly welcome at a time when the arts are being downgraded in schools.' It was a mistake to see the arts as unnecessary, he added.\n\nHistorian Sir Simon Schama is also a supporter of the project. He said that arts education in schools was not just an add-on.\n\n'It is absolutely necessary. The future depends on creativity and creativity depends on the young. What will remain of us when artificial intelligence takes over will be our creativity, and it is our creative spirit, our visionary sense of freshness, that has been our strength for centuries.'"],
["真题·阅读","What is a problem with the cattle-raising industry?",["Soil pollution.","Lack of workers.","Aging machines.","Low profitability."],1,"考点：细节理解。首段“is facing a labor shortage”，第四段又说越来越难找到看牛的工人，B 对。A、D 原文未提，C 把“low-tech approach（技术含量低）”曲解为机器老化。","2021·新高考II卷","An Australian professor is developing a robot to monitor the health of grazing cattle, a development that could bring big changes to a profession that's relied largely on a low-tech approach for decades but is facing a labor shortage.\n\nSalah Sukkarieh, a professor at the University of Sydney, sees robots as necessary given how cattlemen are aging. He is building a four-wheeled robot that will run on solar and electric power. It will use cameras and sensors to monitor the animals. A computer system will analyze the video to determine whether a cow is sick. Radio tags on the animals will measure temperature changes. The quality of grassland will be tracked by monitoring the shape, color and texture of grass. That way, cattlemen will know whether they need to move their cattle to another field for nutrition purposes.\n\nMachines have largely taken over planting, watering and harvesting crops such as corn and wheat, but the monitoring of cattle has gone through fewer changes.\n\nFor Texas cattleman Pete Bonds, it's increasingly difficult to find workers interested in watching cattle. But Bonds doesn't believe a robot is right for the job. Years of experience in the industry — and failed attempts to use technology — have convinced him that the best way to check cattle is with a man on a horse. Bonds, who bought his first cattle almost 50 years ago, still has each of his cowboys inspect 300 or 400 cattle daily and look for signs that an animal is getting sick.\n\nOther cattlemen see more promise in robots. Michael Kelsey, vice president of the Oklahoma Cattlemen's Association, said a robot could be extremely useful given rising concerns about cattle theft. Cattle tend to be kept in remote places and their value has risen, making them appealing targets."],
["真题·阅读","What will Sukkarieh's robot be able to do?",["Monitor the quality of grass.","Cure the diseased cattle.","Move cattle to another field.","Predict weather changes."],0,"考点：细节理解。第二段“The quality of grassland will be tracked by monitoring the shape, color and texture of grass”，A 对。机器人只判断牛是否生病而不治病，B 错；C 是它提供信息、由人决定，D 原文未提。","2021·新高考II卷","An Australian professor is developing a robot to monitor the health of grazing cattle, a development that could bring big changes to a profession that's relied largely on a low-tech approach for decades but is facing a labor shortage.\n\nSalah Sukkarieh, a professor at the University of Sydney, sees robots as necessary given how cattlemen are aging. He is building a four-wheeled robot that will run on solar and electric power. It will use cameras and sensors to monitor the animals. A computer system will analyze the video to determine whether a cow is sick. Radio tags on the animals will measure temperature changes. The quality of grassland will be tracked by monitoring the shape, color and texture of grass. That way, cattlemen will know whether they need to move their cattle to another field for nutrition purposes.\n\nMachines have largely taken over planting, watering and harvesting crops such as corn and wheat, but the monitoring of cattle has gone through fewer changes.\n\nFor Texas cattleman Pete Bonds, it's increasingly difficult to find workers interested in watching cattle. But Bonds doesn't believe a robot is right for the job. Years of experience in the industry — and failed attempts to use technology — have convinced him that the best way to check cattle is with a man on a horse. Bonds, who bought his first cattle almost 50 years ago, still has each of his cowboys inspect 300 or 400 cattle daily and look for signs that an animal is getting sick.\n\nOther cattlemen see more promise in robots. Michael Kelsey, vice president of the Oklahoma Cattlemen's Association, said a robot could be extremely useful given rising concerns about cattle theft. Cattle tend to be kept in remote places and their value has risen, making them appealing targets."],

["真题·阅读","How may robots help with cattle watching according to Michael Kelsey?",["Increase the value of cattle.","Bring down the cost of labor.","Make the job more appealing.","Keep cattle from being stolen."],3,"考点：细节理解。末段说鉴于偷牛之忧日增，机器人“could be extremely useful”，又强调牛养在偏远处、价值上升易成目标，故可防偷，D 对。A 与“价值已上升”相反，B、C 非凯尔西所言。","2021·新高考II卷","An Australian professor is developing a robot to monitor the health of grazing cattle, a development that could bring big changes to a profession that's relied largely on a low-tech approach for decades but is facing a labor shortage.\n\nSalah Sukkarieh, a professor at the University of Sydney, sees robots as necessary given how cattlemen are aging. He is building a four-wheeled robot that will run on solar and electric power. It will use cameras and sensors to monitor the animals. A computer system will analyze the video to determine whether a cow is sick. Radio tags on the animals will measure temperature changes. The quality of grassland will be tracked by monitoring the shape, color and texture of grass. That way, cattlemen will know whether they need to move their cattle to another field for nutrition purposes.\n\nMachines have largely taken over planting, watering and harvesting crops such as corn and wheat, but the monitoring of cattle has gone through fewer changes.\n\nFor Texas cattleman Pete Bonds, it's increasingly difficult to find workers interested in watching cattle. But Bonds doesn't believe a robot is right for the job. Years of experience in the industry — and failed attempts to use technology — have convinced him that the best way to check cattle is with a man on a horse. Bonds, who bought his first cattle almost 50 years ago, still has each of his cowboys inspect 300 or 400 cattle daily and look for signs that an animal is getting sick.\n\nOther cattlemen see more promise in robots. Michael Kelsey, vice president of the Oklahoma Cattlemen's Association, said a robot could be extremely useful given rising concerns about cattle theft. Cattle tend to be kept in remote places and their value has risen, making them appealing targets."],
["真题·七选五","第36空最合适的句子是？",["Stop to have a rest now and then.","Spend a few minutes looking through the book.","This depends on the type of book you are reading.","Here are some tips to help improve your reading speed.","Make a note of any page which is of special importance.","You may find yourself having to learn something by heart.","Keep the room cool rather than warm to avoid feeling sleepy."],3,"考点：段尾总起。空处位于首段末尾，后文用分点列举坐姿、翻看目录、控制阅读量、记笔记等做法，D 项“以下是一些帮助你提高阅读速度的建议”正好引出下文。F 讲背书，与下文无关；A 只是分点之一，不能统领全文。","2021·新高考II卷","If the only reading you ever do is the novel or magazine, the speed at which you read probably does not matter very much. But if you have to read a great deal for study, you will appreciate the benefits of being able to read more quickly. (36)\n\n• Before you open the book, make sure that you are comfortable. You need a seat which supports your back and the book should be at the right distance from your eyes. (37)\n\n• (38) Look at the table of contents, the preface, the chapter heading, etc. This will help you to decide whether you really need to read the whole book or only certain parts of it. Ten minutes spent in this way could save you quite a lot of time in the long run.\n\n• If you decide that you need to read the whole book, decide how much you can read at a time. (39) A history book which may contain the facts in story form will be easier to read than one dealing with scientific subjects. In the former case you may be able to read a chapter. In the latter you may only be able to read one page.\n\n• Always keep a pencil and paper beside you. (40) Note also the facts important for your purpose as well as anything which leads you to further research. You don't have to write these things in detail. It is enough to put the page number and one or two words as a reminder."],

["真题·阅读","What is probably the major concern of travelers who choose to stay in a hostel?",["Comfort.","Security.","Price.","Location."],2,"考点：细节推断。首段说罗马住宿贵“can be pricey”，这正是许多人改住旅社的原因，可见价格是首要考量，C 对。A、B 是住旅社附带的好处，D 只是位置优势，都不是“选择旅社”的动因。","2021·新高考I卷","Rome can be pricey for travelers, which is why many choose to stay in a hostel. The hostels in Rome offer a bed in a dorm room for around $25 a night, and for that, you'll often get to stay in a central location with security and comfort.\n\nYellow Hostel\n\nIf I had to make just one recommendation for where to stay in Rome, it would be Yellow Hostel. It's one of the best-rated hostels in the city, and for good reason. It's affordable, and it's got a fun atmosphere without being too noisy. As an added bonus, it's close to the main train station.\n\nHostel Alessandro Palace\n\nIf you love social hostels, this is the best hostel for you in Rome. Hostel Alessandro Palace is fun. Staff members hold plenty of bar events for guests, like free shots, bar crawls, and karaoke. There's also an area on the rooftop for hanging out with other travelers during the summer.\n\nYouth Station Hostel\n\nIf you're looking for cleanliness and a modern hostel, look no further than Youth Station. It offers beautiful furnishings and beds. There are plenty of other benefits, too; it doesn't charge city tax; it has both air conditioning and a heater for the rooms; it also has free Wi-Fi in every room.\n\nHotel and Hostel Des Artistes\n\nHotel and Hostel Des Artistes is located just a 10-minute walk from the central city station and it's close to all of the city's main attractions. The staff is friendly and helpful, providing you with a map of the city when you arrive, and offering advice if you require some. However, you have to pay 2 euros a day for Wi-Fi."],

["真题·阅读","What should Titterman be able to do to be a page turner?",["Read music.","Play the piano.","Sing songs.","Fix the instruments."],0,"考点：细节理解。第一段引语“I'm not a trained musician, but I've learnt to read music so I can help Maria”，说明他靠读谱胜任，A 对。B 与“没受过专业音乐训练”矛盾，C、D 原文无据，属臆造。","2021·新高考I卷","By day, Robert Titterman is a lawyer. In his spare time though he goes on stage beside pianist Maria Raspopova — not as a musician but as her page turner. 'I'm not a trained musician, but I've learnt to read music so I can help Maria in her performance.'\n\nMr Titterman is chairman of the Omega Ensemble but has been the group's official page turner for the past four years. His job is to sit beside the pianist and turn the pages of the score so the musician doesn't have to break the flow of sound by doing it themselves. He said he became just as nervous as those playing instruments on stage.\n\n'A lot of skills are needed for the job. You have to make sure you don't turn two pages at once and make sure you find the repeats in the music when you have to go back to the right spot,' Mr Titterman explained.\n\nBeing a page turner requires plenty of practice. Some pieces of music can go for 40 minutes and require up to 50 page turns, including back turns for repeat passages. Silent onstage communication is key, and each pianist has their own style of 'nodding' to indicate a page turn which they need to practise with their page turner.\n\nBut like all performances, there are moments when things go wrong. 'I was turning the page to get ready for the next page, but the draft wind from the turn caused the spare pages to fall off the stand,' Mr Titterman said. 'Luckily I was able to catch them and put them back.'\n\nMost page turners are piano students or up-and-coming concert pianists, although Ms Raspopova has once asked her husband to help her out on stage.\n\n'My husband is the worst page turner,' she laughed. 'He's absorbed in the music, feeling every note, and I have to say: \"Turn, turn!\" Robert is the best page turner I've had in my entire life.'"],

["真题·阅读","Why is Ms Raspopova's husband 'the worst page turner'?",["He has very poor eyesight.","He ignores the audience.","He has no interest in music.","He forgets to do his job."],3,"考点：原因推断。末段说丈夫“absorbed in the music, feeling every note”，她不得不喊“Turn, turn!”，即他太入迷而忘了翻页，D 对。C 与“沉浸在音乐里”正相反，A、B 原文未提。","2021·新高考I卷","By day, Robert Titterman is a lawyer. In his spare time though he goes on stage beside pianist Maria Raspopova — not as a musician but as her page turner. 'I'm not a trained musician, but I've learnt to read music so I can help Maria in her performance.'\n\nMr Titterman is chairman of the Omega Ensemble but has been the group's official page turner for the past four years. His job is to sit beside the pianist and turn the pages of the score so the musician doesn't have to break the flow of sound by doing it themselves. He said he became just as nervous as those playing instruments on stage.\n\n'A lot of skills are needed for the job. You have to make sure you don't turn two pages at once and make sure you find the repeats in the music when you have to go back to the right spot,' Mr Titterman explained.\n\nBeing a page turner requires plenty of practice. Some pieces of music can go for 40 minutes and require up to 50 page turns, including back turns for repeat passages. Silent onstage communication is key, and each pianist has their own style of 'nodding' to indicate a page turn which they need to practise with their page turner.\n\nBut like all performances, there are moments when things go wrong. 'I was turning the page to get ready for the next page, but the draft wind from the turn caused the spare pages to fall off the stand,' Mr Titterman said. 'Luckily I was able to catch them and put them back.'\n\nMost page turners are piano students or up-and-coming concert pianists, although Ms Raspopova has once asked her husband to help her out on stage.\n\n'My husband is the worst page turner,' she laughed. 'He's absorbed in the music, feeling every note, and ["真题·阅读","What was a cause of the waterfowl population decline in North America?",["Loss of wetlands.","Popularity of water sports.","Pollution of rivers.","Arrival of other wild animals."],0,"考点：细节理解。首段“Millions of acres of wetlands were dried...greatly reducing waterfowl habitat”，湿地被排干使栖息地锐减，A 对。B、C 原文未提，D 与“猎手和移民是人为原因”相悖。","2021·新高考I卷","When the explorers first set foot upon the continent of North America, the skies and lands were alive with an astonishing variety of wildlife. Native Americans had taken care of these precious natural resources wisely. Unfortunately, it took the explorers and the settlers who followed only a few decades to decimate a large part of these resources. Millions of waterfowl were killed at the hands of market hunters and a handful of overly ambitious sportsmen. Millions of acres of wetlands were dried to feed and house the ever-increasing populations, greatly reducing waterfowl habitat.\n\nIn 1934, with the passage of the Migratory Bird Hunting Stamp Act (Act), an increasingly concerned nation took firm action to stop the destruction of migratory waterfowl and the wetlands so vital to their survival. Under this Act, all waterfowl hunters 16 years of age and over must annually purchase and carry a Federal Duck Stamp. The very first Federal Duck Stamp was designed by J. N. 'Ding' Darling, a political cartoonist from Des Moines, Iowa, who at that time was appointed by President Franklin Roosevelt as Director of the Bureau of Biological Survey. Hunters willingly pay the stamp price to ensure the survival of our natural resources.\n\nAbout 98 cents of every duck stamp dollar goes directly into the Migratory Bird Conservation Fund to purchase wetlands and wildlife habitat for inclusion into the National Wildlife Refuge System — a fact that ensures this land will be protected and available for all generations to come. Since 1934, better than half a billion dollars has gone into that Fund to purchase more than 5 million acres of habitat. Little wonder the Federal Duck Stamp Program has been called one of the most successful conservation programs ever initiated."],
["真题·阅读","What does the underlined word 'decimate' mean in the first paragraph?",["Acquire.","Export.","Destroy.","Distribute."],2,"考点：词义猜测。上文说印第安人善待资源，接着 Unfortunately 转折，后文并列列举水禽被猎杀、湿地被排干，可见 decimate 指“大量毁坏”，C 对。A、B、D 都无法与后文的破坏行为衔接。","2021·新高考I卷","When the explorers first set foot upon the continent of North America, the skies and lands were alive with an astonishing variety of wildlife. Native Americans had taken care of these precious natural resources wisely. Unfortunately, it took the explorers and the settlers who followed only a few decades to decimate a large part of these resources. Millions of waterfowl were killed at the hands of market hunters and a handful of overly ambitious sportsmen. Millions of acres of wetlands were dried to feed and house the ever-increasing populations, greatly reducing waterfowl habitat.\n\nIn 1934, with the passage of the Migratory Bird Hunting Stamp Act (Act), an increasingly concerned nation took firm action to stop the destruction of migratory waterfowl and the wetlands so vital to their survival. Under this Act, all waterfowl hunters 16 years of age and over must annually purchase and carry a Federal Duck Stamp. The very first Federal Duck Stamp was designed by J. N. 'Ding' Darling, a political cartoonist from Des Moines, Iowa, who at that time was appointed by President Franklin Roosevelt as Director of the Bureau of Biological Survey. Hunters willingly pay the stamp price to ensure the survival of our natural resources.\n\nAbout 98 cents of every duck stamp dollar goes directly into the Migratory Bird Conservation Fund to purchase wetlands and wildlife habitat for inclusion into the National Wildlife Refuge System — a fact that ensures this land will be protected and available for all generations to come. Since 1934, better than half a billion dollars has gone into that Fund to purchase more than 5 million acres of habitat. Little wonder the Federal Duck Stamp Program has been called one of the most successful conservation programs ever initiated."],
["真题·阅读","What is a direct result of the Act passed in 1934?",["The stamp price has gone down.","The migratory birds have flown away.","The hunters have stopped hunting.","The government has collected money."],3,"考点：细节理解。法案要求 16 岁以上狩猎者每年购买鸭票，票款进入保护基金，直接结果即政府征得资金，D 对。C 与“必须每年购买”及“心甘情愿付钱”矛盾，狩猎并未停止；A、B 无据。","2021·新高考I卷","When the explorers first set foot upon the continent of North America, the skies and lands were alive with an astonishing variety of wildlife. Native Americans had taken care of these precious natural resources wisely. Unfortunately, it took the explorers and the settlers who followed only a few decades to decimate a large part of these resources. Millions of waterfowl were killed at the hands of market hunters and a handful of overly ambitious sportsmen. Millions of acres of wetlands were dried to feed and house the ever-increasing populations, greatly reducing waterfowl habitat.\n\nIn 1934, with the passage of the Migratory Bird Hunting Stamp Act (Act), an increasingly concerned nation took firm action to stop the destruction of migratory waterfowl and the wetlands so vital to their survival. Under this Act, all waterfowl hunters 16 years of age and over must annually purchase and carry a Federal Duck Stamp. The very first Federal Duck Stamp was designed by J. N. 'Ding' Darling, a political cartoonist from Des Moines, Iowa, who at that time was appointed by President Franklin Roosevelt as Director of the Bureau of Biological Survey. Hunters willingly pay the stamp price to ensure the survival of our natural resources.\n\nAbout 98 cents of every duck stamp dollar goes directly into the Migratory Bird Conservation Fund to purchase wetlands and wildlife habitat for inclusion into the National Wildlife Refuge System — a fact that ensures this land will be protected and available for all generations to come. Since 1934, better than half a billion dollars has gone into that Fund to purchase more than 5 million acres of habitat. Little wonder the Federal Duck Stamp Program has been called one of the most successful conservation programs ever initiated."],
["真题·阅读","Which of the following is a suitable title for the text?",["The Federal Duck Stamp Story","The National Wildlife Refuge System","The Benefits of Saving Waterfowl","The History of Migratory Bird Hunting"],0,"考点：主旨归纳。全文由水禽危机引出 1934 年法案，重点写鸭票的诞生、设计者、票款用途与成效，A 对。B、D 只是局部信息，C 偏离“鸭票”这一核心对象，范围过宽。","2021·新高考I卷","When the explorers first set foot upon the continent of North America, the skies and lands were alive with an astonishing variety of wildlife. Native Americans had taken care of these precious natural resources wisely. Unfortunately, it took the explorers and the settlers who followed only a few decades to decimate a large part of these resources. Millions of waterfowl were killed at the hands of market hunters and a handful of overly ambitious sportsmen. Millions of acres of wetlands were dried to feed and house the ever-increasing populations, greatly reducing waterfowl habitat.\n\nIn 1934, with the passage of the Migratory Bird Hunting Stamp Act (Act), an increasingly concerned nation took firm action to stop the destruction of migratory waterfowl and the wetlands so vital to their survival. Under this Act, all waterfowl hunters 16 years of age and over must annually purchase and carry a Federal Duck Stamp. The very first Federal Duck Stamp was designed by J. N. 'Ding' Darling, a political cartoonist from Des Moines, Iowa, who at that time was appointed by President Franklin Roosevelt as Director of the Bureau of Biological Survey. Hunters willingly pay the stamp price to ensure the survival of our natural resources.\n\nAbout 98 cents of every duck stamp dollar goes directly into the Migratory Bird Conservation Fund to purchase wetlands and wildlife habitat for inclusion into the National Wildlife Refuge System — a fact that ensures this land will be protected and available for all generations to come. Since 1934, better than half a billion dollars has gone into that Fund to purchase more than 5 million acres of habitat. Little wonder the Federal Duck Stamp Program has been called one of the most successful conservation programs ever initiated."],
["真题·阅读","What is a common misunderstanding of emotional intelligence?",["It can be measured by an IQ test.","It helps to exercise a person's mind.","It includes a set of emotional skills.","It refers to a person's positive qualities."],3,"考点：细节理解。首段“misunderstand emotional intelligence as almost everything desirable in a person's makeup”，即把情商等同于一切好品质，D 对。A 与“无法用智商测试衡量”相反，C 是作者主张的正确理解而非误解，B 原文未提。","2021·新高考I卷","Popularization has in some cases changed the original meaning of emotional intelligence. Many people now misunderstand emotional intelligence as almost everything desirable in a person's makeup that cannot be measured by an IQ test, such as character, motivation, confidence, mental stability, optimism and 'people skills.' Research has shown that emotional skills may contribute to some of these qualities, but most of them move far beyond skill-based emotional intelligence.\n\nWe prefer to describe emotional intelligence as a specific set of skills that can be used for either good or bad purposes. The ability to accurately understand how others are feeling may be used by a doctor to find how best to help her patients, while a cheater might use it to control potential victims. Being emotionally intelligent does not necessarily make one a moral person.\n\nAlthough popular beliefs regarding emotional intelligence run far ahead of what research can reasonably support, the overall effects of the publicity have been more beneficial than harmful. The most positive aspect of this popularization is a new and much needed emphasis on emotion by employers, educators and others interested in promoting social well-being. The popularization of emotional intelligence has helped both the public and researchers re-evaluate the functionality of emotions and how they serve people adaptively in everyday life.\n\nAlthough the continuing popular appeal of emotional intelligence is desirable, we hope that such attention will excite a greater interest in the scientific and scholarly study of emotion. It is our hope that in coming decades, advances in science will offer new perspectives from which to study how people manage their lives. Emotional intelligence, with its focus on both head and heart, may serve to point us in the right direction."],
["真题·阅读","Why does the author mention 'doctor' and 'cheater' in paragraph 2?",["To explain a rule.","To clarify a concept.","To present a fact.","To make a prediction."],1,"考点：写作意图。第二段先提出情商是一套可用于善也可用于恶的技能，再用医生与骗子两例具体说明，目的在澄清概念，B 对。例子是假设情形，故 C 错；A、D 与该段“界定概念”的功能不符。","2021·新高考I卷","Popularization has in some cases changed the original meaning of emotional intelligence. Many people now misunderstand emotional intelligence as almost everything desirable in a person's makeup that cannot be measured by an IQ test, such as character, motivation, confidence, mental stability, optimism and 'people skills.' Research has shown that emotional skills may contribute to some of these qualities, but most of them move far beyond skill-based emotional intelligence.\n\nWe prefer to describe emotional intelligence as a specific set of skills that can be used for either good or bad purposes. The ability to accurately understand how others are feeling may be used by a doctor to find how best to help her patients, while a cheater might use it to control potential victims. Being emotionally intelligent does not necessarily make one a moral person.\n\nAlthough popular beliefs regarding emotional intelligence run far ahead of what research can reasonably support, the overall effects of the publicity have been more beneficial than harmful. The most positive aspect of this popularization is a new and much needed emphasis on emotion by employers, educators and others interested in promoting social well-being. The popularization of emotional intelligence has helped both the public and researchers re-evaluate the functionality of emotions and how they serve people adaptively in everyday life.\n\nAlthough the continuing popular appeal of emotional intelligence is desirable, we hope that such attention will excite a greater interest in the scientific and scholarly study of emotion. It is our hope that in coming decades, advances in science will offer new perspectives from which to study how people manage their lives. Emotional intelligence, with its focus on both head and heart, may serve to point us in the right direction."],
["真题·阅读","What is the author's attitude to the popularization of emotional intelligence?",["Favorable.","Intolerant.","Doubtful.","Unclear."],0,"考点：观点态度。第三段“the overall effects of the publicity have been more beneficial than harmful”，并列举普及带来的积极影响，可见作者肯定这一普及，A 对。B、C 与该句判断相反，D 与作者明确的褒贬不符。","2021·新高考I卷","Popularization has in some cases changed the original meaning of emotional intelligence. Many people now misunderstand emotional intelligence as almost everything desirable in a person's makeup that cannot be measured by an IQ test, such as character, motivation, confidence, mental stability, optimism and 'people skills.' Research has shown that emotional skills may contribute to some of these qualities, but most of them move far beyond skill-based emotional intelligence.\n\nWe prefer to describe emotional intelligence as a specific set of skills that can be used for either good or bad purposes. The ability to accurately understand how others are feeling may be used by a doctor to find how best to help her patients, while a cheater might use it to control potential victims. Being emotionally intelligent does not necessarily make one a moral person.\n\nAlthough popular beliefs regarding emotional intelligence run far ahead of what research can reasonably support, the overall effects of the publicity have been more beneficial than harmful. The most positive aspect of this popularization is a new and much needed emphasis on emotion by employers, educators and others interested in promoting social well-being. The popularization of emotional intelligence has helped both the public and researchers re-evaluate the functionality of emotions and how they serve people adaptively in everyday life.\n\nAlthough the continuing popular appeal of emotional intelligence is desirable, we hope that such attention will excite a greater interest in the scientific and scholarly study of emotion. It is our hope that in coming decades, advances in science will offer new perspectives from which to study how people manage their lives. Emotional intelligence, with its focus on both head and heart, may serve to point us in the right direction."],
["真题·阅读","What does the last paragraph mainly talk about concerning emotional intelligence?",["Its appeal to the public.","Expectations for future studies.","Its practical application.","Scientists with new perspectives."],1,"考点：段落主旨。末段“we hope that such attention will excite a greater interest in the scientific and scholarly study”，并期待未来科学提供新视角，核心是对今后研究的期望，B 对。A 只是让步起点，C、D 均为个别词语而非主旨。","2021·新高考I卷","Popularization has in some cases changed the original meaning of emotional intelligence. Many people now misunderstand emotional intelligence as almost everything desirable in a person's makeup that cannot be measured by an IQ test, such as character, motivation, confidence, mental stability, optimism and 'people skills.' Research has shown that emotional skills may contribute to some of these qualities, but most of them move far beyond skill-based emotional intelligence.\n\nWe prefer to describe emotional intelligence as a specific set of skills that can be used for either good or bad purposes. The ability to accurately understand how others are feeling may be used by a doctor to find how best to help her patients, while a cheater might use it to control potential victims. Being emotionally intelligent does not necessarily make one a moral person.\n\nAlthough popular beliefs regarding emotional intelligence run far ahead of what research can reasonably support, the overall effects of the publicity have been more beneficial than harmful. The most positive aspect of this popularization is a new and much needed emphasis on emotion by employers, educators and others interested in promoting social well-being. The popularization of emotional intelligence has helped both the public and researchers re-evaluate the functionality of emotions and how they serve people adaptively in everyday life.\n\nAlthough the continuing popular appeal of emotional intelligence is desirable, we hope that such attention will excite a greater interest in the scientific and scholarly study of emotion. It is our hope that in coming decades, advances in science will offer new perspectives from which to study how people manage their lives. Emotional intelligence, with its focus on both head and heart, may serve to point us in the right direction."],
["真题·七选五","第36空最合适的句子是？",["Not all the customers are tourists.","The quality of life in France is equally excellent.","There was a nice kitchen and a comfortable bed.","The amazing food is mainly consumed by local farmers.","That's not the only reason the French eat less than we do.","Our aim was to see if we could live, in some way, like real Parisians.","The food is so delicious that you don't need much of it to make you happy."],5,"考点：段首衔接。空后“So the first thing we did was rent...”说明先有打算才去租房，F 项以 our/we 与全文人称一致，且“像真正的巴黎人那样生活”正是租房目的，承接自然。C 讲屋内设施，与“第一件事”逻辑不合。","2021·新高考I卷","My husband and I just spent a week in Paris. (36) So the first thing we did was rent a fantastically expensive sixth-floor apartment the size of a cupboard. It was so tiny that we had to leave our suitcases in the hallway.\n\nThe place wasn't entirely authentic, though. Unlike a normal Parisian apartment, the plumbing worked. (37) Our building even had a tiny lift with a female voice that said, \"Ouverture des portes,\" in perfect French. That is the only French phrase I mastered, and it's a shame I don't have much use for it.\n\nParisians are different from you and me. They never look lazy or untidy. As someone noted in this paper a couple of weeks ago, they eat great food and never gain weight. (38) French strawberries do not taste like cardboard. Instead, they explode in your mouth like little flavor bombs.\n\n(39) On our first morning in Paris, I went around the corner to the food market to pick up some groceries. I bought a handful of perfectly ripe small strawberries and a little sweet melon. My husband and I agreed they were the best fruit we had ever eaten. But they cost $18!\n\nIn France, quality of life is much more important than efficiency. You can tell this by café life. French cafés are always crowded. (40) When do these people work? The French take their 35-hour workweek seriously — so seriously that some labor unions recently struck a deal with a group of companies limiting the number of hours that independent contractors can be on call."],

ontractors can be on call."],

["真题·阅读","What does a group need to do if they are offered a scholarship?",["Prepay the admission fees.","Use the Museum's transportation.","Take a survey after the visit.","Schedule their visit on weekdays."],2,"细节题。奖学金部分明确要求参观后参与问卷调查（post-visit survey），C 项与此对应；A 项预付门票、B 项馆方提供交通工具、D 项限工作日参观，原文均无此要求，D 项更与“每天开放”矛盾。","2022·新高考II卷","Children's Discovery Museum\n\nGeneral Information about Group Play\n\nPricing\n\nGroup Play $7/person\n\nScholarships\n\nWe offer scholarships to low-income schools and youth organizations, subject to availability. Participation in a post-visit survey is required.\n\nScholarships are for Group Play admission fees and/or transportation. Transportation invoices (发票) must be received within 60 days of your visit to guarantee the scholarship.\n\nGroup Size\n\nWe require one chaperone (监护人) per ten children. Failure to provide enough chaperones will result in an extra charge of $50 per absent adult.\n\nGroup Play is for groups of 10 or more with a limit of 35 people. For groups of 35 or more, please call to discuss options.\n\nHours\n\nThe Museum is open daily from 9:30 am to 4:30 pm.\n\nGroup Play may be scheduled during any day or time the Museum is open.\n\nRegistration Policy\n\nRegistration must be made at least two weeks in advance.\n\nRegister online or fill out a Group Play Registration Form with multiple date and start time options.\n\nOnce the registration form is received and processed, we will send a confirmation email within two business days.\n\nGuidelines\n\n• Teachers and chaperones should model good behavior for the group and remain with students at all times.\n\n• Children are not allowed unaccompanied in all areas of the Museum.\n\n• Children should play nicely with each other and exhibits.\n\n• Use your indoor voice when at the Museum."],

["真题·阅读","What do the underlined words \"hit home for me\" mean in paragraph 2?",["Provided shelter for me.","Became very clear to me.","Took the pressure off me.","Worked quite well on me."],1,"词义猜测题。作者原以为“讲故事进入新时代”与自己无关，直到陪孙子读书、见他把纸书当平板戳，才真切体会到，hit home 即“让人深有感触”，选 B。A 项按 home“家”字面理解，C、D 项与语境无关。","2022·新高考II卷","We journalists live in a new age of storytelling, with many new multimedia tools. Many young people don't even realize it's new. For them, it's just normal.\n\nThis hit home for me as I was sitting with my 2-year-old grandson on a sofa over the Spring Festival holiday. I had brought a children's book to read. It had simple words and colorful pictures — a perfect match for his age.\n\nPicture this: my grandson sitting on my lap as I hold the book in front so he can see the pictures. As I read, he reaches out and pokes (戳) the page with his finger.\n\nWhat's up with that? He just likes the pictures, I thought. Then I turned the page and continued. He poked the page even harder. I nearly dropped the book. I was confused: Is there something wrong with this kid?\n\nThen I realized what was happening. He was actually a stranger to books. His father frequently amused the boy with a tablet computer which was loaded with colorful pictures that come alive when you poke them. He thought my storybook was like that.\n\nSorry, kid. This book is not part of your high-tech world. It's an outdated, lifeless thing. An antique. Like your grandfather. Well, I may be old, but I'm not hopelessly challenged, digitally speaking. I edit video and produce audio. I use mobile payment. I've even built websites.\n\nThere's one notable gap in my new-media experience, however: I've spent little time in front of a camera, since I have a face made for radio. But that didn't stop China Daily from asking me last week to share a personal story for a video project about the integration of Beijing, Tianjin and Hebei province.\n\nAnyway, grandpa is now an Internet star — two minutes of fame! I promise not to let it go to my head. But I will make sure my 2-year-old grandson sees it on his tablet."],

["真题·阅读","Which of the following best describes the ban on drivers' texting in the US?",["Ineffective.","Unnecessary.","Inconsistent.","Unfair."],0,"推理判断题。禁令推行七年，事故按任何标准衡量都在上升，人们照旧发短信、刷社交网络，官员也承认分心驾驶只增不减，可见禁令收效甚微，选 A。B、C、D 是主观评价，文中无据。","2022·新高考II卷","Over the last seven years, most states have banned texting by drivers, and public service campaigns have tried a wide range of methods to persuade people to put down their phones when they are behind the wheel.\n\nYet the problem, by just about any measure, appears to be getting worse. Americans are still texting while driving, as well as using social networks and taking photos. Road accidents, which had fallen for years, are now rising sharply.\n\nThat is partly because people are driving more, but Mark Rosekind, the chief of the National Highway Traffic Safety Administration, said distracted (分心) driving was “only increasing, unfortunately.”\n\n“Big change requires big ideas,” he said in a speech last month, referring broadly to the need to improve road safety. So to try to change a distinctly modern behavior, lawmakers and public health experts are reaching back to an old approach: They want to treat distracted driving like drunk driving.\n\nAn idea from lawmakers in New York is to give police officers a new device called the Textalyzer. It would work like this: An officer arriving at the scene of a crash could ask for the phones of the drivers and use the Textalyzer to check in the operating system for recent activity. The technology could determine whether a driver had just texted, emailed or done anything else that is not allowed under New York's hands-free driving laws.\n\n“We need something on the books that can change people's behavior,” said Félix W. Ortiz, who pushed for the state's 2001 ban on hand-held devices by drivers. “If the Textalyzer bill becomes law,” he said, “people are going to be more afraid to put their hands on the cell phone.”"],
["真题·阅读","What can the Textalyzer help a police officer find out?",["Where a driver came from.","Whether a driver used their phone.","How fast a driver was going.","When a driver arrived at the scene."],1,"细节题。第五段说该设备可检查手机操作系统的近期活动，判定司机是否刚发过短信、邮件或违规用手机，B 项与之对应。A 项行踪、C 项车速、D 项到达时间均非该设备功能，属同类细节的错位干扰。","2022·新高考II卷","Over the last seven years, most states have banned texting by drivers, and public service campaigns have tried a wide range of methods to persuade people to put down their phones when they are behind the wheel.\n\nYet the problem, by just about any measure, appears to be getting worse. Americans are still texting while driving, as well as using social networks and taking photos. Road accidents, which had fallen for years, are now rising sharply.\n\nThat is partly because people are driving more, but Mark Rosekind, the chief of the National Highway Traffic Safety Administration, said distracted (分心) driving was “only increasing, unfortunately.”\n\n“Big change requires big ideas,” he said in a speech last month, referring broadly to the need to improve road safety. So to try to change a distinctly modern behavior, lawmakers and public health experts are reaching back to an old approach: They want to treat distracted driving like drunk driving.\n\nAn idea from lawmakers in New York is to give police officers a new device called the Textalyzer. It would work like this: An officer arriving at the scene of a crash could ask for the phones of the drivers and use the Textalyzer to check in the operating system for recent activity. The technology could determine whether a driver had just texted, emailed or done anything else that is not allowed under New York's hands-free driving laws.\n\n“We need something on the books that can change people's behavior,” said Félix W. Ortiz, who pushed for the state's 2001 ban on hand-held devices by drivers. “If the Textalyzer bill becomes law,” he said, “people are going to be more afraid to put their hands on the cell phone.”"] ["真题·阅读","What does the underlined word \"something\" in the last paragraph refer to?",["Advice.","Data.","Tests.","Laws."],3,"词义指代题。something 后接 on the books（有法律条文），下句又说该法案若成为法律，可见他指的是能约束行为的法律，故选 laws。A 建议、B 数据、C 检测都不能与 on the books 搭配。","2022·新高考II卷","Over the last seven years, most states have banned texting by drivers, and public service campaigns have tried a wide range of methods to persuade people to put down their phones when they are behind the wheel.\n\nYet the problem, by just about any measure, appears to be getting worse. Americans are still texting while driving, as well as using social networks and taking photos. Road accidents, which had fallen for years, are now rising sharply.\n\nThat is partly because people are driving more, but Mark Rosekind, the chief of the National Highway Traffic Safety Administration, said distracted (分心) driving was “only increasing, unfortunately.”\n\n“Big change requires big ideas,” he said in a speech last month, referring broadly to the need to improve road safety. So to try to change a distinctly modern behavior, lawmakers and public health experts are reaching back to an old approach: They want to treat distracted driving like drunk driving.\n\nAn idea from lawmakers in New York is to give police officers a new device called the Textalyzer. It would work like this: An officer arriving at the scene of a crash could ask for the phones of the drivers and use the Textalyzer to check in the operating system for recent activity. The technology could determine whether a driver had just texted, emailed or done anything else that is not allowed under New York's hands-free driving laws.\n\n“We need something on the books that can change people's behavior,” said Félix W. Ortiz, who pushed for the state's 2001 ban on hand-held devices by drivers. “If the Textalyzer bill becomes law,” he said, “people are going to be more afraid to put their hands on the cell phone.”"],

ple are going to be more afraid to put their hands on the cell phone.”"],
["真题·阅读","What does Levine want to explain by mentioning the rubber band?",["The right way of exercising.","The causes of a heart attack.","The difficulty of keeping fit.","The aging process of the heart."],3,"写作意图题。橡皮筋久放抽屉会变干、易断，喻指心脏随年龄增长逐渐失去弹性，与首段“心脏处理氧气效率下降、五十多岁出现迹象”呼应，故选 D。A 项谈锻炼方法、B 项谈病因、C 项谈健身难度，都不是比喻的落点。","2022·新高考II卷","As we age, even if we're healthy, the heart just isn't as efficient in processing oxygen as it used to be. In most people the first signs show up in their 50s or early 60s. And among people who don't exercise, the changes can start even sooner.\n\n“Think of a rubber band. In the beginning, it is flexible, but put it in a drawer for 20 years and it will become dry and easily broken,” says Dr. Ben Levine, a heart specialist at the University of Texas. That's what happens to the heart. Fortunately for those in midlife, Levine is finding that even if you haven't been an enthusiastic exerciser, getting in shape now may help improve your aging heart.\n\nLevine and his research team selected volunteers aged between 45 and 64 who did not exercise much but were otherwise healthy. Participants were randomly divided into two groups. The first group participated in a program of nonaerobic (无氧) exercise — balance training and weight training — three times a week. The second group did high-intensity aerobic exercise under the guidance of a trainer for four or more days a week. After two years, the second group saw remarkable improvements in heart health.\n\n“We took these 50-year-old hearts and turned the clock back to 30- or 35-year-old hearts,” says Levine. “And the reason they got so much stronger and fitter was that their hearts could now fill a lot better and pump (泵送) a lot more blood during exercise.” But the hearts of those who participated in less intense exercise didn't change, he says.\n\n“The sweet spot in life to start exercising, if you haven't already, is in late middle age when the heart still has flexibility,” Levine says. “We put healthy 70-year-olds through a yearlong exercise training program, and nothing happened to them at all.”\n\nDr. Nieca Goldberg, a spokeswoman for the American Heart Association, says Levine's findings are a great start. But the study was small and needs to be repeated with far larger groups of people to determine exactly which aspects of an exercise routine make the biggest difference."],

ong exercise training program, and nothing happened to them at all.”\n\nDr. Nieca Goldberg, a spokeswoman for the American Heart Association, says Levine's findings are a great start. But the study was small and needs to be repeated with far larger groups of people to determine exactly which aspects of an exercise routine make the biggest difference."],

 when the heart still has flexibility,” Levine says. “We put healthy 70-year-olds through a yearlong exercise training program, and nothing happened to them at all.”\n\nDr. Nieca Goldberg, a spokeswoman for the American Heart Association, says Levine's findings are a great start. But the study was small and needs to be repeated with far larger groups of people to determine exactly which aspects of an exercise routine make the biggest difference."],
["真题·阅读","What does Dr. Nieca Goldberg suggest?",["Making use of the findings.","Interviewing the study participants.","Conducting further research.","Clarifying the purpose of the study."],2,"观点态度题。她说研究规模小，需在人数多得多的群体中重做（repeat with far larger groups），即开展进一步研究，C 项正合此意；A 项把“好的开端”曲解为直接应用，B、D 项属无据推断。","2022·新高考II卷","As we age, even if we're healthy, the heart just isn't as efficient in processing oxygen as it used to be. In most people the first signs show up in their 50s or early 60s. And among people who don't exercise, the changes can start even sooner.\n\n“Think of a rubber band. In the beginning, it is flexible, but put it in a drawer for 20 years and it will become dry and easily broken,” says Dr. Ben Levine, a heart specialist at the University of Texas. That's what happens to the heart. Fortunately for those in midlife, Levine is finding that even if you haven't been an enthusiastic exerciser, getting in shape now may help improve your aging heart.\n\nLevine and his research team selected volunteers aged between 45 and 64 who did not exercise much but were otherwise healthy. Participants were randomly divided into two groups. The first group participated in a program of nonaerobic (无氧) exercise — balance training and weight training — three times a week. The second group did high-intensity aerobic exercise under the guidance of a trainer for four or more days a week. After two years, the second group saw remarkable improvements in heart health.\n\n“We took these 50-year-old hearts and turned the clock back to 30- or 35-year-old hearts,” says Levine. “And the reason they got so much stronger and fitter was that their hearts could now fill a lot better and pump (泵送) a lot more blood during exercise.” But the hearts of those who participated in less intense exercise didn't change, he says.\n\n“The sweet spot in life to start exercising, if you haven't already, is in late middle age when the heart still has flexibility,” Levine says. “We put healthy 70-year-olds through a yearlong exercise training program, and nothing happened to them at all.”\n\nDr. Nieca Goldberg, a spokeswoman for the American Heart Association, says Levine's findings are a great start. But the study was small and needs to be repeated with far larger groups of people to determine exactly which aspects of an exercise routine make the biggest difference."],
["真题·七选五","第 36 空最合适的句子是？",["Make sure your handwriting is neat.","Let your pen follow the waves of thought.","The second draft of the essay should be better.","First of all, learn the technique of nonstop writing.","Too many writers try to get their drafts right the first time.","Many beginning writers don't leave enough space to revise.","Then you can print out a fresh draft, again setting your text on triple-space."],3,"段首句，须引出本段“不停笔写作”的技巧，并承接首段“三个简单技巧”的总起。空后紧接 write nonstop，D 项“首先，要学会不停笔写作的技巧”正好领起下文；A 项谈书写、C 项谈二稿，E、F 项属后两段话题。","2022·新高考II卷","Writing an essay is a difficult process for most people. However, the process can be made easier if you learn to practice three simple techniques.\n\n(36) When you are first trying to think of ideas for an essay, put your pen to your paper and write nonstop for ten or fifteen minutes without letting your pen leave the paper. Stay loose and free. (37) Don't worry about grammar or spelling. Even though this technique won't work for everyone, it helps many people get a good store of ideas to draw on.\n\nThe next technique is to write your draft rapidly without worrying about being perfect. (38) Yet, by learning to live with imperfection, you will save yourself headaches and a wastepaper basket full of crumpled (揉皱的) paper. Think of your first draft as a path cut out of the jungle as part of an exploration, not as a complete highway.\n\nThe third technique is to try printing out a triple-spaced (三倍行距) copy to allow space for revision. (39) As a result, these writers never get in the habit of crossing out chunks (大块) of their draft and writing revisions in the blank space. After you have revised your draft until it is too messy to work from anymore, you can enter your changes into your word processor. (40) The resulting blank space invites you to revise."],

["真题·阅读","Where is this text probably taken from?",["A textbook.","An exam paper.","A course plan.","An academic article."],2,"考点：文章出处推断。全文依次列出评分等级、论文与小组作业的成绩占比、迟交如何扣分，都是教师开课时发给学生的课程说明，故选 course plan。教科书重在知识讲解，不会有「我还会不时布置作业」这类第一人称安排；学术论文更不会规定 Blackboard 提交与降级规则；试卷也不含这类面向学生的规则条款。","2022·新高考I卷","Grading Policies for Introduction to Literature\n\nGrading Scale\n\n90-100, A; 80-89, B; 70-79, C; 60-69, D; Below 60, E.\n\nEssays (60%)\n\nYour four major essays will combine to form the main part of the grade for this course: Essay 1 = 10%; Essay 2 = 15%; Essay 3 = 15%; Essay 4 = 20%.\n\nGroup Assignments (30%)\n\nStudents will work in groups to complete four assignments (作业) during the course. All the assignments will be submitted by the assigned date through Blackboard, our online learning and course management system.\n\nDaily Work/In-Class Writings and Tests/Group Work/Homework (10%)\n\nClass activities will vary from day to day, but students must be ready to complete short in-class writings or tests drawn directly from assigned readings or notes from the previous class' lecture/discussion, so it is important to take careful notes during class. Additionally, from time to time I will assign group work to be completed in class or short assignments to be completed at home, both of which will be graded.\n\nLate Work\n\nAn essay not submitted in class on the due date will lose a letter grade for each class period it is late. If it is not turned in by the 4th day after the due date, it will earn a zero. Daily assignments not completed during class will get a zero. Short writings missed as a result of an excused absence will be accepted."],
["真题·阅读","How many parts is a student's final grade made up of?",["Two.","Three.","Four.","Five."],1,"考点：细节归纳。三个小标题后的百分比即答案：Essays（60%）、Group Assignments（30%）、Daily Work 等（10%），三者合计 100%，故为三部分。Four 是典型干扰项：四篇论文只是「论文」这一项内部的拆分，四项小组作业也只是第二项的内部数目，都不构成四个评分板块；Five 更无依据。","2022·新高考I卷","Grading Policies for Introduction to Literature\n\nGrading Scale\n\n90-100, A; 80-89, B; 70-79, C; 60-69, D; Below 60, E.\n\nEssays (60%)\n\nYour four major essays will combine to form the main part of the grade for this course: Essay 1 = 10%; Essay 2 = 15%; Essay 3 = 15%; Essay 4 = 20%.\n\nGroup Assignments (30%)\n\nStudents will work in groups to complete four assignments (作业) during the course. All the assignments will be submitted by the assigned date through Blackboard, our online learning and course management system.\n\nDaily Work/In-Class Writings and Tests/Group Work/Homework (10%)\n\nClass activities will vary from day to day, but students must be ready to complete short in-class writings or tests drawn directly from assigned readings or notes from the previous class' lecture/discussion, so it is important to take careful notes during class. Additionally, from time to time I will assign group work to be completed in class or short assignments to be completed at home, both of which will be graded.\n\nLate Work\n\nAn essay not submitted in class on the due date will lose a letter grade for each class period it is late. If it is not turned in by the 4th day after the due date, it will earn a zero. Daily assignments not completed during class will get a zero. Short writings missed as a result of an excused absence will be accepted."],
["真题·阅读","What will happen if you submit an essay one week after the due date?",["You will receive a zero.","You will lose a letter grade.","You will be given a test.","You will have to rewrite it."],0,"考点：细节推理。迟交规则分两层：每迟一节课降一级，但「not turned in by the 4th day after the due date, it will earn a zero」。一周已超过四天，直接零分，选 A。B 只适用于四天以内的短期迟交，是最易误选的干扰项；C 的测验属课堂写作环节，与迟交无关；D 的「重写」文中从未提及。","2022·新高考I卷","Grading Policies for Introduction to Literature\n\nGrading Scale\n\n90-100, A; 80-89, B; 70-79, C; 60-69, D; Below 60, E.\n\nEssays (60%)\n\nYour four major essays will combine to form the main part of the grade for this course: Essay 1 = 10%; Essay 2 = 15%; Essay 3 = 15%; Essay 4 = 20%.\n\nGroup Assignments (30%)\n\nStudents will work in groups to complete four assignments (作业) during the course. All the assignments will be submitted by the assigned date through Blackboard, our online learning and course management system.\n\nDaily Work/In-Class Writings and Tests/Group Work/Homework (10%)\n\nClass activities will vary from day to day, but students must be ready to complete short in-class writings or tests drawn directly from assigned readings or notes from the previous class' lecture/discussion, so it is important to take careful notes during class. Additionally, from time to time I will assign group work to be completed in class or short assignments to be completed at home, both of which will be graded.\n\nLate Work\n\nAn essay not submitted in class on the due date will lose a letter grade for each class period it is late. If it is not turned in by the 4th day after the due date, it will earn a zero. Daily assignments not completed during class will get a zero. Short writings missed as a result of an excused absence will be accepted."],
["真题·阅读","What does the author want to show by telling the arugula story?",["We pay little attention to food waste.","We waste food unintentionally at times.","We waste more vegetables than meat.","We have good reasons for wasting food."],1,"考点：写作意图推断。作者自述因加班、赴约把菜放坏，又「unthinkingly bought way too much」，落点都在「没多想」，说明浪费往往是无意造成的。A 与首句「我尽量留心」自相矛盾；C 的蔬菜与肉之比文中从未出现；D 与全文批评浪费、呼吁减少浪费的立场正相反。","2022·新高考I卷","Like most of us, I try to be mindful of food that goes to waste. The arugula (芝麻菜) was to make a nice green salad, rounding out a roast chicken dinner. But I ended up working late. Then friends called with a dinner invitation. I stuck the chicken in the freezer. But as days passed, the arugula went bad. Even worse, I had unthinkingly bought way too much; I could have made six salads with what I threw out.\n\nIn a world where nearly 800 million people a year go hungry, “food waste goes against the moral grain,” as Elizabeth Royte writes in this month's cover story. It's jaw-dropping how much perfectly good food is thrown away — from “ugly” (but quite eatable) vegetables rejected by grocers to large amounts of uneaten dishes thrown into restaurant garbage cans.\n\nProducing food that no one eats wastes the water, fuel, and other resources used to grow it. That makes food waste an environmental problem. In fact, Royte writes, “if food waste were a country, it would be the third largest producer of greenhouse gases in the world.”\n\nIf that's hard to understand, let's keep it as simple as the arugula at the back of my refrigerator. Mike Curtin sees my arugula story all the time — but for him, it's more like 12 boxes of donated strawberries nearing their last days. Curtin is CEO of DC Central Kitchen in Washington, D.C., which recovers food and turns it into healthy meals. Last year it recovered more than 807,500 pounds of food by taking donations and collecting blemished (有瑕疵的) produce that otherwise would have rotted in fields. And the strawberries? Volunteers will wash, cut, and freeze or dry them for use in meals down the road.\n\nSuch methods seem obvious, yet so often we just don't think. “Everyone can play a part in reducing waste, whether by not purchasing more food than necessary in your weekly shopping or by asking restaurants to not include the side dish you won't eat,” Curtin says."],
