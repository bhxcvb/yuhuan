<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>语欢 · 高考英语语法真题练习</title>
<style>
:root{
  --page:radial-gradient(120% 80% at 50% 0%,#141a26 0%,#0b0d13 55%);
  --bg:#0b0d13;--card:#171b25;--card2:#222836;--fg:#eef2f9;--mute:#8a93a8;
  --acc:#5b9dff;--acc2:#8f7bff;--good:#3ecf8e;--bad:#ff6b6b;--warn:#f2b53d;--line:#242b3a;
  --card-grad:linear-gradient(165deg,#1a1f2b,#151924);
  --nav-bg:#0e111a;--track-bg:#1e2532;--shadow:0 18px 40px -18px #000c,0 0 0 1px #ffffff08;
  --why-bg:#0d1017;--chip-bg:#5b9dff1a;--ok-bg:#16331f;--no-bg:#361c1f;
  --input-bg:#0d1017;--input-line:#2c3342
}
body.light{
  --page:radial-gradient(120% 80% at 50% 0%,#ffffff 0%,#eaeff8 60%);
  --bg:#eaeff8;--card:#ffffff;--card2:#e9eef7;--fg:#161c2a;--mute:#6b7488;
  --acc:#2f6fe4;--acc2:#7b5cf0;--good:#1f9e6a;--bad:#d64545;--warn:#b8801a;--line:#e2e8f2;
  --card-grad:linear-gradient(165deg,#ffffff,#f6f9ff);
  --nav-bg:#ffffff;--track-bg:#dde4f0;--shadow:0 12px 28px -16px #35507a55,0 0 0 1px #dbe3f0;
  --why-bg:#f2f6fd;--chip-bg:#2f6fe414;--ok-bg:#e6f8ef;--no-bg:#fdeaea;
  --input-bg:#ffffff;--input-line:#cdd7e6
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--fg);
  font:16px/1.55 -apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto}
header{padding:calc(12px + env(safe-area-inset-top)) 18px 4px;flex-shrink:0}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.topline .lbl{font-size:13px;color:var(--mute)}
.topline .right{font-size:12.5px;color:var(--mute)}
.topline .back{background:none;border:0;color:var(--acc);font-size:14px;padding:2px 0;font-family:inherit;display:none}
.topline .themebtn{background:var(--card2);border:0;border-radius:50%;width:30px;height:30px;font-size:14px;color:var(--fg);line-height:1}
.track{height:4px;border-radius:4px;background:var(--track-bg);overflow:hidden;margin-top:10px}
.track>i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .45s cubic-bezier(.2,.8,.2,1)}
main{flex:1;overflow-y:auto;padding:14px 18px 20px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--nav-bg);padding-bottom:env(safe-area-inset-bottom);flex-shrink:0}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 0 10px;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;transition:color .2s}
nav button .ic{font-size:18px;line-height:1;transition:transform .25s}
nav button.on{color:var(--acc)}
nav button.on .ic{transform:translateY(-1px) scale(1.08)}

.card{position:relative;background:var(--card-grad);border-radius:24px;
  padding:20px 18px;box-shadow:var(--shadow)}
.card.enter{animation:enter .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.qtext{font-size:18px;line-height:1.72;letter-spacing:.1px}
.srcrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.spkmini{background:var(--card2);border:0;border-radius:20px;padding:4px 10px;font-size:11.5px;color:var(--acc);font-family:inherit}
.spkmini:active{transform:scale(.95)}
.src{display:inline-block;font-size:11.5px;color:var(--acc);background:var(--chip-bg);border:1px solid #5b9dff33;border-radius:20px;padding:2px 10px}
.qtext u{color:var(--acc);text-decoration:none;border-bottom:2px solid var(--acc);padding:0 2px}
.opt{width:100%;text-align:left;background:var(--card);border:1.5px solid #2a3142;color:var(--fg);
  border-radius:16px;padding:15px 16px;font-size:16px;margin-bottom:10px;font-family:inherit;line-height:1.5;
  transition:border-color .22s,background .22s,transform .12s;display:flex;gap:10px;align-items:flex-start}
.opt:active{transform:scale(.99)}
.opt .k{color:var(--mute);font-size:14px;min-width:14px;padding-top:2px}
.opt.ok{border-color:var(--good);background:var(--ok-bg);color:var(--good)}
.opt.ok .k{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--no-bg);color:var(--bad)}
.opt.no .k{color:var(--bad)}
.opt.enter{animation:enter .3s both}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:16px;padding:16px 6px;font-size:15.5px;font-weight:650;color:#fff;
  background:var(--card2);font-family:inherit;transition:transform .12s,opacity .2s,box-shadow .2s}
.btn:active{transform:scale(.965)}
.btn:disabled{opacity:.3}
.btn.good{background:linear-gradient(180deg,#41d795,#22a672);box-shadow:0 8px 20px -10px #3ecf8ea0}
.btn.bad{background:linear-gradient(180deg,#ff8080,#dc4444);box-shadow:0 8px 20px -10px #ff6b6ba0}
.btn.ghost{background:var(--card2);color:var(--fg);font-weight:500}
.why{background:var(--why-bg);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;
  line-height:1.65;color:var(--fg);animation:enter .3s both}
.why b{color:var(--acc)}
.why .cat{font-size:11.5px;color:var(--mute);display:block;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{background:var(--card);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 0 0 1px #ffffff06}
.tile b{display:block;font-size:22px;font-weight:680;line-height:1.2}
.tile span{font-size:11px;color:var(--mute)}
.sec{background:var(--card);border-radius:18px;padding:15px 16px;margin-bottom:12px;box-shadow:0 0 0 1px #ffffff06}
.sec h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:15px;border-bottom:1px solid #ffffff08}
.row:last-child{border:0}
.row .v{color:var(--mute);font-size:13.5px}
.meter{display:flex;align-items:center;gap:10px;padding:7px 0}
.meter .nm{font-size:13.5px;width:86px;flex-shrink:0;color:var(--fg);opacity:.85}
.meter .tr{flex:1;height:7px;border-radius:5px;background:var(--track-bg);overflow:hidden}
.meter .tr>i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.meter .pc{font-size:12px;color:var(--mute);width:38px;text-align:right;flex-shrink:0}
.hint{color:var(--mute);font-size:12.5px;line-height:1.62}
.center{text-align:center}
.big{font-size:20px;font-weight:680}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);
  border-radius:16px;padding:15px 16px;margin-bottom:10px;font-size:15.5px;transition:transform .12s,background .2s}
.pick:active{transform:scale(.99)}
.pick .go{color:var(--mute);font-size:13px}
.pick.cta{background:linear-gradient(135deg,#2b3d68,#3a2d63);color:#fff;border:1px solid #5b9dff55}
.pick.cta .hint{color:#ffffffc0}
body.light .pick.cta{background:linear-gradient(135deg,#e9f0ff,#f1ebff);color:var(--fg);border:1px solid #c3d4ef}
body.light .pick.cta .hint{color:var(--mute)}
.pick .badge{font-size:11px;border-radius:20px;padding:2px 9px;background:#5b9dff1a;color:var(--acc);border:1px solid #5b9dff33}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;
  border-bottom:1px solid var(--line);font-size:15px;transition:background .2s}
.item:last-child{border:0}
.item:active{background:var(--card2)}
.item .st{font-size:12px;color:var(--mute);flex-shrink:0}
.rows{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px #ffffff06}
.search{width:100%;background:var(--input-bg);border:1.5px solid var(--input-line);color:var(--fg);border-radius:13px;
  padding:11px 13px;font-size:15px;font-family:inherit;margin-bottom:12px}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.burst{position:relative;height:0}
.burst span{position:absolute;left:50%;top:0;font-size:20px;animation:fly .9s ease-out both}
@keyframes fly{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:200;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sheet.on{display:flex}
.sheetbox{background:var(--card);border-radius:22px;padding:20px 18px;width:100%;max-width:520px;box-shadow:0 20px 50px -20px #000c;animation:enter .28s cubic-bezier(.2,.8,.2,1) both}
.sheettitle{font-size:17px;font-weight:680;margin-bottom:6px}
.sheettext{font-size:14.5px;color:var(--mute);line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card2);border:0;border-radius:20px;padding:5px 12px;font-size:12px;color:var(--mute);font-family:inherit}
.chip.on{background:linear-gradient(135deg,#2b5db8,#4b3a9e);color:#fff}
.trbox{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:var(--shadow)}
.trbox .trh{font-size:12.5px;color:var(--mute);margin-bottom:6px;letter-spacing:.3px}
.trbox .trq{font-size:14.5px;color:var(--fg);line-height:1.65}
.trbox .tro{font-size:13.5px;color:var(--mute);line-height:1.6;margin-top:4px}
.trbox .tro b{color:var(--acc);font-weight:600}
.exbox{border-radius:13px;padding:11px 13px;margin-top:10px;font-size:14.5px;line-height:1.6;color:var(--fg)}
.exbox.ok{background:var(--ok-bg);border-left:3px solid var(--good)}
.exbox.no{background:var(--no-bg);border-left:3px solid var(--bad)}
.extag{display:block;font-size:11px;opacity:.7;margin-bottom:3px}
.passage{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.passage summary{font-size:13px;color:var(--acc);cursor:pointer;list-style:none}
.passage summary::-webkit-details-marker{display:none}
.ptext{margin-top:10px;font-size:14px;line-height:1.75;color:var(--fg);white-space:pre-wrap;max-height:44vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:#2b3342;color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
input[type=number],input[type=date]{background:var(--input-bg);border:1.5px solid var(--input-line);color:var(--fg);
  border-radius:11px;padding:8px;font-size:15px;font-family:inherit;font-weight:600;color-scheme:light dark}
input[type=number]{width:78px;text-align:center}
.gap{height:10px}
.mt{margin-top:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="topline"><button class="back" id="back" data-act="back">‹ 返回</button><div class="lbl" id="lbl"></div><div style="display:flex;align-items:center;gap:8px"><div class="right" id="right"></div><button class="themebtn" id="theme" data-act="theme">🌙</button></div></div>
    <div class="track"><i id="track"></i></div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet">
  <div class="sheetbox">
    <div class="sheettitle" id="stitle"></div>
    <div class="sheettext" id="stext"></div>
    <div class="btns" style="margin-top:16px">
      <button class="btn ghost" data-act="sheetNo">取消</button>
      <button class="btn bad" id="sok" data-act="sheetYes">确定</button>
    </div>
  </div>
</div>

<script>
"use strict";
var POINTS = [
["一般现在时","表示习惯、规律或客观事实；主语第三人称单数时动词加 -s/-es。","He goes to school by bike every day.","He go to school by bike every day.","主语 he 是第三人称单数，动词要用 goes。","He ___ to school by bike every day.","goes","时态"],
["一般过去时","表示过去某个时间发生并结束的动作，常与 last night、yesterday 连用。","I watched a film last night.","I have watched a film last night.","last night 是明确的过去时间，不能和现在完成时连用。","I ___ a film last night.","watched","时态"],
["现在完成时","have/has + 过去分词，强调对现在的影响或持续到现在。","I have finished my homework, so I can play now.","I finished my homework since this morning.","since 表示持续到现在，要用现在完成时。","I ___ my homework, so I can play now.","have finished","时态"],
["过去完成时","表示“过去的过去”，had + 过去分词。","When I arrived, the train had left.","When I arrived, the train has left.","火车离开发生在“我到达”之前，用过去完成时。","When I arrived, the train ___.","had left","时态"],
["现在进行时","表示此刻正在进行，be + doing。","Look! The children are playing football.","Look! The children play football.","考点：现在进行时。Look! 是“此刻正在发生”的信号，主语 the little boy 为单数，故用 is drawing；draws 表习惯、drew 表过去、has drawn 表完成，都与“此刻”冲突。","Look! The children ___ football.","are playing","时态"],
["一般将来时","will + 动词原形，will 后不接 to 或 -ing。","We will visit the museum tomorrow.","We will visiting the museum tomorrow.","will 后面必须接动词原形。","We ___ the museum tomorrow.","will visit","时态"],
["现在完成进行时","have/has been + doing，强调从过去持续到现在并可能继续。","He has been working here for ten years.","He has working here for ten years.","结构是 has been + 现在分词。","He ___ here for ten years.","has been working","时态"],
["被动语态","主语是动作承受者时用 be + 过去分词。","The bridge was built in 1990.","The bridge built in 1990.","桥是被建造的，要用被动语态。","The bridge ___ in 1990.","was built","语态与一致"],
["主谓一致","主语单数则谓语单数；each of + 复数名词作主语也用单数。","Each of the students has a dictionary.","Each of the students have a dictionary.","each of 作主语时谓语用单数。","Each of the students ___ a dictionary.","has","语态与一致"],
["定语从句：关系代词","who 指人，which 指物，that 可指人或物，作主语或宾语。","The man who lives next door is a doctor.","The man who live next door is a doctor.","who 指代单数的 the man，从句谓语用 lives。","The man ___ lives next door is a doctor.","who","从句"],
["定语从句：关系副词","where 指地点，when 指时间，在从句中作状语。","This is the house where I was born.","This is the house which I was born.","从句缺地点状语，用 where。","This is the house ___ I was born.","where","从句"],
["定语从句：whose","whose 表所属，后面紧跟名词。","I know a girl whose father is a pilot.","I know a girl who father is a pilot.","表示“她的父亲”，用 whose。","I know a girl ___ father is a pilot.","whose","从句"],
["非限制性定语从句","用逗号隔开只作补充说明，不能用 that。","My brother, who lives in Beijing, is an engineer.","My brother, that lives in Beijing, is an engineer.","非限制性定语从句不能用 that。","My brother, ___ lives in Beijing, is an engineer.","who","从句"],
["宾语从句：语序","宾语从句一律用陈述语序。","Could you tell me where the station is?","Could you tell me where is the station?","从句用陈述语序，不用疑问语序。","Could you tell me ___?","where the station is","从句"],
["宾语从句：时态","主句过去时从句用相应的过去时；客观真理仍用现在时。","He said that the earth goes around the sun.","He said that the earth went around the sun.","客观真理不受主句时态影响。","He said that the earth ___ around the sun.","goes","从句"],
["主语从句","what/that 引导的从句作主语，谓语用单数。","What he said is very important.","What he said are very important.","主语从句视为单数。","___ he said is very important.","What","从句"],
["同位语从句","说明 news、fact、idea 等抽象名词的内容，常用 that。","The news that our team won excited us.","The news which our team won excited us.","解释 news 的内容用 that。","The news ___ our team won excited us.","that","从句"],
["表语从句","系动词后用 that/whether/why 引导；the reason is that… 是固定搭配。","The reason is that he was ill.","The reason is because he was ill.","规范写法是 the reason is that…。","The reason is ___ he was ill.","that","从句"],
["时间状语从句","when、as soon as 等引导；主句将来时，从句用一般现在时。","As soon as he arrives, I will tell him.","As soon as he will arrive, I will tell him.","时间状语从句用一般现在时表将来。","As soon as he ___, I will tell him.","arrives","从句"],
["条件状语从句","if 引导真实条件句，同样主将从现。","If it rains tomorrow, we will stay at home.","If it will rain tomorrow, we will stay at home.","if 从句用一般现在时表将来。","If it ___ tomorrow, we will stay at home.","rains","从句"],
["让步状语从句","although/though 不与 but 同时使用。","Although it was raining, we went out.","Although it was raining, but we went out.","although 和 but 只能留一个。","___ it was raining, we went out.","Although","从句"],
["结果状语从句","so + 形容词 + that；such + a/an + 形容词 + 名词 + that。","It was such a hot day that we stayed indoors.","It was so a hot day that we stayed indoors.","名词前有 a/an 时用 such a hot day。","It was ___ a hot day that we stayed indoors.","such","从句"],
["不定式表目的","表示“为了……”，用 to do 或 in order to do。","He got up early to catch the first bus.","He got up early for catching the first bus.","表目的用不定式。","He got up early ___ the first bus.","to catch","非谓语"],
["动名词作主语","动词作主语要用 -ing 形式，谓语用单数。","Reading English aloud helps a lot.","Read English aloud helps a lot.","主语位置要用动名词。","___ English aloud helps a lot.","Reading","非谓语"],
["现在分词作状语","分词与主句主语是主动关系时用 -ing 形式。","Walking along the street, I met an old friend.","Walked along the street, I met an old friend.","我是主动“走”，用 walking。","___ along the street, I met an old friend.","Walking","非谓语"],
["过去分词作定语","名词与分词是被动关系时用过去分词。","The book written by him is popular.","The book writing by him is popular.","书是“被写”的，用过去分词。","The book ___ by him is popular.","written","非谓语"],
["独立主格结构","名词/代词 + 分词，逻辑主语与主句主语不同。","Weather permitting, we will go hiking.","Weather permits, we will go hiking.","独立主格用分词 permitting。","Weather ___, we will go hiking.","permitting","非谓语"],
["动名词作宾语","enjoy、finish、mind、practice 后接动名词。","She enjoys reading novels.","She enjoys to read novels.","enjoy 后面接动名词。","She enjoys ___ novels.","reading","非谓语"],
["虚拟语气：与现在相反","if 从句用过去式（be 用 were），主句 would + 动词原形。","If I were you, I would accept the offer.","If I am you, I would accept the offer.","与现在事实相反，从句用 were。","If I ___ you, I would accept the offer.","were","虚拟语气"],
["虚拟语气：与过去相反","if 从句用 had done，主句用 would have done。","If he had studied harder, he would have passed.","If he studied harder, he would have passed.","与过去事实相反，从句用 had studied。","If he ___ harder, he would have passed.","had studied","虚拟语气"],
["wish 后的从句","wish 表示与现在相反的愿望时，从句用过去式。","I wish I knew the answer.","I wish I know the answer.","wish 后的从句要用虚拟语气。","I wish I ___ the answer.","knew","虚拟语气"],
["虚拟语气：建议要求","suggest、demand、insist 后的从句用 (should) + 动词原形。","The doctor suggested that he (should) stop smoking.","The doctor suggested that he stops smoking.","这类动词后的从句用 (should) + 原形。","The doctor suggested that he ___ smoking.","(should) stop","虚拟语气"],
["情态动词表推测","肯定推测用 must be，否定推测用 can't be。","He must be at home — the light is on.","He mustn't be at home — the light is on.","否定推测用 can't be。","He ___ at home — the light is on.","must be","情态动词"],
["情态动词 + 原形","can、could、should 后直接接动词原形。","Could you help me with this box?","Can you helped me with this box?","情态动词后接动词原形。","Could you ___ me with this box?","help","情态动词"],
