["真题·完形","That encouragement helped me to get through the language ______.",["course","barrier","area","test"],1,"考点：名词固定搭配。依据：get through the language barrier 意为克服语言障碍，与上文“问路点餐都费劲”呼应，选 B。干扰项排除：course 课程、area 领域、test 测试，都不能构成“语言障碍”这一表达。","2024·新课标II卷"],
["真题·完形","After I made Italy my permanent home, I discovered how ______ Italians are.",["open-minded","strong-willed","warm-hearted","well-informed"],2,"考点：合成形容词辨析。依据：邻居送来现做的奶酪、下雨前来敲门提醒关车窗，体现待人热心，warm-hearted 意为热心的，选 C。干扰项排除：open-minded 思想开明、strong-willed 意志坚定、well-informed 见多识广，均与“待人热心”无关。","2024·新课标II卷"],
["真题·完形","Neighbors will bring me freshly made cheese and will come to my door to ______ me to close the window in my car when rain is coming.",["remind","allow","persuade","order"],0,"考点：动词搭配。依据：remind sb to do sth 意为提醒某人做某事，邻居来敲门提醒我关车窗，选 A。干扰项排除：allow 允许、persuade 说服、order 命令，都与“下雨前善意提醒”的语境不符。","2024·新课标II卷"],
["真题·完形","It's these small ______ of kindness that make a new country feel like home.",["tricks","promises","acts","duties"],2,"考点：名词辨析。依据：acts of kindness 意为善举，these small acts 指代上文送奶酪、提醒关窗等小事，选 C。干扰项排除：tricks 把戏、promises 承诺、duties 职责，都不能与 of kindness 搭配表示“善举”。","2024·新课标II卷"],
["真题·完形","As a foodie, the way to my heart is through my stomach, and nowhere fuels my ______ quite like Italy.",["ambition","success","appetite","growth"],2,"考点：名词辨析＋语义呼应。依据：foodie（美食家）、the way to my heart is through my stomach 都指向食欲，nowhere fuels my appetite quite like Italy 意为没有哪里比意大利更能勾起我的食欲，选 C。干扰项排除：ambition 抱负、success 成功、growth 增长都与“美食”无关。","2024·新课标II卷"],
["真题·完形","Each town has its own traditional ______, and every family keeps a recipe passed from one generation to another.",["costume","dish","symbol","tale"],1,"考点：名词辨析。依据：后文说每个家庭都保留着代代相传的 recipe（食谱），提示此处指传统菜肴，选 B。干扰项排除：costume 服装、symbol 象征、tale 故事，都不能由食谱传承，也不合“小镇特色饮食”的语境。","2024·新课标II卷"],
["真题·完形","Families ______ for big meals on Sundays, birthdays, and whatever other excuses they can come up with.",["gather","cheer","leave","wait"],0,"考点：动词辨析。依据：家人为周日、生日以及各种借口聚在一起吃大餐，gather for big meals 意为聚在一起吃饭，选 A。干扰项排除：cheer 欢呼、leave 离开、wait 等待，都不能表达“聚会用餐”这一含义。","2024·新课标II卷"],
["真题·完形","Families gather for big meals on Sundays, birthdays, and whatever other excuses they can ______.",["put up with","stand up for","come up with","make up for"],2,"考点：动词短语辨析。依据：whatever other excuses they can come up with 意为他们能想出的任何其他借口，选 C。干扰项排除：put up with 忍受、stand up for 支持维护、make up for 弥补，都不能与 excuses 搭配表示“想出”。","2024·新课标II卷"],
["真题·完形","These meals are always ______ by laughter and joy.",["signaled","confirmed","represented","accompanied"],3,"考点：动词辨析＋被动结构。依据：be accompanied by 意为伴随着，聚餐总伴有欢声笑语，与上文的欢乐气氛一致，选 D。干扰项排除：signaled 示意、confirmed 证实、represented 代表，都不能表示“伴随发生”。","2024·新课标II卷"],
["真题·完形","Whatever ______ life in Italy might have, the problems are forgotten once you sit down to a big meal with friends and family.",["disadvantages","meanings","surprises","opportunities"],0,"考点：名词辨析＋让步关系。依据：whatever disadvantages life in Italy might have 意为无论意大利的生活有什么不便，与后文 the problems 构成同义复现，选 A。干扰项排除：meanings 意义、surprises 惊喜、opportunities 机会，都与“问题、烦恼”不对应。","2024·新课标II卷"],
["真题·完形","Whatever disadvantages life in Italy might have, the problems are ______ once you sit down to a big meal with friends and family.",["created","forgotten","understood","identified"],1,"考点：动词辨析＋转折。依据：与亲友坐下吃顿大餐，烦恼便被抛诸脑后，forgotten 与前面的让步状语形成转折，选 B。干扰项排除：created 创造、understood 理解、identified 识别，都不符合“烦恼消失”的语境。","2024·新课标II卷"],
["真题·语法填空","Chinese cultural elements commemorating (纪念) Tang Xianzu, ______ is known as “the Shakespeare of Asia,” add an international character to Stratford-upon-Avon, William Shakespeare's hometown.",["who","which","that","whom"],0,"考点：非限制性定语从句。依据：先行词 Tang Xianzu 指人，从句缺主语，且先行词与从句间有逗号，故用 who。干扰项排除：which 只能指物；that 不引导非限制性定语从句；whom 只能作宾语。","2024·新课标II卷"],
["真题·语法填空","Although they could never have met, there are common ______ (theme) in their works, said Paul Edmondson, head of research for the Shakespeare Birthplace Trust.",["theme","themes","themed","theming"],1,"考点：名词复数。依据：there are 后须接复数名词，且指两位作家作品中的多个共同主题，故 theme 变为 themes。易错排除：单数 theme 与 are 不一致；themed、theming 是分词形式，不能作从句主语。","2024·新课标II卷"],
["真题·语法填空","Some of the things that Tang was writing about ______ (be) also Shakespeare's concerns.",["is","are","am","be"],1,"考点：时态与主谓一致。依据：主语 some of the things 为复数，且所述是四百多年前汤显祖所写内容，属过去事实，故填 were。（部分资料作 are，考场以官方答案 were 为准。）","2024·新课标II卷"],
["真题·语法填空","I happen to know that Tang's play The Peony Pavilion (牡丹亭) is similar in some ways ______ Romeo and Juliet.",["with","to","for","as"],1,"考点：介词固定搭配。依据：be similar to sb/sth 意为与……相似，是固定结构，故填 to，此处指《牡丹亭》与《罗密欧与朱丽叶》相似。易错排除：with、for、as 均不能与 be similar 构成该搭配。","2024·新课标II卷"],
["真题·语法填空","Two years later, a six-meter-tall pavilion, ______ (inspire) by The Peony Pavilion, was built at the Firs Garden, just ten minutes' walk from Shakespeare's birthplace.",["inspire","inspiring","inspired","to inspire"],2,"考点：非谓语动词（过去分词作定语）。依据：pavilion 与 inspire 是被动关系，即“受《牡丹亭》启发而建”，故用过去分词 inspired。干扰项排除：inspiring 表主动，to inspire 表目的或将来，均不合。","2024·新课标II卷"],
["真题·语法填空","Two years later, a six-meter-tall pavilion, inspired by The Peony Pavilion, ______ (build) at the Firs Garden, just ten minutes' walk from Shakespeare's birthplace.",["built","was built","has built","is building"],1,"考点：被动语态与一般过去时。依据：主语 a six-meter-tall pavilion 是 build 的承受者，时间状语 Two years later 指过去，故填 was built。易错排除：built 缺助动词，has built 表主动且与过去时间不符。","2024·新课标II卷"],
["真题·语法填空","Those cultural elements have increased Stratford's international ______ (visible), said Edmondson, adding that visitors walking through the Birthplace Garden were often amazed to find the connection between the two great writers.",["visible","visibility","visibly","vision"],1,"考点：词性转换（形容词变名词）。依据：形容词 international 后需名词，visible 的名词形式 visibility 意为知名度，故填 visibility。","2024·新课标II卷"],
["真题·语法填空","Those cultural elements have increased Stratford's international visibility, said Edmondson, adding that visitors walking through the Birthplace Garden were often amazed ______ (find) the connection between the two great writers.",["find","finding","to find","found"],2,"考点：固定搭配（不定式）。依据：be amazed to do sth 意为对做某事感到惊讶，故填 to find，表示游客惊讶地发现两位伟大作家之间的联系。易错排除：finding 不能用于该固定搭配，found 则与 be 动词叠加成被动，语义不通。","2024·新课标II卷"],
["真题·语法填空","______ (recall) watching a Chinese opera version of Shakespeare's play Richard II in Shanghai and meeting Chinese actors who came to Stratford a few years ago to perform parts of The Peony Pavilion, Edmondson said, “It was very exciting to hear the Chinese language and see how Tang's play was being performed.”",["Recall","Recalled","Recalling","To recall"],2,"考点：非谓语动词（现在分词作状语）。依据：句中已有谓语 said，recall 与主语 Edmondson 是主动关系，用现在分词 Recalling 作时间状语，且位于句首需大写。","2024·新课标II卷"],
["真题·语法填空","It was very exciting to hear the Chinese language ______ see how Tang's play was being performed.",["but","and","or","so"],1,"考点：并列连词。依据：hear the Chinese language 与 see how Tang's play was being performed 两个不定式并列作真正主语，用 and 连接，构成 it was exciting to do A and do B。易错排除：but 表转折、or 表选择，此处两个动作同为令人兴奋之事，语义并列。","2024·新课标II卷"],
["真题·完形","My husband and I had just sold our house and we were busy ______ the beloved home our family had spent 23 years filling up.",["painting over","looking around","emptying out","pulling down"],2,"考点：动词短语辨析。依据：房子已卖掉、即将搬进城里的公寓，正忙着把住了 23 年的家“清空”，empty out 意为清空，选 C。干扰项排除：paint over 重新刷漆、look around 环顾、pull down 拆除，都与搬家前的整理不符。","2025·全国一卷"],
["真题·完形","We had decided on key items for the ______ we were moving to in town, donated what we could, and rented a place to store our supposedly important objects.",["hotel","office","cottage","apartment"],3,"考点：名词辨析＋后文呼应。依据：全家要搬到城里的新居，末段 I sit in my apartment today 直接呼应，选 D。干扰项排除：hotel 旅馆、office 办公室、cottage 小屋，都不合家庭搬迁的语境。","2025·全国一卷"],
["真题·完形","We had decided on key items for the apartment we were moving to in town, donated what we could, and rented a place to ______ our supposedly important objects.",["store","display","sell","repair"],0,"考点：动词辨析。依据：租一处地方把“自认为重要的物品”存放起来，store 意为存放，选 A。干扰项排除：display 展示、sell 出售、repair 修理，都与“租房存货”的用途不符。","2025·全国一卷"],
["真题·完形","That left a house still ______ — with things that, while not particularly valuable, didn't belong in a landfill.",["covered","decorated","stuffed","equipped"],2,"考点：动词辨析（被动结构）。依据：清走必需品后，房子里仍“塞满”东西，be stuffed with 意为塞满，选 C。干扰项排除：covered 覆盖、decorated 装饰、equipped 配备，都不能表示“堆满杂物”。","2025·全国一卷"],
["真题·完形","That left a house still stuffed — with things that, while not particularly ______, didn't belong in a landfill.",["conventional","valuable","complicated","tolerable"],1,"考点：形容词辨析。依据：这些东西并不特别值钱，却也不该进垃圾场，与下文把价格降到 0 元呼应，选 B。干扰项排除：conventional 传统的、complicated 复杂的、tolerable 可忍受的，都不合“值不值钱”的语义。","2025·全国一卷"],
["真题·完形","A couple of messages came in, one wanting additional ______, another asking for a price cut.",["fees","photos","receipts","models"],1,"考点：名词辨析。依据：帖子里配的是花瓶照片，有人想多要几张照片看货，另一人还想砍价，选 B。干扰项排除：fees 费用、receipts 收据、models 模型，都不符合线上二手交易的情境。","2025·全国一卷"],
["真题·完形","As our ______ day drew near, I settled on a new price ($0) and reposted it.",["move","pay","market","work"],0,"考点：名词辨析。依据：搬家日越来越近，她才把价格改成 0 元重新发帖，move day 即搬家那天，选 A。干扰项排除：pay 付款、market 市场、work 工作，都不能与 day 搭配表示“搬家日”。","2025·全国一卷"],
["真题·完形","The ______: “I hate this vase. Maybe you won't.”",["warning","request","description","reply"],2,"考点：名词辨析。依据：她重发帖子时写下的说明“I hate this vase. Maybe you won't.”属于物品描述，选 C。干扰项排除：warning 警告、request 请求、reply 回复，都不是帖子正文的说明文字。","2025·全国一卷"],
["真题·完形","______, I posted more.",["Confused","Interested","Disappointed","Encouraged"],3,"考点：情感线索。依据：第一个花瓶顺利被人高兴地拿走，她受到鼓舞，于是发布更多帖子，选 D。干扰项排除：Confused 困惑、Interested 感兴趣、Disappointed 失望，都与继续发帖这一行为不符。","2025·全国一卷"],
["真题·完形","My daily posts and the ______ I received became a precious ray of light in the chaos of my house.",["visits","reports","advice","money"],0,"考点：名词辨析。依据：她一发文就有人上门取物，这些来访成了混乱日子里的“一束光”，选 A。干扰项排除：reports 报道、advice 建议、money 钱，因价格已为 0 元，均不合“上门取物”之意。","2025·全国一卷"],
["真题·完形","Each exchange provided a chance to ______ the landfill and to please another person I might not otherwise have encountered.",["remove","spare","find","check"],1,"考点：动词辨析。依据：每次交接都让垃圾场“少收一件”，spare 意为使免于，选 B。干扰项排除：remove 移除（对象是垃圾场本身）、find 找到、check 检查，都不合“让垃圾场少收”的意思。","2025·全国一卷"],
["真题·完形","Each exchange provided a chance to spare the landfill and to please another person I might not otherwise have ______.",["investigated","recognized","encountered","recommended"],2,"考点：动词辨析。依据：否则她根本不会遇到这些人，encounter 意为遇到、邂逅，选 C。干扰项排除：investigated 调查、recognized 认出、recommended 推荐，都与素不相识的受赠者不符。","2025·全国一卷"],
["真题·完形","I sit in my apartment today, loving each of the ______ that share our small space.",["giveaways","posts","contributions","belongings"],3,"考点：名词辨析。依据：如今陪她在小公寓里的，是留下来的每一件物品，belongings 意为所有物，选 D。干扰项排除：giveaways 赠品、posts 帖子、contributions 贡献，都不能指家里的物件。","2025·全国一卷"],
["真题·完形","I take ______ in knowing that, somewhere nearby, someone is appreciating something that couldn't come with us.",["joy","part","care","time"],0,"考点：固定搭配。依据：take joy in 意为以……为乐，想到旧物在别人手里便心生欢喜，选 A。干扰项排除：take part in 参加、take care 当心、take time 花时间，都不能与 in knowing 搭配表欣慰。","2025·全国一卷"],
["真题·完形","I take joy in knowing that, somewhere nearby, someone is ______ something that couldn't come with us.",["anticipating","appreciating","delivering","withdrawing"],1,"考点：动词辨析。依据：附近有人正在欣赏那些没能随她搬走的旧物，appreciating 意为欣赏、珍惜，选 B。干扰项排除：anticipating 期待、delivering 递送、withdrawing 撤回，均与旧物被珍惜的语境不符。","2025·全国一卷"],
["真题·语法填空","An exhibition at the Jiushi Art Museum in Shanghai is featuring artwork inspired by Go, or weiqi in Chinese, ______ originated in China more than 4,000 years ago.",["which","that","what","where"],0,"考点：非限制性定语从句。依据：先行词 Go（围棋）指物，从句缺主语，且先行词与从句间有逗号，故填 which。干扰项排除：that 不引导非限制性定语从句；what 前不能有先行词；where 只作地点状语。","2025·全国一卷"],
["真题·语法填空","Go is one of ______ earliest binary-based games.",["a","an","the","this"],2,"考点：冠词。依据：one of the + 形容词最高级 + 复数名词，earliest 为最高级，故填定冠词 the。易错排除：a、an 不能与最高级连用，this 为指示代词，与复数名词 games 及固定结构都不搭配。","2025·全国一卷"],
["真题·语法填空","We hope ______ (present) the rather abstract Go game and AI in a visual context, and initiate dialogues with minimalist art, conceptual art and expressionism.",["present","presenting","to present","presented"],2,"考点：非谓语动词。依据：hope 后接动词不定式，即 hope to do sth，故填 to present，与后面的 initiate 并列作 hope 的宾语。易错排除：presenting 不能作 hope 的宾语；presented 为过去分词，与句意“希望呈现”不符。","2025·全国一卷"],
["真题·语法填空","You try to lead the opponent into your trap and force them to follow your ______ (guide) till they lose.",["guide","guiding","guidance","guided"],2,"考点：词性转换。依据：形容词性物主代词 your 后需名词，guide 的名词形式 guidance 意为引导、指导，且为不可数名词，故填 guidance。易错排除：guide 指“向导”，指人的可数名词，与“跟随你的引导”不符。","2025·全国一卷"],
["真题·语法填空","The players' personalities ______ (reveal) during the game, and one's weaknesses are exposed to the opponent.",["reveal","reveals","are revealed","is revealed"],2,"考点：被动语态与主谓一致。依据：主语 personalities 为复数，与 reveal 是被动关系，陈述一般事实，故用一般现在时被动 are revealed。","2025·全国一卷"],
["真题·语法填空","A decent winner always ______ (try) to beat the opponent by no more than one or two points as a gesture of respect for the other side.",["try","tries","tried","is trying"],1,"考点：主谓一致与时态。依据：主语 a decent winner 为单数，always 表示习惯性动作，谓语须用第三人称单数 tries。易错排除：try 与单数主语不一致；tried 表过去，is trying 表进行，均与 always 所表的惯常行为不符。","2025·全国一卷"],
["真题·语法填空","A decent winner always tries (try) to beat the opponent ______ no more than one or two points as a gesture of respect for the other side.",["by","at","in","with"],0,"考点：介词搭配。依据：表示以多少分之差获胜用 beat sb by + 数量，故填 by，此处指只赢一两分以示尊重。易错排除：at、in、with 都不能与数量连用表示“领先的差距”。","2025·全国一卷"],
["真题·语法填空","Tu says that the balance between the black and white pieces, the beauty in the ______ (strategy) placement of the pieces, and the energy flow following each move inspired artists to create oil paintings, sculptures, digitally (digital) generated pictures and silk-screen prints for the exhibition.",["strategy","strategic","strategically","strategies"],1,"考点：词性转换。依据：修饰名词 placement 需形容词，strategy 的形容词为 strategic（或 strategical），故填 strategic。","2025·全国一卷"],
["真题·语法填空","Tu says that the balance between the black and white pieces, the beauty in the strategic (strategy) placement of the pieces, ______ the energy flow following each move inspired artists to create oil paintings, sculptures, digitally (digital) generated pictures and silk-screen prints for the exhibition.",["or","but","and","so"],2,"考点：并列连词。依据：balance、beauty、energy flow 三个并列主语，最后一项前用 and 连接，与前面的逗号构成并列结构。","2025·全国一卷"],
["真题·语法填空","Tu says that the balance between the black and white pieces, the beauty in the strategic (strategy) placement of the pieces, and the energy flow following each move inspired artists to create oil paintings, sculptures, ______ (digital) generated pictures and silk-screen prints for the exhibition.",["digital","digitally","digitalized","digits"],1,"考点：词性转换。依据：修饰过去分词 generated 需副词，digital 的副词形式为 digitally，故填 digitally。","2025·全国一卷"],
["真题·完形","She only started to ______ seven years ago after having a wake-up call.",["write","travel","exercise","recover"],2,"考点：动词辨析。下文 work out、weightlifting 与“七年前才开始”呼应，指她 65 岁才开始锻炼。write、travel、recover 与后文健身内容无关，recover 更与“开始”矛盾。","2025·全国二卷"],
["真题·完形","She only started to exercise seven years ago after having a ______ call.",["goodwill","timeout","long-distance","wake-up"],3,"考点：名词搭配。a wake-up call 指“警醒事件”，即健康危机让她醒悟。goodwill（善意）、timeout（暂停）、long-distance（长途）都不能与 call 搭配表此义。","2025·全国二卷"],
["真题·完形","She'd been struggling with eating disorders and health issues, which ______ led her to getting surgery.",["normally","ultimately","suddenly","automatically"],1,"考点：副词。饮食失调与健康问题“最终”导致她接受手术，表结果。normally（通常）、suddenly（突然）、automatically（自动地）都不合这一因果递进。","2025·全国二卷"],
["真题·完形","After that experience, she knew that she needed to make a ______.",["change","fortune","wish","deal"],0,"考点：名词。手术后她意识到必须“做出改变”，make a change 与下文 turn her life around 呼应。fortune、wish、deal 与 make a 搭配均不表“改变”。","2025·全国二卷"],
["真题·完形","Determined to turn her life around, Ms Donohue began to work out and follow a ______ lifestyle, before discovering a passion for weightlifting.",["risky","traditional","comfortable","healthy"],3,"考点：形容词。开始锻炼并遵循“健康”的生活方式，与 work out 并列。risky（冒险的）、traditional（传统的）、comfortable（舒适的）都与健身语境不符。","2025·全国二卷"],
["真题·完形","Determined to turn her life around, Ms Donohue began to work out and follow a healthy lifestyle, before discovering a ______ for weightlifting.",["demand","secret","passion","cure"],2,"考点：名词。discover a passion for weightlifting 意为“发现自己热爱举重”。demand（需求）、secret（秘密）、cure（疗法）与 discover...for 搭配均不表“热爱”。","2025·全国二卷"],
["真题·完形","Since setting out on the journey, the ______ lover has not only managed to grow an impressive set of muscles — but also a huge following on social media.",["peace","fitness","fun","nature"],1,"考点：名词作定语。她成了“健身”爱好者，与全文 workout、muscles 呼应。peace、fun、nature 都不能概括她以健身为身份标签这一点。","2025·全国二卷"],
["真题·完形","Since setting out on the journey, the fitness lover has not only managed to ______ an impressive set of muscles — but also a huge following on social media.",["grow","control","activate","relax"],0,"考点：动词。练出可观的肌肉用 grow muscles，取“增长”义。control（控制）、activate（激活）、relax（放松）与 muscles 搭配均不合语境。","2025·全国二卷"],
["真题·完形","The well-liked grandma regularly posts workout content, explaining there's no ______ others can't look this good.",["need","choice","reason","difference"],2,"考点：名词。there's no reason others can't look this good 意为“没有理由别人做不到”，用于鼓励他人。need、choice、difference 均不能构成该固定表达。","2025·全国二卷"],
["真题·完形","“Hold on; Consider failure as a ______ to success and never give up. Stick to your plan,” she said.",["green light","road block","passing mark","stepping stone"],3,"考点：名词短语。把失败看作通往成功的“垫脚石”，与 never give up 一致。green light（绿灯）、road block（路障）、passing mark（及格分）语义相反或无关。","2025·全国二卷"],
["真题·完形","“______ others; Lift others up on your journey.”",["Help","Consult","Follow","Forgive"],0,"考点：动词。分号后 Lift others up 是对前面的解释，故填 Help。Consult（咨询）、Follow（跟随）、Forgive（原谅）均不能与“托举他人”对应。","2025·全国二卷"],
["真题·完形","“Success is sweeter when ______.”",["accepted","shared","expected","celebrated"],1,"考点：动词过去分词。上文说帮助他人、托举他人，故“成功与人分享时更甜”。accepted、expected、celebrated 都不能体现“与他人共享”之意。","2025·全国二卷"],
["真题·完形","She previously explained that you do not need to have an amazing body to exercise... the ______ is to feel good, not look good.",["goal","case","duty","cost"],0,"考点：名词。锻炼的“目标”是感觉好而不是看起来好，与 feel good / look good 的对比呼应。case、duty、cost 均不能这样作主语表“目的”。","2025·全国二卷"],
["真题·完形","Ms Donohue used to be laughed at for being too old to work out, but she has proved the ______ wrong in the best possible way and has indeed become an inspiration for many social media users.",["instructors","admirers","beginners","doubters"],3,"考点：名词。她曾因“太老”被嘲笑，如今“证明怀疑者错了”，prove sb wrong。instructors、admirers、beginners 都与“被嘲笑”的语境不符。","2025·全国二卷"],
["真题·完形","Ms Donohue used to be laughed at for being too old to work out, but she has proved the doubters wrong in the best possible way and has indeed become an ______ for many social media users.",["authority","excuse","inspiration","option"],2,"考点：名词。她成为许多网友的“励志榜样”，an inspiration for sb。authority（权威）、excuse（借口）、option（选择）都不含“以身激励他人”之意。","2025·全国二卷"],
["真题·语法填空","Yet now, I live in the countryside of Zhejiang, China with my Chinese husband and his family, ______ bamboo and tea bushes grow wild in the mountains, chickens are always free-range, and central (center) heating doesn't exist.",["which","where","that","when"],1,"考点：定语从句。先行词是地点 the countryside，从句成分完整、缺地点状语，故用关系副词 where。which、that 须在从句作主宾，when 指时间，均排除。","2025·全国二卷"],
["真题·语法填空","Yet now, I live in the countryside of Zhejiang, China with my Chinese husband and his family, where bamboo and tea bushes grow wild in the mountains, chickens are always free-range, and ______ (center) heating doesn't exist.",["center","central","centered","centrally"],1,"考点：词性转换。central heating 是固定说法“集中供暖”，需形容词 central 修饰 heating。center 为名词或动词，centered、centrally 都不合该搭配。","2025·全国二卷"],
["真题·语法填空","Nothing in my life before prepared me ______ this one — and to be sure, the first time I came here I never imagined I would ever feel comfortable in this area.",["for","to","with","by"],0,"考点：介词。prepare sb for sth 意为“使某人为……做好准备”。to、with、by 都不能与 prepare sb 构成这一含义，故填 for。","2025·全国二卷"],
["真题·语法填空","But it's amazing how you can adapt ______ learn in a new environment.",["or","but","and","so"],2,"考点：连词。adapt 与 learn 是两个并列的动词原形，用 and 连接表并列。or 表选择、but 表转折、so 表结果，都与“适应并学习”的并列关系不符。","2025·全国二卷"],
["真题·语法填空","Over time, I've found ______ (I) feeling extremely at home here.",["me","myself","mine","my"],1,"考点：代词。find oneself doing 表示“发现自己处于某种状态”，主语为 I，故用反身代词 myself。me、mine、my 都不能构成该结构。","2025·全国二卷"],
["真题·语法填空","The “sunshine scent” of freshly sunned clothes ______ (be) one of them.",["is","are","was","be"],0,"考点：主谓一致与时态。主语中心词是 the sunshine scent（单数），全文用现在时，故填 is。are 与单数主语不一致，was 与全文时态不符。","2025·全国二卷"],
["真题·语法填空","Growing up, my family and our neighbors never used clotheslines to dry clothing, denying me the chance ______ (discover) one of the great wonders of sunshine — the sweet “sunshine scent” after sunning clothes for an entire day.",["discover","discovering","to discover","discovered"],2,"考点：非谓语动词。chance 后接不定式作定语，即 the chance to do sth。discovering、discovered 不能作 chance 的定语，discover 原形亦不成立。","2025·全国二卷"],
["真题·语法填空","The sun-dried clothes smell especially pleasant where I live, thanks to the ______ (absent) of smog and plenty of blue sky afternoons (afternoon) with lots of fresh air.",["absent","absence","absently","absences"],1,"考点：词性转换。the ... of 结构需名词，absent 的名词为不可数 absence，此处指“没有雾霾”。absently 是副词，absences 用复数不合不可数用法。","2025·全国二卷"],
["真题·语法填空","The sun-dried clothes smell especially pleasant where I live, thanks to the absence (absent) of smog and plenty of blue sky ______ (afternoon) with lots of fresh air.",["afternoon","afternoons","afternoon's","afternoons'"],1,"考点：名词的数。plenty of 后接可数名词复数，指“许多个晴朗的下午”，故用 afternoons。单数与 plenty of 不搭，afternoon's、afternoons' 所有格在此无对应中心词。","2025·全国二卷"],
["真题·语法填空","If you've never experienced the “sunshine scent” from a sheet or shirt ______ (leave) to sun for a day, well, you're missing out on one of life's wonders.",["leaving","left","to leave","leave"],1,"考点：非谓语动词。sheet or shirt 与 leave 是被动关系（被晾在阳光下），用过去分词 left 作后置定语。leaving 表主动，to leave 表目的，均不合被动含义。","2025·全国二卷"],
["真题·完形","The ______ of how little people knew about Ohio came quickly after I went to school in central Pennsylvania.",["fantasy","prejudice","realization","expectation"],2,"考点：名词。去宾州上学后“意识到”别人对俄亥俄了解之少，realization 表认识、领悟。fantasy（幻想）、prejudice（偏见）、expectation（期待）都与“came quickly”的醒悟不符。","2026·全国一卷"],
["真题·完形","Though I lived ______ three and a half hours away, most of my classmates thought of Ohio as a whole different world.",["only","indeed","still","even"],0,"考点：副词。though 表让步，强调两地“只不过”三个半小时车程，与“另一个世界”形成反差。indeed、still、even 都不能体现这种“仅此距离”的对比。","2026·全国一卷"],
["真题·完形","\"Do you have to fly home? Do you live on a farm?\" The ______ were never-ending.",["tests","questions","games","debates"],1,"考点：名词。前引“要坐飞机回家吗”“你住农场吗”都是同学的提问，故没完没了的是 questions。tests、games、debates 与引号里的内容不对应。","2026·全国一卷"],
["真题·完形","I was a ______ in their eyes.",["success","victim","novelty","problem"],2,"考点：名词。同学把俄亥俄当成另一个世界，故“我”在他们眼中是个新奇的存在，a novelty。success、victim、problem 都不含“新奇、少见”之意。","2026·全国一卷"],
["真题·完形","As I grow older, I'm more and more ______ for my small town roots.",["thankful","hopeful","suitable","reliable"],0,"考点：形容词。be thankful for 意为“对……心怀感激”，与下文 grateful 呼应。hopeful、suitable、reliable 与 for 搭配后都不合“感激小镇根脉”的语境。","2026·全国一卷"],
["真题·完形","Sure, my friends and I loved to ______ about how bored we were in the middle of nowhere.",["dream","lie","hear","complain"],3,"考点：动词。complain about 抱怨，与 how bored we were 的内容一致。dream、lie、hear 与 about 搭配都不能引出“无聊”这一内容。","2026·全国一卷"],
["真题·完形","Sure, my friends and I loved to complain about how bored we were in the middle of nowhere; ______, as I finish up my junior year of college, I'm convinced that it took leaving our small town to realize how much we actually loved it.",["therefore","however","instead","otherwise"],1,"考点：连接副词。前句说嫌小镇无聊，后句说其实很爱它，前后转折用 however。therefore 表结果、instead 表替代、otherwise 表否则，均不合这一对比。","2026·全国一卷"],
["真题·完形","I'm convinced that it took ______ our small town to realize how much we actually loved it and what exactly we loved about it.",["touring","changing","leaving","protecting"],2,"考点：动词辨析。it took doing sth 结构，且只有“离开”小镇后才更懂珍惜，与离家上大学一致。touring、changing、protecting 都不合“离家才懂珍惜”的逻辑。","2026·全国一卷"],
["真题·完形","The pace of life is slow and people ______ connecting to each other.",["value","admit","fear","remember"],0,"考点：动词。小镇节奏慢，人们“重视”彼此往来，value 作动词表珍视。admit（承认）、fear（害怕）、remember（记得）与 connecting to each other 搭配均不合语境。","2026·全国一卷"],
["真题·完形","You do more than just talk to your neighbors — in a lot of cases, they're truly an ______ of your family.",["advantage","example","honor","extension"],3,"考点：名词。an extension of your family 意为“家庭的延伸”，说明邻里亲如一家。advantage、example、honor 与 of your family 搭配都不表此义。","2026·全国一卷"],
["真题·完形","Much of this ______ centers around being outside and knowing the ins and outs of the town.",["lifestyle","landscape","procedure","personality"],0,"考点：名词。此处谈的是小镇的“生活方式”：节奏慢、爱交往、常在户外。landscape（风景）、procedure（程序）、personality（个性）都不能概括这些内容。","2026·全国一卷"],
["真题·完形","Being present and mindful of your ______ is a critical part of the culture.",["findings","surroundings","belongings","greetings"],1,"考点：名词。be mindful of your surroundings 意为留意周围环境，与“常在户外、熟悉小镇”相合。findings、belongings、greetings 与 mindful of 搭配均不合语境。","2026·全国一卷"],
["真题·完形","As I move through my college years, I ______ the visits to my little hometown.",["give up","put off","face up to","look forward to"],3,"考点：短语动词。上大学后“期待”回乡探望，与末段感激、珍视的情绪一致。give up、put off、face up to 与“珍视”的语意相反或无关。","2026·全国一卷"],
["真题·完形","I am grateful for the ______ that I had growing up.",["confidence","reputation","experience","opportunity"],2,"考点：名词。be grateful for the experience 指成长中获得的那段经历，与全文回忆呼应。confidence、reputation、opportunity 都不能概括“在小镇长大”这一段。","2026·全国一卷"],
["真题·完形","I know that wherever my next adventure takes me, I can ______ my small-town roots to lead me in the right direction.",["inspire","trust","remind","challenge"],1,"考点：动词。trust sth to do sth 意为“相信某物会做某事”，即相信小镇根脉会指引方向。inspire、remind、challenge 接 to lead 都不合“依靠根脉引导”之意。","2026·全国一卷"],
["真题·语法填空","It is also common for them ______ (hold) during traditional Chinese holidays such as the Spring Festival and the Mid-Autumn Festival, as well as other local festivals.",["to hold","to be held","holding","held"],1,"考点：非谓语与语态。be common for sb/sth to do 结构，且 them（大集）与 hold 是被动关系，故用不定式被动 to be held。to hold 表主动，holding、held 不能用于该结构。","2026·全国一卷"],
["真题·语法填空","The exact dates and ______ (frequent) of daji vary from region to region.",["frequent","frequency","frequently","frequencies"],1,"考点：词性转换。与 dates 并列作主语须用名词，表“频率”用不可数名词 frequency。frequent 是形容词，frequently 是副词，frequencies 用复数不合不可数用法。","2026·全国一卷"],
["真题·语法填空","Daji originated from the ancient folk custom of trading goods, which dates back to ______ Han Dynasty.",["a","the","one","this"],1,"考点：冠词。朝代名 Han Dynasty 前用定冠词，即 date back to the Han Dynasty。a、one、this 都不能用于朝代名前的特指。","2026·全国一卷"],
["真题·语法填空","As transportation and communication ______ (be) underdeveloped at that time, it was very difficult for households to obtain daily necessities.",["was","were","is","are"],1,"考点：时态与主谓一致。主语是 transportation and communication 两个并列名词，且 at that time 表过去，故用 were。was 与复数主语不一致，is、are 与过去时间矛盾。","2026·全国一卷"],
["真题·语法填空","As a solution, it was very difficult for households to obtain daily ______ (necessity).",["necessity","necessities","necessary","necessarily"],1,"考点：名词的数。daily necessities 是固定搭配“日常必需品”，须用复数。necessity 单数、necessary 形容词、necessarily 副词都不合该搭配。","2026·全国一卷"],
["真题·语法填空","As a solution, people gathered at specific locations on set days to trade their surplus items ______ what they needed.",["with","for","to","by"],1,"考点：介词。trade A for B 意为“用 A 换取 B”，符合以剩余物品换取所需之物的语境。with、to、by 都不能构成“换取”这一含义。","2026·全国一卷"],
["真题·语法填空","______ (draw) by the aroma of street food, they line up in front of stands that serve steaming dumplings and hot noodle soup.",["Drawing","Drawn","To draw","Draw"],1,"考点：非谓语动词。they 与 draw 是被动关系（被香味吸引），用过去分词 Drawn 作状语。Drawing 表主动，To draw 表目的，均不合逻辑。","2026·全国一卷"],
["真题·语法填空","They line up in front of stands ______ serve steaming dumplings and hot noodle soup.",["which","who","whose","where"],0,"考点：定语从句。先行词 stands 指物，从句缺主语，用关系代词 which。who 指人，whose 表所属，where 作地点状语，均不可。","2026·全国一卷"],
["真题·语法填空","Before ______ (head) home, they fill their shopping bags with fresh fruit and vegetables from local farmers.",["head","heading","headed","to head"],1,"考点：非谓语动词。before 在此为介词，后接动名词 heading home。head 原形、headed 过去分词、to head 不定式都不能作介词宾语。","2026·全国一卷"],
["真题·语法填空","..., at prices significantly ______ (cheap) than those found in supermarkets.",["cheap","cheaper","cheapest","cheaply"],1,"考点：比较级。句中有 than 表比较，形容词 cheap 须用比较级 cheaper。cheap 为原级、cheapest 为最高级、cheaply 为副词，都不合比较结构。","2026·全国一卷"],
["短文改错","I have went to the Great Wall twice. 句子里哪个词用错了？",["have","went","to","twice"],1,"考点是现在完成时的构成 have + 过去分词。went 是 go 的过去式，过去分词应为 gone；句中已有 have，说明要用完成时，所以错在 went。其余三项 have/to/twice 都不构成错误。","仿真·改错"],
["短文改错","She don't like coffee at all. 句子里哪个词用错了？",["She","don't","like","coffee"],1,"考点是主谓一致与否定助动词。主语 She 为第三人称单数，一般现在时的否定要用 doesn't，不能沿用 don't；likes/coffee 本身没问题。","仿真·改错"],
["短文改错","He is more taller than his brother. 句子里哪个词用错了？",["is","more","taller","than"],1,"考点是比较级的构成，属于双重比较错误。taller 已由 tall + -er 构成比较级，不能再加 more；than 引出比较对象，位置正确。","仿真·改错"],
["短文改错","The news are very exciting today. 句子里哪个词用错了？",["news","are","very","exciting"],1,"考点是不可数名词作主语时的主谓一致。news 虽以 -s 结尾但为不可数名词，谓语要用 is；are 与主语不一致，其余两项无错。","仿真·改错"],
["短文改错","I'm looking forward to see you again. 句子里哪个词用错了？",["looking","forward","to","see"],3,"考点是固定短语 look forward to 中的 to。此处 to 为介词，后接名词或动名词，故 see 应改为 seeing；looking/forward 构成短语，位置无误。","仿真·改错"],
["短文改错","There is many books on the desk. 句子里哪个词用错了？",["There","is","many","books"],1,"考点是 there be 句型的主语一致。真正主语是 many books（复数），be 动词要用 are；is 与复数主语不一致。","仿真·改错"],
["短文改错","He suggested that we went there by bus. 句子里哪个词用错了？",["suggested","that","went","by"],2,"考点是虚拟语气在 suggest 后的用法。suggest 表建议时，从句谓语用 (should) + 动词原形，故 went 应改为 go；that/by 无错。","仿真·改错"],
["短文改错","I have been here since three years. 句子里哪个词用错了？",["have","been","here","since"],3,"考点是 since 与 for 的区别。three years 是一段时间，前面用 for；since 后应接时间点（如 since 2020）。have/been 构成完成时，用法正确。","仿真·改错"],
["短文改错","Neither of them have finished the work. 句子里哪个词用错了？",["Neither","of","them","have"],3,"考点是 neither of + 复数名词作主语时的主谓一致。谓语用单数，故 have 应改为 has；Neither/of/them 本身无误。","仿真·改错"],
["短文改错","The reason why he was late was because he missed the bus. 句子里哪个词用错了？",["reason","why","late","because"],3,"考点是 the reason is that… 的固定结构。表语从句用 that 引导；because 会与 the reason 语义重复，属常见错误。","仿真·改错"],
["真题·阅读","How many camps does Pali Overnight Adventures offer this summer?",["2.","4.","17.","21."],2,"考点：细节理解。依据：首段写明这是所开设的 17 个夏令营中的 4 个。排除：A、B 把举例的 4 个当成总数，D 把 17 与 4 相加，都是误读数字关系。","2020·新高考II卷","Pali Overnight Adventures offers children and teens exciting experiences this summer. From broadcasting to street art, these are just 4 of the 17 highly unique camps being offered.\n\nBroadcasting Camp\n\nBecome the next star reporter, news writer, director or producer. While running every aspect of our own news station, kids and their fellow campers will create and host a broadcast airing each night at dinner for the entire camp. Every night it goes on the web, keeping parents and the world informed of the happenings at Pali.\n\nSecret Agent Camp\n\nIn the movie Mission Impossible, Tom Cruise made being a secret agent seem like the coolest job ever. Campers who sign up for the 2-week secret agent camp can get to know about the life of real secret agents by learning strategies and military skills on the paintball field.\n\nCulinary Camp\n\nIf your child enjoys being in the kitchen, then the culinary camp is definitely the right fit. Campers learn technical skills of roasting, frying and cutting, as well as some recipes that they can take home and share with their families.\n\nStreet Art Camp\n\nThis camp takes creative license to an entirely new level. Campers will share their colorful ideas and imagination with each other and work together to visualize, sketch and paint with non-traditional techniques to create the coolest mural (壁画) which will be displayed in public for all to see."],

["真题·阅读","What was the author's purpose in having the conversation with the students?",["To collect the water pistol.","To talk about her grandchildren.","To recommend some toys.","To explain her teaching method."],0,"考点：目的意图。依据：她先说请把水枪拿给我，再编出“奶奶的箱子”的说法，目的是把违禁物品收走。排除：B 谈孙辈只是借口，C 未推荐玩具，D 与教学法无关。","2020·新高考II卷","The end of the school year was in sight and spirits were high. I was back teaching after an absence of 15 years, dealing with the various kinds of “forbidden fruit” that come out of book bags. Now was the spring of the water pistol (手枪).\n\nI decided to think up a method of dealing with forbidden fruit.\n\n“Please bring that pistol to me,” I said. “I'm going to put it in my Grandma's Box.”\n\n“What's that?” they asked.\n\n“It's a large wooden chest full of toys for my grandchildren,” I replied.\n\n“You don't have grandchildren,” someone said.\n\n“I don't now,” I replied. “But someday I will. When I do, my box will be full of wonderful things for them.”\n\nMy imaginary Grandma's Box worked like magic that spring, and later. Sometimes students would ask me to describe all the things I had in it. Then I would try to remember the different possessions I supposedly had taken away — since I seldom actually kept them. Usually the offender would appear at the end of the day, and I would return the belonging.\n\nThe years went by, and my first grandchild Gordon was born. I shared my joy with that year's class. Then someone said, “Now you can use your Grandma's Box.” From then on, instead of coming to ask their possessions back, the students would say, “That's okay. Put it in your Grandma's Box for Gordon.”\n\nI loved talking about the imaginary box, not only with my students but also with my own children. They enjoyed hearing about all the forbidden fruit I had collected. Then one Christmas I received a surprise gift — a large, beautifully made wooden chest. My son Bruce had made my Grandma's Box a reality."],

["真题·阅读","What can we infer about the author?",["She enjoys telling jokes.","She is a strict and smart teacher.","She loves doing woodwork.","She is a responsible grandmother."],1,"考点：推理判断。依据：她用“奶奶的箱子”既收走违禁物品又不伤学生感情，还借机建立信任，可见是既严格又聪明的老师。排除：A 无讲笑话，C 做木箱的是她儿子，D 当时尚无孙辈。","2020·新高考II卷","The end of the school year was in sight and spirits were high. I was back teaching after an absence of 15 years, dealing with the various kinds of “forbidden fruit” that come out of book bags. Now was the spring of the water pistol (手枪).\n\nI decided to think up a method of dealing with forbidden fruit.\n\n“Please bring that pistol to me,” I said. “I'm going to put it in my Grandma's Box.”\n\n“What's that?” they asked.\n\n“It's a large wooden chest full of toys for my grandchildren,” I replied.\n\n“You don't have grandchildren,” someone said.\n\n“I don't now,” I replied. “But someday I will. When I do, my box will be full of wonderful things for them.”\n\nMy imaginary Grandma's Box worked like magic that spring, and later. Sometimes students would ask me to describe all the things I had in it. Then I would try to remember the different possessions I supposedly had taken away — since I seldom actually kept them. Usually the offender would appear at the end of the day, and I would return the belonging.\n\nThe years went by, and my first grandchild Gordon was born. I shared my joy with that year's class. Then someone said, “Now you can use your Grandma's Box.” From then on, instead of coming to ask their possessions back, the students would say, “That's okay. Put it in your Grandma's Box for Gordon.”\n\nI loved talking about the imaginary box, not only with my students but also with my own children. They enjoyed hearing about all the forbidden fruit I had collected. Then one Christmas I received a surprise gift — a large, beautifully made wooden chest. My son Bruce had made my Grandma's Box a reality."],
["真题·阅读","What happened to the Golden Gate Bridge on its 50th birthday?",["It carried more weight than it could.","It swayed violently in a strong wind.","Its roadway was damaged by vehicles.","Its access was blocked by many people."],0,"考点：细节理解。依据：首段写桥面在“历来被要求承载的最重负荷”下下陷。排除：B 晃动是随后出现的现象，C 路面被车辆损坏、D 通道被人群堵住均无依据。","2020·新高考II卷","In May 1987 the Golden Gate Bridge had a 50th birthday party. The bridge was closed to motor traffic so people could enjoy a walk across it. Organizers expected perhaps 50,000 people to show up. Instead, as many as 800,000 crowded the roads to the bridge. By the time 250,000 were on the bridge, engineers noticed something terrible: the roadway was flattening under what turned out to be the heaviest load it had ever been asked to carry. Worse, it was beginning to sway (晃动). The authorities closed access to the bridge and tens of thousands of people made their way back to land. A disaster was avoided.\n\nThe story is one of many stories in To Forgive Design: Understanding Failure, a book that is at once a love letter to engineering and a paean (赞歌) to its breakdowns. Its author, Dr. Henry Petroski, has long been writing about disasters. In this book, he includes the loss of the space shuttles (航天飞机) Challenger and Columbia, and the sinking of the Titanic.\n\nThough he acknowledges that engineering works can fail because the person who thought them up or engineered them simply got things wrong, in this book Dr. Petroski widens his view to consider the larger context in which such failures occur. Sometimes devices fail because a good design is constructed with low quality materials incompetently applied. Or perhaps a design works so well that it is adopted elsewhere again and again, with seemingly harmless improvements, until, suddenly, it does not work at all anymore.\n\nReaders will encounter not only stories they have heard before, but some new stories and a moving discussion of the responsibility of the engineer to the public and the ways young engineers can be helped to grasp them.\n\n“Success is success but that is all that it is,” Dr. Petroski writes. It is failure that brings improvement."],

["真题·阅读","What does the last paragraph suggest?",["Failure can lead to progress.","Success results in overconfidence.","Failure should be avoided.","Success comes from joint efforts."],0,"考点：段落主旨。依据：末段直陈“带来进步的恰恰是失败”。排除：B 文中未论成功导致自负，C 与作者宽恕失败的态度相反，D 谈合作属无中生有。","2020·新高考II卷","In May 1987 the Golden Gate Bridge had a 50th birthday party. The bridge was closed to motor traffic so people could enjoy a walk across it. Organizers expected perhaps 50,000 people to show up. Instead, as many as 800,000 crowded the roads to the bridge. By the time 250,000 were on the bridge, engineers noticed something terrible: the roadway was flattening under what turned out to be the heaviest load it had ever been asked to carry. Worse, it was beginning to sway (晃动). The authorities closed access to the bridge and tens of thousands of people made their way back to land. A disaster was avoided.\n\nThe story is one of many stories in To Forgive Design: Understanding Failure, a book that is at once a love letter to engineering and a paean (赞歌) to its breakdowns. Its author, Dr. Henry Petroski, has long been writing about disasters. In this book, he includes the loss of the space shuttles (航天飞机) Challenger and Columbia, and the sinking of the Titanic.\n\nThough he acknowledges that engineering works can fail because the person who thought them up or engineered them simply got things wrong, in this book Dr. Petroski widens his view to consider the larger context in which such failures occur. Sometimes devices fail because a good design is constructed with low quality materials incompetently applied. Or perhaps a design works so well that it is adopted elsewhere again and again, with seemingly harmless improvements, until, suddenly, it does not work at all anymore.\n\nReaders will encounter not only stories they have heard before, but some new stories and a moving discussion of the responsibility of the engineer to the public and the ways young engineers can be helped to grasp them.\n\n“Success is success but that is all that it is,” Dr. Petroski writes. It is failure that brings improvement."],
["真题·阅读","What is the text?",["A news report.","A short story.","A book review.","A research article."],2,"考点：体裁判断。依据：文章由金门大桥事件引出《宽恕设计》一书，随后评介其作者、内容与观点。排除：A 新闻只报事件，B 无虚构情节，D 无研究方法与数据。","2020·新高考II卷","In May 1987 the Golden Gate Bridge had a 50th birthday party. The bridge was closed to motor traffic so people could enjoy a walk across it. Organizers expected perhaps 50,000 people to show up. Instead, as many as 800,000 crowded the roads to the bridge. By the time 250,000 were on the bridge, engineers noticed something terrible: the roadway was flattening under what turned out to be the heaviest load it had ever been asked to carry. Worse, it was beginning to sway (晃动). The authorities closed access to the bridge and tens of thousands of people made their way back to land. A disaster was avoided.\n\nThe story is one of many stories in To Forgive Design: Understanding Failure, a book that is at once a love letter to engineering and a paean (赞歌) to its breakdowns. Its author, Dr. Henry Petroski, has long been writing about disasters. In this book, he includes the loss of the space shuttles (航天飞机) Challenger and Columbia, and the sinking of the Titanic.\n\nThough he acknowledges that engineering works can fail because the person who thought them up or engineered them simply got things wrong, in this book Dr. Petroski widens his view to consider the larger context in which such failures occur. Sometimes devices fail because a good design is constructed with low quality materials incompetently applied. Or perhaps a design works so well that it is adopted elsewhere again and again, with seemingly harmless improvements, until, suddenly, it does not work at all anymore.\n\nReaders will encounter not only stories they have heard before, but some new stories and a moving discussion of the responsibility of the engineer to the public and the ways young engineers can be helped to grasp them.\n\n“Success is success but that is all that it is,” Dr. Petroski writes. It is failure that brings improvement."],
["真题·阅读","What can we learn about rainforests from the first paragraph?",["They produce oxygen.","They cover a vast area.","They are well managed.","They are rich in wildlife."],3,"考点：细节理解。依据：首段说雨林是药用植物、食物、鸟类和动物的家园，又以蚂蚁和树种数量举例。排除：A 谈氧气在第二段，B 未提面积，C“管理良好”无据。","2020·新高考II卷","Rainforests are home to a rich variety of medicinal plants, food, birds and animals. Can you believe that a single bush (灌木丛) in the Amazon may have more species of ants than the whole of Britain? About 480 varieties of trees may be found in just one hectare of rainforest.\n\nRainforests are the lungs of the planet — storing vast quantities of carbon dioxide and producing a significant amount of the world's oxygen. Rainforests have their own perfect system for ensuring their own survival: the tall trees make a canopy (树冠层) of branches and leaves which protect themselves, smaller plants, and the forest animals from heavy rain, intense dry heat from the sun and strong winds.\n\nAmazingly, the trees grow in such a way that their leaves and branches, although close together, never actually touch those of another tree. Scientists think this is the plants' way to prevent the spread of any tree diseases and make life more difficult for leaf-eating insects like caterpillars. To survive in the forest, animals must climb, jump or fly across the gaps. The ground floor of the forest is not all tangled leaves and bushes, like in films, but is actually fairly clear. It is where dead leaves turn into food for the trees and other forest life.\n\nThey are not called rainforests for nothing! Rainforests can generate 75% of their own rain. At least 80 inches of rain a year is normal — and in some areas there may be as much as 430 inches of rain annually. This is real rain — your umbrella may protect you in a shower, but it won't keep you dry if there is a full rainstorm. In just two hours, streams can rise ten to twenty feet. The humidity (湿度) of large rainforests contributes to the formation of rainclouds that may travel to other countries in need of rain."],

["真题·阅读","Why do the leaves and branches of different trees avoid touching each other?",["For more sunlight.","For more growing space.","For self-protection.","For the detection of insects."],2,"考点：细节理解。依据：第三段说这是植物防止疾病传播、并让食叶昆虫更难生存的办法。排除：A 阳光、B 生长空间、D 探测昆虫在文中均未提及。","2020·新高考II卷","Rainforests are home to a rich variety of medicinal plants, food, birds and animals. Can you believe that a single bush (灌木丛) in the Amazon may have more species of ants than the whole of Britain? About 480 varieties of trees may be found in just one hectare of rainforest.\n\nRainforests are the lungs of the planet — storing vast quantities of carbon dioxide and producing a significant amount of the world's oxygen. Rainforests have their own perfect system for ensuring their own survival: the tall trees make a canopy (树冠层) of branches and leaves which protect themselves, smaller plants, and the forest animals from heavy rain, intense dry heat from the sun and strong winds.\n\nAmazingly, the trees grow in such a way that their leaves and branches, although close together, never actually touch those of another tree. Scientists think this is the plants' way to prevent the spread of any tree diseases and make life more difficult for leaf-eating insects like caterpillars. To survive in the forest, animals must climb, jump or fly across the gaps. The ground floor of the forest is not all tangled leaves and bushes, like in films, but is actually fairly clear. It is where dead leaves turn into food for the trees and other forest life.\n\nThey are not called rainforests for nothing! Rainforests can generate 75% of their own rain. At least 80 inches of rain a year is normal — and in some areas there may be as much as 430 inches of rain annually. This is real rain — your umbrella may protect you in a shower, but it won't keep you dry if there is a full rainstorm. In just two hours, streams can rise ten to twenty feet. The humidity (湿度) of large rainforests contributes to the formation of rainclouds that may travel to other countries in need of rain."],
["真题·阅读","What can be a suitable title for the text?",["Life-Giving Rainforests","The Law of the Jungle","Animals in the Amazon","Weather in Rainforests"],0,"考点：主旨标题。依据：全文讲雨林为地球供氧、自造降雨并养育无数生命。排除：B 谈弱肉强食，C 只涉动物，D 只涉气候，都不足以概括全文。","2020·新高考II卷","Rainforests are home to a rich variety of medicinal plants, food, birds and animals. Can you believe that a single bush (灌木丛) in the Amazon may have more species of ants than the whole of Britain? About 480 varieties of trees may be found in just one hectare of rainforest.\n\nRainforests are the lungs of the planet — storing vast quantities of carbon dioxide and producing a significant amount of the world's oxygen. Rainforests have their own perfect system for ensuring their own survival: the tall trees make a canopy (树冠层) of branches and leaves which protect themselves, smaller plants, and the forest animals from heavy rain, intense dry heat from the sun and strong winds.\n\nAmazingly, the trees grow in such a way that their leaves and branches, although close together, never actually touch those of another tree. Scientists think this is the plants' way to prevent the spread of any tree diseases and make life more difficult for leaf-eating insects like caterpillars. To survive in the forest, animals must climb, jump or fly across the gaps. The ground floor of the forest is not all tangled leaves and bushes, like in films, but is actually fairly clear. It is where dead leaves turn into food for the trees and other forest life.\n\nThey are not called rainforests for nothing! Rainforests can generate 75% of their own rain. At least 80 inches of rain a year is normal — and in some areas there may be as much as 430 inches of rain annually. This is real rain — your umbrella may protect you in a shower, but it won't keep you dry if there is a full rainstorm. In just two hours, streams can rise ten to twenty feet. The humidity (湿度) of large rainforests contributes to the formation of rainclouds that may travel to other countries in need of rain."],
["真题·七选五","第 36 空最合适的句子是？",["This will make getting answers easier.","Here are some tips for talking with your doctor.","You can talk to another doctor if the treatments don't work.","Before your doctor's visit, keep notes on how you are feeling.","Remember, your doctor and other caregivers are on your side.","Bring your medical history, including a list of your current medicines.","Writing down what the doctor says will help you remember important information."],1,"考点：段首总起。依据：空前劝人不要害怕说出困扰，空后是分条建议，B“以下是一些与医生交谈的建议”正好承上启下。排除：C 谈换医生、G 谈记录医嘱只涉局部，F 与病史段重复。","2020·新高考II卷","Talking with your doctor\n\nTalking freely with your doctor can make you feel better and give your doctor the information she or he needs to give you the best care. Don't be afraid or embarrassed to discuss something that is bothering you. (36)\n\n●Stay positive.\n\nGo to your doctor's office with a good attitude. (37) Think teamwork! Think positive!\n\n●Keep track of how you are feeling.\n\n(38) This will make it easier for you to answer questions about your symptoms (症状) and how medicines make you feel. It also makes it easier for you to bring up anything that you are worried about. Make sure to be honest about how you feel and how long you've felt that way.\n\n●(39)\n\nYour medical history is a list of your illnesses, treatments, what the doctors told you to do, and anything else you think your doctor should know. Also, if you are allergic (过敏) to any medicines, be sure to mention that to your doctor.\n\n●Ask questions.\n\nDo not be afraid to ask your doctor any questions you have. To remember all the questions you have when you are not in the doctor's office, write them down and bring the list with you to your appointment. (40) Remember — there's no such thing as a stupid question. If you don't understand the answer to a question, ask the doctor to explain it again until you do understand."],

["真题·阅读","How many people can each grand prize winner take on the free trip?",["Two.","Three.","Four.","Six."],0,"考点：细节理解。依据：奖项部分写明三名特等奖获得者各可带一位家长和一位自选同行者，故本人之外为 2 人。排除：B 误把获奖者本人计入可带人数，C、D 于文中无据。","2020·新高考I卷","POETRY CHALLENGE\n\nWrite a poem about how courage, determination, and strength have helped you face challenges in your life.\n\nPrizes\n\n3 Grand Prizes: Trip to Washington, D.C. for each of three winners, a parent and one other person of the winner's choice. Trip includes round-trip air tickets, hotel stay for two nights, and tours of the National Air and Space Museum and the office of National Geographic World.\n\n6 First Prizes: The book Sky Pioneer: A Photobiography of Amelia Earhart signed by author Corinne Szabo and pilot Linda Finch.\n\n50 Honorable Mentions: Judges will choose up to 50 honorable mention winners, who will each receive a T-shirt in memory of Earhart's final flight.\n\nRules\n\nFollow all rules carefully to prevent disqualification.\n\n■Write a poem using 100 words or fewer. Your poem can be any format, any number of lines.\n\n■Write by hand or type on a single sheet of paper. You may use both the front and back of the paper.\n\n■On the same sheet of paper, write or type your name, address, telephone number, and birth date.\n\n■Mail your entry to us by October 31 this year."],

["真题·阅读","What did Jennifer do after high school?",["She helped her dad with his work.","She ran the family farm on her own.","She supported herself through college.","She taught her sisters and brothers at home."],2,"考点：细节理解。依据：第二段写她高中毕业后就读当地技术学院，靠打工支付学费。排除：A 是父亲在农场外上班，B 是母亲带孩子经营农场，D 于文中无据。","2020·新高考I卷","Jennifer Mauer has needed more willpower than the typical college student to pursue her goal of earning a nursing degree. That willpower bore fruit when Jennifer graduated from University of Wisconsin-Eau Claire and became the first in her large family to earn a bachelor's degree.\n\nMauer, of Edgar, Wisconsin, grew up on a farm in a family of 10 children. Her dad worked at a job away from the farm, and her mother ran the farm with the kids. After high school, Jennifer attended a local technical college, working to pay her tuition (学费), because there was no extra money set aside for a college education. After graduation, she worked to help her sisters and brothers pay for their schooling.\n\nJennifer now is married and has three children of her own. She decided to go back to college to advance her career and to be able to better support her family while doing something she loves: nursing. She chose the UW-Eau Claire program at Ministry Saint Joseph's Hospital in Marshfield because she was able to pursue her four-year degree close to home. She could drive to class and be home in the evening to help with her kids.\n\nJennifer received great support from her family as she worked to earn her degree. Her husband worked two jobs to cover the bills, and her 68-year-old mother helped take care of the children at times.\n\nThrough it all, she remained in good academic standing and graduated with honors. Jennifer sacrificed (牺牲) to achieve her goal, giving up many nights with her kids and missing important events to study. “Some nights my heart was breaking to have to pick between my kids and studying for exams or papers,” she says. However, her children have learned an important lesson witnessing their mother earn her degree. Jennifer is a first-generation graduate and an inspiration to her family — and that's pretty powerful."],

["真题·阅读","What made Mr Bissell return to Uzbekistan?",["His friends' invitation.","His interest in the country.","His love for teaching.","His desire to regain health."],1,"考点：细节理解。依据：第一段写他几年后仍被这个国家吸引，于是重返乌兹别克斯坦写文章。排除：A 文中没有朋友邀请，C 这次并非去教书，D 健康只是他当年离开的原因。","2020·新高考I卷","In the mid-1990s, Tom Bissell taught English as a volunteer in Uzbekistan. He left after seven months, physically broken and having lost his mind. A few years later, still attracted to the country, he returned to Uzbekistan to write an article about the disappearance of the Aral Sea.\n\nHis visit, however, ended up involving a lot more than that. Hence this book, Chasing the Sea: Lost Among the Ghosts of Empire in Central Asia, which talks about a road trip from Tashkent to Karakalpakstan, where millions of lives have been destroyed by the slow drying up of the sea. It is the story of an American travelling to a strange land, and of the people he meets on his way: Rustam, his translator, a lovely 24-year-old who picked up his colorful English in California, Oleg and Natasha, his hosts in Tashkent, and a string of foreign aid workers.\n\nThis is a quick look at life in Uzbekistan, made of friendliness and warmth, but also its darker side of society. In Samarkand, Mr Bissell admires the architectural wonders, while on his way to Bukhara he gets a taste of police methods when suspected of drug dealing. In Ferghana, he attends a mountain funeral (葬礼) followed by a strange drinking party. And in Karakalpakstan, he is saddened by the dust storms, diseases and fishing boats stuck miles from the sea.\n\nMr Bissell skillfully organizes historical insights and cultural references, making his tale a well-rounded picture of Uzbekistan, seen from Western eyes. His judgment and references are decidedly American, as well as his delicate stomach. As the author explains, this is neither a travel nor a history book, or even a piece of reportage. Whatever it is, the result is a fine and vivid description of the purest of Central Asian traditions."],

 Asian traditions."],
["真题·阅读","What is the recent study mainly about?",["Food safety.","Movie viewership.","Consumer demand.","Eating behavior."],3,"考点：主旨要义。依据：首段点明同伴的体型与进食习惯会影响我们的进食量，两项实验也都在测进食量。排除：A、B 只是实验的幌子，C 范围过大。","2020·新高考I卷","According to a recent study in the Journal of Consumer Research, both the size and consumption habits of our eating companions can influence our food intake. And contrary to existing research that says you should avoid eating with heavier people who order large portions (份), it's the beanpoles with big appetites you really need to avoid.\n\nTo test the effect of social influence on eating habits, the researchers conducted two experiments. In the first, 95 undergraduate women were individually invited into a lab to ostensibly (表面上) participate in a study about movie viewership. Before the film began, each woman was asked to help herself to a snack. An actor hired by the researchers grabbed her food first. In her natural state, the actor weighed 105 pounds. But in half the cases she wore a specially designed fat suit which increased her weight to 180 pounds.\n\nBoth the fat and thin versions of the actor took a large amount of food. The participants followed suit, taking more food than they normally would have. However, they took significantly more when the actor was thin.\n\nFor the second test, in one case the thin actor took two pieces of candy from the snack bowls. In the other case, she took 30 pieces. The results were similar to the first test: the participants followed suit but took significantly more candy when the thin actor took 30 pieces.\n\nThe tests show that the social environment is extremely influential when we're making decisions. If this fellow participant is going to eat more, so will I. Call it the “I'll have what she's having” effect. However, we'll adjust the influence. If an overweight person is having a large portion, I'll hold back a bit because I see the results of his eating habits. But if a thin person eats a lot, I'll follow suit. If he can eat much and keep slim, why can't I?"],
["真题·阅读","What does the underlined word “beanpoles” in paragraph 1 refer to?",["Big eaters.","Overweight persons.","Picky eaters.","Tall thin persons."],3,"考点：词义猜测。依据：首段把 beanpoles 与较胖的人对照，末段又说瘦人吃得多却能保持苗条，可见指又高又瘦的人。排除：A 漏掉“瘦”，B 是文中对照的另一类，C 无中生有。","2020·新高考I卷","According to a recent study in the Journal of Consumer Research, both the size and consumption habits of our eating companions can influence our food intake. And contrary to existing research that says you should avoid eating with heavier people who order large portions (份), it's the beanpoles with big appetites you really need to avoid.\n\nTo test the effect of social influence on eating habits, the researchers conducted two experiments. In the first, 95 undergraduate women were individually invited into a lab to ostensibly (表面上) participate in a study about movie viewership. Before the film began, each woman was asked to help herself to a snack. An actor hired by the researchers grabbed her food first. In her natural state, the actor weighed 105 pounds. But in half the cases she wore a specially designed fat suit which increased her weight to 180 pounds.\n\nBoth the fat and thin versions of the actor took a large amount of food. The participants followed suit, taking more food than they normally would have. However, they took significantly more when the actor was thin.\n\nFor the second test, in one case the thin actor took two pieces of candy from the snack bowls. In the other case, she took 30 pieces. The results were similar to the first test: the participants followed suit but took significantly more candy when the thin actor took 30 pieces.\n\nThe tests show that the social environment is extremely influential when we're making decisions. If this fellow participant is going to eat more, so will I. Call it the “I'll have what she's having” effect. However, we'll adjust the influence. If an overweight person is having a large portion, I'll hold back a bit because I see the results of his eating habits. But if a thin person eats a lot, I'll follow suit. If he can eat much and keep slim, why can't I?"],
["真题·阅读","Why did the researchers hire the actor?",["To see how she would affect the participants.","To test if the participants could recognize her.","To find out what she would do in the two tests.","To study why she could keep her weight down."],0,"考点：推理判断。依据：研究者请演员先取食物，并让她以 105 磅本人和穿增肥装 180 磅两种形象出现，是为观察她对参与者进食量的影响。排除：B、C、D 都不是实验目的。","2020·新高考I卷","According to a recent study in the Journal of Consumer Research, both the size and consumption habits of our eating companions can influence our food intake. And contrary to existing research that says you should avoid eating with heavier people who order large portions (份), it's the beanpoles with big appetites you really need to avoid.\n\nTo test the effect of social influence on eating habits, the researchers conducted two experiments. In the first, 95 undergraduate women were individually invited into a lab to ostensibly (表面上) participate in a study about movie viewership. Before the film began, each woman was asked to help herself to a snack. An actor hired by the researchers grabbed her food first. In her natural state, the actor weighed 105 pounds. But in half the cases she wore a specially designed fat suit which increased her weight to 180 pounds.\n\nBoth the fat and thin versions of the actor took a large amount of food. The participants followed suit, taking more food than they normally would have. However, they took significantly more when the actor was thin.\n\nFor the second test, in one case the thin actor took two pieces of candy from the snack bowls. In the other case, she took 30 pieces. The results were similar to the first test: the participants followed suit but took significantly more candy when the thin actor took 30 pieces.\n\nThe tests show that the social environment is extremely influential when we're making decisions. If this fellow participant is going to eat more, so will I. Call it the “I'll have what she's having” effect. However, we'll adjust the influence. If an overweight person is having a large portion, I'll hold back a bit because I see the results of his eating habits. But if a thin person eats a lot, I'll follow suit. If he can eat much and keep slim, why can't I?"],
["真题·阅读","On what basis do we “adjust the influence” according to the last paragraph?",["How hungry we are.","How slim we want to be.","How we perceive others.","How we feel about the food."],2,"考点：推理判断。依据：末段说见胖人吃得多就克制一点，见瘦人吃得多就跟着多吃，依据是对他人身材与食量的判断。排除：A 饥饿、B 想变瘦、D 对食物的感觉，都不是依据。","2020·新高考I卷","According to a recent study in the Journal of Consumer Research, both the size and consumption habits of our eating companions can influence our food intake. And contrary to existing research that says you should avoid eating with heavier people who order large portions (份), it's the beanpoles with big appetites you really need to avoid.\n\nTo test the effect of social influence on eating habits, the researchers conducted two experiments. In the first, 95 undergraduate women were individually invited into a lab to ostensibly (表面上) participate in a study about movie viewership. Before the film began, each woman was asked to help herself to a snack. An actor hired by the researchers grabbed her food first. In her natural state, the actor weighed 105 pounds. But in half the cases she wore a specially designed fat suit which increased her weight to 180 pounds.\n\nBoth the fat and thin versions of the actor took a large amount of food. The participants followed suit, taking more food than they normally would have. However, they took significantly more when the actor was thin.\n\nFor the second test, in one case the thin actor took two pieces of candy from the snack bowls. In the other case, she took 30 pieces. The results were similar to the first test: the participants followed suit but took significantly more candy when the thin actor took 30 pieces.\n\nThe tests show that the social environment is extremely influential when we're making decisions. If this fellow participant is going to eat more, so will I. Call it the “I'll have what she's having” effect. However, we'll adjust the influence. If an overweight person is having a large portion, I'll hold back a bit because I see the results of his eating habits. But if a thin person eats a lot, I'll follow suit. If he can eat much and keep slim, why can't I?"],
["真题·七选五","第 16 空最合适的句子是？",["Do the opposite.","You want to be an effective public speaker.","You don't need to apologize for a minor slip.","When it comes to public speaking, less is usually more.","The objective of most speeches is to benefit the audience.","Take the fear out of public speaking by focusing on your listeners.","However, the majority of people are effective speakers because they train to be."],6,"考点：段首衔接。依据：空前说有些人生来就有演讲天赋，空后问“你想成为优秀演讲者吗”，G 用转折补出“多数人靠训练”，与天生形成对照。排除：B 与空后问句重复，F 谈听众，位置不合。","2020·新高考I卷","Some individuals are born with a gift for public speaking. (16) Do you want to be a good public speaker? Here are some principles you must master.\n\nPeople want to listen to someone who is interesting, relaxed and comfortable. Too often, when you stand up to give a speech, you focus on the “public” at the expense of the “speaking.” (17) Focus on the speaking. Talk directly to your audience, be yourself and make a connection.\n\nEven the most successful public speaker will make mistakes. Yet, the only one who cares about any mistake is the one who is speaking. People's attention wanders constantly. In fact, most people only absorb about 20 percent of a speaker's message. So, don't stop speaking when you make a mistake unless it's a truly serious one. (18)\n\nYour goal is not to be a perfect public speaker. (19) And like everything else in life, that takes practice. Remember, even world champion athletes practice their skills on a consistent basis.\n\n(20) It's rare to hear someone say, “I wish that speaker had spoken longer.” On the other hand, you probably can't count the times that you've thought, “I'm glad that talk is over. It seemed to go on forever!” So surprise your audience. Always make your presentation just a bit shorter than anticipated. It's better to leave your listeners wishing for more than shifting restlessly in their seats waiting for your speech finally to end."],

["真题·阅读","What should you do if you want to attend the taster session of Jodie's fitness classes?",["Join a fitness club.","Pay a registration fee.","Make a booking.","Hire a personal trainer."],2,"考点：细节理解。Jodie 一段说体验课只有 8 个名额，且“Advance bookings are required”，明确要求提前预订，C 对。B 与“free taster session”的免费相矛盾，A、D 是长期健身的做法，与参加体验课无关。","2021·新高考II卷","Things to Do in Yorkshire This Summer\n\nHarrogate Music Festival\n\nSince its birth, Harrogate Music Festival has gone from strength to strength. This year, we are celebrating our 50th anniversary. We begin on 1st June with Manchester Camerata and Nicola Benedetti, presenting an amazing programme of Mozart pieces.\n\nDates: 1 June — 31 July\nTickets: £12 — £96\n\nJodie's Fitness Summer Classes\n\nAs the summer months roll in, our Georgian country estate makes the perfect setting for an outdoor fitness session. Come and work out with our qualified personal trainer, Jodie McGregor, on the grounds of the Middleton Lodge estate.\n\nWe will be holding a free taster session on 23rd May, at 10 am, to demonstrate the variety of effective and active exercises. There are eight spaces available for the taster session. Advance bookings are required (info@middletonlodge.co.uk).\n\nDates: 23 May — 11 July\nTickets: £7.50 per session\n\nFelt Picture Making\n\nWorking from an inspirational picture, this workshop at Helmsley Arts Centre will teach you the techniques you will need to recreate your picture in wool.\n\nWe will also discuss the origins of felt, what enables wool fibres to become felt and how the processes we use work.\n\nDates: 12 June — 12 July\nTickets: £40 including materials\n\nFigure It Out! — Playing with Math\n\nA new exhibition in Halifax uses everyday activities to explain the hidden math principles we all use on a regular basis. Pack a bag, cut a cake, guess which juice container holds the most liquid, and much more. Discover how architects, product designers and scientists use similar skills in their work.\n\nDates: 7 May — 10 June\nTickets: Free"],
