["真题·阅读","What do some of Farber's coworkers think of him?",["He's odd.","He's strict.","He's brave.","He's rude."],0,"考查观点态度。首段 even some of his coworkers occasionally laugh at his unusual methods 说明同事觉得他的方法不寻常，即认为他古怪，A 正确；strict、brave、rude 在文中均无依据，属无中生有。","2024·新课标I卷","\"I am not crazy,\" says Dr. William Farber, shortly after performing acupuncture (针刺疗法) on a rabbit. \"I am ahead of my time.\" If he seems a little defensive, it might be because even some of his coworkers occasionally laugh at his unusual methods. But Farber is certain he'll have the last laugh. He's one of a small but growing number of American veterinarians (兽医) now practicing \"holistic\" medicine — combining traditional Western treatments with acupuncture, chiropractic (按摩疗法) and herbal medicine.\n\nFarber, a graduate of Colorado State University, started out as a more conventional veterinarian. He became interested in alternative treatments 20 years ago when he suffered from terrible back pain. He tried muscle-relaxing drugs but found little relief. Then he tried acupuncture, an ancient Chinese practice, and was amazed that he improved after two or three treatments. What worked on a veterinarian seemed likely to work on his patients. So, after studying the techniques for a couple of years, he began offering them to pets.\n\nLeigh Tindale's dog Charlie had a serious heart condition. After Charlie had a heart attack, Tindale says, she was prepared to put him to sleep, but Farber's treatments eased her dog's suffering so much that she was able to keep him alive for an additional five months. And Priscilla Dewing reports that her horse, Nappy, \"moves more easily and rides more comfortably\" after a chiropractic adjustment.\n\nFarber is certain that the holistic approach will grow more popular with time, and if the past is any indication, he may be right: Since 1982, membership in the American Holistic Veterinary Medical Association has grown from 30 to over 700. \"Sometimes it surprises me that it works so well,\" he says. \"I will do anything to help an animal. That's my job.\""],

["真题·阅读","What does the underlined phrase \"shine through\" in paragraph 2 mean?",["Seem unlikely to last.","Seem hard to explain.","Become ready to use.","Become easy to notice."],3,"考查词义猜测。该句说任务升级为需要抽象思维时，纸质阅读的优势 particularly shine through，即优势格外明显地显现出来，D 正确；A、B 含否定意味，C 与“优势显现”无关。","2024·新课标I卷","Is comprehension the same whether a person reads a text onscreen or on paper? And are listening to and viewing content as effective as reading the written word when covering the same material? The answers to both questions are often \"no.\" The reasons relate to a variety of factors, including reduced concentration, an entertainment mindset (心态) and a tendency to multitask while consuming digital content.\n\nWhen reading texts of several hundred words or more, learning is generally more successful when it's on paper than onscreen. A large amount of research confirms this finding. The benefits of print reading particularly shine through when experimenters move from posing simple tasks — like identifying the main idea in a reading passage — to ones that require mental abstraction — such as drawing inferences from a text.\n\nThe differences between print and digital reading results are partly related to paper's physical properties. With paper, there is a literal laying on of hands, along with the visual geography of distinct pages. People often link their memory of what they've read to how far into the book it was or where it was on the page.\n\nBut equally important is the mental aspect. Reading researchers have proposed a theory called \"shallowing hypothesis (浅化假说).\" According to this theory, people approach digital texts with a mindset suited to social media, which are often not so serious, and devote less mental effort than when they are reading print.\n\nAudio (音频) and video can feel more engaging than text, and so university teachers increasingly turn to these technologies — say, assigning an online talk instead of an article by the same person. However, psychologists have demonstrated that when adults read news stories, they remember more of the content than if they listen to or view identical pieces.\n\nDigital texts, audio and video all have educational roles, especially when providing resources not available in print. However, for maximizing learning where mental focus and reflection are called for, educators shouldn't assume all media are the same, even when they contain identical words."],

["真题·阅读","What does the author imply in the last paragraph?",["Students should apply multiple learning techniques.","Teachers should produce their own teaching material.","Print texts cannot be entirely replaced in education.","Education outside the classroom cannot be ignored."],2,"考查推理判断。末段强调需要专注与思考时 educators shouldn't assume all media are the same，言下之意纸质阅读仍有不可替代之处，C 正确；A、B、D 都超出末段的论述范围。","2024·新课标I卷","Is comprehension the same whether a person reads a text onscreen or on paper? And are listening to and viewing content as effective as reading the written word when covering the same material? The answers to both questions are often \"no.\" The reasons relate to a variety of factors, including reduced concentration, an entertainment mindset (心态) and a tendency to multitask while consuming digital content.\n\nWhen reading texts of several hundred words or more, learning is generally more successful when it's on paper than onscreen. A large amount of research confirms this finding. The benefits of print reading particularly shine through when experimenters move from posing simple tasks — like identifying the main idea in a reading passage — to ones that require mental abstraction — such as drawing inferences from a text.\n\nThe differences between print and digital reading results are partly related to paper's physical properties. With paper, there is a literal laying on of hands, along with the visual geography of distinct pages. People often link their memory of what they've read to how far into the book it was or where it was on the page.\n\nBut equally important is the mental aspect. Reading researchers have proposed a theory called \"shallowing hypothesis (浅化假说).\" According to this theory, people approach digital texts with a mindset suited to social media, which are often not so serious, and devote less mental effort than when they are reading print.\n\nAudio (音频) and video can feel more engaging than text, and so university teachers increasingly turn to these technologies — say, assigning an online talk instead of an article by the same person. However, psychologists have demonstrated that when adults read news stories, they remember more of the content than if they listen to or view identical pieces.\n\nDigital texts, audio and video all have educational roles, especially when providing resources not available in print. However, for maximizing learning where mental focus and reflection are called for, educators shouldn't assume all media are the same, even when they contain identical words."],
["真题·阅读","What do we know about the records of species collected now?",["They are becoming outdated.","They are mostly in electronic form.","They are limited in number.","They are used for public exhibition."],1,"考查细节理解。首段 most records of biodiversity are often in the form of photos, videos, and other digital records，即多为电子形式，B 正确；文中说已收集数十亿条，排除 C；A、D 在文中没有依据。","2024·新课标I卷","In the race to document the species on Earth before they go extinct, researchers and citizen scientists have collected billions of records. Today, most records of biodiversity are often in the form of photos, videos, and other digital records. Though they are useful for detecting shifts in the number and variety of species in an area, a new Stanford study has found that this type of record is not perfect.\n\n\"With the rise of technology it is easy for people to make observations of different species with the aid of a mobile application,\" said Barnabas Daru, who is lead author of the study and assistant professor of biology in the Stanford School of Humanities and Sciences. \"These observations now outnumber the primary data that comes from physical specimens (标本), and since we are increasingly using observational data to investigate how species are responding to global change, I wanted to know: Are they usable?\"\n\nUsing a global dataset of 1.9 billion records of plants, insects, birds, and animals, Daru and his team tested how well these data represent actual global biodiversity patterns.\n\n\"We were particularly interested in exploring the aspects of sampling that tend to bias (使有偏差) data, like the greater likelihood of a citizen scientist to take a picture of a flowering plant instead of the grass right next to it,\" said Daru.\n\nTheir study revealed that the large number of observation-only records did not lead to better global coverage. Moreover, these data are biased and favor certain regions, time periods, and species. This makes sense because the people who get observational biodiversity data on mobile devices are often citizen scientists recording their encounters with species in areas nearby. These data are also biased toward certain species with attractive or eye-catching features.\n\nWhat can we do with the imperfect datasets of biodiversity?\n\n\"Quite a lot,\" Daru explained. \"Biodiversity apps can use our study results to inform users of oversampled areas and lead them to places — and even species — that are not well-sampled. To improve the quality of observational data, biodiversity apps can also encourage users to have an expert confirm the identification of their uploaded image.\""],

["真题·七选五","第 36 空最合适的句子是？",["I don't often use this dictionary.","It takes no account of the context.","But I still don't want to replace them.","But a dictionary can be a pleasure to read.","Of course, a dictionary is not only for spelling.","That means good grammar and no spelling mistakes.","Dictionaries don't always give you enough information."],5,"考查上下文衔接。空前说投稿须交完美、排版专业的原稿，空后警告编辑不容忍拼写错误，F“那意味着语法正确、没有拼写错误”正好解释“完美”的含义；E、G 谈词典用途，与此处话题不一致。","2024·新课标I卷","Not all great writers are great spellers. If you want to be published, it's vital to submit a perfect, professionally presented manuscript (原稿). (36) No editor is likely to tolerate a writer who does not take the trouble to spell words correctly.\n\nI keep two reference books close-by on my desk: dictionary and thesaurus (同义词词典). I don't trust my laptop's spellchecker. (37) Of course, these days there are plenty of online dictionaries and thesauruses, but I'm old-fashioned enough to prefer a hard cover and pages I can leaf through with my fingers. I use the Concise Oxford Dictionary and the Collins Thesaurus.\n\n(38) It should give you a precise definition of each word, thus differentiating it from other words whose meanings are similar, but not identical. It will also usually show how the word is pronounced.\n\nIn addition, I have an old two-volume copy of the Shorter Oxford Dictionary, picked up a few years ago in a bookshop sale for just 99 pence. Of course, with its 2,672 pages, it's not exactly short. It contains around 163,000 words, plus word combinations and idiomatic phrases. (39) However, if I need to check the origin of a word or to look up examples of its usage, there's nothing better.\n\nFor well over a hundred years the most influential English dictionary was Samuel Johnson's Dictionary of the English Language published in 1755. \"To make dictionaries is dull (乏味的) work,\" wrote Johnson, illustrating one definition of \"dull\". (40) A few minutes spent casting your eye over a page or two can be a rewarding experience."],

["真题·阅读","Where can you find an original copy of the Magna Carta?",["In the Ludlow Castle.","In the Foodie Center of England.","In the Hereford Cathedral.","In the Black and White House Museum."],2,"考点：细节定位。依据：赫里福德一节说大教堂内有一座古老图书馆，《大宪章》四份原件之一陈列于此。A、B 分属拉德洛城堡与“美食中心”，D 是博物馆，均未提原件，排除。","2025·全国二卷","English Market Towns to Visit in the UK\n\nEnglish market towns come in many shapes and sizes. Each has a personality shaped by the goods and services produced and traded for centuries. But each town has more to do than shop.\n\nHereford, Herefordshire\nHereford has remained a lively market town since 1189. Skirting the town square, you'll find lovely shops, eateries, and the Black and White House Museum. The Hereford Cathedral is the most impressive building in town. It's also home to an ancient library. One of the four original copies of the Magna Carta is displayed there.\n\nLudlow, Shropshire\nLudlow is known as the Foodie Center of England. Butcher shops, greengrocers, bakeries, and cheese shops line the town square. Bordering the square, the Ludlow Castle is a \"must explore\" medieval stronghold. The three-day Ludlow Food Festival is held each September.\n\nShrewsbury, Shropshire\nGetting to Shrewsbury Town Center from London is challenging but worth the anxiety. The River Severn has a significant turn through town, almost making an island of Shrewsbury Town Center. The shape creates a perfect market where goods could be shipped and received using the river as a highway. Flowers are everywhere — hanging baskets, window boxes, and planters — just what you imagine in an attractive English market town.\n\nMevagissey, Cornwall\nEven if you haven't been to the small fishing village Mevagissey, you've probably seen it in a movie or British TV show. The working harbor (港口) took shape in 1774. Fishermen go out to sea daily and sell their fish in harbor-side markets. Don't leave the harbor without a traditional Cornish pie. It's delicious."],
["真题·阅读","What is a feature of Shrewsbury Town Center?",["It's situated near a big island.","It's almost surrounded by water.","It's known for its flower festival.","It's easily accessible from London."],1,"考点：细节理解。依据：塞文河在城中大幅转弯，“几乎把市中心变成一座岛”，即几乎被水环绕。A 把“像岛”误读为附近有大岛；C 原文只说处处有花，未提花卉节；D 与“challenging”相反。","2025·全国二卷","English Market Towns to Visit in the UK\n\nEnglish market towns come in many shapes and sizes. Each has a personality shaped by the goods and services produced and traded for centuries. But each town has more to do than shop.\n\nHereford, Herefordshire\nHereford has remained a lively market town since 1189. Skirting the town square, you'll find lovely shops, eateries, and the Black and White House Museum. The Hereford Cathedral is the most impressive building in town. It's also home to an ancient library. One of the four original copies of the Magna Carta is displayed there.\n\nLudlow, Shropshire\nLudlow is known as the Foodie Center of England. Butcher shops, greengrocers, bakeries, and cheese shops line the town square. Bordering the square, the Ludlow Castle is a \"must explore\" medieval stronghold. The three-day Ludlow Food Festival is held each September.\n\nShrewsbury, Shropshire\nGetting to Shrewsbury Town Center from London is challenging but worth the anxiety. The River Severn has a significant turn through town, almost making an island of Shrewsbury Town Center. The shape creates a perfect market where goods could be shipped and received using the river as a highway. Flowers are everywhere — hanging baskets, window boxes, and planters — just what you imagine in an attractive English market town.\n\nMevagissey, Cornwall\nEven if you haven't been to the small fishing village Mevagissey, you've probably seen it in a movie or British TV show. The working harbor (港口) took shape in 1774. Fishermen go out to sea daily and sell their fish in harbor-side markets. Don't leave the harbor without a traditional Cornish pie. It's delicious."],

["真题·阅读","Who does Ho teach at LPCH?",["Sick children.","Young nurses.","Medical students.","Patients' parents."],0,"考点：细节理解。依据：第二段说每年约 500 名 LPCH 患者在她班上成为学生，即住院患儿。B、C 是“医院”一词引起的联想；D 与原文“没有家长”直接矛盾，均排除。","2025·全国二卷","Kathy Ho teaches high school inside Lucile Packard Children's Hospital Stanford (LPCH). \"Sometimes I don't like saying that I'm a teacher,\" says Ho. \"People get in their minds an idea of what teachers do, but that's not really what it is here.\"\n\n\"Here\" is room 386, where each year, about 500 LPCH patients also become students. The hospital school is free of parents, doctors, and medical procedures. It's a place of learning. About half of Ho's students stay for a week or less; others are there for more than a year. Most of Ho's students will recover, which means that preparing them to return to school is an increasingly important component of care.\n\nStill, in room 386, academics don't come first. Physical health and mental health are the priority. \"If you're scared about something and thinking only about that, there's no way you're going to be able to learn,\" Ho says. \"I'm a coach, an adviser, and a comforter, and that's what it means to be a hospital teacher.\"\n\nThere are up to 30 students at any given time in Ho's class. She generally works with their regular teachers to get lessons and tests being used at their home schools. Some teachers don't give the kids any assignments; they express sympathy instead. \"I feel like it is a disservice to the kids,\" Ho says. \"They think their teachers don't care about their schoolwork.\"\n\nHo recognizes the psychological benefit of helping kids keep up with their peers (同龄人) outside the hospital. \"I actually think the medicine is only a small piece for some problems,\" says Julie Good, director of pain management services at LPCH. \"It's about problem-solving around what it means to have a full life. Those kids have dreams. School can keep those dreams alive by giving kids a way to learn and grow.\""],

e kids have dreams. School can keep those dreams alive by giving kids a way to learn and grow.\""],
["真题·阅读","How was Detrinidad's business when it started?",["It faced tough competition.","It suffered a great loss.","It got lots of financial support.","It went surprisingly well."],3,"考点：细节理解。依据：她原本“没抱多大希望”，结果订单暴增、一年寄出七万多株，生意好得出乎意料。A、B 与“订单如潮”相反，C 文中未提融资，属无中生有。","2025·全国二卷","When Sonja Detrinidad opened her online shop selling houseplants, she didn't have high hopes for it. But the opposite happened: She was flooded, shipping out 1,200 orders in June of 2020 alone. In the past year, Detrinidad sent out more than 70,000 plants. Her success is just one example of increased time at home leading to an explosion in the houseplant industry.\n\n\"Plants are in fashion right now,\" says Dr. Melinda Knuth, a researcher from the University of Florida. \"People who live in plant-rich environments report a higher life satisfaction rating,\" she says. \"Adding more nature to our environment can change our mood and how we think.\" Plants can improve our state of mind in a few ways but the biggest is by decreasing our level of cortisol, the stress hormone (激素) in our body.\n\n\"Students who are around plants perform better academically than students who are in a classroom without plants,\" says Knuth. \"This productivity also translates into the workplace for adults. Our study showed that there was a 30% decrease in sick leave for people who were in plant-rich workplaces.\"\n\nIf you're among the groups of people who are enjoying the mental and physical health benefits of surrounding yourself with plants, don't beat yourself up if one (or a few!) doesn't make it. \"Doctors practice medicine and lawyers practice law and you should allow yourself the practice it takes to sustain a plant. Tending to plants is an exercise in patience and learning. Be invested in taking care of it, but if it dies, go get another one,\" Detrinidad says."],
["真题·阅读","What is one of Knuth's findings about plants?",["They appeal more to students.","They purify the environment.","They raise the cortisol level.","They enhance productivity."],3,"考点：细节定位。依据：克努斯说身边有植物的学生学习更好，这种效率提升还延伸到职场，病假减少 30%。C 与“降低皮质醇”相反，B 未提净化，A 把“表现更好”偷换成“更受喜爱”。","2025·全国二卷","When Sonja Detrinidad opened her online shop selling houseplants, she didn't have high hopes for it. But the opposite happened: She was flooded, shipping out 1,200 orders in June of 2020 alone. In the past year, Detrinidad sent out more than 70,000 plants. Her success is just one example of increased time at home leading to an explosion in the houseplant industry.\n\n\"Plants are in fashion right now,\" says Dr. Melinda Knuth, a researcher from the University of Florida. \"People who live in plant-rich environments report a higher life satisfaction rating,\" she says. \"Adding more nature to our environment can change our mood and how we think.\" Plants can improve our state of mind in a few ways but the biggest is by decreasing our level of cortisol, the stress hormone (激素) in our body.\n\n\"Students who are around plants perform better academically than students who are in a classroom without plants,\" says Knuth. \"This productivity also translates into the workplace for adults. Our study showed that there was a 30% decrease in sick leave for people who were in plant-rich workplaces.\"\n\nIf you're among the groups of people who are enjoying the mental and physical health benefits of surrounding yourself with plants, don't beat yourself up if one (or a few!) doesn't make it. \"Doctors practice medicine and lawyers practice law and you should allow yourself the practice it takes to sustain a plant. Tending to plants is an exercise in patience and learning. Be invested in taking care of it, but if it dies, go get another one,\" Detrinidad says."],

["真题·阅读","What can be a suitable title for the text?",["Time to Replace Houseplants","Plants Boost Your Mood","Tips on Choosing Houseplants","Plants Brighten Your Home"],1,"考点：主旨标题。依据：全文由销售火爆引出植物降低压力激素、改善情绪、提升学习与工作效率，核心是“植物提升情绪与状态”。A 与文意相反，C 未讲挑选，D 只谈装饰，均偏窄。","2025·全国二卷","When Sonja Detrinidad opened her online shop selling houseplants, she didn't have high hopes for it. But the opposite happened: She was flooded, shipping out 1,200 orders in June of 2020 alone. In the past year, Detrinidad sent out more than 70,000 plants. Her success is just one example of increased time at home leading to an explosion in the houseplant industry.\n\n\"Plants are in fashion right now,\" says Dr. Melinda Knuth, a researcher from the University of Florida. \"People who live in plant-rich environments report a higher life satisfaction rating,\" she says. \"Adding more nature to our environment can change our mood and how we think.\" Plants can improve our state of mind in a few ways but the biggest is by decreasing our level of cortisol, the stress hormone (激素) in our body.\n\n\"Students who are around plants perform better academically than students who are in a classroom without plants,\" says Knuth. \"This productivity also translates into the workplace for adults. Our study showed that there was a 30% decrease in sick leave for people who were in plant-rich workplaces.\"\n\nIf you're among the groups of people who are enjoying the mental and physical health benefits of surrounding yourself with plants, don't beat yourself up if one (or a few!) doesn't make it. \"Doctors practice medicine and lawyers practice law and you should allow yourself the practice it takes to sustain a plant. Tending to plants is an exercise in patience and learning. Be invested in taking care of it, but if it dies, go get another one,\" Detrinidad says."],
["真题·阅读","What can be inferred about the author's early life?",["He witnessed food shortage.","He enjoyed the local cuisine.","He donated food to Africans.","He helped to cook at home."],0,"考点：推理判断。依据：作者在南非长大，说“非洲有孩子在挨饿”是“对事实的提醒”而非祷告，可推知他亲眼见过食物短缺。B、C、D 均无文本依据，属无中生有。","2025·全国二卷","Does your soul die a little every time you throw away unused food? Mine does. Maybe that feeling comes from growing up in South Africa, where the phrase \"there are children starving in Africa\" was more of an uncomfortable reminder of fact than a prayer at dinner time.\n\nFood waste is a growing concern in the restaurant, supermarket, and chain supply industries. From technological solutions to educational campaigns, food producers and sellers are looking for ways to use more of what we're already growing. But last month, one popular New York City restaurant tried a different way: It changed its menu to exclusively (仅仅) offer food that would otherwise be thrown away.\n\nFor two weeks in March, Greenwich Village's Blue Hill restaurant was renamed wastED and served items like fried skate cartilage, a juice pulp burger, and a dumpster diver's vegetable salad. Each dish was tailor-made to raise awareness regarding food waste.\n\nA study by the Food Waste Alliance determined that the average restaurant generates 33 pounds of food waste for every $1,000 in revenue (收入) and of that waste only 15.7% is donated or recycled. Up to 84.3% is simply thrown out. Restaurants like Silo in the UK have experimented with zero-waste systems, but wastED took the concept to its logical conclusion.\n\nIt should be noted that none of the items on wastED's menu was technically made from garbage. Instead, all the ingredients (配料) used were examples of meat cuts and produce that most restaurants would never consider serving. Things like kale ribs, fish collars, rejected sweet potatoes, and cucumber butts were all re-appropriated and, with the help of a number of good chefs, turned into excellent cuisine.\n\nThough wastED received enthusiastic reviews, it was designed from the start as a short-lived experiment; Blue Hill has since returned to its regular menu. Nevertheless, it serves as a reminder that there are many ways to address problems of sustainability, and that you can make an amazing meal out of almost anything."],

["真题·阅读","What can we learn about wastED?",["It has ended as planned.","It is creating new jobs.","It has regained popularity.","It is criticized by top chefs."],0,"考点：细节理解。依据：末段说它“从一开始就被设计成短期实验”，蓝山餐厅已恢复常规菜单，即按计划结束。B、C 无依据；原文说它“广受好评”，与 D 相反。","2025·全国二卷","Does your soul die a little every time you throw away unused food? Mine does. Maybe that feeling comes from growing up in South Africa, where the phrase \"there are children starving in Africa\" was more of an uncomfortable reminder of fact than a prayer at dinner time.\n\nFood waste is a growing concern in the restaurant, supermarket, and chain supply industries. From technological solutions to educational campaigns, food producers and sellers are looking for ways to use more of what we're already growing. But last month, one popular New York City restaurant tried a different way: It changed its menu to exclusively (仅仅) offer food that would otherwise be thrown away.\n\nFor two weeks in March, Greenwich Village's Blue Hill restaurant was renamed wastED and served items like fried skate cartilage, a juice pulp burger, and a dumpster diver's vegetable salad. Each dish was tailor-made to raise awareness regarding food waste.\n\nA study by the Food Waste Alliance determined that the average restaurant generates 33 pounds of food waste for every $1,000 in revenue (收入) and of that waste only 15.7% is donated or recycled. Up to 84.3% is simply thrown out. Restaurants like Silo in the UK have experimented with zero-waste systems, but wastED took the concept to its logical conclusion.\n\nIt should be noted that none of the items on wastED's menu was technically made from garbage. Instead, all the ingredients (配料) used were examples of meat cuts and produce that most restaurants would never consider serving. Things like kale ribs, fish collars, rejected sweet potatoes, and cucumber butts were all re-appropriated and, with the help of a number of good chefs, turned into excellent cuisine.\n\nThough wastED received enthusiastic reviews, it was designed from the start as a short-lived experiment; Blue Hill has since returned to its regular menu. Nevertheless, it serves as a reminder that there are many ways to address problems of sustainability, and that you can make an amazing meal out of almost anything."],
["真题·七选五","第 36 空最合适的句子是？",["Helping the community lowers rates of depression.","Volunteering as a family may be just the thing you need.","Volunteering has a lifelong effect on kids and teenagers.","Volunteering can be the first step in breaking down prejudice.","For adults, volunteering can provide significant physical health benefits.","You may even learn that your kid has a talent you didn't know about before.","Volunteering makes you feel capable and inspires you to make the most of each day."],1,"考点：承上启下。依据：前面连用两个“想不想”的问句，B 项“全家一起做志愿服务正是你需要的”直接作答，又引出下文的种种好处。A 谈抑郁、D 谈偏见，与本段话题无关，排除。","2025·全国二卷","Unexpected Benefits of Volunteering as a Family\n\nAre you looking for a way to bring your family together? Hoping to find a hobby that can be shared by both the little ones and adults? (36) You may know the \"feel-good\" emotions that come with helping others, but there are even more unexpected ways volunteering will positively affect the whole family.\n\n● You'll feel like you have more time.\nPeople often feel they are too busy to volunteer. Yet, research has found that giving your time to community causes actually makes you feel like you have more of it. (37)\n\n● You can live longer if you volunteer regularly.\n(38) Washington University found that adults 55 and older who volunteered had better memory and maintained overall health longer than others their age. Volunteers are also more likely to look after their own health and are more focused on adding physical activity into their lives.\n\n● (39)\nVolunteering during teenage years has been linked to some major positive effects such as improved grades and increased self-confidence. These effects aren't just short-term but have been proved to affect a teen's well-being in the years to come.\n\n● You'll have more time with family.\nFamilies who volunteer together have the unique experience of working toward a common goal. (40) Everyone brings something unique to the table and can connect with each other in a new way. And, there are tasks for every age and ability, so all your children can feel proud of their work."],

["真题·阅读","What percentage of global transport emissions did road vehicles account for in 2018?",["11.6%.","45.1%.","74.5%.","86.1%."],2,"考点：图表数据读取。依据：图中 2018 年各方式占比中道路车辆最高，为 74.5%，故选 C。干扰项排除：A 为飞机占比；B、D 系数字干扰。图表数值按可见项与总量推算：100%−11.6%−10.7%−1%−2.2%=74.5%。","2025·全国一卷","The greening of planes, trains and automobiles\n\nMoving goods and people around the world is responsible for a large part of global CO2 emissions (排放). As the world races to decarbonize everything, it faces particular problems with transportation — which accounts for about a quarter of our energy-related greenhouse gas emissions. Here's the breakdown of the emissions in 2018 for different modes of transport.\n\nROAD VEHICLES 74.5% | AIRPLANES 11.6% | SHIPPING 10.7% | RAIL 1% | OTHER 2.2%\n\nThe fuels for transport need to be not just green, cheap and powerful, but also lightweight and safe enough to be carried around. Each mode of transport has its specific fuel needs. Much is still to be settled, but here are some of the solutions to get us going green.\n\nCARS — Batteries: Batteries are energy-efficient and electric. New batteries will take a car farther on a single charge.\n\nPLANES — Synthetic hydrocarbons: The hardest sector to decarbonize is aviation. The most promising option for sustainable fuel for planes is to make hydrocarbons from recycled air, which can be dropped into existing services.\n\nTRUCKS — Hydrogen fuel cells: Hydrogen fuel cells are a lighter choice than batteries for trucks, but making green hydrogen is expensive.\n\nSHIPS — Liquid ammonia: Liquid ammonia is easy to keep and transport, but it is hard to ignite (点燃) and requires an engine redesign.\n\nTRAINS — Electricity: Some trains are already electrified through rails or wires; others can be made electric in pretty simple ways.\n\nThis energy transition (转型) is global, and the amount of renewable energy the world will need is \"a little bit mind-blowing,\" says mechanical engineer Keith Wipke at the National Renewable Energy Laboratory. It's estimated that the global demand for electricity could more than double by 2050. Fortunately, analyses suggest that renewables are up to the task. \"We need to speed up the development of green energy, and it will all get used,\" says Wipke."],
["真题·阅读","Which mode of transport can go green comparatively easily?",["Planes.","Trucks.","Trains.","Ships."],2,"考点：细节理解。依据：文末说部分火车已通过轨道或电线电气化，其余也能以非常简单的方式改用电驱动，可见火车最易绿色化，故选 C。干扰项排除：飞机“最难脱碳”；卡车制取绿氢成本高；船舶需重新设计发动机。","2025·全国一卷","The greening of planes, trains and automobiles\n\nMoving goods and people around the world is responsible for a large part of global CO2 emissions (排放). As the world races to decarbonize everything, it faces particular problems with transportation — which accounts for about a quarter of our energy-related greenhouse gas emissions. Here's the breakdown of the emissions in 2018 for different modes of transport.\n\nROAD VEHICLES 74.5% | AIRPLANES 11.6% | SHIPPING 10.7% | RAIL 1% | OTHER 2.2%\n\nThe fuels for transport need to be not just green, cheap and powerful, but also lightweight and safe enough to be carried around. Each mode of transport has its specific fuel needs. Much is still to be settled, but here are some of the solutions to get us going green.\n\nCARS — Batteries: Batteries are energy-efficient and electric. New batteries will take a car farther on a single charge.\n\nPLANES — Synthetic hydrocarbons: The hardest sector to decarbonize is aviation. The most promising option for sustainable fuel for planes is to make hydrocarbons from recycled air, which can be dropped into existing services.\n\nTRUCKS — Hydrogen fuel cells: Hydrogen fuel cells are a lighter choice than batteries for trucks, but making green hydrogen is expensive.\n\nSHIPS — Liquid ammonia: Liquid ammonia is easy to keep and transport, but it is hard to ignite (点燃) and requires an engine redesign.\n\nTRAINS — Electricity: Some trains are already electrified through rails or wires; others can be made electric in pretty simple ways.\n\nThis energy transition (转型) is global, and the amount of renewable energy the world will need is \"a little bit mind-blowing,\" says mechanical engineer Keith Wipke at the National Renewable Energy Laboratory. It's estimated that the global demand for electricity could more than double by 2050. Fortunately, analyses suggest that renewables are up to the task. \"We need to speed up the development of green energy, and it will all get used,\" says Wipke."],

["真题·阅读","Who are the people mentioned at the beginning of paragraph 1?",["Ninth graders.","Students' parents.","Modern writers.","Fictional characters."],3,"考点：细节理解。依据：牛仔、严父、现代版朱丽叶都是学生在写作课上创造出来的人物，属虚构角色，故选 D。干扰项排除：A 项是作者的学生，不是文中人物；B 项严父只是学生笔下的角色；C 项“现代作家”无依据。","2025·全国一卷","In my ninth-grade writing class last year, I met a cowboy who saved his town, a strict father who demanded his son earn straight A's, and a modern-day Juliet who died of heartbreak after her parents rejected the love of her young life. More than once, I found myself wondering just how my students, who'd created these people, knew their subjects so well.\n\nBut things were different for their first essay, which was about the question: \"Why is writing important?\" Most of the essays filled less than one page, and few contained a sentence that could be interpreted as a thesis (论点) statement. I was shocked. Then I realized that the problem was the question itself. They could have written pages on the necessity of computers, but writing, in and of itself, simply didn't strike them as important. This would have to change.\n\nAs a new unit started, I asked everyone to write a persuasive piece on a health-related topic of their choice. This time they found the exercise much more interesting. For the next two assignments, a personal-narrative unit followed by a creative-writing workshop, I only required that the piece meet the specifications of its genre (体裁) and that it contain a thesis. The results were staggering. The students took on diverse topics and turned in stories, 10 to 20 pages each, with characters that broadened my view and touched my heart.\n\nI walked into class believing that writing is important as a means of communication. However, my students demonstrated something more important to me. When the final bell rang in June, I walked away with a yearbook full of messages about writing's most powerful significance — the ability to connect people, to put us in another's skin, to teach us what it means to be human."],

bility to connect people, to put us in another's skin, to teach us what it means to be human."],

["真题·阅读","What does the author's experience show?",["Teaching is learning.","Still waters run deep.","Knowledge is power.","Practice makes perfect."],0,"考点：主旨升华。依据：作者本想教学生写作之重要，学生却让她领悟写作最强大的意义，师生彼此成就，正是“教学相长”，故选 A。干扰项排除：B 项强调内敛深沉；C 项强调知识的力量；D 项强调反复练习，均非文意。","2025·全国一卷","In my ninth-grade writing class last year, I met a cowboy who saved his town, a strict father who demanded his son earn straight A's, and a modern-day Juliet who died of heartbreak after her parents rejected the love of her young life. More than once, I found myself wondering just how my students, who'd created these people, knew their subjects so well.\n\nBut things were different for their first essay, which was about the question: \"Why is writing important?\" Most of the essays filled less than one page, and few contained a sentence that could be interpreted as a thesis (论点) statement. I was shocked. Then I realized that the problem was the question itself. They could have written pages on the necessity of computers, but writing, in and of itself, simply didn't strike them as important. This would have to change.\n\nAs a new unit started, I asked everyone to write a persuasive piece on a health-related topic of their choice. This time they found the exercise much more interesting. For the next two assignments, a personal-narrative unit followed by a creative-writing workshop, I only required that the piece meet the specifications of its genre (体裁) and that it contain a thesis. The results were staggering. The students took on diverse topics and turned in stories, 10 to 20 pages each, with characters that broadened my view and touched my heart.\n\nI walked into class believing that writing is important as a means of communication. However, my students demonstrated something more important to me. When the final bell rang in June, I walked away with a yearbook full of messages about writing's most powerful significance — the ability to connect people, to put us in another's skin, to teach us what it ["真题·阅读","What phenomenon does the author point out in paragraph 1?",["Cars often get stuck on the road.","Traffic accidents occur frequently.","People walk less and drive more.","Pedestrians fail to follow the rules."],2,"考点：细节理解。依据：首段说行人出行能力下降，家长因车多而不让孩子步行上学、改为车送，即步行减少、用车增多，故选 C。干扰项排除：A 项拥堵、B 项事故、D 项违规，首段均未提及。","2025·全国一卷","While safety improvements might have been made to our streets in recent years, transport studies also show declines in pedestrian (行人) mobility, especially among young children. Many parents say there's too much traffic on the roads for their children to walk safely to school, so they pack them into the car instead.\n\nDutch authors Thalia Verkade and Marco te Brémmelstroet are bothered by facts like these. In their new book Movement: How to Take Back Our Streets and Transform Our Lives, they call for a rethink of our streets and the role they play in our lives.\n\nLife on city streets started to change decades ago. Whole neighbourhoods were destroyed to make way for new road networks and kids had to play elsewhere. Some communities fought back. Most famously, a Canadian journalist who had moved her family to Manhattan in the early 1950s led a campaign to stop the destruction of her local park. Describing her alarm at its proposed replacement with an expressway, Jane Jacobs called on her mayor (市长) to champion \"New York as a decent place to live, and not just rush through.\" Similar campaigns occurred in Australia in the late 1960s and 1970s as well.\n\nAlthough these campaigns were widespread, the reality is that the majority of the western cities were completely redesigned around the needs of the motor car. The number of cars on roads has been increasing rapidly. In Australia we now have over twenty million cars for just over twenty-six million people, among the highest rate of car ownership in the world.\n\nWe invest a lot in roads that help us rush through, but we fail to account for the true costs. Do we really recognise what it costs us as a society when children can't move safely around our communities? The authors of Movement have it right: it's time to think differently about that street outside your front door."],

["真题·阅读","How does the author present the issue in the first paragraph?",["By quoting an expert.","By defining a concept.","By giving examples.","By providing statistics."],2,"考点：写作手法。依据：首段列举深海、喜马拉雅山、火山岩、海鸟胃、南极雪乃至人体内等一串实例，说明微塑料无处不在，属举例，故选 C。干扰项排除：A 项引用在末段；B 项未下定义；D 项首段没有数据。","2025·全国一卷","Microplastics have become a common source of pollution across the Earth — they have settled in the deep sea and on the Himalayas, stuck inside volcanic rocks, filled the stomachs of seabirds and even fallen in fresh Antarctic snow. They are even appearing inside humans.\n\nNow, new research suggests that a simple, cheap measure may significantly reduce the level of microplastics in water from your tap (水龙头): boiling and filtering (过滤) it. In a study published Wednesday in Environmental Science & Technology Letters, researchers from China found that boiling tap water for just five minutes — then filtering it after it cools — could remove at least 80 percent of its microplastics.\n\nCrucially, this process relies on the water containing enough calcium carbonate (碳酸钙) to trap the plastics. In the study, boiling hard water containing 300 milligrams of calcium carbonate led to an almost 90 percent drop in plastics. But in samples with less than 60 milligrams of calcium carbonate, boiling reduced the level of plastics by just 25 percent. Additionally, the research didn't include all types of plastics. The team focused only on three common types — polystyrene, polyethylene and polypropylene — and they didn't study other chemicals previously found in water such as vinyl chloride.\n\nStill, the findings show a potential path forward for reducing microplastic exposure — a task that's becoming increasingly difficult. Even bottled water, scientists found earlier this year, contains 10 to 1,000 times more microplastics than originally thought.\n\nScientists are still trying to determine how harmful microplastics are — but what they do know has raised concerns. The new study suggests boiling tap water could be a tool to limit intake. \"The way they demonstrated how microplastics were trapped through the boiling process was nice,\" Caroline Gauchotte-Lindsay, an environmental engineer at the University of Glasgow in Scotland who was not involved in the research, tells New Scientist. \"We should be looking into upgrading drinking water treatment plants so they remove microplastics.\""],

rns. The new study suggests boiling tap water could be a tool to limit intake. \"The way they demonstrated how microplastics were trapped through the boiling process was nice,\" Caroline Gauchotte-Lindsay, an environmental engineer at the University of Glasgow in Scotland who was not involved in the research, tells New Scientist. \"We should be looking into upgrading drinking water treatment plants so they remove microplastics.\""],

["真题·七选五","第 36 空最合适的句子是？",["The cafe closes at 9 pm every day.","She has two children aged eight and four.","Sometimes she arrives early to serve the students early.","After finishing an order, she calls out the name on the cup.","Not only does this cafe serve up drinks, it also serves up smiles.","Going to the cafe starts her day off good and gets her ready for class.","She has served here for 17 years and can't imagine working anywhere else."],4,"考点：总起句。依据：空在首段末尾，前句说咖啡馆“能满足你，而且不止于此”，E 项“不仅供应饮品，还供应微笑”既点题又引出下文对墨菲笑容的描写，故选 E。干扰项排除：A 项营业时间、B 项家庭情况与首段无关；C、D、G 都是具体细节。","2025·全国一卷","An Unsung Hero\n\nNeed a break between classes or just a quick pick-me-up in the morning? The College Cafe has just that, and more. (36)\n\nCatherine Murphy, a cafe worker in a green shirt and black hat, makes sure that each customer gets exactly what they order. She goes back and forth between machines to make the drinks. (37) As the customer grabs the drink from her hand, she smiles and says, \"Hello, how is your day?\" Even when the line is getting longer, she doesn't let it get in the way of her genuine conversations.\n\nMurphy gets up at a quarter to five and drives thirty minutes every day to get to work on time. (38) \"I do so because I like to make coffee for the students. I know they need it in the morning,\" Murphy said. Being a mother and wife has helped her become the woman she is. She believes she is here to serve.\n\nOne thing Murphy may not know is that her smile is contagious (有感染力的) and can be the difference in a student having a much better day than they were having before seeing her. Joanna Wright, a senior political science major, loves coffee and goes to the cafe at least six days a week. (39) \"Catherine always has a huge smile on her face, which always puts me in a cheerful mood,\" Wright said.\n\n\"I enjoy working in the cafe,\" Murphy said. (40) She has every intention of staying and continuing doing what she loves."],

["真题·阅读","Which team will play the most games at the stadium this month?",["Dallas Cowboys.","Los Angeles Rams.","Los Angeles Chargers.","New Orleans Saints."],1,"考点：图表信息统计。依据：赛程中公羊队出现在 8 月 9、16、24 日三场，闪电队两场，牛仔队与圣徒队各一场。A、C、D 场次均少于公羊队，排除。","2026·全国一卷","SoFi Stadium Events This Month\n\nSoFi Stadium is the go-to destination in the heart of Los Angeles for sports fans. Its calendar is always packed with headline-grabbing events.\n\nUpcoming Football Events\nLos Angeles Rams v Dallas Cowboys — Saturday, August 9, 4:00 PM\nLos Angeles Chargers v New Orleans Saints — Sunday, August 10, 5:00 PM\nLos Angeles Chargers v Los Angeles Rams — Saturday, August 16, 4:00 PM\nLos Angeles Rams v Houston Texans — Sunday, August 24, 1:25 PM\n\nNearby Hotels\nWhen attending an event at SoFi Stadium, you're just a short walk or ride from several comfortable and classy hotels. Right across the street, Sonder Liim Hotel offers spacious rooms and a rooftop pool. A mile away, the H Hotel Los Angeles, with its stylish design, is ideal for a nice stay between events. For those seeking both comfort and convenience, the Renaissance Los Angeles Airport Hotel is just a short drive away. If you're willing to drive a little further, the Ritz-Carlton Los Angeles promises luxurious rooms and extensive leisure facilities — perfect for turning a game day into a great weekend escape.\n\nParking\nSoFi Stadium requires you to park strictly in your assigned zone, and guests must enter through the exact gate indicated on their color-coded digital parking pass. If you enter through the wrong access point, you'll be turned around and redirected — so plan ahead. Each parking zone consists of multiple lots, designed to efficiently manage traffic across the venue's network. Make sure to download your parking pass to your smartphone before arrival. Upon entering the correct zone, parking staff will guide you directly to a space. For those wishing to park near friends, all vehicles must have passes for the same zone and arrive together — spaces cannot be saved."],

["真题·阅读","What does Kevin usually do to get the meaning of a word?",["Use electronic devices.","Consult a paper dictionary.","Guess from the context.","Turn to his English teacher."],0,"考点：细节推断。依据：他说“屏幕时间用完了”并反问“你就不能用手机吗”，说明平时靠手机等电子设备查词。B 恰是他不会做的，C、D 文中均无依据。","2026·全国一卷","Not long ago, my fifth-grade son Kevin asked me about the meaning of a word in a novel. \"Look it up,\" I responded. \"But my screen time is off,\" he said. I looked pointedly at the bookshelf that held at least three dictionaries, and Kevin sighed (叹气) dramatically. \"Can't you just use your phone?\" he asked. Suddenly it occurred to me that he did not even know how to use a dictionary.\n\nI took down one of the dictionaries, and we read it together for a few minutes before I handed it to him. It took him a few tries to find the word in question. While going through the pages, he kept saying, wide-eyed: \"How can there be this many words?\" After a while, he looked at me and asked, \"Do you know all these words, Mom?\" I smiled. \"I definitely do not know all these words,\" I said. \"But that's why this is one of my favorite books.\"\n\nI had my first dictionary as a gift for my 13th birthday. I decided that I wanted to learn as many words as I could and started marking every entry I looked up with a pencil to measure my progress. I continued to make these pencil marks for years, and when I went off to college, I packed that dictionary in my suitcase.\n\nKevin wanted to see the dictionary. I felt a small pain in my chest. The dictionary was stolen at the end of my freshman year of college. \"That's so sad,\" he said, \"but you still know all those words, even without the book.\" I realized that this was true. I still made it through the next three years of college, even without the book. And it wasn't, ultimately, the dictionary that got me there — not really.\n\nNow I understand that although my son may be learning differently, he is still learning. It's not about the words themselves or how we learn them, but the wanting to know them, the curiosity and the appetite."],

["真题·阅读","What does the new study imply regarding oaks and sweetgums?",["They affect the growth of other trees.","They absorb less carbon than expected.","They harm people's health indirectly.","They raise the local temperature slowly."],2,"考点：推理判断。依据：二者释放的异戊二烯与氮氧化物生成近地面臭氧，而臭氧是许多呼吸问题的重要诱因，即间接危害健康。B、D 与“吸收大量碳、降低地表温度”相反，A 未提及。","2026·全国一卷","In line with longstanding initiatives to expand its green spaces, New York City is planting tens of thousands of trees each year. They provide shade, lower surface temperatures, absorb a surprising amount of airborne carbon, remove tiny pollutants, and provide wildlife habitat along with just plain beauty.\n\nSomething could go wrong, though, according to a new study. Oaks and sweetgums, which currently account for a majority of the city's trees, produce huge amounts of a chemical substance called isoprene. Harmless by itself, isoprene interacts rapidly with polluting nitrogen oxides released by vehicles, buildings and industry to form ground-level ozone (臭氧) — a major factor in many breathing problems.\n\nThe research, carried out by scientists at the Columbia Climate School and other institutions, found that if the city maintains past species patterns in new plantings, isoprene production in Manhattan in coming decades will go up by about 140%, and resulting summer ozone levels as much as 30%.\n\n\"We're all for planting more trees. They bring so many good things,\" said study coauthor Róisín Commane. \"But if we're not careful, we could make air quality worse.\"\n\nThe Parks Department is not oblivious to the issue. A study carried out by some of its researchers several years ago concluded that city trees did release isoprene. \"We didn't make a big deal of that,\" said Novem Auyeung, a Parks Department senior scientist. She said trees should not be viewed as the enemy. \"We could plant any trees we want to, if we just rethink our car-centric lifestyle,\" she said.\n\n\"We're not going to go cutting down any big old oaks,\" and neither will the department completely stop planting new ones, said Auyeung. \"You have to think about what you would lose if you do that.\" Oaks are keystone species, she pointed out, providing food and habitat for native insects, birds and other animals."],

["真题·阅读","What was the beauty group asked to do with the clay objects?",["Draw their outlines.","Give each piece a rating.","Compare their prices.","Make a copy of each piece."],1,"考点：细节理解。依据：审美组被要求认真品味并“rate the beauty of each object”，即给每件作品的美感评分。A 是“线描图配对”，属对照组任务，C、D 文中未出现。","2026·全国一卷","A team of Cambridge psychologists conducted an experiment to compare the cognitive (认知的) effects of merely seeing art with actively judging how beautiful it is.\n\nIn the study, 187 people were invited to visit Kettle's Yard gallery during an exhibition of handmade clay objects. Participants were randomly divided into two groups: the \"beauty\" group was asked to actively consider and then rate the beauty of each object they viewed, while the control group just matched a line drawing of the object with the artwork itself. All participants were then tested on how they process information, and whether it's in a more practical or abstract way.\n\nAcross all participants, those in the beauty group scored almost 14% higher on average than the control group in abstract thinking. While they were told the study was about cognitive processes, participants were asked about interests, with around half saying they had an artistic hobby. Among those, the effect was greater: those with an artistic hobby in the beauty group scored over 25% higher on average for abstract thinking than those with an artistic hobby in the control group.\n\nEmotional states of participants were also measured by asking about their feelings while completing the gallery task. Across all participants, those in the beauty group reported an average of 23% higher levels of \"transformative and self-transcendent feelings\" — such as feeling moved, enlightened and inspired — than the control group. Importantly, however, the beauty group did not report feeling any happier than the control group, suggesting that it was the engagement with beauty that influenced abstract thinking, rather than any overall positivity from the experience.\n\n\"We usually think in very concrete terms when doing something on a screen,\" said Simone Schnall, senior author of the study. \"It's becoming much rarer to zone out and just let the mind wander, but that's when we think in ways that broaden our minds. Admiring the beauty of art may be the ideal way to initiate the abstract cognitive processes.\""],

["真题·七选五","第 36 空最合适的句子是？",["This capability allows for timely restoration.","Visitor data collection also raises privacy issues.","In short, AI is redefining the museum in all respects.","It tailors learning experiences to different age groups and learning styles.","Museums are not only places to store artworks, but also spaces for learning.","Furthermore, AI-powered virtual guides are replacing traditional tour guides.","AI is changing this by using image recognition technology to analyze exhibits."],2,"考点：段末总结。依据：首段列举 AI 在个性化参观、保护藏品、揭示故事三方面的作用，C 项“总之，AI 正在各个方面重新定义博物馆”正好收束。A 只讲修复、G 只讲图像识别，各涉一点，排除。","2026·全国一卷","Museums, once quiet places filled with history, are now full of digital excitement. By using machine learning and advanced algorithms (算法), these institutions are creating personalized visitor journeys, protecting delicate collections, and revealing hidden stories. (36)\n\nAI transforms a standard museum trip into a personalized — and interactive — adventure. Smart recommendation engines analyze data such as exhibit popularity and visitors' past behavior to suggest specific exhibits and events, making each visit unique and surprising. (37) These digital assistants engage visitors in dynamic conversations and offer context-sensitive insights that deepen understanding and satisfy curiosity.\n\nBeyond visitor interaction, AI plays a crucial role in preserving priceless artworks. Since the exhibits in museums sustain natural decay (破损) over time, early detection is vital. AI can help identify the slightest signs of decay, such as cracks or discoloration, which are often invisible to the human eye. (38) Moreover, by predicting future decay patterns, AI helps museums take preventive measures and improve preservation strategies.\n\nAI also significantly enhances the educational value of museums, particularly for children and families. (39) For instance, interactive exhibits powered by AI can adjust their content and difficulty level based on the users' preferences and responses. This adaptability ensures that complex historical concepts become accessible and engaging for young minds.\n\nLooking ahead, the rapid advancement of AI promises both exciting possibilities and ethical (伦理的) challenges. Museums are working together with AI ethicists to develop fair algorithms. (40) Strict policies should be established to protect visitors' information."],

["真题·阅读","How does Reisley feel about having Wright as his house designer?",["Honored.","Amused.","Stressed.","Inspired."],0,"考查观点态度。首段“that's not the thing he prides himself on”后紧接他自称赖特“最后一位原始客户”，语气满是自豪，honored 与 prides himself on 对应，A 正确。B、C、D 三项的情绪在文中都找不到依据。","2026·全国二卷","Roland Reisley turned 101 years old in May and is in remarkable health. But that's not the thing he prides himself on. \"I am the last original client of Frank Lloyd Wright, still living in the home he designed for me,\" Reisley said, sitting in the bright open living room of the home designed by the famous architect.\n\nThe house where Reisley has lived for 73 years is located in the woods of Westchester County, New York, just 30 miles north of Manhattan. It's one of 47 that make up the peaceful mid-20th-century modern village of Usonia.\n\nBack in 1951, Reisley was just 26, newly married and ready to put down roots. He and his wife began looking for a place in Manhattan. But what they liked, they couldn't afford on his sound engineer's salary and what they could, they didn't like. Then they heard about Usonia. On their first trip out, they were greeted with such enthusiasm from the 10 families who'd already established homes there that they decided to join.\n\nThe house has signature Wright features. It is made with local materials, has a flat roof, wood paneling, concrete floors and custom-made furniture. Over the decades, Reisley has opened his doors to visitors. The house is now listed on the National Register of Historic Places. Reisley said he's tried his best to be a good steward (管家) not just of the Wright creation he lives in, but all others as well. He co-founded the Frank Lloyd Wright Building Conservancy, an organization engaged in the preservation of all of Wright's remaining buildings. Reisley believes that his devotion to the home and the community are what have kept him in such good health all of these years."],

["真题·阅读","What does the author point out at the beginning of the text?",["Some mountains are getting higher.","Data on wearables are misleading.","The concept of elevation is relative.","The reference point is hard to locate."],2,"考查细节理解。首段以 But 转折，落脚句“elevation is necessarily relative”点明高度是相对概念，C 正确。A 项只说各山高度，未言升高；B 项只讲读数易得，未说误导；D 项“参照点难找”无据。","2026·全国二卷","The peak of Mount Qomolangma, 8,849 meters above sea level. Chimborazo, 6,263 m; Mont Blanc, 4,806 m; Pradidali hut, at the foot of the Pala group in the Dolomites, 2,278 m. It is common practice to provide the elevation (高度) of a place. Simple readings are now readily available on our phones and wearables. But elevation is necessarily relative; only the choice of a reference point allows us to express numerically the height of an object or a location.\n\nThe idea of sea level as a reference point for elevations has by now been around for so long as to go essentially unnoticed — we mention it without even considering what it means. That the concept has a history is easily ignored. We tend to forget that sea level is a product of technically and culturally determined assumptions. In this book I tell a story of these assumptions.\n\nAppropriately, the book took shape during a summer spent between sea and mountains. A month after visiting the French Riviera and enjoying the sandy beaches of Nice and Menton, I went hiking with friends in the Pala group. Resting on a pass near the Pradidali hut, we began discussing the readings offered by our altimeters (测高仪). Why did they vary ever so slightly from one instrument to the next? This sense of uncertainty led me to think about the meaning of zero. This is how I began my search for the conceptual history of sea level.\n\nIn this book I examine three crucial stages in the history of mean sea level. These stages mirror the development of human conceptions of the sea. Since I began thinking about this project in August 2011, the issue of sea-level rise and the need to place it historically have only become more urgent; between then and the end of 2022 the global sea rose by almost 5 centimeters, about half of the overall rise recorded by satellites since 1993."],

["真题·阅读","What can be the title of the book mentioned in the text?",["The Altimeter: A Must-Have","Sea Level: A History","Meaning of Zero: Nothing or Everything","Mountains to Seas: Ups and Downs"],1,"考查主旨与标题。全文反复围绕“the conceptual history of sea level”“three crucial stages in the history of mean sea level”展开，B 项最能统摄全书。A、C、D 只抓测高仪、零、山与海等局部细节，均以偏概全。","2026·全国二卷","The peak of Mount Qomolangma, 8,849 meters above sea level. Chimborazo, 6,263 m; Mont Blanc, 4,806 m; Pradidali hut, at the foot of the Pala group in the Dolomites, 2,278 m. It is common practice to provide the elevation (高度) of a place. Simple readings are now readily available on our phones and wearables. But elevation is necessarily relative; only the choice of a reference point allows us to express numerically the height of an object or a location.\n\nThe idea of sea level as a reference point for elevations has by now been around for so long as to go essentially unnoticed — we mention it without even considering what it means. That the concept has a history is easily ignored. We tend to forget that sea level is a product of technically and culturally determined assumptions. In this book I tell a story of these assumptions.\n\nAppropriately, the book took shape during a summer spent between sea and mountains. A month after visiting the French Riviera and enjoying the sandy beaches of Nice and Menton, I went hiking with friends in the Pala group. Resting on a pass near the Pradidali hut, we began discussing the readings offered by our altimeters (测高仪). Why did they vary ever so slightly from one instrument to the next? This sense of uncertainty led me to think about the meaning of zero. This is how I began my search for the conceptual history of sea level.\n\nIn this book I examine three crucial stages in the history of mean sea level. These stages mirror the development of human conceptions of the sea. Since I began thinking about this project in August 2011, the issue of sea-level rise and the need to place it historically have only become more urgent; between then and the end of 2022 the global sea rose by almost 5 centimeters, about half of the overall rise recorded by satellites since 1993."],
["真题·阅读","Why does Barcelona launch the MetroCharge project?",["To fuel the city's economy.","To enhance passengers' experience.","To promote green transportation.","To raise the quality of electric cars."],2,"考查细节理解。第二段“clean energy technologies”“help public transportation go greener”“tackle climate change”共同指向推动绿色交通，C 正确。A、B、D 三项的经济、乘车体验、汽车质量在文中均无对应信息。","2026·全国二卷","The Barcelona subway pulls into the station, the doors slide open and passengers pour out to go about their daily business. Little do they know that as they do so, a burst of energy is sent up to street level to help charge an electric car.\n\nBarcelona has put together a package of clean energy technologies to help public transportation go greener, while also doing its part to tackle climate change and aid Europe's difficult shift to the privately owned electric vehicle market.\n\nSixteen stations of Barcelona's subway system are part of its new MetroCharge project whereby the energy from the underground trains' brakes (刹车) is used to power the trains and the stations themselves, while the remainder is sent snaking through cables (电缆) to the surface to power plug-in stations for privately owned vehicles.\n\nBernardo Espinoza, an engineer who takes the subway every day, owns an electric car. \"I am pleasantly surprised, because I am always looking for where to plug it in,\" Espinoza said before catching the subway in a working-class area of southern Barcelona. \"And if it is from energy from the trains' brakes, then even better.\"\n\nRegenerative brakes have been in trains for decades and are also used in some cars. They consist of an electric motor which collects energy used in the braking action that would be lost as heat by conventional brakes. That energy can be immediately used to accelerate (加速) the vehicle or, in the case of the Barcelona subway system, sent along cables to supply electricity for the station or for electric car chargers.\n\nAlvaro Luna, a professor of electrical engineering, said that the system is innovative in so far as it allows for recycled energy to be redirected to specific local uses — in this case, powering electric cars parked nearby. That, he said, boosts efficiency."],

["真题·七选五","(36)",["The key is consistency.","Help kids develop analytical skills.","Model the work ethic you want to see.","Instead, encourage them to do differently next time.","Sometimes, a cleaner living room is the best reward.","Progress can be slow, and you'll wonder if it's all sinking in.","Not every child is born with the willpower of a marathon runner."],0,"空后说当家务像刷牙一样成为日常，孩子才会内化，强调长期反复；A 项“关键在于持之以恒”承上启下。B 项分析能力、E 项奖励与习惯养成无关；C 项是下一段主旨，G 项属“目标”一段。","2026·全国二卷","Ways to Teach Kids Work Ethic Early\n\nEver watched your child try to get out of doing housework by making excuses? If only the effort they put into avoiding responsibility could be redirected into, well, actual responsibility. In fact, building work ethic (道德) in kids doesn't require military-style drills. Here are four simple and practical ways.\n\n• Make housework part of the family routine.\nInvolve your child in the daily running of the house; tidying toys, feeding the dog, watering the plants. (36) When the tasks become as routine as brushing teeth, kids internalise that helping with housework is simply part of life.\n\n(37)\nYou can't expect your child to tackle their tasks with enthusiasm while you're complaining about loading the dishwasher. If your child sees you enjoying your work and taking pride in a job well done, they're far more likely to do the same.\n\n• Build determination through goals.\n(38) Sometimes you have to help them find their \"thing.\" Set small, achievable goals together with them and celebrate progress, not perfection. The trick is to let them struggle a bit — resist the urge to help fix things the moment they experience a setback.\n\n• Treat mistakes as opportunities.\nFew things strike fear into a child's heart like the prospect of failing. The best way is to normalise mistakes as a natural part of learning. When kids mess up, don't jump in with a rescue mission. (39) Teaching kids to gently and consistently push them toward responsibility, determination, and pride in their efforts. (40) No worry. Those habits you're building now are setting your child up for a lifetime of resilience (韧性) and satisfaction."],

var TR = {"405":{"q":"帕利过夜探险营今年夏天提供多少个夏令营？","o":["2 个。","4 个。","17 个。","21 个。"],"p":"帕利过夜探险营今年夏天为儿童和青少年提供精彩的体验。从播音到街头艺术，这只是所开设的 17 个极具特色的夏令营中的 4 个。\n\n播音营\n\n成为下一位明星记者、新闻撰稿人、导演或制片人。孩子们和营员们将参与我们自己的新闻台的各个环节，制作并主持一档每晚晚餐时间向全营播出的节目。每晚节目都会上传网络，让家长和全世界了解帕利的动态。\n\n特工营\n\n在电影《碟中谍》中，汤姆·克鲁斯让特工这一职业显得酷极了。报名参加为期两周特工营的营员，可以在彩弹场上学习策略与军事技能，了解真实特工的生活。\n\n烹饪营\n\n如果你的孩子喜欢待在厨房里，烹饪营肯定最合适。营员们将学习烤、炸、切等技艺，还能带走一些食谱与家人分享。\n\n街头艺术营\n\n这个营把创作自由提升到全新的层次。营员们将彼此分享色彩斑斓的点子和想象，合作构思、素描并用非传统技法绘画，创作出最酷的壁画，公开展出供所有人观赏。"},"406":{"q":"营员在播音营会做什么？","o":["建一个网站。","运营一家新闻台。","见到一位明星记者。","举办一场晚宴。"],"p":"帕利过夜探险营今年夏天为儿童和青少年提供精彩的体验。从播音到街头艺术，这只是所开设的 17 个极具特色的夏令营中的 4 个。\n\n播音营\n\n成为下一位明星记者、新闻撰稿人、导演或制片人。孩子们和营员们将参与我们自己的新闻台的各个环节，制作并主持一档每晚晚餐时间向全营播出的节目。每晚节目都会上传网络，让家长和全世界了解帕利的动态。\n\n特工营\n\n在电影《碟中谍》中，汤姆·克鲁斯让特工这一职业显得酷极了。报名参加为期两周特工营的营员，可以在彩弹场上学习策略与军事技能，了解真实特工的生活。\n\n烹饪营\n\n如果你的孩子喜欢待在厨房里，烹饪营肯定最合适。营员们将学习烤、炸、切等技艺，还能带走一些食谱与家人分享。\n\n街头艺术营\n\n这个营把创作自由提升到全新的层次。营员们将彼此分享色彩斑斓的点子和想象，合作构思、素描并用非传统技法绘画，创作出最酷的壁画，公开展出供所有人观赏。"},"407":{"q":"哪个营会吸引对烹饪感兴趣的孩子？","o":["播音营。","特工营。","烹饪营。","街头艺术营。"],"p":"帕利过夜探险营今年夏天为儿童和青少年提供精彩的体验。从播音到街头艺术，这只是所开设的 17 个极具特色的夏令营中的 4 个。\n\n播音营\n\n成为下一位明星记者、新闻撰稿人、导演或制片人。孩子们和营员们将参与我们自己的新闻台的各个环节，制作并主持一档每晚晚餐时间向全营播出的节目。每晚节目都会上传网络，让家长和全世界了解帕利的动态。\n\n特工营\n\n在电影《碟中谍》中，汤姆·克鲁斯让特工这一职业显得酷极了。报名参加为期两周特工营的营员，可以在彩弹场上学习策略与军事技能，了解真实特工的生活。\n\n烹饪营\n\n如果你的孩子喜欢待在厨房里，烹饪营肯定最合适。营员们将学习烤、炸、切等技艺，还能带走一些食谱与家人分享。\n\n街头艺术营\n\n这个营把创作自由提升到全新的层次。营员们将彼此分享色彩斑斓的点子和想象，合作构思、素描并用非传统技法绘画，创作出最酷的壁画，公开展出供所有人观赏。"},"408":{"q":"作者与学生进行这段对话的目的是什么？","o":["收走那把水枪。","谈谈她的孙辈。","推荐一些玩具。","解释她的教学法。"],"p":"学年即将结束，大家情绪高涨。我离开讲台 15 年后重返教学岗位，要应付从书包里冒出来的各种“禁果”。那阵子正赶上水枪流行。\n\n我决定想个办法来对付这些禁果。\n\n“请把那把水枪拿给我，”我说，“我要把它放进我奶奶的箱子。”\n\n“那是什么？”他们问。\n\n“那是一个大木箱，装满了给我孙辈的玩具，”我回答。\n\n“你根本没有孙辈，”有人说。\n\n“现在没有，”我答道，“但总有一天会有。到那时，我的箱子里会装满给他们的好东西。”\n\n我那虚构的“奶奶的箱子”在那年春天以及后来都灵验如魔法。有时学生会请我描述箱子里有什么，我便努力回想那些所谓被没收的物件——因为我很少真把它们留下。通常“犯规者”会在放学时出现，我就把东西还给他。\n\n几年过去，我的第一个孙辈戈登出生了。我把这份喜悦与那一年的班级分享。有人就说：“现在你可以用你的奶奶的箱子了。”从那以后，学生不再来讨要东西，而是说：“没关系，把它放进你的奶奶的箱子，留给戈登吧。”\n\n我喜欢谈论这个虚构的箱子，不仅跟学生谈，也跟自己的孩子谈。他们爱听我讲没收来的那些“禁果”。后来有一个圣诞节，我收到一份意外的礼物——一个做得非常漂亮的大木箱。我的儿子布鲁斯把“奶奶的箱子”变成了现实。"},"409":{"q":"第八段中画线词“the offender”指谁？","o":["学生的家长。","木箱的制作者。","作者的孙辈。","违禁物品的主人。"],"p":"学年即将结束，大家情绪高涨。我离开讲台 15 年后重返教学岗位，要应付从书包里冒出来的各种“禁果”。那阵子正赶上水枪流行。\n\n我决定想个办法来对付这些禁果。\n\n“请把那把水枪拿给我，”我说，“我要把它放进我奶奶的箱子。”\n\n“那是什么？”他们问。\n\n“那是一个大木箱，装满了给我孙辈的玩具，”我回答。\n\n“你根本没有孙辈，”有人说。\n\n“现在没有，”我答道，“但总有一天会有。到那时，我的箱子里会装满给他们的好东西。”\n\n我那虚构的“奶奶的箱子”在那年春天以及后来都灵验如魔法。有时学生会请我描述箱子里有什么，我便努力回想那些所谓被没收的物件——因为我很少真把它们留下。通常“犯规者”会在放学时出现，我就把东西还给他。\n\n几年过去，我的第一个孙辈戈登出生了。我把这份喜悦与那一年的班级分享。有人就说：“现在你可以用你的奶奶的箱子了。”从那以后，学生不再来讨要东西，而是说：“没关系，把它放进你的奶奶的箱子，留给戈登吧。”\n\n我喜欢谈论这个虚构的箱子，不仅跟学生谈，也跟自己的孩子谈。他们爱听我讲没收来的那些“禁果”。后来有一个圣诞节，我收到一份意外的礼物——一个做得非常漂亮的大木箱。我的儿子布鲁斯把“奶奶的箱子”变成了现实。"},"410":{"q":"得知戈登出生后，学生们做了什么？","o":["他们去和婴儿玩。","他们要求看看奶奶的箱子。","他们给戈登做了礼物。","他们不再讨要自己的玩具。"],"p":"学年即将结束，大家情绪高涨。我离开讲台 15 年后重返教学岗位，要应付从书包里冒出来的各种“禁果”。那阵子正赶上水枪流行。\n\n我决定想个办法来对付这些禁果。\n\n“请把那把水枪拿给我，”我说，“我要把它放进我奶奶的箱子。”\n\n“那是什么？”他们问。\n\n“那是一个大木箱，装满了给我孙辈的玩具，”我回答。\n\n“你根本没有孙辈，”有人说。\n\n“现在没有，”我答道，“但总有一天会有。到那时，我的箱子里会装满给他们的好东西。”\n\n我那虚构的“奶奶的箱子”在那年春天以及后来都灵验如魔法。有时学生会请我描述箱子里有什么，我便努力回想那些所谓被没收的物件——因为我很少真把它们留下。通常“犯规者”会在放学时出现，我就把东西还给他。\n\n几年过去，我的第一个孙辈戈登出生了。我把这份喜悦与那一年的班级分享。有人就说：“现在你可以用你的奶奶的箱子了。”从那以后，学生不再来讨要东西，而是说：“没关系，把它放进你的奶奶的箱子，留给戈登吧。”\n\n我喜欢谈论这个虚构的箱子，不仅跟学生谈，也跟自己的孩子谈。他们爱听我讲没收来的那些“禁果”。后来有一个圣诞节，我收到一份意外的礼物——一个做得非常漂亮的大木箱。我的儿子布鲁斯把“奶奶的箱子”变成了现实。"},"411":{"q":"关于作者，我们可以推断出什么？","o":["她喜欢讲笑话。","她是一位严格又聪明的老师。","她喜欢做木工。","她是一位尽责的祖母。"],"p":"学年即将结束，大家情绪高涨。我离开讲台 15 年后重返教学岗位，要应付从书包里冒出来的各种“禁果”。那阵子正赶上水枪流行。\n\n我决定想个办法来对付这些禁果。\n\n“请把那把水枪拿给我，”我说，“我要把它放进我奶奶的箱子。”\n\n“那是什么？”他们问。\n\n“那是一个大木箱，装满了给我孙辈的玩具，”我回答。\n\n“你根本没有孙辈，”有人说。\n\n“现在没有，”我答道，“但总有一天会有。到那时，我的箱子里会装满给他们的好东西。”\n\n我那虚构的“奶奶的箱子”在那年春天以及后来都灵验如魔法。有时学生会请我描述箱子里有什么，我便努力回想那些所谓被没收的物件——因为我很少真把它们留下。通常“犯规者”会在放学时出现，我就把东西还给他。\n\n几年过去，我的第一个孙辈戈登出生了。我把这份喜悦与那一年的班级分享。有人就说：“现在你可以用你的奶奶的箱子了。”从那以后，学生不再来讨要东西，而是说：“没关系，把它放进你的奶奶的箱子，留给戈登吧。”\n\n我喜欢谈论这个虚构的箱子，不仅跟学生谈，也跟自己的孩子谈。他们爱听我讲没收来的那些“禁果”。后来有一个圣诞节，我收到一份意外的礼物——一个做得非常漂亮的大木箱。我的儿子布鲁斯把“奶奶的箱子”变成了现实。"},"412":{"q":"金门大桥在 50 岁生日时发生了什么？","o":["它承载了超出自己承受能力的重量。","它在强风中剧烈摇晃。","它的车行道被车辆损坏。","它的通道被许多人堵住。"],"p":"1987 年 5 月，金门大桥举办了 50 岁生日庆典。大桥对机动车封闭，以便人们步行过桥。组织者预计大约会有 5 万人到场，结果多达 80 万人涌向通往大桥的道路。当桥上人数达到 25 万时，工程师们发现了可怕的情况：桥面正在下陷，因为这座桥承受了它历来被要求承载的最重负荷。更糟的是，桥开始晃动。当局封闭了上桥通道，成千上万的人返回陆地，一场灾难得以避免。\n\n这个故事只是《宽恕设计：理解失败》一书中的众多故事之一。这本书既是一封写给工程学的情书，也是一曲献给工程失败的赞歌。作者亨利·彼得罗斯基博士长期写作灾难题材，书中收录了“挑战者号”与“哥伦比亚号”航天飞机的失事，以及“泰坦尼克号”的沉没。\n\n尽管他承认，工程作品可能因设计者或建造者弄错而出问题，但在这本书中，彼得罗斯基博士把视野放宽，去考察这些失败发生的更大背景。有时装置失灵，是因为好的设计用了质量低劣的材料，且施工拙劣；又或者某一设计太好，被反复照搬到别处，加上看似无害的改进，直到某天它突然彻底失效。\n\n读者不仅会读到熟悉的故事，还会读到一些新故事，以及一段动人的讨论：工程师对公众负有怎样的责任，以及如何帮助年轻工程师领会这些责任。\n\n“成功就是成功，仅此而已，”彼得罗斯基博士写道，“带来进步的恰恰是失败。”"},"413":{"q":"根据第三段，下列哪项是彼得罗斯基博士的观点？","o":["没有一种设计能在各地都受欢迎。","施工比设计更重要。","并非所有灾难都由工程设计造成。","对工程作品进行改进是必要的。"],"p":"1987 年 5 月，金门大桥举办了 50 岁生日庆典。大桥对机动车封闭，以便人们步行过桥。组织者预计大约会有 5 万人到场，结果多达 80 万人涌向通往大桥的道路。当桥上人数达到 25 万时，工程师们发现了可怕的情况：桥面正在下陷，因为这座桥承受了它历来被要求承载的最重负荷。更糟的是，桥开始晃动。当局封闭了上桥通道，成千上万的人返回陆地，一场灾难得以避免。\n\n这个故事只是《宽恕设计：理解失败》一书中的众多故事之一。这本书既是一封写给工程学的情书，也是一曲献给工程失败的赞歌。作者亨利·彼得罗斯基博士长期写作灾难题材，书中收录了“挑战者号”与“哥伦比亚号”航天飞机的失事，以及“泰坦尼克号”的沉没。\n\n尽管他承认，工程作品可能因设计者或建造者弄错而出问题，但在这本书中，彼得罗斯基博士把视野放宽，去考察这些失败发生的更大背景。有时装置失灵，是因为好的设计用了质量低劣的材料，且施工拙劣；又或者某一设计太好，被反复照搬到别处，加上看似无害的改进，直到某天它突然彻底失效。\n\n读者不仅会读到熟悉的故事，还会读到一些新故事，以及一段动人的讨论：工程师对公众负有怎样的责任，以及如何帮助年轻工程师领会这些责任。\n\n“成功就是成功，仅此而已，”彼得罗斯基博士写道，“带来进步的恰恰是失败。”"},"414":{"q":"最后一段暗示了什么？","o":["失败能带来进步。","成功会导致自负。","失败应当被避免。","成功来自共同努力。"],"p":"1987 年 5 月，金门大桥举办了 50 岁生日庆典。大桥对机动车封闭，以便人们步行过桥。组织者预计大约会有 5 万人到场，结果多达 80 万人涌向通往大桥的道路。当桥上人数达到 25 万时，工程师们发现了可怕的情况：桥面正在下陷，因为这座桥承受了它历来被要求承载的最重负荷。更糟的是，桥开始晃动。当局封闭了上桥通道，成千上万的人返回陆地，一场灾难得以避免。\n\n这个故事只是《宽恕设计：理解失败》一书中的众多故事之一。这本书既是一封写给工程学的情书，也是一曲献给工程失败的赞歌。作者亨利·彼得罗斯基博士长期写作灾难题材，书中收录了“挑战者号”与“哥伦比亚号”航天飞机的失事，以及“泰坦尼克号”的沉没。\n\n尽管他承认，工程作品可能因设计者或建造者弄错而出问题，但在这本书中，彼得罗斯基博士把视野放宽，去考察这些失败发生的更大背景。有时装置失灵，是因为好的设计用了质量低劣的材料，且施工拙劣；又或者某一设计太好，被反复照搬到别处，加上看似无害的改进，直到某天它突然彻底失效。\n\n读者不仅会读到熟悉的故事，还会读到一些新故事，以及一段动人的讨论：工程师对公众负有怎样的责任，以及如何帮助年轻工程师领会这些责任。\n\n“成功就是成功，仅此而已，”彼得罗斯基博士写道，“带来进步的恰恰是失败。”"},"415":{"q":"本文是什么体裁？","o":["新闻报道。","短篇小说。","书评。","研究论文。"],"p":"1987 年 5 月，金门大桥举办了 50 岁生日庆典。大桥对机动车封闭，以便人们步行过桥。组织者预计大约会有 5 万人到场，结果多达 80 万人涌向通往大桥的道路。当桥上人数达到 25 万时，工程师们发现了可怕的情况：桥面正在下陷，因为这座桥承受了它历来被要求承载的最重负荷。更糟的是，桥开始晃动。当局封闭了上桥通道，成千上万的人返回陆地，一场灾难得以避免。\n\n这个故事只是《宽恕设计：理解失败》一书中的众多故事之一。这本书既是一封写给工程学的情书，也是一曲献给工程失败的赞歌。作者亨利·彼得罗斯基博士长期写作灾难题材，书中收录了“挑战者号”与“哥伦比亚号”航天飞机的失事，以及“泰坦尼克号”的沉没。\n\n尽管他承认，工程作品可能因设计者或建造者弄错而出问题，但在这本书中，彼得罗斯基博士把视野放宽，去考察这些失败发生的更大背景。有时装置失灵，是因为好的设计用了质量低劣的材料，且施工拙劣；又或者某一设计太好，被反复照搬到别处，加上看似无害的改进，直到某天它突然彻底失效。\n\n读者不仅会读到熟悉的故事，还会读到一些新故事，以及一段动人的讨论：工程师对公众负有怎样的责任，以及如何帮助年轻工程师领会这些责任。\n\n“成功就是成功，仅此而已，”彼得罗斯基博士写道，“带来进步的恰恰是失败。”"},"416":{"q":"从第一段我们可以了解到雨林的什么？","o":["它们制造氧气。","它们覆盖广阔面积。","它们得到良好管理。","它们野生生物丰富。"],"p":"热带雨林是各种药用植物、食物、鸟类和动物的家园。你相信吗，亚马孙的一丛灌木里的蚂蚁种类，可能比整个英国的还多？仅仅一公顷雨林中就能找到约 480 种树木。\n\n雨林是地球之肺——储存大量二氧化碳，并产生世界上相当一部分氧气。雨林有自己完美的存续系统：高大的树木用枝叶组成树冠层，保护自身、较小的植物以及雨林动物免受暴雨、烈日酷热和强风之害。\n\n令人惊奇的是，树木的生长方式使得彼此的枝叶虽然靠得很近，却从不真正相触。科学家认为，这是植物防止树木疾病传播、并让毛毛虫这类食叶昆虫更难生存的办法。为了在林中生存，动物必须爬、跳或飞过这些缝隙。雨林的地面并不像电影里那样满是缠绕的枝叶和灌木，而是相当空旷——那里正是落叶变成树木和其他林下生物养分之所在。\n\n它们叫“雨”林可不是白叫的！雨林 75% 的降雨可以由自身产生。一年至少 80 英寸的降雨属正常，有些地区年降雨量可高达 430 英寸。这是真正的雨——小雨时伞还能护你，遇上暴雨就无济于事了。仅仅两小时，溪流就能上涨十到二十英尺。大片雨林的湿气有助于形成雨云，这些雨云可能飘到其他缺雨的国家。"},"417":{"q":"下列哪项对雨林的存续贡献最大？","o":["暴雨。","高大的树木。","小植物。","雨林动物。"],"p":"热带雨林是各种药用植物、食物、鸟类和动物的家园。你相信吗，亚马孙的一丛灌木里的蚂蚁种类，可能比整个英国的还多？仅仅一公顷雨林中就能找到约 480 种树木。\n\n雨林是地球之肺——储存大量二氧化碳，并产生世界上相当一部分氧气。雨林有自己完美的存续系统：高大的树木用枝叶组成树冠层，保护自身、较小的植物以及雨林动物免受暴雨、烈日酷热和强风之害。\n\n令人惊奇的是，树木的生长方式使得彼此的枝叶虽然靠得很近，却从不真正相触。科学家认为，这是植物防止树木疾病传播、并让毛毛虫这类食叶昆虫更难生存的办法。为了在林中生存，动物必须爬、跳或飞过这些缝隙。雨林的地面并不像电影里那样满是缠绕的枝叶和灌木，而是相当空旷——那里正是落叶变成树木和其他林下生物养分之所在。\n\n它们叫“雨”林可不是白叫的！雨林 75% 的降雨可以由自身产生。一年至少 80 英寸的降雨属正常，有些地区年降雨量可高达 430 英寸。这是真正的雨——小雨时伞还能护你，遇上暴雨就无济于事了。仅仅两小时，溪流就能上涨十到二十英尺。大片雨林的湿气有助于形成雨云，这些雨云可能飘到其他缺雨的国家。"},"418":{"q":"为什么不同树木的枝叶要避免相互接触？","o":["为了获得更多阳光。","为了获得更多生长空间。","为了自我保护。","为了探测昆虫。"],"p":"热带雨林是各种药用植物、食物、鸟类和动物的家园。你相信吗，亚马孙的一丛灌木里的蚂蚁种类，可能比整个英国的还多？仅仅一公顷雨林中就能找到约 480 种树木。\n\n雨林是地球之肺——储存大量二氧化碳，并产生世界上相当一部分氧气。雨林有自己完美的存续系统：高大的树木用枝叶组成树冠层，保护自身、较小的植物以及雨林动物免受暴雨、烈日酷热和强风之害。\n\n令人惊奇的是，树木的生长方式使得彼此的枝叶虽然靠得很近，却从不真正相触。科学家认为，这是植物防止树木疾病传播、并让毛毛虫这类食叶昆虫更难生存的办法。为了在林中生存，动物必须爬、跳或飞过这些缝隙。雨林的地面并不像电影里那样满是缠绕的枝叶和灌木，而是相当空旷——那里正是落叶变成树木和其他林下生物养分之所在。\n\n它们叫“雨”林可不是白叫的！雨林 75% 的降雨可以由自身产生。一年至少 80 英寸的降雨属正常，有些地区年降雨量可高达 430 英寸。这是真正的雨——小雨时伞还能护你，遇上暴雨就无济于事了。仅仅两小时，溪流就能上涨十到二十英尺。大片雨林的湿气有助于形成雨云，这些雨云可能飘到其他缺雨的国家。"},"419":{"q":"下列哪项最适合作为本文标题？","o":["赐予生命的雨林","丛林法则","亚马孙的动物","雨林的天气"],"p":"热带雨林是各种药用植物、食物、鸟类和动物的家园。你相信吗，亚马孙的一丛灌木里的蚂蚁种类，可能比整个英国的还多？仅仅一公顷雨林中就能找到约 480 种树木。\n\n雨林是地球之肺——储存大量二氧化碳，并产生世界上相当一部分氧气。雨林有自己完美的存续系统：高大的树木用枝叶组成树冠层，保护自身、较小的植物以及雨林动物免受暴雨、烈日酷热和强风之害。\n\n令人惊奇的是，树木的生长方式使得彼此的枝叶虽然靠得很近，却从不真正相触。科学家认为，这是植物防止树木疾病传播、并让毛毛虫这类食叶昆虫更难生存的办法。为了在林中生存，动物必须爬、跳或飞过这些缝隙。雨林的地面并不像电影里那样满是缠绕的枝叶和灌木，而是相当空旷——那里正是落叶变成树木和其他林下生物养分之所在。\n\n它们叫“雨”林可不是白叫的！雨林 75% 的降雨可以由自身产生。一年至少 80 英寸的降雨属正常，有些地区年降雨量可高达 430 英寸。这是真正的雨——小雨时伞还能护你，遇上暴雨就无济于事了。仅仅两小时，溪流就能上涨十到二十英尺。大片雨林的湿气有助于形成雨云，这些雨云可能飘到其他缺雨的国家。"},"420":{"q":"第 36 空应填入的句子是？","o":["这会让得到答案更容易。","以下是与医生交谈的一些建议。","如果治疗无效，你可以换一位医生。","就诊前，把你的感受记录下来。","记住，你的医生和其他医护人员都站在你这边。","带上你的病史，包括目前所用药物的清单。","写下医生说的话，能帮你记住重要信息。"],"p":"与医生交谈\n\n与医生坦诚交谈会让你感觉更好，也能让医生获得所需信息，从而给你最好的治疗。不要因为谈论困扰你的事情而害怕或难为情。（36）\n\n●保持积极。\n\n带着好心情去医生诊室。（37）想想团队合作！想想积极的一面！\n\n●记录你的感受。\n\n（38）这样你就更容易回答关于症状以及药物让你有何感觉的问题，也更容易提出你担心的任何事。务必如实说明你的感受以及这种感受持续了多久。\n\n●（39）\n\n病史是一份清单，包括你的疾病、治疗、医生嘱咐你做的事，以及其他你认为医生应当知道的情况。另外，如果你对任何药物过敏，一定要告诉医生。\n\n●提问。\n\n不要害怕向医生提出任何问题。为了记住不在诊室时想到的所有问题，把它们写下来，就诊时带上这份清单。（40）记住——没有愚蠢的问题。如果你听不懂某个回答，就请医生再解释一遍，直到你明白为止。"},"421":{"q":"第 37 空应填入的句子是？","o":["这会让得到答案更容易。","以下是与医生交谈的一些建议。","如果治疗无效，你可以换一位医生。","就诊前，把你的感受记录下来。","记住，你的医生和其他医护人员都站在你这边。","带上你的病史，包括目前所用药物的清单。","写下医生说的话，能帮你记住重要信息。"],"p":"与医生交谈\n\n与医生坦诚交谈会让你感觉更好，也能让医生获得所需信息，从而给你最好的治疗。不要因为谈论困扰你的事情而害怕或难为情。（36）\n\n●保持积极。\n\n带着好心情去医生诊室。（37）想想团队合作！想想积极的一面！\n\n●记录你的感受。\n\n（38）这样你就更容易回答关于症状以及药物让你有何感觉的问题，也更容易提出你担心的任何事。务必如实说明你的感受以及这种感受持续了多久。\n\n●（39）\n\n病史是一份清单，包括你的疾病、治疗、医生嘱咐你做的事，以及其他你认为医生应当知道的情况。另外，如果你对任何药物过敏，一定要告诉医生。\n\n●提问。\n\n不要害怕向医生提出任何问题。为了记住不在诊室时想到的所有问题，把它们写下来，就诊时带上这份清单。（40）记住——没有愚蠢的问题。如果你听不懂某个回答，就请医生再解释一遍，直到你明白为止。"},"422":{"q":"第 38 空应填入的句子是？","o":["这会让得到答案更容易。","以下是与医生交谈的一些建议。","如果治疗无效，你可以换一位医生。","就诊前，把你的感受记录下来。","记住，你的医生和其他医护人员都站在你这边。","带上你的病史，包括目前所用药物的清单
