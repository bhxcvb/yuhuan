<script>
"use strict";
var QS = __QS__;
var TR = __TR__;
var NOS = __NOS__;
var POINTS = __POINTS__;
var KB = __KB__;
var REL = __REL__;
var CLOZE = __CLOZE__;
var WRITING = __WRITING__;
var DICT_RAW = __DICT__;
var DICT = null;
function getDict(){
  if(DICT) return DICT;
  try{ DICT=JSON.parse(DICT_RAW); DICT_RAW=null; }catch(e){ DICT={}; }
  return DICT;
}

// 自定义题库（可导入新题库而不重装 App）
function applyDataset(){
  try{
    if(typeof S!=="undefined" && S && S.dataset && S.dataset.QS && S.dataset.QS.length){
      QS=S.dataset.QS; TR=S.dataset.TR||{}; NOS=S.dataset.NOS||{};
      return true;
    }
  }catch(e){}
  return false;
}

var MODULES = ["时态","语态与一致","从句","非谓语","虚拟语气","情态动词","倒装与强调","词法与搭配"];
var REASONS = [["concept","概念不清"],["careless","粗心"],["reading","没看懂句子"]];
/* 复习间隔（天）：箱位 0–8；掌握后保留长间隔继续复习，而不是删除记录 */
var INT_MULT = { loose:[3,3,5,8,14,30,60,120,240], normal:[1,1,2,4,7,15,30,60,120], tight:[1,1,1,2,3,7,15,30,60] };
function intDays(box){ var m=INT_MULT[S.settings.reviewIntensity]||INT_MULT.normal; return m[Math.min(box,m.length-1)]; }
/* 难度/表现因子：正确率低、反复遗忘、概念性错误 → 缩短间隔 */
function daysBetween(a,b){ try{ return Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000); }catch(e){ return 0; } }
function easeFactor(i, reason){
  var q=S.q[i]||{n:0,right:0};
  var acc=q.n?q.right/q.n:0.75;
  var f=1;
  if(acc<0.4) f*=0.6; else if(acc<0.6) f*=0.8; else if(acc>0.9) f*=1.2;
  var rv=S.rev[i]||{};
  if((rv.lapses||0)>=2) f*=0.8;
  if(reason==="concept") f*=0.85;
  // 长期未复习（逾期超过预期间隔的 1.5 倍）说明可能已遗忘，下次缩短
  if(rv.due){
    var od=daysBetween(dateKey(), rv.due);
    if(od>0){
      var expected=intDays(rv.box||0);
      if(od > expected*1.5) f*=0.75;
    }
  }
  return Math.max(0.5, Math.min(1.8, f));
}
var VERSION = "6.24";
var KEY = "yuhuan_v6";
var SCHEMA = 4;
var OLD_KEYS = ["yuhuan_v5","grammar_v5"];

/* ---------- 学习闭环 ---------- */
var ACH = [
  {id:"q1",   ic:"🌱", t:"第一步",  f:function(){return totalDone()>=1;}},
  {id:"q50",  ic:"🌿", t:"50 题",   f:function(){return totalDone()>=50;}},
  {id:"q200", ic:"🌳", t:"200 题",  f:function(){return totalDone()>=200;}},
  {id:"q600", ic:"🏅", t:"600 题",  f:function(){return totalDone()>=600;}},
  {id:"q1000",ic:"👑", t:"1000 题", f:function(){return totalDone()>=1000;}},
  {id:"streak7", ic:"🔥", t:"7 天", f:function(){return streak()>=7;}},
  {id:"pt10", ic:"🎯", t:"10 点",   f:function(){return masteredPoints()>=10;}},
  {id:"ptall",ic:"🧠", t:"全掌握",  f:function(){return masteredPoints()>=51;}}
];

var S = null, phase = "home", ses = null, timerId = null;
var ui = { detail:null, openMod:"", essay:0, qid:null, mod:"", words:0 };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];}); }
function fallbackCopy(t, okMsg){
  try{
    var ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; ta.style.left="-9999px";
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
    ta.remove(); toast(ok?(okMsg||"已复制"):"复制失败，请长按选择");
  }catch(e){ toast("复制失败，请长按选择"); }
}
function copyText(t, okMsg){
  if(!t){ toast("没有可复制的内容"); return; }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast(okMsg||"已复制"); }, function(){ fallbackCopy(t, okMsg); });
      return;
    }
  }catch(e){}
  fallbackCopy(t, okMsg);
}
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function dateKey(d){ d=d||new Date(); var p=function(n){return String(n).padStart(2,"0");}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return dateKey(d); }

function initStore(){ return {q:{},log:{},wrong:[],rev:{},reason:{},trend:[],words:[],ach:[],seenGuide:false,profiles:{},activeProfile:"builtin",settings:{theme:"dark",daily:10,examDate:"",checkUpdate:true,reviewIntensity:"normal",weekly:70}}; }

/* ---------- 多题库：每个题库独立保存学习进度、错题与复习记录 ---------- */
var PROFILE_FIELDS=["q","log","wrong","rev","reason","trend"];
/* 题库指纹：内容哈希 + 题量，跨设备稳定，不需要服务端 */
function datasetHash(qs){
  var str;
  try{ str=JSON.stringify(qs); }catch(e){ str=String(qs&&qs.length); }
  var h=2166136261;
  for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return "d"+(h>>>0).toString(16)+"_"+(qs&&qs.length);
}
function activeDatasetId(){
  var ds=S&&S.dataset;
  if(ds && ds.QS && ds.QS.length){ if(!ds.id) ds.id=datasetHash(ds.QS); return ds.id; }
  return "builtin";
}
function activeDatasetIdOfStore(o){
  var ds=o&&o.dataset;
  if(ds && ds.QS && ds.QS.length){ if(!ds.id) ds.id=datasetHash(ds.QS); return ds.id; }
  return "builtin";
}
function freshProfile(){ var d=initStore(),p={}; for(var i=0;i<PROFILE_FIELDS.length;i++) p[PROFILE_FIELDS[i]]=d[PROFILE_FIELDS[i]]; return p; }
function profileSnapshotOf(src){ var p={}; for(var i=0;i<PROFILE_FIELDS.length;i++){ var f=PROFILE_FIELDS[i]; p[f]=src[f]; } return p; }
function applyProfile(p){ var d=initStore(); for(var i=0;i<PROFILE_FIELDS.length;i++){ var f=PROFILE_FIELDS[i]; S[f]=(p && p[f]!==undefined)?p[f]:d[f]; } }
/* 保证：当前题库进度放在顶层，profiles 里只放「其他题库」的进度，避免重复存储 */
function syncActive(){
  if(!S.profiles || typeof S.profiles!=="object" || Array.isArray(S.profiles)) S.profiles={};
  S.activeProfile=activeDatasetId();
  delete S.profiles[S.activeProfile];
}

function normalizeProfile(o){
  var d=initStore();
  if(!o || typeof o!=="object" || Array.isArray(o)) o={};
  if(typeof o.q!=="object" || Array.isArray(o.q)) o.q={};
  var q2={}; for(var qi in o.q){ var qv=o.q[qi]; if(qv && typeof qv==="object"){ var qn=Math.max(0,parseInt(qv.n,10)||0); q2[qi]={n:qn,right:Math.min(qn,Math.max(0,parseInt(qv.right,10)||0))}; } } o.q=q2;
  if(typeof o.log!=="object" || Array.isArray(o.log)) o.log={};
  var l2={}; for(var dk in o.log){ var lv=o.log[dk]; if(lv && typeof lv==="object"){ var ln=Math.max(0,parseInt(lv.n,10)||0); l2[dk]={n:ln,r:Math.min(ln,Math.max(0,parseInt(lv.r,10)||0))}; } } o.log=l2;
  if(typeof o.rev!=="object" || Array.isArray(o.rev)) o.rev={};
  var r2={}; for(var ri in o.rev){ var rv=o.rev[ri]; if(rv && typeof rv==="object" && rv.due) r2[ri]={box:Math.max(0,parseInt(rv.box,10)||0),due:String(rv.due),err:Math.max(0,parseInt(rv.err,10)||0),lapses:Math.max(0,parseInt(rv.lapses,10)||0)}; } o.rev=r2;
  if(typeof o.reason!=="object" || Array.isArray(o.reason)) o.reason={};
  if(!Array.isArray(o.wrong)) o.wrong=[];
  o.wrong=o.wrong.filter(function(x){ return typeof x==="number" && x>=0; });
  if(!Array.isArray(o.trend)) o.trend=[];
  o.trend=o.trend.filter(function(t){ return t && typeof t.d==="string" && typeof t.v==="number"; }).slice(-90);
  return o;
}

/* 统一数据结构规范化：加载、导入、备份恢复、撤销都走这里，兼容旧版本 */
function normalizeStore(o){
  var d=initStore();
  if(!o || typeof o!=="object" || Array.isArray(o)) o={};
  for(var k in d){ if(!(k in o) || o[k]===null || o[k]===undefined) o[k]=JSON.parse(JSON.stringify(d[k])); }
  if(typeof o.settings!=="object" || !o.settings || Array.isArray(o.settings)) o.settings=JSON.parse(JSON.stringify(d.settings));
  for(var sk in d.settings){ if(typeof o.settings[sk]!==typeof d.settings[sk]) o.settings[sk]=d.settings[sk]; }
  var np=normalizeProfile(o);
  for(var i=0;i<PROFILE_FIELDS.length;i++){ o[PROFILE_FIELDS[i]]=np[PROFILE_FIELDS[i]]; }
  if(!Array.isArray(o.words)) o.words=[];
  o.words=o.words.filter(function(w){ return w && typeof w.w==="string" && w.w; });
  if(!Array.isArray(o.ach)) o.ach=[];
  o.ach=o.ach.filter(function(x){ return typeof x==="string"; });
  if(!Array.isArray(o.errors)) o.errors=[];
  if(o.dataset && (!o.dataset.QS || !Array.isArray(o.dataset.QS) || !o.dataset.QS.length)) delete o.dataset;
  if(o.dataset && o.dataset.QS && !o.dataset.id) o.dataset.id=datasetHash(o.dataset.QS);
  if(!o.profiles || typeof o.profiles!=="object" || Array.isArray(o.profiles)) o.profiles={};
  var prof={}; for(var pid in o.profiles){ prof[pid]=normalizeProfile(o.profiles[pid]); } o.profiles=prof;
  if(typeof o.activeProfile!=="string" || !o.activeProfile) o.activeProfile=activeDatasetIdOfStore(o);
  delete o.profiles[o.activeProfile];
  o.schema=SCHEMA;
  return o;
}
function migrate(S){ return normalizeStore(S); }

var CORRUPT_RAW=null;
function loadStore(){
  var raw=null, migrated=false, corrupt=false;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ try{ for(var i=0;i<OLD_KEYS.length;i++){ var o=localStorage.getItem(OLD_KEYS[i]); if(o){ raw=o; migrated=true; break; } } }catch(e){} }
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=null; corrupt=true; } }
  if(S && (typeof S!=="object" || Array.isArray(S) || !S.q)) { S=null; corrupt=true; }
  if(corrupt && raw){
    CORRUPT_RAW=raw;
    try{ localStorage.setItem("yuhuan_corrupt_"+dateKey()+"_"+Date.now(), raw); }catch(e){}
  }
  if(!S) S=initStore();
  S=normalizeStore(S);
  // 旧版本数据顶层就是「当前题库」的进度；若 profiles 里存了当前题库的进度则载入
  var id=activeDatasetId();
  if(S.profiles[id]){ applyProfile(S.profiles[id]); delete S.profiles[id]; }
  S.activeProfile=id;
  if(migrated) save();
}
function save(){
  var ok=true;
  try{ snapshot(); syncActive(); localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ ok=false; toast("保存失败，存储空间可能已满"); }
  try{ idbSnapshot(); }catch(e){}
  return ok;
}
/* 环境切换（导入题库/恢复题库/恢复整包备份）后，把顶层进度对齐到当前题库 */
function settleActive(){
  if(!S.profiles || typeof S.profiles!=="object" || Array.isArray(S.profiles)) S.profiles={};
  var id=activeDatasetId(), cur=S.activeProfile;
  if(cur && cur!==id){ S.profiles[cur]=profileSnapshotOf(S); }
  var p=S.profiles[id];
  if(p){ delete S.profiles[id]; applyProfile(p); }
  else if(cur!==id){ applyProfile(freshProfile()); }
  S.activeProfile=id;
  syncActive();
}
/* 切换题库：保存当前进度到 profiles，再载入目标题库自己的进度（没有则从零开始） */
function switchDataset(ds){
  var backup=null;
  try{ backup=JSON.stringify(S); }catch(e){}
  if(!S.profiles || typeof S.profiles!=="object" || Array.isArray(S.profiles)) S.profiles={};
  var cur=S.activeProfile||activeDatasetId();
  S.profiles[cur]=profileSnapshotOf(S);
  if(ds){ S.dataset=ds; if(!S.dataset.id) S.dataset.id=datasetHash(S.dataset.QS); }
  else delete S.dataset;
  var id=activeDatasetId();
  if(S.profiles[id]){ applyProfile(S.profiles[id]); delete S.profiles[id]; }
  else applyProfile(freshProfile());
  S.activeProfile=id;
  var ok=save();
  if(!ok && backup){ try{ S=JSON.parse(backup); }catch(e){} }
  return ok;
}
/* 导入进度/恢复备份：识别旧格式并落到正确的题库 profile，避免把 A 题库进度套到 B 题库 */
function adoptImportedStore(o, keepSettings){
  var src=(o && typeof o==="object")?o:{};
  var legacy=!src.profiles && !src.activeProfile;
  var localDs=S.dataset, curSet=S.settings||{};
  var imp=normalizeStore(src);
  if(!imp.dataset && localDs) imp.dataset=localDs;
  if(legacy){
    // v6.23 及更早的备份没有题库信息：按旧行为归属到当前题库
    imp.activeProfile=activeDatasetIdOfStore(imp);
  }
  if(keepSettings){
    imp.settings=imp.settings||{};
    for(var k in curSet){ if(curSet[k]!==undefined) imp.settings[k]=curSet[k]; }
  }
  S=imp;
  if(!legacy) settleActive();
  return S;
}

/* ---------- 词典 ---------- */
function lookup(w){
  if(!w) return null;
  w=String(w).toLowerCase().replace(/^[^a-z]+|[^a-z']+$/g,"");
  var tries=[w, w.replace(/'s$/,""), w.replace(/'$/,""), w.replace(/-/g," ")];
  if(w.endsWith("ies")) tries.push(w.slice(0,-3)+"y");
  if(w.endsWith("es")) tries.push(w.slice(0,-2));
  if(w.endsWith("s")) tries.push(w.slice(0,-1));
  if(w.endsWith("ing")) tries.push(w.slice(0,-3), w.slice(0,-3)+"e");
  if(w.endsWith("ed")) tries.push(w.slice(0,-2), w.slice(0,-1));
  for(var i=0;i<tries.length;i++){ var t=tries[i]; if(getDict()[t]) return {w:t, d:getDict()[t]}; }
  return null;
}
function meanOf(w){ var r=lookup(w); return r? r.d.t : ""; }

/* ---------- 错误日志 ---------- */
function logError(msg, stack){
  try{
    if(!S.errors) S.errors=[];
  if(!S.trend) S.trend=[];
    S.errors.push({t:Date.now(), v:VERSION, p:typeof phase==="string"?phase:"", m:String(msg).slice(0,300), s:String(stack||"").slice(0,600)});
    if(S.errors.length>30) S.errors=S.errors.slice(-30);
    save();
  }catch(e){}
}
window.onerror=function(m,src,line,col,err){ logError(m, (err&&err.stack)||(src+":"+line+":"+col)); return false; };
window.addEventListener("unhandledrejection", function(ev){ try{ logError("unhandledrejection: "+(ev.reason&&ev.reason.message||ev.reason), ev.reason&&ev.reason.stack); }catch(e){} });
function errorDump(){ return (S.errors||[]).map(function(e){ return new Date(e.t).toISOString()+" ["+e.v+"/"+e.p+"] "+e.m+"\n"+(e.s||""); }).join("\n\n"); }

/* ---------- 更新检查 ---------- */
var UPD={checked:false,latest:null,url:null};
function checkUpdate(force){
  if(!S.settings.checkUpdate && !force) return;
  var cacheKey="update_check";
  try{
    var raw=localStorage.getItem(cacheKey);
    if(raw && !force){ var c=JSON.parse(raw); if(Date.now()-c.t<12*3600*1000){ compareVersion(c.tag,c.url); return; } }
  }catch(e){}
  try{
    var xhr=new XMLHttpRequest();
    xhr.open("GET","https://api.github.com/repos/bhxcvb/yuhuan/releases/latest",true);
    xhr.timeout=8000;
    xhr.onload=function(){
      try{
        if(xhr.status!==200) return;
        var j=JSON.parse(xhr.responseText);
        var tag=(j.tag_name||"").replace(/^v/,"");
        var url=j.html_url||"https://github.com/bhxcvb/yuhuan/releases";
        try{ localStorage.setItem(cacheKey, JSON.stringify({t:Date.now(),tag:tag,url:url})); }catch(e){}
        compareVersion(tag,url);
      }catch(e){}
    };
    xhr.onerror=function(){};
    xhr.send();
  }catch(e){}
}
function compareVersion(tag,url){
  if(!tag) return;
  UPD.latest=tag; UPD.url=url;
  var cur=VERSION.split(".").map(Number), nw=tag.split(".").map(Number);
  var newer=false;
  for(var i=0;i<Math.max(cur.length,nw.length);i++){
    var a=cur[i]||0,b=nw[i]||0;
    if(b>a){ newer=true; break; }
    if(b<a) break;
  }
  if(newer && phase==="home") render();
}

/* ---------- 薄弱知识点 ---------- */
function weakList(){
  var arr=[];
  for(var i=0;i<POINTS.length;i++){
    var p=POINTS[i][0], s=pointStats(p);
    if(s.total>0){
      var acc=s.acc===null?1:s.acc;
      // 贝叶斯平滑：样本少时向 50% 收缩，避免「答 1 题错 1 题」被误判为最薄弱
      var shrunk=(s.right+1.5)/(s.n+3);
      arr.push({p:p, mod:POINTS[i][7], acc:acc, shrunk:shrunk, n:s.n, attempted:s.attempted, done:s.done, total:s.total, mastery:pointMastery(p), low:s.n<3});
    }
  }
  // 有作答记录的知识点按平滑后正确率排序；没有记录的排在最后
  arr.sort(function(a,b){
    if(a.n===0 && b.n>0) return 1;
    if(b.n===0 && a.n>0) return -1;
    return a.shrunk-b.shrunk || a.mastery-b.mastery || b.n-a.n;
  });
  return arr;
}
/* 推荐练习用的薄弱程度：低正确率 + 低掌握度 + 有足够样本 */
function weakScore(x){
  var acc=x.shrunk!==undefined?x.shrunk:(x.acc||0);
  return (1-acc)*60 + (100-(x.mastery||0))*0.4;
}

/* ---------- 中文反查 ---------- */
var REVIDX=null;
function revIndex(){
  if(REVIDX) return REVIDX;
  REVIDX={};
  var keys=Object.keys(getDict());
  for(var i=0;i<keys.length;i++){
    var w=keys[i];
    if(w.indexOf("'")>=0 || w.indexOf('-')===0) continue;   // 跳过缩写/生僻连字符
    var t=(getDict()[w].t||'');
    // 去掉词性前缀与方括号里的领域标记（[计] [化] 等）
    t=t.replace(/^\s*[a-zA-Z]+\.\s*/,'').replace(/\[[^\]]*\]/g,' ').replace(/【[^】]*】/g,' ').replace(/（[^）]*）/g,' ');
    var segs=t.split(/[^\u4e00-\u9fff]+/);
    for(var j=0;j<segs.length;j++){
      var sg=segs[j];
      if(sg.length<2||sg.length>8) continue;
      var arr=REVIDX[sg]; if(!arr){ arr=REVIDX[sg]=[]; }
      if(arr.length<8 && !arr.some(function(x){return x[0]===w;})) arr.push([w,j]);
    }
  }
  return REVIDX;
}
function isCJK(q){ return /[\u4e00-\u9fff]/.test(q); }
function searchChinese(q,n){
  n=n||12;
  var idx=revIndex(), hit=[];
  var exact=idx[q];
  if(exact) for(var i=0;i<exact.length;i++) hit.push([exact[i][0], exact[i][1]]);   // 完全等于该段
  if(hit.length<n){
    for(var k in idx){
      if(k.length>q.length && k.indexOf(q)===0){
        var arr=idx[k];
        for(var j=0;j<arr.length;j++) hit.push([arr[j][0], 6]);
        if(hit.length>=n*3) break;
      }
    }
  }
  // 排序：译文里越靠前的义项越优先，其次词形短、短语优先
  var seen={}, res=[];
  hit.sort(function(a,b){
    if(a[1]!==b[1]) return a[1]-b[1];
    return a[0].length-b[0].length;
  });
  for(var z=0;z<hit.length;z++){
    var w=hit[z][0];
    if(seen[w]) continue; seen[w]=1; res.push(w);
    if(res.length>=n) break;
  }
  return res;
}
function suggestCNHTML(q){
  q=String(q||"").trim();
  if(!q) return "";
  var arr=searchChinese(q);
  if(!arr.length) return '<div class="sec" style="padding:12px 14px"><div class="hint">没找到对应的英文，换个说法试试（如「网络」「解释」「尽管」）</div></div>';
  return '<div class="sec" style="padding:6px 0">'+arr.map(function(w){
    var f=getDict()[w]||{t:""};
    return '<div data-act="lookup" data-w="'+esc(w)+'" style="display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)">'+
      '<div style="flex:1;min-width:0"><div><b style="font-size:15px">'+esc(w)+'</b>'+(f.p?'<span class="hint" style="margin-left:6px">'+esc(f.p)+'</span>':"")+'</div>'+
      '<div class="hint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc((f.t||"").slice(0,30))+'</div>'+
      (f.e?'<div class="hint" style="opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">例 '+esc(f.e.slice(0,26))+'</div>':"")+'</div></div>';
  }).join("")+'</div>';
}

/* ---------- 查词联想 ---------- */
var WORDSORT=null;
function wordList(){ if(!WORDSORT){ WORDSORT=Object.keys(getDict()).sort(); } return WORDSORT; }
function suggestWords(q,n){
  q=String(q||"").toLowerCase().trim();
  if(!q) return [];
  n=n||12;
  var list=wordList(), pre=[], sub=[], near=[];
  for(var i=0;i<list.length;i++){
    var w=list[i];
    if(w.indexOf(q)===0){ pre.push(w); if(pre.length>=n) break; }
    else if(w.indexOf(q)>0){ if(sub.length<n) sub.push(w); }
    else if(q.length>=2 && w.indexOf(q.slice(0,2))===0 && Math.abs(w.length-q.length)<=2){ if(near.length<n) near.push(w); }
  }
  return pre.concat(sub, near).slice(0,n);
}
function suggestHTML(q){
  if(isCJK(q)) return suggestCNHTML(q);
  var arr=suggestWords(q);
  if(!q.trim()) return "";
  if(!arr.length) return '<div class="sec" style="padding:12px 14px"><div class="hint">没有找到相近的单词</div></div>';
  return '<div class="sec" style="padding:6px 0">'+
    arr.map(function(w){
      var f=getDict()[w]||{t:""};
      return '<div data-act="lookup" data-w="'+esc(w)+'" style="display:flex;gap:10px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)">'+
        '<div style="flex:1;min-width:0"><div><b style="font-size:15px">'+esc(w)+'</b>'+(f.p?'<span class="hint" style="margin-left:6px">'+esc(f.p)+'</span>':"")+

/* ---------- IndexedDB 自动备份 ---------- */
var IDB=null, IDBP=null, IDB_DAY=null;
try{ IDB_DAY=localStorage.getItem("yuhuan_idb_day"); }catch(e){}
function idbOpen(){
  if(IDB) return Promise.resolve(IDB);
  if(IDBP) return IDBP;
  IDBP=new Promise(function(res,rej){
    if(!window.indexedDB) return rej("no idb");
    var r=indexedDB.open("yuhuan",1);
    r.onupgradeneeded=function(){ try{ r.result.createObjectStore("snap"); }catch(e){} };
    r.onsuccess=function(){ IDB=r.result; res(IDB); };
    r.onerror=function(){ IDBP=null; rej("idb error"); };
  });
  return IDBP;
}
function idbPut(key,val){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction("snap","readwrite");
        tx.objectStore("snap").put(val,key);
        tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
      }catch(e){ rej(e); }
    });
  });
}
function idbGet(key){
  return idbOpen().then(function(db){
    return new Promise(function(res,rej){
      try{
        var tx=db.transaction("snap","readonly"), req=tx.objectStore("snap").get(key);
        req.onsuccess=function(){ res(req.result); }; req.onerror=function(){ rej(req.error); };
      }catch(e){ rej(e); }
    });
  });
}

/* ---------- 统计 ---------- */
function qs(i){ if(!S.q[i]) S.q[i]={n:0,right:0}; return S.q[i]; }
function isDone(i){ return !!(S.q[i]&&S.q[i].right>0); }
function pointIds(p){ var a=[]; for(var i=0;i<QS.length;i++){ if(QS[i][7]===p) a.push(i); } return a; }
function moduleIds(m){ var a=[]; for(var i=0;i<QS.length;i++){ if(QS[i][0]===m) a.push(i); } return a; }
function pointProgress(p){ var ids=pointIds(p), d=0; for(var i=0;i<ids.length;i++) if(isDone(ids[i])) d++; return {total:ids.length,done:d}; }
function moduleProgress(m){ var ids=moduleIds(m), d=0; for(var i=0;i<ids.length;i++) if(isDone(ids[i])) d++; return {total:ids.length,done:d}; }
var POINTMOD=null;
function pointMod(p){
  if(!POINTMOD){ POINTMOD={}; for(var i=0;i<POINTS.length;i++) POINTMOD[POINTS[i][0]]=POINTS[i][7]; }
  return POINTMOD[p]||"";
}
/* 知识点统计：真实正确率（不是覆盖率） */
function pointStats(p){
  var ids=pointIds(p), n=0, right=0, attempted=0, done=0;
  for(var i=0;i<ids.length;i++){
    var st=S.q[ids[i]];
    if(st && st.n>0){ n+=st.n; right+=st.right; attempted++; }
    if(isDone(ids[i])) done++;
  }
  return {p:p, mod:pointMod(p), total:ids.length, attempted:attempted, n:n, right:right, done:done, acc:n?right/n:null};
}
/* 掌握度 0–100：正确率 70% + 覆盖度 30% */
function pointMastery(p){
  var s=pointStats(p);
  if(!s.n || !s.total) return 0;
  return Math.max(0,Math.min(100,Math.round(((s.acc||0)*0.7 + (s.done/s.total)*0.3)*100)));
}
function moduleMastery(m){
  var totalW=0, sum=0;
  for(var i=0;i<POINTS.length;i++){
    if(POINTS[i][7]!==m) continue;
    var s=pointStats(POINTS[i][0]);
    if(!s.total) continue;
    sum+=pointMastery(POINTS[i][0])*s.total; totalW+=s.total;
  }
  return totalW?Math.round(sum/totalW):0;
}
function totalDone(){ var d=0; for(var i=0;i<QS.length;i++) if(isDone(i)) d++; return d; }
function masteredPoints(){ var n=0; for(var i=0;i<POINTS.length;i++){ if(pointMastery(POINTS[i][0])>=80) n++; } return n; }
/* 错题智能分类：用户标记的错因优先，未标记时按该知识点历史表现推断 */
function wrongCategory(i){
  var r=S.reason[i]||{};
  if(r.concept) return "concept";
  if(r.careless) return "careless";
  if(r.reading) return "reading";
  var p=QS[i]&&QS[i][7];
  if(p){ var s=pointStats(p); if(s.n>=2){ var acc=s.acc||0; if(acc<0.6) return "concept"; if(acc>=0.8) return "careless"; } }
  return "unknown";
}
function snapshot(){

function streak(){ function has(k){ var l=S.log[k]; return !!(l&&l.n); } var d=new Date(); if(!has(dateKey(d))) d.setDate(d.getDate()-1); var n=0; for(var i=0;i<5000;i++){ if(!has(dateKey(d))) break; n++; d.setDate(d.getDate()-1);} return n; }
function stageInfo(){

function paperDone(src){ var ids=[]; for(var i=0;i<QS.length;i++) if((QS[i][5]||"")===src) ids.push(i); if(!ids.length) return 0; var d=0; for(var k=0;k<ids.length;k++) if(isDone(ids[k])) d++; return d/ids.length; }

/* ---------- 间隔复习 ---------- */
function dueList(){
  var today=dateKey(), out=[];
  for(var k in S.rev){
    var rv=S.rev[k];
    if(rv && rv.due && rv.due<=today) out.push(parseInt(k,10));
  }
  return out.filter(function(i){ return i>=0 && i<QS.length; });
}
function dueCount(){ return dueList().length; }
function schedule(i, ok, reason){
  if(!validQ(i)) return;
  var rv=S.rev[i]||{box:0,due:dateKey(),err:0,lapses:0};
  if(ok){
    var hadErr=rv.err||0;
    rv.box=Math.min(8,(rv.box||0)+1);
    if(hadErr>0) rv.box=Math.min(8,rv.box+1);   // 错过又答对，加速恢复
    rv.err=0;
    var base=intDays(rv.box);
    rv.due=addDays(Math.max(1,Math.round(base*easeFactor(i))));
    rv.last=dateKey();
    S.rev[i]=rv;
  } else {
    rv.err=(rv.err||0)+1;
    if((rv.box||0)>=3) rv.lapses=(rv.lapses||0)+1;   // 已到高箱又错，记为遗忘
    rv.box=0;
    // 第一次错：今天再练一次；连续错两次：推到明天，避免原地打转
    // 概念不清 → 明天再看；粗心/没看懂 → 今天再练
    var nextToday = (reason==="concept")? false : (rv.err<2);
    rv.due = nextToday? dateKey() : addDays(1);
    S.rev[i]=rv;
  }
}

/* ---------- 计划 ---------- */
function weakPoints(n){
  // 至少作答 2 次才参与薄弱点推荐，避免单题样本误判
  var arr=weakList().filter(function(x){ return x.n>=2 && (x.acc<0.9 || x.mastery<90); });
  if(!arr.length) arr=weakList().filter(function(x){ return x.attempted<x.total; });
  return arr.slice(0,n||3);
}
/* 智能推荐练习：到期复习优先 → 薄弱知识点 → 新题补足 */
function recommendList(n){
  n=Math.max(5,n||15);
  var out=[], used={};
  function push(i){ if(!used[i]){ used[i]=1; out.push(i); } }
  var due=dueList().filter(function(i){ return !hasPassage(i); });
  shuffle(due);
  var dueCap=Math.max(1,Math.round(n*0.5));
  for(var i=0;i<due.length && out.length<dueCap;i++) push(due[i]);
  var ws=weakList().filter(function(x){ return x.n>=2 && (x.acc<0.85 || x.mastery<85); }).sort(function(a,b){ return weakScore(b)-weakScore(a); });
  for(var w=0;w<ws.length && out.length<n;w++){
    var ids=pointIds(ws[w].p), pool=ids.filter(function(x){ return !hasPassage(x) && !isDone(x); });
    if(!pool.length) pool=ids.filter(function(x){ return !hasPassage(x); });
    shuffle(pool);
    for(var j=0;j<pool.length && out.length<n;j++) push(pool[j]);
  }
  var fresh=freshList(n);
  for(var f=0;f<fresh.length && out.length<n;f++) push(fresh[f]);
  shuffle(out);
  return out;
}
function freshList(n){
  var pool=singles().filter(function(i){ return !isDone(i); });
  shuffle(pool);
  var out=[], mods={}, i, m;
  // 第一轮：每个模块最多先取 1 题，保证跨模块
  for(i=0;i<pool.length && out.length<n;i++){
    m=QS[pool[i]][0];
    if(!mods[m]){ mods[m]=1; out.push(pool[i]); }
  }
  // 第二轮：剩下的随机补满
  for(i=0;i<pool.length && out.length<n;i++){
    if(out.indexOf(pool[i])<0) out.push(pool[i]);
  }
  shuffle(out);
  return out;
}
function nextNewList(limit){
  var out=[];
  for(var m=0;m<MODULES.length;m++){
    for(var j=0;j<POINTS.length;j++){
      if(POINTS[j][7]!==MODULES[m]) continue;
      var ids=pointIds(POINTS[j][0]);
      for(var k=0;k<ids.length;k++){ if(!isDone(ids[k])) out.push(ids[k]); if(out.length>=limit) return out; }
    }
  }
  return out;
}

var REAL_INDEX=null;

function current(){ return ses&&ses.i<ses.list.length?ses.list[ses.i]:null; }

/* 2022 年后真题官方未公开答案：在解析下方标注来源，避免误导 */
function answerSourceNote(i){

  if(m && parseInt(m[1],10)>=2022) return '<div class="hint" style="margin-top:8px">2022 年后官方未公布答案，本题由项目维护者解答；如发现错误请点「这题有问题」。</div>';

var DUPQ=null;
function dupSet(){
  if(DUPQ) return DUPQ;

    var k=String(q[1]||"").replace(/\s+/g," ").replace(/_{2,}/g,"____").trim().toLowerCase();

function duePassageGroups(){

  }

/* ---------- 篇章模式 ---------- */
function passGroups(cat,src){
  var g={};
  for(var i=0;i<QS.length;i++){
    var q=QS[i];
    if(!q[6]) continue;
    if(cat && q[0]!==cat) continue;
    if(src && (q[5]||"")!==src) continue;
    var k=(q[5]||"")+"|"+q[6].slice(0,40);
    if(!g[k]) g[k]=[];
    g[k].push(i);
  }
  return Object.keys(g).map(function(k){ return {key:k,ids:g[k],src:QS[g[k][0]][5],cat:QS[g[k][0]][0]}; });
}
function sectionsOf(src){
  var out=[];
  var cats=["真题·完形","真题·语法填空","真题·阅读","真题·七选五","短文改错"];
  for(var c=0;c<cats.length;c++){
    var cat=cats[c];
    if(cat==="真题·阅读"||cat==="真题·七选五"){
      var gs=passGroups(cat,src);
      for(var i=0;i<gs.length;i++) out.push({kind:"block",cat:cat,ids:gs[i].ids,label:cat.replace("真题·","")+" 第"+(i+1)+"篇"});
    } else {
      var ids=[];
      for(var j=0;j<QS.length;j++){ if(QS[j][0]===cat && (QS[j][5]||"")===src) ids.push(j); }
      if(ids.length) out.push({kind:"seq",cat:cat,ids:ids,label:cat.replace("真题·","")});
    }
  }
  return out;
}
function startBlock(ids,label){
  if(!ids||!ids.length){ toast("没有题目"); return; }
  ses={mode:"block",label:label||"篇章练习",list:ids.slice(),answers:{},submitted:false,right:0,wrong:0};
  nav("block");
}

/* ---------- 记录 ---------- */
function record(i, ok){
  if(!validQ(i)) return;
  var st=qs(i); st.n++; if(ok) st.right++;
  var l=S.log[dateKey()]||(S.log[dateKey()]={n:0,r:0});
  l.n++; if(ok) l.r=(l.r||0)+1;
  if(!ok && S.wrong.indexOf(i)<0) S.wrong.push(i);
  if(ok){ var k=S.wrong.indexOf(i); if(k>=0 && st.right>=2) S.wrong.splice(k,1); }
  schedule(i, ok);
  save();
}

/* 统一统计口径：报告与分析页共用，避免两边数字不一致（offset=0 本期，offset=span 上一期） */
function rangeStats(span, offset){
  span=Math.max(1,parseInt(span,10)||7); offset=Math.max(0,parseInt(offset,10)||0);
  var days=[], perDay=[], tot=0, rgt=0, mx=1;
  for(var k=span-1;k>=0;k--){
    var dt=new Date(); dt.setDate(dt.getDate()-k-offset);
    var key=dateKey(dt), l=S.log[key]||{};
    var n=Math.max(0,l.n||0), r=Math.min(n,Math.max(0,l.r||0));
    days.push(key); perDay.push({d:key,n:n,r:r}); tot+=n; rgt+=r; if(n>mx) mx=n;
  }
  return {span:span,offset:offset,days:days,perDay:perDay,tot:tot,rgt:rgt,acc:tot?Math.round(rgt/tot*100):0,mx:mx};
}

/* 长按取词：任意英文文本块 */
function openWordSheet(w, ctx){
  var f=lookup(w);
  var d=f?f.d:{};
  var mean=d.t||"词库未收录（可能是专有名词）";
  var ph=d.p? d.p+"\n" : "";
  var ex=d.e? "\n例："+d.e : "";
  var syn=(d.s&&d.s.length)? "\n近义："+d.s.join(" / ") : "";
  $("stitle").innerHTML=esc(w)+' <button class="chip" data-act="pron" data-w="'+esc(w)+'" style="margin-left:6px">🔊 朗读</button>';
  $("stext").textContent=ph+mean+ex+syn+(ctx?"\n\n"+ctx:"");
  $("sok").textContent="加入生词本";
  pendingOk=function(){
    if(S.words.some(function(x){return x.w===w;})){ toast("「"+w+"」已在生词本"); return; }
    S.words.push({w:w,ctx:ctx||"",ts:Date.now()}); save(); toast("已加入生词本："+w);
    if(phase==="words") render();
  };
  $("sheet").className="sheet on";
}

var lpTimer=null;
document.addEventListener("pointerdown", function(ev){
  var t=ev.target;
  if(!t||!t.closest) return;
  if(!t.closest("[data-word]")) return;
  lpTimer=setTimeout(function(){
    try{
      var range=null, pt=null;
      try{ if(document.caretRangeFromPoint) range=document.caretRangeFromPoint(ev.clientX,ev.clientY); }catch(e){}
      try{ if(!range && document.caretPositionFromPoint) pt=document.caretPositionFromPoint(ev.clientX,ev.clientY); }catch(e){}
      var node=range&&range.startContainer, off=range?range.startOffset:0;
      if(!node && pt){ node=pt.offsetNode; off=pt.offset; }
      if(!node) { toast("取词失败，请长按在英文单词上"); return; }
      var text=node.textContent||"";
      var start=off, end=off;
      while(start>0 && /[A-Za-z'-]/.test(text[start-1])) start--;
      while(end<text.length && /[A-Za-z'-]/.test(text[end])) end++;
      var w=text.slice(start,end).trim();
      if(!w || w.length<2){ toast("请长按在一个英文单词上"); return; }
      var ctx=text.slice(Math.max(0,start-50), Math.min(text.length,end+50)).replace(/\s+/g," ").trim();
      openWordSheet(w, ctx);
    }catch(e){ toast("取词失败，请再长按一次"); }
  },520);
}, {passive:true});
document.addEventListener("pointerup", function(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }, {passive:true});
document.addEventListener("pointercancel", function(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } }, {passive:true});
document.addEventListener("contextmenu", function(ev){
  if(ev.target&&ev.target.closest&&ev.target.closest("[data-word]")) ev.preventDefault();
});
document.addEventListener("selectionchange", function(){
  try{ var sel=window.getSelection&&window.getSelection(); if(sel && sel.removeAllRanges && document.activeElement && document.activeElement.tagName!=="TEXTAREA" && document.activeElement.tagName!=="INPUT"){ /* 保留输入框选择 */ } }catch(e){}
});

document.addEventListener("focusin", function(ev){
  var t=ev.target;
  if(!t || (t.tagName!=="INPUT" && t.tagName!=="TEXTAREA")) return;
  setTimeout(function(){
    try{ if(t.scrollIntoView) t.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){ try{ t.scrollIntoView(); }catch(e2){} }
  },300);
});
window.addEventListener("popstate", function(ev){
  stopTimer();
  if(navStack.length){ phase=navStack.pop(); render(); try{ history.pushState({d:navStack.length},""); }catch(e){} }
  else if(phase!=="home"){ phase="home"; render(); try{ history.pushState({d:0},""); }catch(e){} }
});

/* ---------- 启动 ---------- */
loadStore();
applyDataset();
try{ history.replaceState({phase:phase},""); }catch(e){}
if(!S.seenGuide){ S.seenGuide=true; save(); phase="guide"; }
render();
setTimeout(function(){ checkUpdate(false); }, 1500);
setTimeout(autoRecover, 600);
/* PWA：安装提示 */
var deferredPrompt=null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredPrompt=e; if(phase==="mine") render(); });
window.addEventListener("appinstalled", function(){ deferredPrompt=null; toast("已安装到桌面"); });

/* PWA：注册 Service Worker（仅当通过 http/https 打开） */
if(typeof navigator!=="undefined" && "serviceWorker" in navigator && typeof location!=="undefined" && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    try{ reg.update(); }catch(e){}
  }).catch(function(){});
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    try{ toast("应用已更新，重新打开后生效"); }catch(e){}
  });
}
</script>
</body>
</html>
