workflows:
  ios-unsigned:
    name: 语欢 iOS（免签名 IPA）
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "Yuhuan.xcodeproj"
        XCODE_SCHEME: "Yuhuan"
    scripts:
      - name: 准备应用文件
        script: |
          mkdir -p ios/Yuhuan/app
          cp web/index.html ios/Yuhuan/app/index.html
          [ -f reward.webp ] && cp reward.webp ios/Yuhuan/app/ || true
      - name: 安装 XcodeGen
        script: brew install xcodegen
      - name: 生成工程
        script: cd ios && xcodegen generate
      - name: 编译（不签名）
        script: |
          cd ios
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: 打包 IPA
        script: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -qr yuhuan-unsigned.ipa Payload
    artifacts:
      - ios/yuhuan-unsigned.ipa
