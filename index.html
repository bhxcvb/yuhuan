ry them for use in meals down the road.\n\nSuch methods seem obvious, yet so often we just don't think. “Everyone can play a part in reducing waste, whether by not purchasing more food than necessary in your weekly shopping or by asking restaurants to not include the side dish you won't eat,” Curtin says."],
["真题·阅读","What does Curtin's company do?",["It produces kitchen equipment.","It turns rotten arugula into clean fuel.","It helps local farmers grow fruits.","It makes meals out of unwanted food."],3,"考点：细节理解。原文「recovers food and turns it into healthy meals」与 D 完全对应。B 把「回收食物」曲解为制取燃料，文中回收的草莓是「for use in meals」；A 的厨房设备、C 的帮助农民种植均属无中生有。注意 D 中的 unwanted food 是对「捐赠、有瑕疵、临期」食物的概括，不是「腐烂变质」。","2022·新高考I卷","Like most of us, I try to be mindful of food that goes to waste. The arugula (芝麻菜) was to make a nice green salad, rounding out a roast chicken dinner. But I ended up working late. Then friends called with a dinner invitation. I stuck the chicken in the freezer. But as days passed, the arugula went bad. Even worse, I had unthinkingly bought way too much; I could have made six salads with what I threw out.\n\nIn a world where nearly 800 million people a year go hungry, “food waste goes against the moral grain,” as Elizabeth Royte writes in this month's cover story. It's jaw-dropping how much perfectly good food is thrown away — from “ugly” (but quite eatable) vegetables rejected by grocers to large amounts of uneaten dishes thrown into restaurant garbage cans.\n\nProducing food that no one eats wastes the water, fuel, and other resources used to grow it. That makes food waste an environmental problem. In fact, Royte writes, “if food waste were a country, it would be the third largest producer of greenhouse gases in the world.”\n\nIf that's hard to understand, let's keep it as simple as the arugula at the back of my refrigerator. Mike Curtin sees my arugula story all the time — but for him, it's more like 12 boxes of donated strawberries nearing their last days. Curtin is CEO of DC Central Kitchen in Washington, D.C., which recovers food and turns it into healthy meals. Last year it recovered more than 807,500 pounds of food by taking donations and collecting blemished (有瑕疵的) produce that otherwise would have rotted in fields. And the strawberries? Volunteers will wash, cut, and freeze or dry them for use in meals down the road.\n\nSuch methods seem obvious, yet so often we just don't think. “Everyone can play a part in reducing waste, whether by not purchasing more food than necessary in your weekly shopping or by asking restaurants to not include the side dish you won't eat,” Curtin says."],
["真题·阅读","What does Curtin suggest people do?",["Buy only what is needed.","Reduce food consumption.","Go shopping once a week.","Eat in restaurants less often."],0,"考点：细节理解。末段引语「not purchasing more food than necessary in your weekly shopping」意为采购时别买超出所需，与 A 一致。C 把「每周采购」误解成「每周只买一次」，原文限定的是数量而非频次；B 谈少吃，属减少摄入，与减少浪费不是一回事；D 只说可请餐馆去掉不吃的配菜，并未建议少下馆子。","2022·新高考I卷","Like most of us, I try to be mindful of food that goes to waste. The arugula (芝麻菜) was to make a nice green salad, rounding out a roast chicken dinner. But I ended up working late. Then friends called with a dinner invitation. I stuck the chicken in the freezer. But as days passed, the arugula went bad. Even worse, I had unthinkingly bought way too much; I could have made six salads with what I threw out.\n\nIn a world where nearly 800 million people a year go hungry, “food waste goes against the moral grain,” as Elizabeth Royte writes in this month's cover story. It's jaw-dropping how much perfectly good food is thrown away — from “ugly” (but quite eatable) vegetables rejected by grocers to large amounts of uneaten dishes thrown into restaurant garbage cans.\n\nProducing food that no one eats wastes the water, fuel, and other resources used to grow it. That makes food waste an environmental problem. In fact, Royte writes, “if food waste were a country, it would be the third largest producer of greenhouse gases in the world.”\n\nIf that's hard to understand, let's keep it as simple as the arugula at the back of my refrigerator. Mike Curtin sees my arugula story all the time — but for him, it's more like 12 boxes of donated strawberries nearing their last days. Curtin is CEO of DC Central Kitchen in Washington, D.C., which recovers food and turns it into healthy meals. Last year it recovered more than 807,500 pounds of food by taking donations and collecting blemished (有瑕疵的) produce that otherwise would have rotted in fields. And the strawberries? Volunteers will wash, cut, and freeze or dry them for use in meals down the road.\n\nSuch methods seem obvious, yet so often we just don't think. “Everyone can play a part in reducing waste, whether by not purchasing more food than necessary in your weekly shopping or by asking restaurants to not include the side dish you won't eat,” Curtin says."],
["真题·阅读","What is the purpose of the project?",["To ensure harmony in care homes.","To provide part-time jobs for the aged.","To raise money for medical research.","To promote the elderly people's welfare."],3,"考点：写作目的。第二段「to reduce loneliness and improve elderly people's wellbeing」明确点出目的，D 正是其概括。B 把「照看母鸡」误读为雇佣关系，老人是参与者而非雇员，且项目并不发工资；A 的「和睦」把增进交流窄化为院内关系；C 与「慈善组织获资金支持」方向相反，项目是花钱而非筹款。","2022·新高考I卷","The elderly residents (居民) in care homes in London are being given hens to look after to stop them feeling lonely.\n\nThe project was dreamed up by a local charity (慈善组织) to reduce loneliness and improve elderly people's wellbeing. It is also being used to help patients suffering dementia, a serious illness of the mind. Staff in care homes have reported a reduction in the use of medicine where hens are in use.\n\nAmong those taking part in the project is 80-year-old Ruth Xavier. She said: “I used to keep hens when I was younger and had to prepare their breakfast each morning before I went to school.\n\n“I like the project a lot. I am down there in my wheelchair in the morning letting the hens out and down there again at night to see they've gone to bed.\n\n“It's good to have a different focus. People have been bringing their children in to see the hens and residents come and sit outside to watch them. I'm enjoying the creative activities, and it feels great to have done something useful.”\n\nThere are now 700 elderly people looking after hens in 20 care homes in the North East, and the charity has been given financial support to roll it out countrywide.\n\nWendy Wilson, extra care manager at 60 Penfold Street, one of the first to embark on the project, said: “Residents really welcome the idea of the project and the creative sessions. We are looking forward to the benefits and fun the project can bring to people here.”\n\nLynn Lewis, director of Notting Hill Pathways, said: “We are happy to be taking part in the project. It will really help connect our residents through a shared interest and creative activities.”"],
["真题·阅读","How has the project affected Ruth Xavier?",["She has learned new life skills.","She has gained a sense of achievement.","She has recovered her memory.","She has developed a strong personality."],1,"考点：人物情感理解。她自述「it feels great to have done something useful」，即做了有用的事让她感觉很好，属于成就感。A 项她年轻时本就养过鸡，算不上新技能；C 把「帮助痴呆症患者」张冠李戴到她身上；D 的「坚强性格」是对她坐轮椅坚持下楼的主观拔高，文中并无性格变化的表述。","2022·新高考I卷","The elderly residents (居民) in care homes in London are being given hens to look after to stop them feeling lonely.\n\nThe project was dreamed up by a local charity (慈善组织) to reduce loneliness and improve elderly people's wellbeing. It is also being used to help patients suffering dementia, a serious illness of the mind. Staff in care homes have reported a reduction in the use of medicine where hens are in use.\n\nAmong those taking part in the project is 80-year-old Ruth Xavier. She said: “I used to keep hens when I was younger and had to prepare their breakfast each morning before I went to school.\n\n“I like the project a lot. I am down there in my wheelchair in the morning letting the hens out and down there again at night to see they've gone to bed.\n\n“It's good to have a different focus. People have been bringing their children in to see the hens and residents come and sit outside to watch them. I'm enjoying the creative activities, and it feels great to have done something useful.”\n\nThere are now 700 elderly people looking after hens in 20 care homes in the North East, and the charity has been given financial support to roll it out countrywide.\n\nWendy Wilson, extra care manager at 60 Penfold Street, one of the first to embark on the project, said: “Residents really welcome the idea of the project and the creative sessions. We are looking forward to the benefits and fun the project can bring to people here.”\n\nLynn Lewis, director of Notting Hill Pathways, said: “We are happy to be taking part in the project. It will really help connect our residents through a shared interest and creative activities.”"],
["真题·阅读","What do the underlined words \"embark on\" mean in paragraph 7?",["Improve.","Oppose.","Begin.","Evaluate."],2,"考点：词义猜测。embark on 本义为「上船」，引申为「着手、开始做（某事）」。原句「one of the first to embark on the project」指最早着手开展该项目的人之一，与后文「我们期待项目带来的益处和乐趣」相承，故为 begin。A 是项目开展之后才会谈的改进；D 的评估通常用于事后；B 与语境正相反。","2022·新高考I卷","The elderly residents (居民) in care homes in London are being given hens to look after to stop them feeling lonely.\n\nThe project was dreamed up by a local charity (慈善组织) to reduce loneliness and improve elderly people's wellbeing. It is also being used to help patients suffering dementia, a serious illness of the mind. Staff in care homes have reported a reduction in the use of medicine where hens are in use.\n\nAmong those taking part in the project is 80-year-old Ruth Xavier. She said: “I used to keep hens when I was younger and had to prepare their breakfast each morning before I went to school.\n\n“I like the project a lot. I am down there in my wheelchair in the morning letting the hens out and down there again at night to see they've gone to bed.\n\n“It's good to have a different focus. People have been bringing their children in to see the hens and residents come and sit outside to watch them. I'm enjoying the creative activities, and it feels great to have done something useful.”\n\nThere are now 700 elderly people looking after hens in 20 care homes in the North East, and the charity has been given financial support to roll it out countrywide.\n\nWendy Wilson, extra care manager at 60 Penfold Street, one of the first to embark on the project, said: “Residents really welcome the idea of the project and the creative sessions. We are looking forward to the benefits and fun the project can bring to people here.”\n\nLynn Lewis, director of Notting Hill Pathways, said: “We are happy to be taking part in the project. It will really help connect our residents through a shared interest and creative activities.”"],
["真题·阅读","What can we learn about the project from the last two paragraphs?",["It is well received.","It needs to be more creative.","It is highly profitable.","It takes ages to see the results."],0,"考点：推理判断。两位负责人的话「really welcome the idea」「happy to be taking part」都表明项目受欢迎，故选 A（well received 即受到好评）。B 与文中「creative sessions」本身受欢迎相悖；C 把公益项目当营利机构，全文未提收入；D 与第二段「用药量已下降」的即时效果矛盾。","2022·新高考I卷","The elderly residents (居民) in care homes in London are being given hens to look after to stop them feeling lonely.\n\nThe project was dreamed up by a local charity (慈善组织) to reduce loneliness and improve elderly people's wellbeing. It is also being used to help patients suffering dementia, a serious illness of the mind. Staff in care homes have reported a reduction in the use of medicine where hens are in use.\n\nAmong those taking part in the project is 80-year-old Ruth Xavier. She said: “I used to keep hens when I was younger and had to prepare their breakfast each morning before I went to school.\n\n“I like the project a lot. I am down there in my wheelchair in the morning letting the hens out and down there again at night to see they've gone to bed.\n\n“It's good to have a different focus. People have been bringing their children in to see the hens and residents come and sit outside to watch them. I'm enjoying the creative activities, and it feels great to have done something useful.”\n\nThere are now 700 elderly people looking after hens in 20 care homes in the North East, and the charity has been given financial support to roll it out countrywide.\n\nWendy Wilson, extra care manager at 60 Penfold Street, one of the first to embark on the project, said: “Residents really welcome the idea of the project and the creative sessions. We are looking forward to the benefits and fun the project can bring to people here.”\n\nLynn Lewis, director of Notting Hill Pathways, said: “We are happy to be taking part in the project. It will really help connect our residents through a shared interest and creative activities.”"],
["真题·阅读","Which aspect of the human speech sound does Damian Blasi's research focus on?",["Its variety.","Its distribution.","Its quantity.","Its development."],3,"考点：主旨与研究对象。研究结论是「diet-related changes in human bite led to new speech sounds」，讲的是新语音如何随咬合变化而产生、扩散，属语音的演变。A、C 对应首段「2,000 different sounds」「more common」的背景描述；B 的分布是霍基特三十年前的观察角度，本研究是要解释这种分布从何而来，重点不在分布本身。","2022·新高考I卷","Human speech contains more than 2,000 different sounds, from the common “m” and “a” to the rare clicks of some southern African languages. But why are certain sounds more common than others? A ground-breaking, five-year study shows that diet-related changes in human bite led to new speech sounds that are now found in half the world's languages.\n\nMore than 30 years ago, the scholar Charles Hockett noted that speech sounds called labiodentals, such as “f” and “v”, were more common in the languages of societies that ate softer foods. Now a team of researchers led by Damian Blasi at the University of Zurich, Switzerland, has found how and why this trend arose.\n\nThey discovered that the upper and lower front teeth of ancient human adults were aligned (对齐), making it hard to produce labiodentals, which are formed by touching the lower lip to the upper teeth. Later, our jaws changed to an overbite structure (覆咬合结构), making it easier to produce such sounds.\n\nThe team showed that this change in bite was connected with the development of agriculture in the Neolithic period. Food became easier to chew at this point. The jawbone didn't have to do as much work and so didn't grow to be so large.\n\nAnalyses of a language database also confirmed that there was a global change in the sound of world languages after the Neolithic age, with the use of “f” and “v” increasing remarkably during the last few thousand years. These sounds are still not found in the languages of many hunter-gatherer people today.\n\nThis research overturns the popular view that all human speech sounds were present when human beings evolved around 300,000 years ago. “The set of speech sounds we use has not necessarily remained stable since the appearance of human beings, but rather the huge variety of speech sounds that we find today is the product of a complex interplay of things like biological change and cultural evolution,” said Steven Moran, a member of the research team."],
["真题·阅读","Why was it difficult for ancient human adults to produce labiodentals?",["They had fewer upper teeth than lower teeth.","They could not open and close their lips easily.","Their jaws were not conveniently structured.","Their lower front teeth were not large enough."],2,"考点：细节理解。第三段说古人上下门齿「aligned」（对齐），没有后来的覆咬合，下唇难触上牙，本质是颌骨结构问题，C 是其概括。A 的牙齿数量、D 的牙齿大小文中从未提及；B 的嘴唇开合是另一套发音机制，原文强调的始终是牙齿排列与咬合方式，容易误选是因为唇齿音确实涉及嘴唇。","2022·新高考I卷","Human speech contains more than 2,000 different sounds, from the common “m” and “a” to the rare clicks of some southern African languages. But why are certain sounds more common than others? A ground-breaking, five-year study shows that diet-related changes in human bite led to new speech sounds that are now found in half the world's languages.\n\nMore than 30 years ago, the scholar Charles Hockett noted that speech sounds called labiodentals, such as “f” and “v”, were more common in the languages of societies that ate softer foods. Now a team of researchers led by Damian Blasi at the University of Zurich, Switzerland, has found how and why this trend arose.\n\nThey discovered that the upper and lower front teeth of ancient human adults were aligned (对齐), making it hard to produce labiodentals, which are formed by touching the lower lip to the upper teeth. Later, our jaws changed to an overbite structure (覆咬合结构), making it easier to produce such sounds.\n\nThe team showed that this change in bite was connected with the development of agriculture in the Neolithic period. Food became easier to chew at this point. The jawbone didn't have to do as much work and so didn't grow to be so large.\n\nAnalyses of a language database also confirmed that there was a global change in the sound of world languages after the Neolithic age, with the use of “f” and “v” increasing remarkably during the last few thousand years. These sounds are still not found in the languages of many hunter-gatherer people today.\n\nThis research overturns the popular view that all human speech sounds were present when human beings evolved around 300,000 years ago. “The set of speech sounds we use has not necessarily remained stable since the appearance of human beings, but rather the huge variety of speech sounds that we find today is the product of a complex interplay of things like biological change and cultural evolution,” said Steven Moran, a member of the research team."],
["真题·阅读","What is paragraph 5 mainly about?",["Supporting evidence for the research results.","Potential application of the research findings.","A further explanation of the research methods.","A reasonable doubt about the research process."],0,"考点：段落主旨。该段用语言数据库分析证明「新石器时代后 f、v 使用显著增加」，并指出狩猎采集语言至今无此音，属于为结论补强旁证。B 应用、C 方法解释、D 质疑在段内都找不到对应内容；误选 D 多因把「still not found」看成反证，其实狩猎采集者不吃软食、不发唇齿音，恰恰支持「饮食—咬合—语音」这条链。","2022·新高考I卷","Human speech contains more than 2,000 different sounds, from the common “m” and “a” to the rare clicks of some southern African languages. But why are certain sounds more common than others? A ground-breaking, five-year study shows that diet-related changes in human bite led to new speech sounds that are now found in half the world's languages.\n\nMore than 30 years ago, the scholar Charles Hockett noted that speech sounds called labiodentals, such as “f” and “v”, were more common in the languages of societies that ate softer foods. Now a team of researchers led by Damian Blasi at the University of Zurich, Switzerland, has found how and why this trend arose.\n\nThey discovered that the upper and lower front teeth of ancient human adults were aligned (对齐), making it hard to produce labiodentals, which are formed by touching the lower lip to the upper teeth. Later, our jaws changed to an overbite structure (覆咬合结构), making it easier to produce such sounds.\n\nThe team showed that this change in bite was connected with the development of agriculture in the Neolithic period. Food became easier to chew at this point. The jawbone didn't have to do as much work and so didn't grow to be so large.\n\nAnalyses of a language database also confirmed that there was a global change in the sound of world languages after the Neolithic age, with the use of “f” and “v” increasing remarkably during the last few thousand years. These sounds are still not found in the languages of many hunter-gatherer people today.\n\nThis research overturns the popular view that all human speech sounds were present when human beings evolved around 300,000 years ago. “The set of speech sounds we use has not necessarily remained stable since the appearance of human beings, but rather the huge variety of speech sounds that we find today is the product of a complex interplay of things like biological change and cultural evolution,” said Steven Moran, a member of the research team."],
["真题·阅读","What does Steven Moran say about the set of human speech sounds?",["It is key to effective communication.","It contributes much to cultural diversity.","It is a complex and dynamic system.","It drives the evolution of human beings."],2,"考点：引语理解。莫兰说语音集合「has not necessarily remained stable」，其丰富性是「biological change and cultural evolution」复杂互动的产物，既不断变化又受多种因素制约，故为复杂动态系统。A 文中未谈沟通效率；B 因果倒置——是文化演化塑造语音，而非语音促进文化多样；D 把语音说成人类进化的动力，与「是进化的产物」相反。","2022·新高考I卷","Human speech contains more than 2,000 different sounds, from the common “m” and “a” to the rare clicks of some southern African languages. But why are certain sounds more common than others? A ground-breaking, five-year study shows that diet-related changes in human bite led to new speech sounds that are now found in half the world's languages.\n\nMore than 30 years ago, the scholar Charles Hockett noted that speech sounds called labiodentals, such as “f” and “v”, were more common in the languages of societies that ate softer foods. Now a team of researchers led by Damian Blasi at the University of Zurich, Switzerland, has found how and why this trend arose.\n\nThey discovered that the upper and lower front teeth of ancient human adults were aligned (对齐), making it hard to produce labiodentals, which are formed by touching the lower lip to the upper teeth. Later, our jaws changed to an overbite structure (覆咬合结构), making it easier to produce such sounds.\n\nThe team showed that this change in bite was connected with the development of agriculture in the Neolithic period. Food became easier to chew at this point. The jawbone didn't have to do as much work and so didn't grow to be so large.\n\nAnalyses of a language database also confirmed that there was a global change in the sound of world languages after the Neolithic age, with the use of “f” and “v” increasing remarkably during the last few thousand years. These sounds are still not found in the languages of many hunter-gatherer people today.\n\nThis research overturns the popular view that all human speech sounds were present when human beings evolved around 300,000 years ago. “The set of speech sounds we use has not necessarily remained stable since the appearance of human beings, but rather the huge variety of speech sounds that we find today is the product of a complex interplay of things like biological change and cultural evolution,” said Steven Moran, a member of the research team."],
["真题·七选五","第 36 空最合适的句子是？",["Your first meeting may be a little awkward.","A workout partner usually needs to live close by.","You'll work harder if you train with someone else.","Do you want to be a better athlete in your favorite sport?","How can you write a good \"seeking a training partner\" notice?","Just accept your differences and learn to work with each other.","Any notice for a training partner should include such information."],2,"考点：段内承接与例证关系。空处是杂志所列「感谢伙伴的理由」之一，紧随其后的句子用「there is a subtle competition」解释它，故须选「和别人一起训练你会更努力」（C）。A 谈初次见面的尴尬，D 是选择问句，都与下一句的解释关系不合；G 讲启事内容，属第四段话题，此处提前出现会割裂上下文。","2022·新高考I卷","Fitness Magazine recently ran an article titled “Five Reasons to Thank Your Workout Partner.” One reason was: “You'll actually show up if you know someone is waiting for you at the gym,” while another read: “(36)” With a workout partner, you will increase your training effort as there is a subtle (微妙的) competition.\n\nSo, how do you find a workout partner?\n\nFirst of all, decide what you want from that person. (37) Or do you just want to be physically fit, able to move with strength and flexibility? Think about the exercises you would like to do with your workout partner.\n\nYou might think about posting what you are looking for on social media, but it probably won't result in a useful response. (38) If you plan on working out in a gym, that person must belong to the same gym.\n\nMy partner posted her request on the notice board of a local park. Her notice included what kind of training she wanted to do, how many days a week and how many hours she wanted to spend on each session, and her age. It also listed her favorite sports and activities, and provided her phone number. (39)\n\nYou and your partner will probably have different skills. (40) Over time, both of you will benefit — your partner will be able to lift more weights and you will become more physically fit. The core (核心) of your relationship is that you will always be there to help each other."],
["真题·七选五","第 37 空最合适的句子是？",["Your first meeting may be a little awkward.","A workout partner usually needs to live close by.","You'll work harder if you train with someone else.","Do you want to be a better athlete in your favorite sport?","How can you write a good \"seeking a training partner\" notice?","Just accept your differences and learn to work with each other.","Any notice for a training partner should include such information."],3,"考点：并列问句（Or 的提示）。空后「Or do you just want to be physically fit」中的 Or 表明前面应是与它并列的另一个一般疑问句，D 项「你想在最喜欢运动上成为更好的运动员吗」正好构成「是想更强，还是只想健康」的二选一。A、B、F、G 均为陈述句，E 是问句但问的是启事写法，与「想要什么」不衔接。","2022·新高考I卷","Fitness Magazine recently ran an article titled “Five Reasons to Thank Your Workout Partner.” One reason was: “You'll actually show up if you know someone is waiting for you at the gym,” while another read: “(36)” With a workout partner, you will increase your training effort as there is a subtle (微妙的) competition.\n\nSo, how do you find a workout partner?\n\nFirst of all, decide what you want from that person. (37) Or do you just want to be physically fit, able to move with strength and flexibility? Think about the exercises you would like to do with your workout partner.\n\nYou might think about posting what you are looking for on social media, but it probably won't result in a useful response. (38) If you plan on working out in a gym, that person must belong to the same gym.\n\nMy partner posted her request on the notice board of a local park. Her notice included what kind of training she wanted to do, how many days a week and how many hours she wanted to spend on each session, and her age. It also listed her favorite sports and activities, and provided her phone number. (39)\n\nYou and your partner will probably have different skills. (40) Over time, both of you will benefit — your partner will be able to lift more weights and you will become more physically fit. The core (核心) of your relationship is that you will always be there to help each ["真题·阅读","Which of the four programs begins the earliest?",["Photography Workshops.","Junior Ranger Wildlife Olympics.","Canyon Talks at Artist Point.","Experiencing Wildlife in Yellowstone."],3,"考查细节比对与排序。四个项目的起始日依次为 5月26日、6月5日、6月9日、6月19日，最早的 Experiencing Wildlife in Yellowstone 对应 D；B、C 均晚至 6 月，A 则晚至 6 月 19 日，均可排除。","2023·新课标II卷","Yellowstone National Park offers a variety of ranger programs throughout the park, and throughout the year. The following are descriptions of the ranger programs this summer.\n\nExperiencing Wildlife in Yellowstone (May 26 to September 2)\n\nWhether you're hiking a backcountry trail (小径), camping, or just enjoying the park's amazing wildlife from the road, this quick workshop is for you and your family. Learn where to look for animals and how to safely enjoy your wildlife watching experience. Meet at the Canyon Village Store.\n\nJunior Ranger Wildlife Olympics (June 5 to August 21)\n\nKids can test their skills and compare their abilities to the animals of Yellowstone. Stay for as little or as long as your plans allow. Meet in front of the Visitor Education Center.\n\nCanyon Talks at Artist Point (June 9 to September 2)\n\nFrom a classic viewpoint, enjoy Lower Falls, the Yellowstone River, and the breathtaking colors of the canyon (峡谷) while learning about the area's natural and human history. Discover why artists and photographers continue to be drawn to this special place. Meet on the lower platform at Artist Point on the South Rim Drive for this short talk.\n\nPhotography Workshops (June 19 & July 10)\n\nEnhance your photography skills — join Yellowstone's park photographer for a hands-on program to inspire new and creative ways of enjoying the beauty and wonder of Yellowstone.\n\n6/19 — Waterfalls & Wide Angles; meet at Artist Point.\n\n7/10 — Wildflowers & White Balance; meet at Washburn Trailhead in Chittenden parking area."],

["真题·阅读","What do we know about Abby Jaramillo?",["She used to be a health worker.","She grew up in a low-income family.","She owns a fast food restaurant.","She is an initiator of Urban Sprouts."],3,"考查细节理解。首段 who with another teacher started Urban Sprouts 说明她与另一位教师共同创办了该项目，D 表述准确；low-income 修饰的是学校而非她的家庭，A、C 文中无据，属无中生有。","2023·新课标II卷","Turning soil, pulling weeds, and harvesting cabbage sound like tough work for middle and high school kids. And at first it is, says Abby Jaramillo, who with another teacher started Urban Sprouts, a school garden program at four low-income schools. The program aims to help students develop science skills, environmental awareness, and healthy lifestyles.\n\nJaramillo's students live in neighborhoods where fresh food and green space are not easy to find and fast food restaurants outnumber grocery stores. \"The kids literally come to school with bags of snacks and large bottles of soft drinks,\" she says. \"They come to us thinking vegetables are awful, dirt is awful, insects are awful.\" Though some are initially scared of the insects and turned off by the dirt, most are eager to try something new.\n\nUrban Sprouts' classes, at two middle schools and two high schools, include hands-on experiments such as soil testing, flower-and-seed dissection, tastings of fresh or dried produce, and work in the garden. Several times a year, students cook the vegetables they grow, and they occasionally make salads for their entire schools.\n\nProgram evaluations show that kids eat more vegetables as a result of the classes. \"We have students who say they went home and talked to their parents and now they're eating differently,\" Jaramillo says.\n\nShe adds that the program's benefits go beyond nutrition. Some students get so interested in gardening that they bring home seeds to start their own vegetable gardens. Besides, working in the garden seems to have a calming effect on Jaramillo's special education students, many of whom have emotional control issues. \"They get outside,\" she says, \"and they feel successful.\""],

aramillo's special education students, many of whom have emotional control issues. \"They get outside,\" she says, \"and they feel successful.\""],

["真题·阅读","What can be a suitable title for the text?",["Rescuing School Gardens","Experiencing Country Life","Growing Vegetable Lovers","Changing Local Landscape"],2,"考查主旨大意。全文写孩子从嫌蔬菜 awful 到 eat more vegetables、带种子回家种菜，核心是让孩子爱上蔬菜与园艺，C 概括最准；A 侧重拯救园圃，B、D 偏离孩子与蔬菜这条主线。","2023·新课标II卷","Turning soil, pulling weeds, and harvesting cabbage sound like tough work for middle and high school kids. And at first it is, says Abby Jaramillo, who with another teacher started Urban Sprouts, a school garden program at four low-income schools. The program aims to help students develop science skills, environmental awareness, and healthy lifestyles.\n\nJaramillo's students live in neighborhoods where fresh food and green space are not easy to find and fast food restaurants outnumber grocery stores. \"The kids literally come to school with bags of snacks and large bottles of soft drinks,\" she says. \"They come to us thinking vegetables are awful, dirt is awful, insects are awful.\" Though some are initially scared of the insects and turned off by the dirt, most are eager to try something new.\n\nUrban Sprouts' classes, at two middle schools and two high schools, include hands-on experiments such as soil testing, flower-and-seed dissection, tastings of fresh or dried produce, and work in the garden. Several times a year, students cook the vegetables they grow, and they occasionally make salads for their entire schools.\n\nProgram evaluations show that kids eat more vegetables as a result of the classes. \"We have students who say they went home and talked to their parents and now they're eating differently,\" Jaramillo says.\n\nShe adds that the program's benefits go beyond nutrition. Some students get so interested in gardening that they bring home seeds to start their own vegetable gardens. Besides, working in the garden seems to have a calming effect on Jaramillo's special education students, many of whom have emotional control issues. \"They get outside,\" she says, \"and they feel successful.\""],
["真题·阅读","Where is the text most probably taken from?",["An introduction to a book.","An essay on the art of writing.","A guidebook to a museum.","A review of modern paintings."],0,"考查文章出处。首句 Reading Art: Art for Book Lovers is a celebration of an everyday object 是典型的图书推介语，后文又说明该书选编思路与价值，故属图书引言；C 侧重参观导览，B、D 与书与阅读的主题不符。","2023·新课标II卷","Reading Art: Art for Book Lovers is a celebration of an everyday object — the book, represented here in almost three hundred artworks from museums around the world. The image of the reader appears throughout history, in art made long before books as we now know them came into being. In artists' representations of books and reading, we see moments of shared humanity that go beyond culture and time.\n\nIn this \"book of books,\" artworks are selected and arranged in a way that emphasizes these connections between different eras and cultures. We see scenes of children learning to read at home or at school, with the book as a focus for relations between the generations. Adults are portrayed (描绘) alone in many settings and poses — absorbed in a volume, deep in thought or lost in a moment of leisure. These scenes may have been painted hundreds of years ago, but they record moments we can all relate to.\n\nBooks themselves may be used symbolically in paintings to demonstrate the intellect (才智), wealth or faith of the subject. Before the wide use of the printing press, books were treasured objects and could be works of art in their own right. More recently, as books have become inexpensive or even throwaway, artists have used them as the raw material for artworks — transforming covers, pages or even complete volumes into paintings and sculptures.\n\nContinued developments in communication technologies were once believed to make the printed page outdated. From a 21st-century point of view, the printed book is certainly ancient, but it remains as interactive as any battery-powered e-reader. To serve its function, a book must be activated by a user: the cover opened, the pages parted, the contents reviewed, perhaps notes written down or words underlined. And in contrast to our increasingly networked lives where the information we consume is monitored and tracked, a printed book still offers the chance of a wholly private, \"off-line\" activity."],

["真题·阅读","What do the underlined words \"relate to\" in paragraph 2 mean?",["Understand.","Paint.","Seize.","Transform."],0,"考查词义猜测。They record moments we can all relate to 意为这些画记录了人人都能共鸣的时刻，relate to 在此为“理解、认同”，A 正确；paint、seize、transform 分别对应 B、C、D，均与“人有共鸣”的语境不合。","2023·新课标II卷","Reading Art: Art for Book Lovers is a celebration of an everyday object — the book, represented here in almost three hundred artworks from museums around the world. The image of the reader appears throughout history, in art made long before books as we now know them came into being. In artists' representations of books and reading, we see moments of shared humanity that go beyond culture and time.\n\nIn this \"book of books,\" artworks are selected and arranged in a way that emphasizes these connections between different eras and cultures. We see scenes of children learning to read at home or at school, with the book as a focus for relations between the generations. Adults are portrayed (描绘) alone in many settings and poses — absorbed in a volume, deep in thought or lost in a moment of leisure. These scenes may have been painted hundreds of years ago, but they record moments we can all relate to.\n\nBooks themselves may be used symbolically in paintings to demonstrate the intellect (才智), wealth or faith of the subject. Before the wide use of the printing press, books were treasured objects and could be works of art in their own right. More recently, as books have become inexpensive or even throwaway, artists have used them as the raw material for artworks — transforming covers, pages or even complete volumes into paintings and sculptures.\n\nContinued developments in communication technologies were once believed to make the printed page outdated. From a 21st-century point of view, the printed book is certainly ancient, but it remains as interactive as any battery-powered e-reader. To serve its function, a book must be activated by a user: the cover opened, the pages parted, the contents reviewed, perhaps notes written down or words underlined. And in contrast to our increasingly networked lives where the information we consume is monitored and tracked, a printed book still offers the chance of a wholly private, \"off-line\" activity."],

nteractive as any battery-powered e-reader. To serve its function, a book must be activated by a user: the cover opened, the pages parted, the contents reviewed, perhaps notes written down or words underlined. And in contrast to our increasingly networked lives where the information we consume is monitored and tracked, a printed book still offers the chance of a wholly private, \"off-line\" activity."],
["真题·阅读","What phenomenon does the author describe at the beginning of the text?",["Pocket parks are now popular.","Wild nature is hard to find in cities.","Many cities are overpopulated.","People enjoy living close to nature."],1,"考查段落主旨。首段 access to nature ... is becoming harder to find 与 it's unusual to find places in a city that are relatively wild，指出城市中难觅野性自然，B 正确；A、D 与原文语气相反，C 只是原因而非所描述的现象。","2023·新课标II卷","As cities balloon with growth, access to nature for people living in urban areas is becoming harder to find. If you're lucky, there might be a pocket park near where you live, but it's unusual to find places in a city that are relatively wild.\n\nPast research has found health and wellness benefits of nature for humans, but a new study shows that wildness in urban areas is extremely important for human well-being.\n\nThe research team focused on a large urban park. They surveyed several hundred park-goers, asking them to submit a written summary online of a meaningful interaction they had with nature in the park. The researchers then examined these submissions, coding (编码) experiences into different categories. For example, one participant's experience of \"We sat and listened to the waves at the beach for a while\" was assigned the categories \"sitting at beach\" and \"listening to waves.\"\n\nAcross the 320 submissions, a pattern of categories the researchers call a \"nature language\" began to emerge. After the coding of all submissions, half a dozen categories were noted most often as important to visitors. These include encountering wildlife, walking along the edge of water, and following an established trail.\n\nNaming each nature experience creates a usable language, which helps people recognize and take part in the activities that are most satisfying and meaningful to them. For example, the experience of walking along the edge of water might be satisfying for a young professional on a weekend hike in the park. Back downtown during a workday, they can enjoy a more domestic form of this interaction by walking along a fountain on their lunch break.\n\n\"We're trying to generate a language that helps bring the human-nature interactions back into our daily lives. And for that to happen, we also need to protect nature so that we can interact with it,\" said Peter Kahn, a senior author of the study."],

re domestic form of this interaction by walking along a fountain on their lunch break.\n\n\"We're trying to generate a language that helps bring the human-nature interactions back into our daily lives. And for that to happen, we also need to protect nature so that we can interact with it,\" said Peter Kahn, a senior author of the study."],

["真题·七选五","第 36 空最合适的句子是？",["Get out of your comfort zone.","Make career plans and set goals.","Don't throw away your beginner art.","Share your work if you feel comfortable doing so.","You'll hit roadblocks, and you'll feel discouraged at times.","Evaluate your performance and, if needed, redefine your role.","You'll develop that painting muscle memory that only comes with repetition."],2,"考查段内衔接。本条讲用素描本做小习作，空后 You'll want to look back on your journey 表明要留下早期作品日后回看，C“不要扔掉初学时的画作”承上启下；E 谈挫折、G 谈重复练习，与该条“从小处起步”的主题不符。","2023·新课标II卷","As an artist who shares her journey on social media, I'm often asked by curious followers how to begin an art journey. Unfortunately, there is no magic list I can offer. I do remember, though, what it was like to be a complete beginner. So I've put together some good tips for starting an art journey.\n\n• Start small. I suggest using a sketchbook (素描本) for small studies. These small studies provide inspiration and may be a springboard for more complex works in the future. (36) You'll want to look back on your journey to see how far you've come.\n\n• Paint often and paint from life. There's no better way to improve than to put in those brush miles. Whether you paint still lifes, portraits, or landscapes, paint from life as much as possible. (37)\n\n• Continually challenge yourself to try something new. (38) Artistic growth can be a bit painful. Welcome to the club; we've all been there. I love taking on challenges. I once took up a challenge to create a painting every day for a month and post the works online.\n\n• (39) Seeking and accepting constructive feedback (反馈) is crucial to growth. I post my work on social media and, in turn, have met some of the kindest people. They make me feel valued and respected, no matter my level of artistic ability.\n\nThe journey you're on won't follow a straight path. (40) Push through, give it time and put in the effort. You will harvest the rewards of an artistic life."],

["真题·七选五","第 40 空最合适的句子是？",["Get out of your comfort zone.","Make career plans and set goals.","Don't throw away your beginner art.","Share your work if you feel comfortable doing so.","You'll hit roadblocks, and you'll feel discouraged at times.","Evaluate your performance and, if needed, redefine your role.","You'll develop that painting muscle memory that only comes with repetition."],4,"考查上下文照应。空前 won't follow a straight path，空后 Push through（坚持挺过去），E“会遇到阻碍，有时也会感到气馁”与“路不直—坚持”完全对应；A、B 已在别处使用，且与“坚持”不衔接。","2023·新课标II卷","As an artist who shares her journey on social media, I'm often asked by curious followers how to begin an art journey. Unfortunately, there is no magic list I can offer. I do remember, though, what it was like to be a complete beginner. So I've put together some good tips for starting an art journey.\n\n• Start small. I suggest using a sketchbook (素描本) for small studies. These small studies provide inspiration and may be a springboard for more complex works in the future. (36) You'll want to look back on your journey to see how far you've come.\n\n• Paint often and paint from life. There's no better way to improve than to put in those brush miles. Whether you paint still lifes, portraits, or landscapes, paint from life as much as possible. (37)\n\n• Continually challenge yourself to try something new. (38) Artistic growth can be a bit painful. Welcome to the club; we've all been there. I love taking on challenges. I once took up a challenge to create a painting every day for a month and post the works online.\n\n• (39) Seeking and accepting constructive feedback (反馈) is crucial to growth. I post my work on social media and, in turn, have met some of the kindest people. They make me feel valued and respected, no matter my level of artistic ability.\n\nThe journey you're on won't follow a straight path. (40) Push through, give it time and put in the effort. You will harvest the rewards of an artistic life."],
["真题·阅读","What is an advantage of MacBike?",["It gives children a discount.","It offers many types of bikes.","It organizes free cycle tours.","It has over 2,500 rental shops."],1,"考点：细节理解。原文「We offer the newest bicycles in a wide variety, including...」后列举脚刹车、手刹带排挡车、带儿童座椅车与儿童车，B 正是这一列举的概括。D 混淆数字：两千五百是车辆数，门店只有五家；文中只提到有儿童车，并未说儿童优惠，A 无据；导览需购票或预订，C 的 free 与原文相悖。","2023·新课标I卷","Bike Rental & Guided Tours\n\nWelcome to Amsterdam, welcome to MacBike. You see much more from the seat of a bike! Cycling is the most economical, sustainable and fun way to explore the city, with its beautiful canals, parks, squares and countless lights. You can also bike along lovely landscapes outside of Amsterdam.\n\nWhy MacBike\n\nMacBike has been around for almost 30 years and is the biggest bicycle rental company in Amsterdam. With over 2,500 bikes stored in our five rental shops at strategic locations, we make sure there is always a bike available for you. We offer the newest bicycles in a wide variety, including basic bikes with foot brake (脚刹), bikes with hand brake and gears (排挡), bikes with child seats, and children's bikes.\n\nPrices\nHand Brake, Three Gears | Foot Brake, No Gears\n1 hour €7.50 | €5.00\n3 hours €11.00 | €7.50\n1 day (24 hours) €14.75 | €9.75\nEach additional day €8.00 | €6.00\n\nGuided City Tours\n\nThe 2.5-hour tour covers the Gooyer Windmill, the Skinny Bridge, the Rijksmuseum, Heineken Brewery and much more.\n\nThe tour departs from Dam Square every hour on the hour, starting at 1:00 pm every day. You can buy your ticket in a MacBike shop or book online."],

["真题·阅读","What can we learn about John from the first two paragraphs?",["He was fond of traveling.","He enjoyed being alone.","He had an inquiring mind.","He longed to be a doctor."],2,"考点：人物性格推断。前两段反复写他「observing how nature solved problems」「started to wonder if this process could be used」，又连用 why、which 追问植物与鱼的功用，可见其凡事爱问为什么、爱找解决办法。A 把「explore the woods」误读为旅行；B 的独处、D 的当医生都无对应信息——他学过 medicine 只是知识背景。","2023·新课标I卷","When John Todd was a child, he loved to explore the woods around his house, observing how nature solved problems. A dirty stream, for example, often became clear after flowing through plants and along rocks where tiny creatures lived. When he got older, John started to wonder if this process could be used to clean up the messes people were making.\n\nAfter studying agriculture, medicine, and fisheries in college, John went back to observing nature and asking questions. Why can certain plants trap harmful bacteria (细菌)? Which kinds of fish can eat cancer-causing chemicals? With the right combination of animals and plants, he figured, maybe he could clean up waste the way nature did. He decided to build what he would later call an eco-machine.\n\nThe task John set for himself was to remove harmful substances from some sludge (污泥). First, he constructed a series of clear fiberglass tanks connected to each other. Then he went around to local ponds and streams and brought back some plants and animals. He placed them in the tanks and waited. Little by little, these different kinds of life got used to one another and formed their own ecosystem. After a few weeks, John added the sludge.\n\nHe was amazed at the results. The plants and animals in the eco-machine took the sludge as food and began to eat it! Within weeks, it had all been digested, and all that was left was pure water.\n\nOver the years, John has taken on many big jobs. He developed a greenhouse-like facility that treated sewage (污水) from 1,600 homes in South Burlington. He also designed an eco-machine to clean canal water in Fuzhou, a city in southeast China.\n\n\"Ecological design\" is the name John gives to what he does. \"Life on Earth is kind of a box of spare parts for the inventor,\" he says. \"You put organisms in new relationships and observe what's happening. Then you let these new systems develop their own ways to self-repair.\""],

["真题·阅读","What is the basis for John's work?",["Nature can repair itself.","Organisms need water to survive.","Life on Earth is diverse.","Most tiny creatures live in groups."],0,"考点：主旨与关键句。末段引语「you let these new systems develop their own ways to self-repair」表明他相信：只要把生物关系搭好，系统会自行修复，人只做设计者，故选 A。B、C 是文中确实出现的事实背景，但只能解释「为什么用动植物」，无法解释「为什么把污泥交给系统」；D 属无关细节。","2023·新课标I卷","When John Todd was a child, he loved to explore the woods around his house, observing how nature solved problems. A dirty stream, for example, often became clear after flowing through plants and along rocks where tiny creatures lived. When he got older, John started to wonder if this process could be used to clean up the messes people were making.\n\nAfter studying agriculture, medicine, and fisheries in college, John went back to observing nature and asking questions. Why can certain plants trap harmful bacteria (细菌)? Which kinds of fish can eat cancer-causing chemicals? With the right combination of animals and plants, he figured, maybe he could clean up waste the way nature did. He decided to build what he would later call an eco-machine.\n\nThe task John set for himself was to remove harmful substances from some sludge (污泥). First, he constructed a series of clear fiberglass tanks connected to each other. Then he went around to local ponds and streams and brought back some plants and animals. He placed them in the tanks and waited. Little by little, these different kinds of life got used to one another and formed their own ecosystem. After a few weeks, John added the sludge.\n\nHe was amazed at the results. The plants and animals in the eco-machine took the sludge as food and began to eat it! Within weeks, it had all been digested, and all that was left was pure water.\n\nOver the years, John has taken on many big jobs. He developed a greenhouse-like facility that treated sewage (污水) from 1,600 homes in South Burlington. He also designed an eco-machine to clean canal water in Fuzhou, a city in southeast China.\n\n\"Ecological design\" is the name John gives to what he does. \"Life on Earth is kind of a box of spare parts for the inventor,\" he says. \"You put organisms in new relationships and observe what's happening. Then you let these new systems develop their own ways to self-repair.\""],
["真题·阅读","What is the book aimed at?",["Teaching critical thinking skills.","Advocating a simple digital lifestyle.","Solving philosophical problems.","Promoting the use of a digital device."],1,"考点：写作目的。首句「make the case for digital minimalism... teach you how to adopt this philosophy」即全书要为数字极简主义辩护并提供实践路径，B 是其同义概括。A 的批判性思维全篇未提；C 中的 philosophy 指生活理念而非哲学问题，属词义误解；D 与「远离可选线上活动」的主旨正相反。","2023·新课标I卷","The goal of this book is to make the case for digital minimalism, including a detailed exploration of what it asks and why it works, and then to teach you how to adopt this philosophy if you decide it's right for you.\n\nTo do so, I divided the book into two parts. In part one, I describe the philosophical foundations of digital minimalism, starting with an examination of the forces that are making so many people's digital lives increasingly intolerable, before moving on to a detailed discussion of the digital minimalism philosophy.\n\nPart one concludes by introducing my suggested method for adopting this philosophy: the digital declutter. This process requires you to step away from optional online activities for thirty days. At the end of the thirty days, you will then add back a small number of carefully chosen online activities that you believe will provide massive benefits to the things you value.\n\nIn the final chapter of part one, I'll guide you through carrying out your own digital declutter. In doing so, I'll draw on an experiment I ran in 2018 in which over 1,600 people agreed to perform a digital declutter. You'll hear these participants' stories and learn what strategies worked well for them, and what traps they encountered that you should avoid.\n\nThe second part of this book takes a closer look at some ideas that will help you cultivate (培养) a sustainable digital minimalism lifestyle. In these chapters, I examine issues such as the importance of solitude (独处) and the necessity of cultivating high-quality leisure to replace the time most now spent on mindless device use. Each chapter concludes with a collection of practices, which are designed to help you act on the big ideas of the chapter. You can view these practices as a toolbox meant to aid your efforts to build a minimalist lifestyle that works for your particular circumstances."],

igh-quality leisure to replace the time most now spent on mindless device use. Each chapter concludes with a collection of practices, which are designed to help you act on the big ideas of the chapter. You can view these practices as a toolbox meant to aid your efforts to build a minimalist lifestyle that works for your particular circumstances."],
["真题·阅读","What is paragraph 2 of the text mainly about?",["The methods of estimation.","The underlying logic of the effect.","The causes of people's errors.","The design of Galton's experiment."],1,"考点：段落主旨。第二段用「errors aren't always the same」「cancel each other out」「requires that people's estimates be independent」解释该效应为何成立、何时失效，讲的正是内在原理与逻辑，B 最准确。A 的估测方法、D 的实验设计都在首段；C 虽反复出现 errors，但段落重点在误差抵消的机制，并未分析人们为何犯错。","2023·新课标I卷","On March 7, 1907, the English statistician Francis Galton published a paper which illustrated what has come to be known as the \"wisdom of crowds\" effect. The experiment of estimation he conducted showed that in some cases, the average of a large number of independent estimates could be quite accurate.\n\nThis effect capitalizes on the fact that when people make errors, those errors aren't always the same. Some people will tend to overestimate, some to underestimate. When enough of these errors are averaged together, they cancel each other out, resulting in a more accurate estimate. If people are similar and tend to make the same errors, then their errors won't cancel each other out. In more technical terms, the wisdom of crowds requires that people's estimates be independent. If for whatever reasons, people's errors become correlated or dependent, the accuracy of the estimate will go down.\n\nBut a new study led by Joaquin Navajas offered an interesting twist (转折) on this classic phenomenon. The key finding of the study was that when crowds were further divided into smaller groups that were allowed to have a discussion, the averages from these groups were more accurate than those from an equal number of independent individuals. For instance, the average obtained from the estimates of four discussion groups of five was significantly more accurate than the average obtained from 20 independent individuals.\n\nIn a follow-up study with 100 university students, the researchers tried to get a better sense of what the group members actually did in their discussion. Did they tend to go with those most confident about their estimates? Did they follow those least willing to change their minds? This happened some of the time, but it wasn't the dominant response. Most frequently, the groups reported that they shared arguments and reasoned together. \"Somehow, these arguments and reasoning resulted in a global reduction in error.\"\n\nAlthough the studies led by Navajas have limitations and many questions remain, the potential implications for group discussion and decision-making are enormous."],

["真题·阅读","What did the follow-up study focus on?",["The size of the groups.","The dominant members.","The discussion process.","The individual estimates."],2,"考点：细节理解。第四段「tried to get a better sense of what the group members actually did in their discussion」表明研究关注的是组员在讨论中如何互动，即讨论过程。B 的「主导成员」只是过程中被检验的一个假设，且已被「wasn't the dominant response」否定；A 的组规模、D 的个人估计都不是该后续研究的问题。","2023·新课标I卷","On March 7, 1907, the English statistician Francis Galton published a paper which illustrated what has come to be known as the \"wisdom of crowds\" effect. The experiment of estimation he conducted showed that in some cases, the average of a large number of independent estimates could be quite accurate.\n\nThis effect capitalizes on the fact that when people make errors, those errors aren't always the same. Some people will tend to overestimate, some to underestimate. When enough of these errors are averaged together, they cancel each other out, resulting in a more accurate estimate. If people are similar and tend to make the same errors, then their errors won't cancel each other out. In more technical terms, the wisdom of crowds requires that people's estimates be independent. If for whatever reasons, people's errors become correlated or dependent, the accuracy of the estimate will go down.\n\nBut a new study led by Joaquin Navajas offered an interesting twist (转折) on this classic phenomenon. The key finding of the study was that when crowds were further divided into smaller groups that were allowed to have a discussion, the averages from these groups were more accurate than those from an equal number of independent individuals. For instance, the average obtained from the estimates of four discussion groups of five was significantly more accurate than the average obtained from 20 independent individuals.\n\nIn a follow-up study with 100 university students, the researchers tried to get a better sense of what the group members actually did in their discussion. Did they tend to go with those most confident about their estimates? Did they follow those least willing to change their minds? This happened some of the time, but it wasn't the dominant response. Most frequently, the groups reported that they shared arguments and reasoned together. \"Somehow, these arguments and reasoning resulted in a global reduction in error.\"\n\nAlthough the studies led by Navajas have limitations and many questions remain, the potential implications for group discussion and decision-making are enormous."],
["真题·阅读","What is the author's attitude toward Navajas' studies?",["Unclear.","Dismissive.","Doubtful.","Approving."],3,"考点：观点态度。末段先让一步承认「have limitations and many questions remain」，随即用「the potential implications... are enormous」给予高度肯定，转折重心在主句，故为赞许。C 只抓住 limitations 而丢掉主句；B 语气过重，文中并无贬斥；A 与作者明确的评价相矛盾。","2023·新课标I卷","On March 7, 1907, the English statistician Francis Galton published a paper which illustrated what has come to be known as the \"wisdom of crowds\" effect. The experiment of estimation he conducted showed that in some cases, the average of a large number of independent estimates could be quite accurate.\n\nThis effect capitalizes on the fact that when people make errors, those errors aren't always the same. Some people will tend to overestimate, some to underestimate. When enough of these errors are averaged together, they cancel each other out, resulting in a more accurate estimate. If people are similar and tend to make the same errors, then their errors won't cancel each other out. In more technical terms, the wisdom of crowds requires that people's estimates be independent. If for whatever reasons, people's errors become correlated or dependent, the accuracy of the estimate will go down.\n\nBut a new study led by Joaquin Navajas offered an interesting twist (转折) on this classic phenomenon. The key finding of the study was that when crowds were further divided into smaller groups that were allowed to have a discussion, the averages from these groups were more accurate than those from an equal number of independent individuals. For instance, the average obtained from the estimates of four discussion groups of five was significantly more accurate than the average obtained from 20 independent individuals.\n\nIn a follow-up study with 100 university students, the researchers tried to get a better sense of what the group members actually did in their discussion. Did they tend to go with those most confident about their estimates? Did they follow those least willing to change their minds? This happened some of the time, but it wasn't the dominant response. Most frequently, the groups reported that they shared arguments and reasoned together. \"Somehow, these arguments and reasoning resulted in a global reduction in error.\"\n\nAlthough the studies led by Navajas have limitations and many questions remain, the potential implications for group discussion and decision-making are enormous."],
["真题·七选五","第 36 空最合适的句子是？",["A little self-forgiveness also goes a long way.","Now list all the characteristics you like about yourself.","They might even like to have a go at doing the exercise.","It's just as important to show yourself some forgiveness.","It doesn't mean you have to ignore what's happened or forget it.","Whatever it is, no matter how small it might seem, write it down.","Whatever the mistake, remember it isn't a fixed aspect of your personality."],3,"考点：代词指代与主题句。空后「help you do this」中的 this 必须有所指，而全文主题是自我宽恕，故空处应提出「给自己一些宽恕」，选 D。A 也说宽恕，但多了 also，需要一个已出现的宽恕语境作前提，此处正是首次提出；G 谈错误不是性格的固定部分，无法被 this 指代，是本题最大的干扰项。","2023·新课标I卷","Personal Forgiveness\n\nTaking responsibility for mistakes is a positive step, but don't beat yourself up about them. To err (犯错) is human. (36) You can use the following writing exercise to help you do this.\n\nIn a journal or on a piece of paper, put the heading \"Personal strengths.\" (37) Are you caring? Creative? Generous? A good listener? Fun to be around? They don't have to be world-changing, just aspects of your personality that you're proud of.\n\nAt the top of a second page, put the heading \"Acts of kindness.\" On this one, list all the positive things you've done for others. It might be the time when you helped a friend with their homework, when you did the ironing without being asked, or when you baked cookies after the family had had a tiring day. (38)\n\nYou could ask a friend or family member to help add to your list. (39) That way, you could exchange thoughts on what makes each of you special and the aspects of your personality that shine through. In fact, don't wait until you've made a mistake to try this — it's a great way to boost self-confidence at any time.\n\nIt's something of a cliché (陈词滥调) that most people learn not from their successes but their mistakes. The thing is, it's true. (40) We're all changing and learning all the time and mistakes are a positive way to develop and grow."],

["真题·阅读","Which walk takes the shortest time?",["The Natural World.","Introduction to Hillwalking.","Moonlight Under the Stars.","Photographic Walk in Kilbrannish Forest."],3,"考点：细节理解（数字比较）。依据：四条路线的时长依次为 6、5、3、1.5 小时，路线四最短，故选 D。干扰项排除：A、B、C 分别需 6、5、3 小时，都长于 1.5 小时，不符合“最短”的要求。","2024·新课标II卷","Choice of Walks for Beginner and Experienced Walkers\n\nThe Carlow Autumn Walking Festival is a great opportunity for the beginner, experienced or advanced walker to enjoy the challenges of Carlow's mountain hikes or the peace of its woodland walks.\n\nWalk 1 — The Natural World\nWith environmentalist Kanna Lamhna as the guide, this walk promises to be an informative tour. Walkers are sure to learn lots about the habitats and natural world of the Blackstairs.\nDate and Time: Saturday, 1st October, at 09:00\nStart Point: Scratoes Bridge\nWalk Duration: 6 hours\n\nWalk 2 — Introduction to Hillwalking\nEmmanuel Chappard, an experienced guide, has a passion for making the great outdoors accessible to all. This mountain walk provides an insight into the skills required for hillwalking to ensure you get the most from future walking trips.\nDate and Time: Sunday, 2nd October, at 09:00\nStart Point: Deerpark Car Park\nWalk Duration: 5 hours\n\nWalk 3 — Moonlight Under the Stars\nWalking at night-time is a great way to step out of your comfort zone. Breathtaking views of the lowlands of Carlow can be enjoyed in the presence of welcoming guides from local walking clubs. A torch (手电筒) along with suitable clothing is essential for walking in the dark. Those who are dressed inappropriately will be refused permission to participate.\nDate and Time: Saturday, 1st October, at 18:30\nStart Point: The Town Hall\nWalk Duration: 3 hours\n\nWalk 4 — Photographic Walk in Kilbrannish Forest\nThis informative walk led by Richard Smyth introduces you to the basic principles of photography in the wild. Bring along your camera and enjoy the wonderful views along this well-surfaced forest path.\nDate and Time: Sunday, 2nd October, at 11:45\nStart Point: Kilbrannish Forest Recreation Area\nWalk Duration: 1.5 hours"],

["真题·阅读","Why did BART start the kiosk program?",["To promote the local culture.","To discourage phone use.","To meet passengers' needs.","To reduce its running costs."],2,"考点：推理判断（项目目的）。依据：开篇从乘客忘带读物、仍想看印刷品的需求切入，再由特罗斯特点明一切为改善乘客体验，故选 C。干扰项排除：A 项只说联系本地作家与乘客；B 项文中并不反对用手机；D 项与降成本无关。","2024·新课标II卷","Do you ever get to the train station and realize you forgot to bring something to read? Yes, we all have our phones, but many of us still like to go old school and read something printed.\n\nWell, there's a kiosk (小亭) for that. In the San Francisco Bay Area, at least.\n\n\"You enter the fare gates (检票口) and you'll see a kiosk that is lit up and it tells you can get a one-minute, a three-minute, or a five-minute story,\" says Alicia Trost, the chief communications officer for the San Francisco Bay Area Rapid Transit — known as BART. \"You choose which length you want and it gives you a receipt-like short story.\"\n\nIt's that simple. Riders have printed nearly 20,000 short stories and poems since the program was launched last March. Some are classic short stories, and some are new original works.\n\nTrost also wants to introduce local writers to local riders. \"We wanted to do something where we do a call to artists in the Bay Area to submit stories for a contest,\" Trost says. \"And as of right now, we've received about 120 submissions. The winning stories would go into our kiosk and then you would be a published artist.\"\n\nRidership on transit (交通) systems across the country has been down the past half century, so could short stories save transit?\n\nTrost thinks so.\n\n\"At the end of the day all transit agencies right now are doing everything they can to improve the rider experience. So I absolutely think we will get more riders just because of short stories,\" she says.\n\nAnd you'll never be without something to read."],
["真题·阅读","How are the stories categorized in the kiosk?",["By popularity.","By length.","By theme.","By language."],1,"考点：细节理解。依据：小亭提供一分钟、三分钟、五分钟的故事，乘客“选好想要的长度”，可见是按篇幅长短分类，故选 B。干扰项排除：A 项人气、C 项主题、D 项语言在文中均无依据，属无中生有。","2024·新课标II卷","Do you ever get to the train station and realize you forgot to bring something to read? Yes, we all have our phones, but many of us still like to go old school and read something printed.\n\nWell, there's a kiosk (小亭) for that. In the San Francisco Bay Area, at least.\n\n\"You enter the fare gates (检票口) and you'll see a kiosk that is lit up and it tells you can get a one-minute, a three-minute, or a five-minute story,\" says Alicia Trost, the chief communications officer for the San Francisco Bay Area Rapid Transit — known as BART. \"You choose which length you want and it gives you a receipt-like short story.\"\n\nIt's that simple. Riders have printed nearly 20,000 short stories and poems since the program was launched last March. Some are classic short stories, and some are new original works.\n\nTrost also wants to introduce local writers to local riders. \"We wanted to do something where we do a call to artists in the Bay Area to submit stories for a contest,\" Trost says. \"And as of right now, we've received about 120 submissions. The winning stories would go into our kiosk and then you would be a published artist.\"\n\nRidership on transit (交通) systems across the country has been down the past half century, so could short stories save transit?\n\nTrost thinks so.\n\n\"At the end of the day all transit agencies right now are doing everything they can to improve the rider experience. So I absolutely think we will get more riders just because of short stories,\" she says.\n\nAnd you'll never be without something to read."],

["真题·阅读","What can be learned about BMF from paragraph 1?",["It guarantees the variety of food.","It requires day-to-day care.","It cuts the farm-to-table distance.","It relies on farmer's markets."],2,"考点：细节理解。依据：首段说农贸市场能缩短运输路程，而 BMF“把它缩得更短”，即缩短从农场到餐桌的距离，故选 C。干扰项排除：A 项“保证多样性”未提；B 项原文说“几乎不费力”；D 项两者是并列比较关系。","2024·新课标II卷","We all know fresh is best when it comes to food. However, most produce at the store went through weeks of travel and covered hundreds of miles before reaching the table. While farmer's markets are a solid choice to reduce the journey, Babylon Micro-Farm (BMF) shortens it even more.\n\nBMF is an indoor garden system. It can be set up for a family. Additionally, it could serve a larger audience such as a hospital, restaurant or school. The innovative design requires little effort to achieve a reliable weekly supply of fresh greens.\n\nSpecifically, it's a farm that relies on new technology. By connecting through the Cloud, BMF is remotely monitored. Also, there is a convenient app that provides growing data in real time. Because the system is automated, it significantly reduces the amount of water needed to grow plants. Rather than watering rows of soil, the system provides just the right amount to each plant. After harvest, users simply replace the plants with a new pre-seeded pod (容器) to get the next growth cycle started.\n\nMoreover, having a system in the same building where it's eaten means zero emissions (排放) from transporting plants from soil to salad. In addition, there's no need for pesticides and other chemicals that pollute traditional farms and the surrounding environment.\n\nBMF employees live out sustainability in their everyday lives. About half of them walk or bike to work. Inside the office, they encourage recycling and waste reduction by limiting garbage cans and avoiding single-use plastic. \"We are passionate about reducing waste, carbon and chemicals in our environment,\" said a BMF employee."],

["真题·阅读","What does the phrase \"In the wrong hands\" in paragraph 2 probably mean?",["If read by someone poorly educated.","If reviewed by someone ill-intentioned.","If written by someone less competent.","If translated by someone unacademic."],2,"考点：词义猜测。依据：下文说幸好坎贝尔有二十多年专业经验，能把艰深内容写得易懂，可见“落到不合适的人手里”指由能力不足的人来写，故选 C。干扰项排除：A 项读者学历、B 项恶意审阅、D 项翻译都偏离上下文。","2024·新课标II卷","Given the astonishing potential of AI to transform our lives, we all need to take action to deal with our AI-powered future, and this is where AI by Design: A Plan for Living with Artificial Intelligence comes in. This absorbing new book by Catriona Campbell is a practical roadmap addressing the challenges posed by the forthcoming AI revolution (变革).\n\nIn the wrong hands, such a book could prove as complicated to process as the computer code (代码) that powers AI but, thankfully, Campbell has more than two decades' professional experience translating the heady into the understandable. She writes from the practical angle of a business person rather than as an academic, making for a guide which is highly accessible and informative and which, by the close, will make you feel almost as smart as AI.\n\nAs we soon come to learn from AI by Design, AI is already super-smart and will become more capable, moving from the current generation of \"narrow-AI\" to Artificial General Intelligence. From there, Campbell says, will come Artificial Dominant Intelligence. This is why Campbell has set out to raise awareness of AI and its future now — several decades before these developments are expected to take place. She says it is essential that we keep control of artificial intelligence, or risk being sidelined and perhaps even worse.\n\nCampbell's point is to wake up those responsible for AI — the technology companies and world leaders — so they are on the same page as all the experts currently developing it. She explains we are at a \"tipping point\" in history and must act now to prevent an extinction-level event for humanity. We need to consider how we want our future with AI to pan out. Such structured thinking, followed by global regulation, will enable us to achieve greatness rather than our downfall.\n\nAI will affect us all, and if you only read one book on the subject, this is it."],
["真题·阅读","What is a feature of AI by Design according to the text?",["It is packed with complex codes.","It adopts a down-to-earth writing style.","It provides step-by-step instructions.","It is intended for AI professionals."],1,"考点：细节理解。依据：她以商人的实用角度写作，书“极具可读性”，即文风平实接地气（down-to-earth），故选 B。干扰项排除：A 项与“不像代码那样难读”相反；C 项分步指导未提；D 项读者是大众而非专业人士。","2024·新课标II卷","Given the astonishing potential of AI to transform our lives, we all need to take action to deal with our AI-powered future, and this is where AI by Design: A Plan for Living with Artificial Intelligence comes in. This absorbing new book by Catriona Campbell is a practical roadmap addressing the challenges posed by the forthcoming AI revolution (变革).\n\nIn the wrong hands, such a book could prove as complicated to process as the computer code (代码) that powers AI but, thankfully, Campbell has more than two decades' professional experience translating the heady into the understandable. She writes from the practical angle of a business person rather than as an academic, making for a guide which is highly accessible and informative and which, by the close, will make you feel almost as smart as AI.\n\nAs we soon come to learn from AI by Design, AI is already super-smart and will become more capable, moving from the current generation of \"narrow-AI\" to Artificial General Intelligence. From there, Campbell says, will come Artificial Dominant Intelligence. This is why Campbell has set out to raise awareness of AI and its future now — several decades before these developments are expected to take place. She says it is essential that we keep control of artificial intelligence, or risk being sidelined and perhaps even worse.\n\nCampbell's point is to wake up those responsible for AI — the technology companies and world leaders — so they are on the same page as all the experts currently developing it. She explains we are at a \"tipping point\" in history and must act now to prevent an extinction-level event for humanity. We n re with AI to pan out. Such structured thinking, followed by global regulation, will enable us to achieve greatness rather than our downfall.\n\nAI will affect us all, and if you only read one book on the subject, this is it."],
["真题·七选五","第 36 空最合适的句子是？",["Visit during off-peak times.","So, should we stop traveling?","Travel for you and no one else.","Can overtourism be avoided then?","You can still find relatively undiscovered places.","You'll find yourself virtually alone, or close to it.","Consider giving back to the communities you're visiting."],1,"考点：上下文逻辑（设问与回答）。依据：空后紧跟 Certainly not，只能是对一个否定式问句的回答，B 项“那我们该停止旅行吗？”与之衔接，故选 B。干扰项排除：D 项语义重复且与 Certainly not 不搭；其余各项为建议句，无法被直接回答。","2024·新课标II卷","Overtourism Is For Real: How Can You Help?\n\nTravel promotes understanding, expands our minds, makes us better people, and boosts local economies and communities, but the rapid growth of travel has led to overtourism in certain regions and destinations. (36) Certainly not. The loss of what travel offers would be unacceptable in today's world. Here are some tips on making wise decisions to minimize pressure on the places we visit and improve our experience.\n\n● Choose mindfully. Overvisited destinations are that way for a reason: they're special. With so many online posts featuring the same places, it's easy to feel like you're missing out. Go somewhere only when the landscape, culture or food deeply draws you. (37)\n\n● Get creative. The best way to ease pressure on over-touristed destinations is to go somewhere else. Though overtourism is described as a problem affecting the entire world, it's actually concentrated to a small number of extremely popular spots. That means you have tons of less-visited options to choose from. (38) Why not try a regional alternative or check out a popular destination's lesser-known sights?\n\n● (39) Minimize impact and maximize experience by skipping major holidays or rush hour. You'll compete with fewer tourists, save money, experience a different side of a popular place, and boost the economy when tourism is traditionally slower.\n\nVisiting a place that others call home is a privilege (荣幸). Do your part to preserve what makes a destination special in the first place. (40) You may be amazed how much closer you'll feel to the people there."],

e amazed how much closer you'll feel to the people there."],

ay be amazed how much closer you'll feel to the people there."],

d how much closer you'll feel to the people there."],

azed how much closer you'll feel to the people there."],
["真题·阅读","What is the aim of the Habitat Restoration Team?",["To discover mineral resources.","To develop new wildlife parks.","To protect the local ecosystem.","To conduct biological research."],2,"考查细节理解。首段 Help restore and protect Marin's natural areas 与 protecting endangered species 说明宗旨是保护当地生态，C 正确；A 文中未提矿藏，B 是新建公园，D 的研究主体是科研人员而非志愿工作队。","2024·新课标I卷","HABITAT RESTORATION TEAM\nHelp restore and protect Marin's natural areas from the Marin Headlands to Bolinas Ridge. We'll explore beautiful park sites while conducting invasive (入侵的) plant removal, winter planting, and seed collection. Habitat Restoration Team volunteers play a vital role in restoring sensitive resources and protecting endangered species across the ridges and valleys.\n\nGROUPS\nGroups of five or more require special arrangements and must be confirmed in advance. Please review the List of Available Projects and fill out the Group Project Request Form.\n\nAGE, SKILLS, WHAT TO BRING\nVolunteers aged 10 and over are welcome. Read our Youth Policy Guidelines for youth under the age of 15.\n\nBring your completed Volunteer Agreement Form. Volunteers under the age of 18 must have the parent/guardian approval section signed.\n\nWe'll be working rain or shine. Wear clothes that can get dirty. Bring layers for changing weather and a raincoat if necessary.\n\nBring a personal water bottle, sunscreen, and lunch.\n\nNo experience necessary. Training and tools will be provided. Fulfills (满足) community service requirements.\n\nUPCOMING EVENTS\nSunday, Jan. 15, 10:00am - 1:00pm — Battery Alexander Trailhead\nSunday, Jan. 22, 10:00am - 2:30pm — Stinson Beach Parking Lot\nSunday, Jan. 29, 9:30am - 2:30pm — Coyote Ridge Trailhead"],
