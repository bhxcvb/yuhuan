外的渔船令他悲伤。\n\n比斯尔先生巧妙地把历史洞见与文化典故组织起来，使他的叙述成为一幅以西方目光看到的、完整的乌兹别克斯坦图景。他的判断和引证明显是美国的，他娇弱的肠胃也是。正如作者所说明的，这既不是游记，也不是历史书，甚至不是报道；不管它是什么，结果都是对中亚最纯正传统的生动而出色的描绘。"},"433":{"q":"第二段中画线词“that”指什么？","o":["患上严重的精神疾病。","在中亚参加跟团游。","在乌兹别克斯坦做志愿者。","写一篇关于咸海的文章。"],"p":"20 世纪 90 年代中期，汤姆·比斯尔在乌兹别克斯坦做志愿者教英语。七个月后他离开了，身体垮掉，精神也几近崩溃。几年后，他仍被这个国家吸引，于是重返乌兹别克斯坦，写一篇关于咸海消失的文章。\n\n然而这次行程涉及的内容远不止于此。于是有了这本书——《追踪大海：迷失在中亚帝国的幽灵之间》，讲的是从塔什干到卡拉卡尔帕克斯坦的公路旅行，那里数百万人的生活已被海水的缓慢干涸摧毁。这是一个美国人前往陌生土地的故事，也是他沿途遇到的人的故事：翻译鲁斯塔姆，一位可爱的 24 岁青年，在加利福尼亚学了一口花哨的英语；塔什干的房东奥列格和娜塔莎；还有一长串外国援助工作者。\n\n这是对乌兹别克斯坦生活的一次快速掠影：有友善与温暖，也有社会更阴暗的一面。在撒马尔罕，比斯尔先生赞叹建筑奇观；前往布哈拉途中，他因被怀疑贩毒而领教了警察的手段；在费尔干纳，他参加了一场山间葬礼，随后又是一场奇怪的酒会；在卡拉卡尔帕克斯坦，沙尘暴、疾病和搁浅在离海数英里之外的渔船令他悲伤。\n\n比斯尔先生巧妙地把历史洞见与文化典故组织起来，使他的叙述成为一幅以西方目光看到的、完整的乌兹别克斯坦图景。他的判断和引证明显是美国的，他娇弱的肠胃也是。正如作者所说明的，这既不是游记，也不是历史书，甚至不是报道；不管它是什么，结果都是对中亚最纯正传统的生动而出色的描绘。"},"434":{"q":"下列哪项最能描述比斯尔先生在乌兹别克斯坦的公路旅行？","o":["浪漫的。","波折不断的。","愉快的。","危险的。"],"p":"20 世纪 90 年代中期，汤姆·比斯尔在乌兹别克斯坦做志愿者教英语。七个月后他离开了，身体垮掉，精神也几近崩溃。几年后，他仍被这个国家吸引，于是重返乌兹别克斯坦，写一篇关于咸海消失的文章。\n\n然而这次行程涉及的内容远不止于此。于是有了这本书——《追踪大海：迷失在中亚帝国的幽灵之间》，讲的是从塔什干到卡拉卡尔帕克斯坦的公路旅行，那里数百万人的生活已被海水的缓慢干涸摧毁。这是一个美国人前往陌生土地的故事，也是他沿途遇到的人的故事：翻译鲁斯塔姆，一位可爱的 24 岁青年，在加利福尼亚学了一口花哨的英语；塔什干的房东奥列格和娜塔莎；还有一长串外国援助工作者。\n\n这是对乌兹别克斯坦生活的一次快速掠影：有友善与温暖，也有社会更阴暗的一面。在撒马尔罕，比斯尔先生赞叹建筑奇观；前往布哈拉途中，他因被怀疑贩毒而领教了警察的手段；在费尔干纳，他参加了一场山间葬礼，随后又是一场奇怪的酒会；在卡拉卡尔帕克斯坦，沙尘暴、疾病和搁浅在离海数英里之外的渔船令他悲伤。\n\n比斯尔先生巧妙地把历史洞见与文化典故组织起来，使他的叙述成为一幅以西方目光看到的、完整的乌兹别克斯坦图景。他的判断和引证明显是美国的，他娇弱的肠胃也是。正如作者所说明的，这既不是游记，也不是历史书，甚至不是报道；不管它是什么，结果都是对中亚最纯正传统的生动而出色的描绘。"},"435":{"q":"本文的目的是什么？","o":["介绍一本书。","解释一种文化现象。","纪念一位作家。","推荐一个旅游目的地。"],"p":"20 世纪 90 年代中期，汤姆·比斯尔在乌兹别克斯坦做志愿者教英语。七个月后他离开了，身体垮掉，精神也几近崩溃。几年后，他仍被这个国家吸引，于是重返乌兹别克斯坦，写一篇关于咸海消失的文章。\n\n然而这次行程涉及的内容远不止于此。于是有了这本书——《追踪大海：迷失在中亚帝国的幽灵之间》，讲的是从塔什干到卡拉卡尔帕克斯坦的公路旅行，那里数百万人的生活已被海水的缓慢干涸摧毁。这是一个美国人前往陌生土地的故事，也是他沿途遇到的人的故事：翻译鲁斯塔姆，一位可爱的 24 岁青年，在加利福尼亚学了一口花哨的英语；塔什干的房东奥列格和娜塔莎；还有一长串外国援助工作者。\n\n这是对乌兹别克斯坦生活的一次快速掠影：有友善与温暖，也有社会更阴暗的一面。在撒马尔罕，比斯尔先生赞叹建筑奇观；前往布哈拉途中，他因被怀疑贩毒而领教了警察的手段；在费尔干纳，他参加了一场山间葬礼，随后又是一场奇怪的酒会；在卡拉卡尔帕克斯坦，沙尘暴、疾病和搁浅在离海数英里之外的渔船令他悲伤。\n\n比斯尔先生巧妙地把历史洞见与文化典故组织起来，使他的叙述成为一幅以西方目光看到的、完整的乌兹别克斯坦图景。他的判断和引证明显是美国的，他娇弱的肠胃也是。正如作者所说明的，这既不是游记，也不是历史书，甚至不是报道；不管它是什么，结果都是对中亚最纯正传统的生动而出色的描绘。"},"436":{"q":"这项近期研究主要关于什么？","o":["食品安全。","电影收视。","消费需求。","饮食行为。"],"p":"《消费者研究杂志》近期的一项研究表明，同伴的体型和进食习惯都会影响我们的进食量。与既有研究相反——那些研究建议你避免和点大份食物的较胖的人一起吃饭——你真正需要避开的是胃口很大的瘦高个。\n\n为检验社会影响对进食习惯的作用，研究者做了两项实验。第一项中，95 名女大学生被逐一请进实验室，表面上参加一项关于电影收视的研究。电影开始前，每位女生被请自取点心。研究者雇用的一名演员先拿了食物。她本人体重 105 磅，但有一半的场次她穿着特制的增肥装，体重增至 180 磅。\n\n无论胖版还是瘦版的演员都取了很多食物。参与者跟着照做，比平时吃得更多；但当演员是瘦子时，她们吃得明显更多。\n\n第二项测试中，一种情况下瘦演员从点心碗里拿了两颗糖，另一种情况下拿了 30 颗。结果与第一项相似：参与者跟着照做，但当瘦演员拿 30 颗时，她们拿的糖明显更多。\n\n这些测试表明，我们做决定时社会环境的影响极大：如果同桌的人要多吃，我也多吃。可以称之为“我要和她一样”效应。不过我们会调整这种影响：如果一个超重的人吃了一大份，我会克制一点，因为我看到了他进食习惯的结果；但如果一个瘦人吃很多，我就会跟着吃——如果他能吃很多还保持苗条，我为什么不能？"},"437":{"q":"第一段中画线词“beanpoles”指什么？","o":["食量大的人。","超重的人。","挑食的人。","又高又瘦的人。"],"p":"《消费者研究杂志》近期的一项研究表明，同伴的体型和进食习惯都会影响我们的进食量。与既有研究相反——那些研究建议你避免和点大份食物的较胖的人一起吃饭——你真正需要避开的是胃口很大的瘦高个。\n\n为检验社会影响对进食习惯的作用，研究者做了两项实验。第一项中，95 名女大学生被逐一请进实验室，表面上参加一项关于电影收视的研究。电影开始前，每位女生被请自取点心。研究者雇用的一名演员先拿了食物。她本人体重 105 磅，但有一半的场次她穿着特制的增肥装，体重增至 180 磅。\n\n无论胖版还是瘦版的演员都取了很多食物。参与者跟着照做，比平时吃得更多；但当演员是瘦子时，她们吃得明显更多。\n\n第二项测试中，一种情况下瘦演员从点心碗里拿了两颗糖，另一种情况下拿了 30 颗。结果与第一项相似：参与者跟着照做，但当瘦演员拿 30 颗时，她们拿的糖明显更多。\n\n这些测试表明，我们做决定时社会环境的影响极大：如果同桌的人要多吃，我也多吃。可以称之为“我要和她一样”效应。不过我们会调整这种影响：如果一个超重的人吃了一大份，我会克制一点，因为我看到了他进食习惯的结果；但如果一个瘦人吃很多，我就会跟着吃——如果他能吃很多还保持苗条，我为什么不能？"},"438":{"q":"研究者为什么雇用这位演员？","o":["观察她会如何影响参与者。","测试参与者能否认出她。","弄清她在两次测试中会怎么做。","研究她为何能保持体重。"],"p":"《消费者研究杂志》近期的一项研究表明，同伴的体型和进食习惯都会影响我们的进食量。与既有研究相反——那些研究建议你避免和点大份食物的较胖的人一起吃饭——你真正需要避开的是胃口很大的瘦高个。\n\n为检验社会影响对进食习惯的作用，研究者做了两项实验。第一项中，95 名女大学生被逐一请进实验室，表面上参加一项关于电影收视的研究。电影开始前，每位女生被请自取点心。研究者雇用的一名演员先拿了食物。她本人体重 105 磅，但有一半的场次她穿着特制的增肥装，体重增至 180 磅。\n\n无论胖版还是瘦版的演员都取了很多食物。参与者跟着照做，比平时吃得更多；但当演员是瘦子时，她们吃得明显更多。\n\n第二项测试中，一种情况下瘦演员从点心碗里拿了两颗糖，另一种情况下拿了 30 颗。结果与第一项相似：参与者跟着照做，但当瘦演员拿 30 颗时，她们拿的糖明显更多。\n\n这些测试表明，我们做决定时社会环境的影响极大：如果同桌的人要多吃，我也多吃。可以称之为“我要和她一样”效应。不过我们会调整这种影响：如果一个超重的人吃了一大份，我会克制一点，因为我看到了他进食习惯的结果；但如果一个瘦人吃很多，我就会跟着吃——如果他能吃很多还保持苗条，我为什么不能？"},"439":{"q":"根据末段，我们依据什么来“调整这种影响”？","o":["我们有多饿。","我们想多瘦。","我们如何看待他人。","我们对食物的感觉。"],"p":"《消费者研究杂志》近期的一项研究表明，同伴的体型和进食习惯都会影响我们的进食量。与既有研究相反——那些研究建议你避免和点大份食物的较胖的人一起吃饭——你真正需要避开的是胃口很大的瘦高个。\n\n为检验社会影响对进食习惯的作用，研究者做了两项实验。第一项中，95 名女大学生被逐一请进实验室，表面上参加一项关于电影收视的研究。电影开始前，每位女生被请自取点心。研究者雇用的一名演员先拿了食物。她本人体重 105 磅，但有一半的场次她穿着特制的增肥装，体重增至 180 磅。\n\n无论胖版还是瘦版的演员都取了很多食物。参与者跟着照做，比平时吃得更多；但当演员是瘦子时，她们吃得明显更多。\n\n第二项测试中，一种情况下瘦演员从点心碗里拿了两颗糖，另一种情况下拿了 30 颗。结果与第一项相似：参与者跟着照做，但当瘦演员拿 30 颗时，她们拿的糖明显更多。\n\n这些测试表明，我们做决定时社会环境的影响极大：如果同桌的人要多吃，我也多吃。可以称之为“我要和她一样”效应。不过我们会调整这种影响：如果一个超重的人吃了一大份，我会克制一点，因为我看到了他进食习惯的结果；但如果一个瘦人吃很多，我就会跟着吃——如果他能吃很多还保持苗条，我为什么不能？"},"440":{"q":"第 16 空应填入的句子是？","o":["反其道而行之。","你想成为一名有影响力的演讲者。","你不必为小小的口误道歉。","就演讲而言，少通常即是多。","多数演讲的目的是让听众受益。","把注意力放在听众身上，从而消除对演讲的恐惧。","然而，大多数人之所以成为有效演讲者，是因为他们受过训练。"],"p":"有些人天生就有演讲天赋。（16）你想成为优秀的演讲者吗？以下是你必须掌握的一些原则。\n\n人们愿意听有趣、放松、自在的人讲话。但站在台上演讲时，人们常常只顾“公众”而忽略了“讲话”。（17）把注意力放在“讲话”上：直接对着听众说，做你自己，与听众建立联系。\n\n即使最成功的演讲者也会出错。然而，唯一在意错误的人就是正在讲话的人。听众的注意力总会走神，事实上多数人只能吸收演讲者约 20% 的信息。所以，除非是真正严重的错误，否则不要因为出错就停下来。（18）\n\n你的目标不是做完美的演讲者。（19）而像生活中的其他事一样，这需要练习。记住，连世界冠军运动员也一直坚持训练。\n\n（20）很少有人会说：“我希望那位演讲者讲得更久些。”另一方面，你大概数不清自己有多少次想：“谢天谢地，终于讲完了，好像永远讲不完！”所以给听众一个惊喜：让演讲比预期稍短一点。让听众意犹未尽，总好过让他们坐立不安地等着你结束。"},"441":{"q":"第 17 空应填入的句子是？","o":["反其道而行之。","你想成为一名有影响力的演讲者。","你不必为小小的口误道歉。","就演讲而言，少通常即是多。","多数演讲的目的是让听众受益。","把注意力放在听众身上，从而消除对演讲的恐惧。","然而，大多数人之所以成为有效演讲者，是因为他们受过训练。"],"p":"有些人天生就有演讲天赋。（16）你想成为优秀的演讲者吗？以下是你必须掌握的一些原则。\n\n人们愿意听有趣、放松、自在的人讲话。但站在台上演讲时，人们常常只顾“公众”而忽略了“讲话”。（17）把注意力放在“讲话”上：直接对着听众说，做你自己，与听众建立联系。\n\n即使最成功的演讲者也会出错。然而，唯一在意错误的人就是正在讲话的人。听众的注意力总会走神，事实上多数人只能吸收演讲者约 20% 的信息。所以，除非是真正严重的错误，否则不要因为出错就停下来。（18）\n\n你的目标不是做完美的演讲者。（19）而像生活中的其他事一样，这需要练习。记住，连世界冠军运动员也一直坚持训练。\n\n（20）很少有人会说：“我希望那位演讲者讲得更久些。”另一方面，你大概数不清自己有多少次想：“谢天谢地，终于讲完了，好像永远讲不完！”所以给听众一个惊喜：让演讲比预期稍短一点。让听众意犹未尽，总好过让他们坐立不安地等着你结束。"},"442":{"q":"第 18 空应填入的句子是？","o":["反其道而行之。","你想成为一名有影响力的演讲者。","你不必为小小的口误道歉。","就演讲而言，少通常即是多。","多数演讲的目的是让听众受益。","把注意力放在听众身上，从而消除对演讲的恐惧。","然而，大多数人之所以成为有效演讲者，是因为他们受过训练。"],"p":"有些人天生就有演讲天赋。（16）你想成为优秀的演讲者吗？以下是你必须掌握的一些原则。\n\n人们愿意听有趣、放松、自在的人讲话。但站在台上演讲时，人们常常只顾“公众”而忽略了“讲话”。（17）把注意力放在“讲话”上：直接对着 觉得累极了。我很感激家人就在身边帮忙。我们得像流水线一样作业：冲“虎奶”、洗奶瓶、擦地板。\n\n斑点和条纹四个月大时，已经学会开门和跳栅栏，我们知道真该让它们走了。最终与它们分别，对我们来说很难。头几天，凯南总因幼虎不在而有些失落。\n\n我并不难过。在动物园里我每天都亲手照料它们，而且我确实满怀深情地回想和它们相处的那段时光。"},"449":{"q":"第三段画线短语“get up to mischief”是什么意思？","o":["行为不端。","迷路。","睡得很香。","想妈妈。"],"p":"我在国家动物园做了 11 年饲养员。斑点和条纹是在这里出生的第一批虎崽。全球范围内，动物园里三分之一的苏门答腊虎崽活不到成年，所以我决定把它们带回家，全天候照顾。\n\n我有两个孩子——小儿子凯南对老虎的到来高兴极了——但我们全家都非常期待参与它们的生活，看着它们长大。我并不担心把它们带回家和妻子、孩子一起住：它们还只是幼崽，体重约 2.5 公斤，小得完全没有危险。\n\n随着它们越来越能活动，白天我们让它们在家里自由走动；但我们睡觉时，只好把它们关在一个大房间里，否则它们就会胡闹。早上我们下楼，常发现它们把房间翻得底朝天，弄得像个动物园。\n\n照顾它们需要耗费大量精力，事情很快变得非常紧张。有过艰难的时候，我只觉得累极了。我很感激家人就在身边帮忙。我们得像流水线一样作业：冲“虎奶”、洗奶瓶、擦地板。\n\n斑点和条纹四个月大时，已经学会开门和跳栅栏，我们知道真该让它们走了。最终与它们分别，对我们来说很难。头几天，凯南总因幼虎不在而有些失落。\n\n我并不难过。在动物园里我每天都亲手照料它们，而且我确实满怀深情地回想和它们相处的那段时光。"},"450":{"q":"作者如何看待在家养虎崽这件事？","o":["无聊。","累人。","花钱多。","危险。"],"p":"我在国家动物园做了 11 年饲养员。斑点和条纹是在这里出生的第一批虎崽。全球范围内，动物园里三分之一的苏门答腊虎崽活不到成年，所以我决定把它们带回家，全天候照顾。\n\n我有两个孩子——小儿子凯南对老虎的到来高兴极了——但我们全家都非常期待参与它们的生活，看着它们长大。我并不担心把它们带回家和妻子、孩子一起住：它们还只是幼崽，体重约 2.5 公斤，小得完全没有危险。\n\n随着它们越来越能活动，白天我们让它们在家里自由走动；但我们睡觉时，只好把它们关在一个大房间里，否则它们就会胡闹。早上我们下楼，常发现它们把房间翻得底朝天，弄得像个动物园。\n\n照顾它们需要耗费大量精力，事情很快变得非常紧张。有过艰难的时候，我只觉得累极了。我很感激家人就在身边帮忙。我们得像流水线一样作业：冲“虎奶”、洗奶瓶、擦地板。\n\n斑点和条纹四个月大时，已经学会开门和跳栅栏，我们知道真该让它们走了。最终与它们分别，对我们来说很难。头几天，凯南总因幼虎不在而有些失落。\n\n我并不难过。在动物园里我每天都亲手照料它们，而且我确实满怀深情地回想和它们相处的那段时光。"},"451":{"q":"作者为什么决定把斑点和条纹送回动物园？","o":["它们吓到了孩子。","它们变得难以管束。","它们惹恼了邻居。","它们开始互相打斗。"],"p":"我在国家动物园做了 11 年饲养员。斑点和条纹是在这里出生的第一批虎崽。全球范围内，动物园里三分之一的苏门答腊虎崽活不到成年，所以我决定把它们带回家，全天候照顾。\n\n我有两个孩子——小儿子凯南对老虎的到来高兴极了——但我们全家都非常期待参与它们的生活，看着它们长大。我并不担心把它们带回家和妻子、孩子一起住：它们还只是幼崽，体重约 2.5 公斤，小得完全没有危险。\n\n随着它们越来越能活动，白天我们让它们在家里自由走动；但我们睡觉时，只好把它们关在一个大房间里，否则它们就会胡闹。早上我们下楼，常发现它们把房间翻得底朝天，弄得像个动物园。\n\n照顾它们需要耗费大量精力，事情很快变得非常紧张。有过艰难的时候，我只觉得累极了。我很感激家人就在身边帮忙。我们得像流水线一样作业：冲“虎奶”、洗奶瓶、擦地板。\n\n斑点和条纹四个月大时，已经学会开门和跳栅栏，我们知道真该让它们走了。最终与它们分别，对我们来说很难。头几天，凯南总因幼虎不在而有些失落。\n\n我并不难过。在动物园里我每天都亲手照料它们，而且我确实满怀深情地回想和它们相处的那段时光。"},"452":{"q":"扎菲拉库将如何支配她的奖金？","o":["拍一部电影。","建新学校。","开展一个项目。","帮助本地音乐人。"],"p":"一位被评为“世界最佳教师”而获得 100 万美元奖金的英国女性，将用这笔钱把鼓舞人心的人物请进英国校园。\n\n伦敦北部一所中学的教师安德里亚·扎菲拉库说，她想带来一场课堂革命。“我们要做出改变，”她说，“我已经启动了一个项目，推动学校里的艺术教学。”\n\n这个项目源于许多学校难以把各类艺术家——无论是崭露头角的本地音乐人还是大牌影星——请进学校，与孩子们一起工作并激励他们。\n\n扎菲拉库在她工作了十二年的阿尔珀顿社区学校启动了这个项目。“我见过那些神奇的时刻：孩子们和他们所敬仰的人交谈时，眼睛发亮，脸上放光，”她说，“我们的学校比以往任何时候都更需要艺术家。”\n\n艺术家迈克尔·克雷格-马丁说：“安德里亚把各领域艺术家带到孩子身边的出色项目，在学校艺术教育正被降格的当下尤其值得欢迎。”他补充说，把艺术视为不必要是个错误。历史学家西蒙·沙马爵士也是该项目的支持者。他说，学校的艺术教育绝不只是附加品。\n\n“它绝对必要。未来取决于创造力，而创造力取决于年轻人。当人工智能接管一切时，我们身上留下的将是创造力；几个世纪以来，正是我们的创造精神、我们富有远见的新鲜感，一直是我们的力量所在。”"},"453":{"q":"克雷格-马丁如何看待英国学校的艺术教学？","o":["它特别难。","它增加了艺术家的收入。","它开阔孩子的心智。","它应受到更多重视。"],"p":"一位被评为“世界最佳教师”而获得 100 万美元奖金的英国女性，将用这笔钱把鼓舞人心的人物请进英国校园。\n\n伦敦北部一所中学的教师安德里亚·扎菲拉库说，她想带来一场课堂革命。“我们要做出改变，”她说，“我已经启动了一个项目，推动学校里的艺术教学。”\n\n这个项目源于许多学校难以把各类艺术家——无论是崭露头角的本地音乐人还是大牌影星——请进学校，与孩子们一起工作并激励他们。\n\n扎菲拉库在她工作了十二年的阿尔珀顿社区学校启动了这个项目。“我见过那些神奇的时刻：孩子们和他们所敬仰的人交谈时，眼睛发亮，脸上放光，”她说，“我们的学校比以往任何时候都更需要艺术家。”\n\n艺术家迈克尔·克雷格-马丁说：“安德里亚把各领域艺术家带到孩子身边的出色项目，在学校艺术教育正被降格的当下尤其值得欢迎。”他补充说，把艺术视为不必要是个错误。历史学家西蒙·沙马爵士也是该项目的支持者。他说，学校的艺术教育绝不只是附加品。\n\n“它绝对必要。未来取决于创造力，而创造力取决于年轻人。当人工智能接管一切时，我们身上留下的将是创造力；几个世纪以来，正是我们的创造精神、我们富有远见的新鲜感，一直是我们的力量所在。”"},"454":{"q":"在沙马看来，学校教育应强调什么？","o":["道德原则。","人际交往技能。","创造能力。","积极的世界观。"],"p":"一位被评为“世界最佳教师”而获得 100 万美元奖金的英国女性，将用这笔钱把鼓舞人心的人物请进英国校园。\n\n伦敦北部一所中学的教师安德里亚·扎菲拉库说，她想带来一场课堂革命。“我们要做出改变，”她说，“我已经启动了一个项目，推动学校里的艺术教学。”\n\n这个项目源于许多学校难以把各类艺术家——无论是崭露头角的本地音乐人还是大牌影星——请进学校，与孩子们一起工作并激励他们。\n\n扎菲拉库在她工作了十二年的阿尔珀顿社区学校启动了这个项目。“我见过那些神奇的时刻：孩子们和他们所敬仰的人交谈时，眼睛发亮，脸上放光，”她说，“我们的学校比以往任何时候都更需要艺术家。”\n\n艺术家迈克尔·克雷格-马丁说：“安德里亚把各领域艺术家带到孩子身边的出色项目，在学校艺术教育正被降格的当下尤其值得欢迎。”他补充说，把艺术视为不必要是个错误。历史学家西蒙·沙马爵士也是该项目的支持者。他说，学校的艺术教育绝不只是附加品。\n\n“它绝对必要。未来取决于创造力，而创造力取决于年轻人。当人工智能接管一切时，我们身上留下的将是创造力；几个世纪以来，正是我们的创造精神、我们富有远见的新鲜感，一直是我们的力量所在。”"},"455":{"q":"下列哪项最适合作为本文标题？","o":["把艺术家请进学校","当历史学家遇见艺术家","英国的艺术教育","世界最佳艺术教师"],"p":"一位被评为“世界最佳教师”而获得 100 万美元奖金的英国女性，将用这笔钱把鼓舞人心的人物请进英国校园。\n\n伦敦北部一所中学的教师安德里亚·扎菲拉库说，她想带来一场课堂革命。“我们要做出改变，”她说，“我已经启动了一个项目，推动学校里的艺术教学。”\n\n这个项目源于许多学校难以把各类艺术家——无论是崭露头角的本地音乐人还是大牌影星——请进学校，与孩子们一起工作并激励他们。\n\n扎菲拉库在她工作了十二年的阿尔珀顿社区学校启动了这个项目。“我见过那些神奇的时刻：孩子们和他们所敬仰的人交谈时，眼睛发亮，脸上放光，”她说，“我们的学校比以往任何时候都更需要艺术家。”\n\n艺术家迈克尔·克雷格-马 制潜在的受害者。情商高并不一定使人成为有道德的人。\n\n尽管大众对情商的看法远远超出了研究能够合理支持的范围，但这种宣传的总体效果仍是利大于弊。普及化最积极的一面，是雇主、教育者和其他关心社会福祉的人对情绪给予了新的、十分必要的重视。情商的普及帮助公众和研究者重新评估情绪的功能，以及情绪如何帮助人们在日常生活中适应环境。\n\n情商持续受到大众欢迎固然可喜，但我们希望这种关注能激发对情绪进行科学与学术研究的更大兴趣。我们期望在未来几十年里，科学的进步能提供新的视角，用来研究人们如何经营自己的生活。情商兼顾头脑与心灵，或许能为我们指明正确的方向。"},"477":{"q":"作者在第二段提到“医生”和“骗子”用意何在？","o":["解释一条规则。","澄清一个概念。","陈述一个事实。","作出一个预测。"],"p":"在某些情况下，普及化改变了“情商”的原意。如今许多人把情商误解为一个人身上几乎所有无法用智商测试衡量的优良品质，如性格、动机、自信、情绪稳定、乐观和“人际交往能力”。研究表明，情绪技能可能有助于形成其中某些品质，但大多数品质远非以技能为基础的情商所能涵盖。\n\n我们更愿意把情商描述为一套具体技能，它既可用于善，也可用于恶。准确理解他人感受的能力，医生可以用来找到最好的办法帮助病人，而骗子则可能用它来控制潜在的受害者。情商高并不一定使人成为有道德的人。\n\n尽管大众对情商的看法远远超出了研究能够合理支持的范围，但这种宣传的总体效果仍是利大于弊。普及化最积极的一面，是雇主、教育者和其他关心社会福祉的人对情绪给予了新的、十分必要的重视。情商的普及帮助公众和研究者重新评估情绪的功能，以及情绪如何帮助人们在日常生活中适应环境。\n\n情商持续受到大众欢迎固然可喜，但我们希望这种关注能激发对情绪进行科学与学术研究的更大兴趣。我们期望在未来几十年里，科学的进步能提供新的视角，用来研究人们如何经营自己的生活。情商兼顾头脑与心灵，或许能为我们指明正确的方向。"},"478":{"q":"作者对情商的普及持什么态度？","o":["赞成。","无法容忍。","怀疑。","不明确。"],"p":"在某些情况下，普及化改变了“情商”的原意。如今许多人把情商误解为一个人身上几乎所有无法用智商测试衡量的优良品质，如性格、动机、自信、情绪稳定、乐观和“人际交往能力”。研究表明，情绪技能可能有助于形成其中某些品质，但大多数品质远非以技能为基础的情商所能涵盖。\n\n我们更愿意把情商描述为一套具体技能，它既可用于善，也可用于恶。准确理解他人感受的能力，医生可以用来找到最好的办法帮助病人，而骗子则可能用它来控制潜在的受害者。情商高并不一定使人成为有道德的人。\n\n尽管大众对情商的看法远远超出了研究能够合理支持的范围，但这种宣传的总体效果仍是利大于弊。普及化最积极的一面，是雇主、教育者和其他关心社会福祉的人对情绪给予了新的、十分必要的重视。情商的普及帮助公众和研究者重新评估情绪的功能，以及情绪如何帮助人们在日常生活中适应环境。\n\n情商持续受到大众欢迎固然可喜，但我们希望这种关注能激发对情绪进行科学与学术研究的更大兴趣。我们期望在未来几十年里，科学的进步能提供新的视角，用来研究人们如何经营自己的生活。情商兼顾头脑与心灵，或许能为我们指明正确的方向。"},"479":{"q":"关于情商，最后一段主要谈了什么？","o":["它对公众的吸引力。","对未来研究的期待。","它的实际应用。","持新视角的科学家。"],"p":"在某些情况下，普及化改变了“情商”的原意。如今许多人把情商误解为一个人身上几乎所有无法用智商测试衡量的优良品质，如性格、动机、自信、情绪稳定、乐观和“人际交往能力”。研究表明，情绪技能可能有助于形成其中某些品质，但大多数品质远非以技能为基础的情商所能涵盖。\n\n我们更愿意把情商描述为一套具体技能，它既可用于善，也可用于恶。准确理解他人感受的能力，医生可以用来找到最好的办法帮助病人，而骗子则可能用它来控制潜在的受害者。情商高并不一定使人成为有道德的人。\n\n尽管大众对情商的看法远远超出了研究能够合理支持的范围，但这种宣传的总体效果仍是利大于弊。普及化最积极的一面，是雇主、教育者和其他关心社会福祉的人对情绪给予了新的、十分必要的重视。情商的普及帮助公众和研究者重新评估情绪的功能，以及情绪如何帮助人们在日常生活中适应环境。\n\n情商持续受到大众欢迎固然可喜，但我们希望这种关注能激发对情绪进行科学与学术研究的更大兴趣。我们期望在未来几十年里，科学的进步能提供新的视角，用来研究人们如何经营自己的生活。情商兼顾头脑与心灵，或许能为我们指明正确的方向。"},"480":{"q":"第 36 空最合适的句子是？","o":["并非所有顾客都是游客。","法国的生活质量同样出色。","那里有很不错的厨房和舒适的床。","那些美味的食物主要由当地农民消费。","这并不是法国人比我们吃得少的唯一原因。","我们的目标是看看能否以某种方式像真正的巴黎人那样生活。","食物太美味了，你不需要吃很多就能感到满足。"],"p":"我和丈夫刚在巴黎待了一周。(36) 所以我们做的第一件事，就是租下一套贵得离谱的六楼公寓，只有橱柜那么大。它小得我们只好把行李箱留在走廊里。\n\n不过，这地方并不完全“正宗”。和普通的巴黎公寓不同，这里的管道是能用的。(37) 我们楼里甚至有一部小电梯，用纯正的法语女声说“Ouverture des portes”（开门）。这是我唯一掌握的法语短语，可惜我没什么机会用它。\n\n巴黎人和你我不同。他们看上去从不懒散邋遢。正如几周前本报有人写到的那样，他们吃得好却从不发胖。(38) 法国的草莓吃起来不像硬纸板，而是在你嘴里像小风味炸弹一样爆开。\n\n(39) 在巴黎的第一个早晨，我走到街角的市场买些食品杂货。我买了一小把熟得正好的小草莓和一只甜甜的小瓜。丈夫和我一致认为，这是我们吃过的最好的水果。可它们花了 18 美元！\n\n在法国，生活质量远比效率重要。从咖啡馆的生活就能看出来。法国咖啡馆总是坐满人。(40) 这些人什么时候上班呢？法国人认真对待 35 小时工作周——认真到一些工会最近与一批公司达成协议，限制独立承包商随叫随到的工作时长。"},"481":{"q":"第 37 空最合适的句子是？","o":["并非所有顾客都是游客。","法国的生活质量同样出色。","那里有很不错的厨房和舒适的床。","那些美味的食物主要由当地农民消费。","这并不是法国人比我们吃得少的唯一原因。","我们的目标是看看能否以某种方式像真正的巴黎人那样生活。","食物太美味了，你不需要吃很多就能感到满足。"],"p":"我和丈夫刚在巴黎待了一周。(36) 所以我们做的第一件事，就是租下一套贵得离谱的六楼公寓，只有橱柜那么大。它小得我们只好把行李箱留在走廊里。\n\n不过，这地方并不完全“正宗”。和普通的巴黎公寓不同，这里的管道是能用的。(37) 我们楼里甚至有一部小电梯，用纯正的法语女声说“Ouverture des portes”（开门）。这是我唯一掌握的法语短语，可惜我没什么机会用它。\n\n巴黎人和你我不同。他们看上去从不懒散邋遢。正如几周前本报有人写到的那样，他们吃得好却从不发胖。(38) 法国的草莓吃起来不像硬纸板，而是在你嘴里像小风味炸弹一样爆开。\n\n(39) 在巴黎的第一个早晨，我走到街角的市场买些食品杂货。我买了一小把熟得正好的小草莓和一只甜甜的小瓜。丈夫和我一致认为，这是我们吃过的最好的水果。可它们花了 18 美元！\n\n在法国，生活质量远比效率重要。从咖啡馆的生活就能看出来。法国咖啡馆总是坐满人。(40) 这些人什么时候上班呢？法国人认真对待 35 小时工作周——认真到一些工会最近与一批公司达成协议，限制独立承包商随叫随到的工作时长。"},"482":{"q":"第 38 空最合适的句子是？","o":["并非所有顾客都是游客。","法国的生活质量同样出色。","那里有很不错的厨房和舒适的床。","那些美味的食物主要由当地农民消费。","这并不是法国人比我们吃得少的唯一原因。","我们的目标是看看能否以某种方式像真正的巴黎人那样生活。","食物太美味了，你不需要吃很多就能感到满足。"],"p":"我和丈夫刚在巴黎待了一周。(36) 所以我们做的第一件事，就是租下一套贵得离谱的六楼公寓，只有橱柜那么大。它小得我们只好把行李箱留在走廊里。\n\n不过，这地方并不完全“正宗”。和普通的巴黎公寓不同，这里的管道是能用的。(37) 我们楼里甚至有一部小电梯，用纯正的法语女声说“Ouverture des portes”（开门）。这是我唯一掌握的法语短语，可惜我没什么机会用它。\n\n巴黎人和你我不同。他们看上去从不懒散邋遢。正如几周前本报有人写到的那样，他们吃得好却从不发胖。(38) 法国的草莓吃起来不像硬纸板，而是在你嘴里像小风味炸弹一样爆开。\n\n(39) 在巴黎的第一个早晨，我走到街角的市场买些食品杂货。我买了一小把熟得正好的小草莓和一只甜甜的小瓜。丈夫和我一致认为，这是我们吃过的最好的水果。可它们花了 18 美元！\n\n在法国，生活质量远比效率重要。从咖啡馆的生活就能看出来。法国咖啡馆总是坐满人。(40) 这些人什么时候上班呢？法国人认真对待 35 小时工作周——认真到一些工会最近与一批公司达成协议，限制独立承包商随叫随到的工作时长。"},"483":{"q":"第 39 空最合适的句子是？","o":["并非所有顾客都是游 的高科技世界。它过时、没有生命，是件老古董——就像你外公。好吧，我或许老了，但在数字方面还没到无可救药的地步。我会剪视频、做音频，用手机支付，甚至建过网站。\n\n不过，我的新媒体经验有一处明显的空白：我很少站在镜头前，因为我这张脸只适合做广播。但这并没有阻止《中国日报》上周请我为一个关于京津冀一体化的视频项目讲一段自己的故事。\n\n总之，外公现在成了网络红人——两分钟的名气！我保证不会因此飘飘然。不过我一定让两岁的孙子在他的平板上看到它。"},"490":{"q":"作者怎样看待自己？","o":["在社交上有野心。","外表有吸引力。","经济上独立。","数字技术上很在行。"],"p":"我们记者正身处一个讲故事的崭新时代，手头有许多新的多媒体工具。许多年轻人甚至不觉得这有多新——对他们来说，这再平常不过。\n\n春节期间，我和两岁的孙子坐在沙发上，这一点让我深有感触。我带了本童书给他读，书里词句简单、图画鲜艳，正合他的年纪。\n\n设想一下：孙子坐在我腿上，我把书举在他面前，好让他看到图画。我念着，他伸出手，用指头戳书页。\n\n这是怎么回事？我心想，他不过是喜欢那些图画。于是我翻过一页继续念。他戳得更用力了。我差点把书掉在地上。我很困惑：这孩子是不是有什么问题？\n\n后来我明白了。他其实对书很陌生。他父亲常拿一台平板电脑哄他玩，里面装满了一戳就会“活”起来的彩色图片。他以为我的故事书也是这样。\n\n抱歉了，孩子。这本书不属于你的高科技世界。它过时、没有生命，是件老古董——就像你外公。好吧，我或许老了，但在数字方面还没到无可救药的地步。我会剪视频、做音频，用手机支付，甚至建过网站。\n\n不过，我的新媒体经验有一处明显的空白：我很少站在镜头前，因为我这张脸只适合做广播。但这并没有阻止《中国日报》上周请我为一个关于京津冀一体化的视频项目讲一段自己的故事。\n\n总之，外公现在成了网络红人——两分钟的名气！我保证不会因此飘飘然。不过我一定让两岁的孙子在他的平板上看到它。"},"491":{"q":"作为记者，我们可以了解到作者的什么情况？","o":["他缺乏工作经验。","他很少出现在电视上。","他管理一个视频部门。","他经常采访网络红人。"],"p":"我们记者正身处一个讲故事的崭新时代，手头有许多新的多媒体工具。许多年轻人甚至不觉得这有多新——对他们来说，这再平常不过。\n\n春节期间，我和两岁的孙子坐在沙发上，这一点让我深有感触。我带了本童书给他读，书里词句简单、图画鲜艳，正合他的年纪。\n\n设想一下：孙子坐在我腿上，我把书举在他面前，好让他看到图画。我念着，他伸出手，用指头戳书页。\n\n这是怎么回事？我心想，他不过是喜欢那些图画。于是我翻过一页继续念。他戳得更用力了。我差点把书掉在地上。我很困惑：这孩子是不是有什么问题？\n\n后来我明白了。他其实对书很陌生。他父亲常拿一台平板电脑哄他玩，里面装满了一戳就会“活”起来的彩色图片。他以为我的故事书也是这样。\n\n抱歉了，孩子。这本书不属于你的高科技世界。它过时、没有生命，是件老古董——就像你外公。好吧，我或许老了，但在数字方面还没到无可救药的地步。我会剪视频、做音频，用手机支付，甚至建过网站。\n\n不过，我的新媒体经验有一处明显的空白：我很少站在镜头前，因为我这张脸只适合做广播。但这并没有阻止《中国日报》上周请我为一个关于京津冀一体化的视频项目讲一段自己的故事。\n\n总之，外公现在成了网络红人——两分钟的名气！我保证不会因此飘飘然。不过我一定让两岁的孙子在他的平板上看到它。"},"492":{"q":"下列哪一项最能描述美国禁止司机发短信的规定？","o":["无效。","不必要。","前后不一致。","不公平。"],"p":"过去七年里，大多数州都禁止司机开车时发短信，公共服务宣传活动也用尽各种办法，劝人们开车时放下手机。\n\n然而，无论用哪种标准衡量，问题似乎都在变得更糟。美国人依旧边开车边发短信，还刷社交网络、拍照。多年来持续下降的道路事故，如今正急剧上升。\n\n部分原因是人们开车更多了，但美国国家公路交通安全管理局局长马克·罗斯金德说，分心驾驶“不幸的是，只增不减”。\n\n“大改变需要大思路，”他在上个月的一次演讲中说，泛指改善道路安全的必要性。于是，为了改变这种典型的现代行为，立法者和公共卫生专家重新拾起一个老办法：他们想把分心驾驶当作醉驾来对待。\n\n纽约州立法者的一个设想是给警察配备一种叫 Textalyzer 的新设备。它的工作原理是这样：赶到事故现场的警官可以要求司机交出手机，用 Textalyzer 检查操作系统中的近期活动。这项技术可以判定司机是否刚刚发过短信、邮件，或做过纽约州免提驾驶法所不允许的其他事情。\n\n 心脏病发作的原因。","保持健康的困难。","心脏的衰老过程。"],"p":"随着我们变老，即使身体健康，心脏处理氧气的效率也不如从前。多数人在五十多岁或六十出头时出现最初的迹象；而不运动的人，这些变化会来得更早。\n\n“想想一根橡皮筋。起初它很有弹性，可把它在抽屉里放上二十年，它就会变干、容易断裂，”得克萨斯大学心脏病专家本·莱文博士说。心脏的情形正是如此。对中年人来说幸运的是，莱文发现，即使你从前并不爱运动，现在开始锻炼也可能改善日渐衰老的心脏。\n\n莱文和研究团队挑选了 45 至 64 岁、平时不怎么运动但其他方面健康的志愿者。参与者被随机分成两组。第一组参加无氧运动项目——平衡训练和力量训练，每周三次。第二组在教练指导下进行高强度有氧运动，每周四天或更多。两年后，第二组的心脏健康状况显著改善。\n\n“我们把这些五十岁的心脏，调回了三十或三十五岁的心脏，”莱文说，“它们变得更强健，是因为运动时心脏能更好地充盈，泵送更多的血液。”而参加强度较低运动的人，心脏没有变化，他说。\n\n“如果还没开始运动，人生中最好的时机是中年后期，那时心脏仍有弹性，”莱文说，“我们让健康的七十岁老人参加为期一年的运动训练，结果他们毫无变化。”\n\n美国心脏协会发言人妮卡·戈德堡博士说，莱文的发现是个很好的开端。但这项研究规模较小，还需要在人数多得多的群体中重复。"},"497":{"q":"就研究设计而言，两组在哪一方面不同？","o":["饮食方案。","专业背景。","运动类型。","先前的身体状况。"],"p":"随着我们变老，即使身体健康，心脏处理氧气的效率也不如从前。多数人在五十多岁或六十出头时出现最初的迹象；而不运动的人，这些变化会来得更早。\n\n“想想一根橡皮筋。起初它很有弹性，可把它在抽屉里放上二十年，它就会变干、容易断裂，”得克萨斯大学心脏病专家本·莱文博士说。心脏的情形正是如此。对中年人来说幸运的是，莱文发现，即使你从前并不爱运动，现在开始锻炼也可能改善日渐衰老的心脏。\n\n莱文和研究团队挑选了 45 至 64 岁、平时不怎么运动但其他方面健康的志愿者。参与者被随机分成两组。第一组参加无氧运动项目——平衡训练和力量训练，每周三次。第二组在教练指导下进行高强度有氧运动，每周四天或更多。两年后，第二组的心脏健康状况显著改善。\n\n“我们把这些五十岁的心脏，调回了三十或三十五岁的心脏，”莱文说，“它们变得更强健，是因为运动时心脏能更好地充盈，泵送更多的血液。”而参加强度较低运动的人，心脏没有变化，他说。\n\n“如果还没开始运动，人生中最好的时机是中年后期，那时心脏仍有弹性，”莱文说，“我们让健康的七十岁老人参加为期一年的运动训练，结果他们毫无变化。”\n\n美国心脏协会发言人妮卡·戈德堡博士说，莱文的发现是个很好的开端。但这项研究规模较小，还需要在人数多得多的群体中重复。"},"498":{"q":"莱文的研究发现了什么？","o":["中年人的心脏会因有氧运动而变年轻。","高强度运动更适合年轻人。","人们开始锻炼永远不晚。","运动越多，心脏越强健。"],"p":"随着我们变老，即使身体健康，心脏处理氧气的效率也不如从前。多数人在五十多岁或六十出头时出现最初的迹象；而不运动的人，这些变化会来得更早。\n\n“想想一根橡皮筋。起初它很有弹性，可把它在抽屉里放上二十年，它就会变干、容易断裂，”得克萨斯大学心脏病专家本·莱文博士说。心脏的情形正是如此。对中年人来说幸运的是，莱文发现，即使你从前并不爱运动，现在开始锻炼也可能改善日渐衰老的心脏。\n\n莱文和研究团队挑选了 45 至 64 岁、平时不怎么运动但其他方面健康的志愿者。参与者被随机分成两组。第一组参加无氧运动项目——平衡训练和力量训练，每周三次。第二组在教练指导下进行高强度有氧运动，每周四天或更多。两年后，第二组的心脏健康状况显著改善。\n\n“我们把这些五十岁的心脏，调回了三十或三十五岁的心脏，”莱文说，“它们变得更强健，是因为运动时心脏能更好地充盈，泵送更多的血液。”而参加强度较低运动的人，心脏没有变化，他说。\n\n“如果还没开始运动，人生中最好的时机是中年后期，那时心脏仍有弹性，”莱文说，“我们让健康的七十岁老人参加为期一年的运动训练，结果他们毫无变化。”\n\n美国心脏协会发言人妮卡·戈德堡博士说，莱文的发现是个很好的开端。但这项研究规模较小，还需要在人数多得多的群体中重复。"},"499":{"q":"妮卡·戈德堡博士建议什么？","o":["利用这些研究发现。","采访研究参与者。","开展进一步研究。","明确研究目的。"],"p":"随着我们变老，即使身体健康，心脏处理氧气的效率也不如从前。多数人在五十多岁或六十出头时出现最初的迹象；而 组活动／家庭作业（占 10%）\n\n课堂活动每天不尽相同，但学生必须随时准备完成直接取自指定阅读材料、或取自上节课讲授与讨论笔记的简短课堂写作或测验，因此课上认真记笔记非常重要。此外，我还会不时布置当堂完成的小组活动，或在家完成的短作业，两者都会计分。\n\n迟交作业\n\n未在截止日期当堂提交的论文，每迟交一个课时降一个等级。若在截止日期后第四天仍未交，该论文记零分。未在课上完成的日常作业记零分。因请假获准而缺做的简短写作可以补交。"},"507":{"q":"如果一篇论文在截止日期一周后才提交，会有什么结果？","o":["你会得零分。","你会被降一个等级。","你会被安排参加一次测验。","你必须重写这篇论文。"],"p":"《文学导论》课程评分政策\n\n评分等级\n\n90—100 为 A；80—89 为 B；70—79 为 C；60—69 为 D；60 分以下为 E。\n\n论文（占 60%）\n\n你的四篇主要论文合计构成本课程成绩的主体部分：论文一占 10%；论文二占 15%；论文三占 15%；论文四占 20%。\n\n小组作业（占 30%）\n\n学生将分组完成课程中的四项作业。所有作业都须在指定日期前通过 Blackboard（我们的在线学习与课程管理系统）提交。\n\n日常作业／课堂写作与测验／小组活动／家庭作业（占 10%）\n\n课堂活动每天不尽相同，但学生必须随时准备完成直接取自指定阅读材料、或取自上节课讲授与讨论笔记的简短课堂写作或测验，因此课上认真记笔记非常重要。此外，我还会不时布置当堂完成的小组活动，或在家完成的短作业，两者都会计分。\n\n迟交作业\n\n未在截止日期当堂提交的论文，每迟交一个课时降一个等级。若在截止日期后第四天仍未交，该论文记零分。未在课上完成的日常作业记零分。因请假获准而缺做的简短写作可以补交。"},"508":{"q":"作者讲芝麻菜的故事是想说明什么？","o":["我们对食物浪费关注很少。","我们有时会无意中浪费食物。","我们浪费的蔬菜比肉多。","我们浪费食物是有充分理由的。"],"p":"像大多数人一样，我也尽量留心别让食物被浪费。那袋芝麻菜本来是要做一份清爽的蔬菜沙拉，给一顿烤鸡晚餐添点绿意的。可后来我加班到很晚，接着朋友又打电话来约饭，我只好把鸡塞进冷冻室。日子一天天过去，芝麻菜却坏了。更糟的是，我当初没多想就买了一大堆；单是我扔掉的那些，就够做六份沙拉了。\n\n在这个每年有近八亿人挨饿的世界上，「浪费食物违背道德准则」，伊丽莎白·罗伊特在本月的封面报道中这样写道。被丢掉的好端端的食物多得令人咋舌——从被杂货商拒收的「丑」蔬菜（其实完全能吃），到成批没动过的菜肴被倒进餐馆的垃圾桶。\n\n生产没人吃的食物，等于白白浪费了种养它所耗的水、燃料和其他资源。这就使食物浪费成了一个环境问题。事实上，罗伊特写道，「如果食物浪费是一个国家，它将是世界第三大温室气体排放国」。\n\n如果这还不好理解，那就想想我冰箱最里头那袋芝麻菜吧。迈克·柯廷天天都能见到我这样的芝麻菜故事——只不过在他那里，更像是十二箱捐赠来的草莓眼看就要过期。柯廷是华盛顿特区「DC 中央厨房」的首席执行官，这家机构回收食物，再把它做成健康的餐食。去年，他们通过接受捐赠、收集本会烂在田里的有瑕疵农产品，共回收了八十多万磅食物。那些草莓呢？志愿者会清洗、切块，再冷冻或烘干，留待日后做餐食用。\n\n这些做法看似显而易见，可我们却常常根本不去想。「每个人都能为减少浪费出一份力，无论是每周采购时别买超出需要的食物，还是请餐馆不要给你不会吃的配菜。」柯廷说。"},"509":{"q":"根据文章，食物浪费会造成什么后果？","o":["道德滑坡。","环境危害。","能源短缺。","全球饥荒。"],"p":"像大多数人一样，我也尽量留心别让食物被浪费。那袋芝麻菜本来是要做一份清爽的蔬菜沙拉，给一顿烤鸡晚餐添点绿意的。可后来我加班到很晚，接着朋友又打电话来约饭，我只好把鸡塞进冷冻室。日子一天天过去，芝麻菜却坏了。更糟的是，我当初没多想就买了一大堆；单是我扔掉的那些，就够做六份沙拉了。\n\n在这个每年有近八亿人挨饿的世界上，「浪费食物违背道德准则」，伊丽莎白·罗伊特在本月的封面报道中这样写道。被丢掉的好端端的食物多得令人咋舌——从被杂货商拒收的「丑」蔬菜（其实完全能吃），到成批没动过的菜肴被倒进餐馆的垃圾桶。\n\n生产没人吃的食物，等于白白浪费了种养它所耗的水、燃料和其他资源。这就使食物浪费成了一个环境问题。事实上，罗伊特写道，「如果食物浪费是一个国家，它将是世界第三大温室气体排放国」。\n\n如果这还不好理解，那就想想我冰箱最里头那袋芝麻菜吧。迈克·柯廷天天都能见到我这样的芝麻菜故事——只不过在他那里，更像是十二箱捐赠来的草莓眼看就要过期。柯廷是华盛顿特区「DC 中央厨房」的首席执行官，这家机构回收食物，再把它做成健康的餐食。去年，他们通过接受捐赠、收集本会烂在田里的有瑕疵农产品，共回收了八十多万磅食物。那些草莓呢？志愿者会清洗、切块，再冷冻或烘干，留待日后做餐食用。\n\n这些做法看似显而易见，可我们却常常根本不去想。「每个人都能为减少浪费出一份力，无论是每周采购时别买超出需要的食物，还是请餐馆不要给你不会吃的配菜。」柯廷说。"},"510":{"q":"柯廷所在的机构做什么？","o":["它生产厨房设备。","它把烂芝麻菜变成清洁燃料。","它帮助当地农民种植水果。","它把没人要的食物做成餐食。"],"p":"像大多数人一样，我也尽量留心别让食物被浪费。那袋芝麻菜本来是要做一份清爽的蔬菜沙拉，给一顿烤鸡晚餐添点绿意的。可后来我加班到很晚，接着朋友又打电话来约饭，我只好把鸡塞进冷冻室。日子一天天过去，芝麻菜却坏了。更糟的是，我当初没多想就买了一大堆；单是我扔掉的那些，就够做六份沙拉了。\n\n在这个每年有近八亿人挨饿的世界上，「浪费食物违背道德准则」，伊丽莎白·罗伊特在本月的封面报道中这样写道。被丢掉的好端端的食物多得令人咋舌——从被杂货商拒收的「丑」蔬菜（其实完全能吃），到成批没动过的菜肴被倒进餐馆的垃圾桶。\n\n生产没人吃的食物，等于白白浪费了种养它所耗的水、燃料和其他资源。这就使食物浪费成了一个环境问题。事实上，罗伊特写道，「如果食物浪费是一个国家，它将是世界第三大温室气体排放国」。\n\n如果这还不好理解，那就想想我冰箱最里头那袋芝麻菜吧。迈克·柯廷天天都能见到我这样的芝麻菜故事——只不过在他那里，更像是十二箱捐赠来的草莓眼看就要过期。柯廷是华盛顿特区「DC 中央厨房」的首席执行官，这家机构回收食物，再把它做成健康的餐食。去年，他们通过接受捐赠、收集本会烂在田里的有瑕疵农产品，共回收了八十多万磅食物。那些草莓呢？志愿者会清洗、切块，再冷冻或烘干，留待日后做餐食用。\n\n这些做法看似显而易见，可我们却常常根本不去想。「每个人都能为减少浪费出一份力，无论是每周采购时别买超出需要的食物，还是请餐馆不要给你不会吃的配菜。」柯廷说。"},"511":{"q":"柯廷建议人们怎么做？","o":["只买需要的量。","减少食物摄入。","每周只购物一次。","少去餐馆吃饭。"],"p":"像大多数人一样，我也尽量留心别让食物被浪费。那袋芝麻菜本来是要做一份清爽的蔬菜沙拉，给一顿烤鸡晚餐添点绿意的。可后来我加班到很晚，接着朋友又打电话来约饭，我只好把鸡塞进冷冻室。日子一天天过去，芝麻菜却坏了。更糟的是，我当初没多想就买了一大堆；单是我扔掉的那些，就够做六份沙拉了。\n\n在这个每年有近八亿人挨饿的世界上，「浪费食物违背道德准则」，伊丽莎白·罗伊特在本月的封面报道中这样写道。被丢掉的好端端的食物多得令人咋舌——从被杂货商拒收的「丑」蔬菜（其实完全能吃），到成批没动过的菜肴被倒进餐馆的垃圾桶。\n\n生产没人吃的食物，等于白白浪费了种养它所耗的水、燃料和其他资源。这就使食物浪费成了一个环境问题。事实上，罗伊特写道，「如果食物浪费是一个国家，它将是世界第三大温室气体排放国」。\n\n如果这还不好理解，那就想想我冰箱最里头那袋芝麻菜吧。迈克·柯廷天天都能见到我这样的芝麻菜故事——只不过在他那里，更像是十二箱捐赠来的草莓眼看就要过期。柯廷是华盛顿特区「DC 中央厨房」的首席执行官，这家机构回收食物，再把它做成健康的餐食。去年，他们通过接受捐赠、收集本会烂在田里的有瑕疵农产品，共回收了八十多万磅食物。那些草莓呢？志愿者会清洗、切块，再冷冻或烘干，留待日后做餐食用。\n\n这些做法看似显而易见，可我们却常常根本不去想。「每个人都能为减少浪费出一份力，无论是每周采购时别买超出需要的食物，还是请餐馆不要给你不会吃的配菜。」柯廷说。"},"512":{"q":"这个项目的目的是什么？","o":["确保养老院内部和睦。","为老年人提供兼职岗位。","为医学研究筹款。","增进老年人的福祉。"],"p":"伦敦养老院里的老年居民如今被安排照看母鸡，以免他们感到孤独。\n\n这一项目由当地一家慈善组织构想推出，目的是减少孤独感、改善老年人的福祉。它也被用来帮助痴呆症（一种严重的精神疾病）患者。养老院的工作人员反映，在有母鸡的院子里，药物的使用量有所下降。\n\n参与项目的老人中有一位八十岁的露丝·泽维尔。她说：「我年轻时也养过鸡，那时每天早上上学前都得先给它们准备早饭。」\n\n「我很喜欢这个项目。早上我坐着轮椅到下面去把鸡放出来，晚上再下去看看它们是不是都进窝睡了。」\n\n「有个不一样的关注点是好事。人们会带孩子来看鸡，住户们也会出来坐在外面看。我很享受这些有创意的活动，做点有用的事感觉真好。」\n\n目前英格兰东北部二十家养老院已有七百位老人在照看母鸡，这家慈善组织也获得了资金支持，可以把项目推广到全国。\n\n彭福街六十号的额外照护经理温迪·威尔逊是最早开展这一项目的人之一。她说：「住户们非常欢迎这个项目和这些创意活动。我们期待项目能给这里的人带来益处和乐趣。」\n\n诺丁山之路的负责人林恩·刘易斯说：「我们很高兴参与这个项目。它能通过共同的兴趣和创意活动真正把我们的住户联系起来。」"},"513":{"q":"这个项目对露丝·泽维尔产生了什么影响？","o":["她学会了新的生活技能。","她获得了成就感。","她恢复了记忆。","她养成了坚强的性格。"],"p":"伦敦养老院里的老年居民如今被安排照看母鸡，以免他们感到孤独。\n\n这一项目由当地一家慈善组织构想推出，目的是减少孤独感、改善老年人的福祉。它也被用来帮助痴呆症（一种严重的精神疾病）患者。养老院的工作人员反映，在有母鸡的院子里，药物的使用量有所下降。\n\n参与项目的老人中有一位八十岁的露丝·泽维尔。她说：「我年轻时也养过鸡，那时每天早上上学前都得先给它们准备早饭。」\n\n「我很喜欢这个项目。早上我坐着轮椅到下面去把鸡放出来，晚上再下去看看它们是不是都进窝睡了。」\n\n「有个不一样的关注点是好事。人们会带孩子来看鸡，住户们也会出来坐在外面看。我很享受这些有创意的活动，做点有用的事感觉真好。」\n\n目前英格兰东北部二十家养老院已有七百位老人在照看母鸡，这家慈善组织也获得了资金支持，可以把项目推广到全国。\n\n彭福街六十号的额外照护经理温迪·威尔逊是最早开展这一项目的人之一。她说：「住户们非常欢迎这个项目和这些创意活动。我们期待项目能给这里的人带来益处和乐趣。」\n\n诺丁山之路的负责人林恩·刘易斯说：「我们很高兴参与这个项目。它能通过共同的兴趣和创意活动真正把我们的住户联系起来。」"},"514":{"q":"第七段中画线短语 embark on 是什么意思？","o":["改善。","反对。","开始。","评估。"],"p":"伦敦养老院里的老年居民如今被安排照看母鸡，以免他们感到孤独。\n\n这一项目由当地一家慈善组织构想推出，目的是减少孤独感、改善老年人的福祉。它也被用来帮助痴呆症（一种严重的精神疾病）患者。养老院的工作人员反映，在有母鸡的院子里，药物的使用量有所下降。\n\n参与项目的老人中有一位八十岁的露丝·泽维尔。她说：「我年轻时也养过鸡，那时每天早上上学前都得先给它们准备早饭。」\n\n「我很喜欢这个项目。早上我坐着轮椅到下面去把鸡放出来，晚上再下去看看它们是不是都进窝睡了。」\n\n「有个不一样的关注点是好事。人们会带孩子来看鸡，住户们也会出来坐在外面看。我很享受这些有创意的活动，做点有用的事感觉真好。」\n\n目前英格兰东北部二十家养老院已有七百位老人在照看母鸡，这家慈善组织也获得了资金支持，可以把项目推广到全国。\n\n彭福街六十号的额外照护经理温迪·威尔逊是最早开展这一项目的人之一。她说：「住户们非常欢迎这个项目和这些创意活动。我们期待项目能给这里的人带来益处和乐趣。」\n\n诺丁山之路的负责人林恩·刘易斯说：「我们很高兴参与这个项目。它能通过共同的兴趣和创意活动真正把我们的住户联系起来。」"},"515":{"q":"从最后两段可以了解到这个项目的什么情况？","o":["它广受好评。","它还需要更有创意。","它利润丰厚。","它需要很久才能见效。"],"p":"伦敦养老院里的老年居民如今被安排照看母鸡，以免他们感到孤独。\n\n这一项目由当地一家慈善组织构想推出，目的是减少孤独感、改善老年人的福祉。它也被用来帮助痴呆症（一种严重的精神疾病）患者。养老院的工作人员反映，在有母鸡的院子里，药物的使用量有所下降。\n\n参与项目的老人中有一位八十岁的露丝·泽维尔。她说：「我年轻时也养过鸡，那时每天早上上学前都得先给它们准备早饭。」\n\n「我很喜欢这个项目。早上我坐着轮椅到下面去把鸡放出来，晚上再下去看看它们是不是都进窝睡了。」\n\n「有个不一样的关注点是好事。人们会带孩子来看鸡，住户们也会出来坐在外面看。我很享受这些有创意的活动，做点有用的事感觉真好。」\n\n目前英格兰东北部二十家养老院已有七百位老人在照看母鸡，这家慈善组织也获得了资金支持，可以把项目推广到全国。\n\n彭福街六十号的额外照护经理温迪·威尔逊是最早开展这一项目的人之一。她说：「住户们非常欢迎这个项目和这些创意活动。我们期待项目能给这里的人带来益处和乐趣。」\n\n诺丁山之路的负责人林恩·刘易斯说：「我们很高兴参与这个项目。它能通过共同的兴趣和创意活动真正把我们的住户联系起来。」"},"516":{"q":"达米安·布拉西的研究关注人类语音的哪个方面？","o":["它的多样性。","它的分布。","它的数量。","它的演变发展。"],"p":"人类语音包含两千多种不同的音，从常见的 m 和 a，到南部非洲某些语言里罕见的搭嘴音。可为什么有些音比另一些更常见？一项历时五年、具有突破性的研究表明，与饮食有关的人类咬合方式的变化催生了新的语音，如今世界上一半的语言中都能找到这些音。\n\n三十多年前，学者查尔斯·霍基特就注意到，被称作唇齿音的音（如 f 和 v）在吃较软食物的社会的语言中更为常见。如今，瑞士苏黎世大学达米安·布拉西带领的研究团队弄清了这一趋势如何产生、又为何产生。\n\n他们发现，古人类成年个体的上下门齿是对齐的，这使得发出唇齿音很困难——唇齿音要靠下唇触碰上牙才能发出。后来，我们的下颌演变成覆咬合结构，发出这类音就变得容易了。\n\n该团队证明，这种咬合变化与新石器时代农业的发展有关。那时食物变得更容易咀嚼，颌骨不必使那么多劲，也就没有长得那么大。\n\n对一个语言数据库的分析也证实，新石器时代之后世界语言的语音发生了全球性变化，过去几千年里 f 和 v 的使用显著增加。而今天许多狩猎采集者的语言中仍然没有这些音。\n\n这项研究推翻了流行看法，即人类约三十万年前进化形成时，所有语音就已经存在。「自人类出现以来，我们所使用的语音集合未必一直保持不变；相反，我们今天看到的语音的丰富多样，是生物变化与文化演化等因素复杂互动的产物。」研究团队成员史蒂文·莫兰说。"},"517":{"q":"古人类成年人为什么难以发出唇齿音？","o":["他们的上牙比下牙少。","他们难以自如地开合嘴唇。","他们的颌部结构不便于发出该音。","他们的下门齿不够大。"],"p":"人类语音包含两千多种不同的音，从常见的 m 和 a，到南部非洲某些语言里罕见的搭嘴音。可为什么有些音比另一些更常见？一项历时五年、具有突破性的研究表明，与饮食有关的人类咬合方式的变化催生了新的语音，如今世界上一半的语言中都能找到这些音。\n\n三十多年前，学者查尔斯·霍基特就注意到，被称作唇齿音的音（如 f 和 v）在吃较软食物的社会的语言中更为常见。如今，瑞士苏黎世大学达米安·布拉西带领的研究团队弄清了这一趋势如何产生、又为何产生。\n\n他们发现，古人类成年个体的上下门齿是对齐的，这使得发出唇齿音很困难——唇齿音要靠下唇触碰上牙才能发出。后来，我们的下颌演变成覆咬合结构，发出这类音就变得容易了。\n\n该团队证明，这种咬合变化与新石器时代农业的发展有关。那时食物变得更容易咀嚼，颌骨不必使那么多劲，也就没有长得那么大。\n\n对一个语言数据库的分析也证实，新石器时代之后世界语言的语音发生了全球性变化，过去几千年里 f 和 v 的使用显著增加。而今天许多狩猎采集者的语言中仍然没有这些音。\n\n这项研究推翻了流行看法，即人类约三十万年前进化形成时，所有语音就已经存在。「自人类出现以来，我们所使用的语音集合未必一直保持不变；相反，我们今天看到的语音的丰富多样，是生物变化与文化演化等因素复杂互动的产物。」研究团队成员史蒂文·莫兰说。"},"518":{"q":"第五段主要讲了什么？","o":["支持研究结论的证据。","研究发现可能的应用。","对研究方法的进一步解释。","对研究过程提出的合理质疑。"],"p":"人类语音包含两千多种不同的音，从常见的 m 和 a，到南部非洲某些语言里罕见的搭嘴音。可为什么有些音比另一些更常见？一项历时五年、具有突破性的研究表明，与饮食有关的人类咬合方式的变化催生了新的语音，如今世界上一半的语言中都能找到这些音。\n\n三十多年前，学者查尔斯·霍基特就注意到，被称作唇齿音的音（如 f 和 v）在吃较软食物的社会的语言中更为常见。如今，瑞士苏黎世大学达米安·布拉西带领的研究团队弄清了这一趋势如何产生、又为何产生。\n\n他们发现，古人类成年个体的上下门齿是对齐的，这使得发出唇齿音很困难——唇齿音要靠下唇触碰上牙才能发出。后来，我们的下颌演变成覆咬合结构，发出这类音就变得容易了。\n\n该团队证明，这种咬合变化与新石器时代农业的发展有关。那时食物变得更容易咀嚼，颌骨不必使那么多劲，也就没有长得那么大。\n\n对一个语言数据库的分析也证实，新石器时代之后世界语言的语音发生了全球性变化，过去几千年里 f 和 v 的使用显著增加。而今天许多狩猎采集者的语言中仍然没有这些音。\n\n这项研究推翻了流行看法，即人类约三十万年前进化形成时，所有语音就已经存在。「自人类出现以来，我们所使用的语音集合未必一直保持不变；相反，我们今天看到的语音的丰富多样，是生物变化与文化演化等因素复杂互动的产物。」研究团队成员史蒂文·莫兰说。"},"519":{"q":"史蒂文·莫兰对人类使用的语音集合有何说法？","o":["它是有效沟通的关键。","它极大促进了文化多样性。","它是一个复杂而动态的系统。","它推动了人类的进化。"],"p":"人类语音包含两千多种不同的音，从常见的 m 和 a，到南部非洲某些语言里罕见的搭嘴音。可为什么有些音比另一些更常见？一项历时五年、具有突破性的研究表明，与饮食有关的人类咬合方式的变化催生了新的语音，如今世界上一半的语言中都能找到这些音。\n\n三十多年前，学者查尔斯·霍基特就注意到，被称作唇齿音的音（如 f 和 v）在吃较软食物的社会的语言中更为常见。如今，瑞士苏黎世大学达米安·布拉西带领的研究团队弄清了这一趋势如何产生、又为何产生。\n\n他们发现，古人类成年个体的上下门齿是对齐的，这使得发出唇齿音很困难——唇齿音要靠下唇触碰上牙才能发出。后来，我们的下颌演变成覆咬合结构，发出这类音就变得容易了。\n\n该团队证明，这种咬合变化与新石器时代农业的发展有关。那时食物变得更容易咀嚼，颌骨不必使那么多劲，也就没有长得那么大。\n\n对一个语言数据库的分析也证实，新石器时代之后世界语言的语音发生了全球性变化，过去几千年里 f 和 v 的使用显著增加。而今天许多狩猎采集者的语言中仍然没有这些音。\n\n这项研究推翻了流行看法，即人类约三十万年前进化形成时，所有语音就已经存在。「自人类出现以来，我们所使用的语音集合未必一直保持不变；相反，我们今天看到的语音的丰富多样，是生物变化与文化演化等因素复杂互动的产物。」研究团队成员史蒂文·莫兰说。"},"520":{"q":"第36空最合适的句子是？","o":["你们的第一次见面可能会有点尴尬。","健身伙伴通常需要住得不远。","和别人一起训练，你会更努力。","你想在自己最喜欢的运动项目上成为更出色的运动员吗？","怎样才能写好一则「寻找训练伙伴」的启事？","接受彼此的不同，学会相互配合就好。","任何寻找训练伙伴的启事都应包含这些信息。"],"p":"《健身》杂志最近刊登了一篇题为「感谢健身伙伴的五个理由」的文章。其中一个理由是：「如果你知道有人在健身房等你，你就会真的去。」另一个理由是：「(36)」有了健身伙伴，你会因为彼此之间存在一种微妙的竞争而加大训练强度。\n\n那么，怎样找到一个健身伙伴呢？\n\n首先，要确定你想从对方那里得到什么。(37) 还是你只想身体健壮，能有力而灵活地活动？想一想你想和健身伙伴一起做哪些运动。\n\n你或许会考虑在社交媒体上发布自己的需求，但这多半不会得到有用的回应。(38) 如果你打算在健身房锻炼，那个人必须是同一家健身房的会员。\n\n我的伙伴把她的招募启事贴在了当地公园的告示牌上。启事写明了她想做哪种训练、每周练几天、每次练几小时，以及她的年龄。上面还列出了她最喜欢的运动和活动，并留下了电话号码。(39)\n\n你和你的伙伴很可能技能不同。(40) 久而久之，你们双方都会受益——你的伙伴能举起更重的重量，而你的身体会变得更健康。你们关系的核心在于：你们永远会在这里互相帮助。"},"521":{"q":"第37空最合适的句子是？","o":["你们的第一次见面可能会有点尴尬。","健身伙伴通常需要住得不远。","和别人一起训练，你会更努力。","你想在自己最喜欢的运动项目上成为更出色的运动员吗？","怎样才能写好一则「寻找训练伙伴」的启事？","接受彼此的不同，学会相互配合就好。","任何寻找训练伙伴的启事都应包含这些信息。"],"p":"《健身》杂志最近刊登了一篇题为「感谢健身伙伴的五个理由」的文章。其中一个理由是：「如果你知道有人在健身房等你，你就会真的去。」另一个理由是：「(36)」有了健身伙伴，你会因为彼此之间存在一种微妙的竞争而加大训练强度。\n\n那么，怎样找到一个健身伙伴呢？\n\n首先，要确定你想从对方那里得到什么。(37) 还是你只想身体健壮，能有力而灵活地活动？想一想你想和健身伙伴一起做哪些运动。\n\n你或许会考虑在社交媒体上发布自己的需求，但这多半不会得到有用的回应。(38) 如果你打算在健身房锻炼，那个人必须是同一家健身房的会员。\n\n我的伙伴把她的招募启事贴在了当地公园的告示牌上。启事写明了她想做哪种训练、每周练几天、每次练几小时，以及她的年龄。上面还列出了她最喜欢的运动和活动，并留下了电话号码。(39)\n\n你和你的伙伴很可能技能不同。(40) 久而久之，你们双方都会受益——你的伙伴能举起更重的重量，而你的身体会变得更健康。你们关系的核心在于：你们永远会在这里互相帮助。"},"522":{"q":"第38空最合适的句子是？","o":["你们的第一次见面可能会有点尴尬。","健身伙伴通常需要住得不远。", 令人惊叹的野生动物，这个短期工作坊都适合你和你的家人。学习去哪里寻找动物，以及如何安全地享受观兽体验。在峡谷村商店集合。\n\n少年护林员野生动物奥运会（6月5日至8月21日）\n\n孩子们可以测试自己的技能，把自己的本领与黄石公园的动物作比较。停留时间可长可短，随你的计划而定。在游客教育中心前集合。\n\n艺术家点的峡谷讲座（6月9日至9月2日）\n\n在一个经典的观景点，欣赏下瀑布、黄石河以及峡谷令人屏息的色彩，同时了解该地区的自然与人文历史。发现艺术家和摄影师为何不断被这个特别的地方吸引。这场短讲在南缘大道的艺术家点下层平台集合。\n\n摄影工作坊（6月19日和7月10日）\n\n提升你的摄影技巧——加入黄石公园的专职摄影师，参加一个动手实践项目，激发欣赏黄石之美与奇妙的新创意方式。\n\n6月19日——瀑布与广角；在艺术家点集合。\n\n7月10日——野花与白平衡；在奇特登停车区的沃什伯恩登山口集合。"},"526":{"q":"艺术家点的那场短讲讲的是什么？","o":["著名艺术家的作品。","野生动物的保护。","基础摄影技巧。","峡谷地区的历史。"],"p":"黄石国家公园全年在全园各地提供多种护林员项目。以下是今年夏天这些护林员项目的介绍。\n\n在黄石体验野生动物（5月26日至9月2日）\n\n无论你是在偏远小径上徒步、露营，还是只在路边欣赏公园里令人惊叹的野生动物，这个短期工作坊都适合你和你的家人。学习去哪里寻找动物，以及如何安全地享受观兽体验。在峡谷村商店集合。\n\n少年护林员野生动物奥运会（6月5日至8月21日）\n\n孩子们可以测试自己的技能，把自己的本领与黄石公园的动物作比较。停留时间可长可短，随你的计划而定。在游客教育中心前集合。\n\n艺术家点的峡谷讲座（6月9日至9月2日）\n\n在一个经典的观景点，欣赏下瀑布、黄石河以及峡谷令人屏息的色彩，同时了解该地区的自然与人文历史。发现艺术家和摄影师为何不断被这个特别的地方吸引。这场短讲在南缘大道的艺术家点下层平台集合。\n\n摄影工作坊（6月19日和7月10日）\n\n提升你的摄影技巧——加入黄石公园的专职摄影师，参加一个动手实践项目，激发欣赏黄石之美与奇妙的新创意方式。\n\n6月19日——瀑布与广角；在艺术家点集合。\n\n7月10日——野花与白平衡；在奇特登停车区的沃什伯恩登山口集合。"},"527":{"q":"参加 7 月 10 日摄影工作坊的人在哪里集合？","o":["艺术家点。","沃什伯恩登山口。","峡谷村商店。","游客教育中心。"],"p":"黄石国家公园全年在全园各地提供多种护林员项目。以下是今年夏天这些护林员项目的介绍。\n\n在黄石体验野生动物（5月26日至9月2日）\n\n无论你是在偏远小径上徒步、露营，还是只在路边欣赏公园里令人惊叹的野生动物，这个短期工作坊都适合你和你的家人。学习去哪里寻找动物，以及如何安全地享受观兽体验。在峡谷村商店集合。\n\n少年护林员野生动物奥运会（6月5日至8月21日）\n\n孩子们可以测试自己的技能，把自己的本领与黄石公园的动物作比较。停留时间可长可短，随你的计划而定。在游客教育中心前集合。\n\n艺术家点的峡谷讲座（6月9日至9月2日）\n\n在一个经典的观景点，欣赏下瀑布、黄石河以及峡谷令人屏息的色彩，同时了解该地区的自然与人文历史。发现艺术家和摄影师为何不断被这个特别的地方吸引。这场短讲在南缘大道的艺术家点下层平台集合。\n\n摄影工作坊（6月19日和7月10日）\n\n提升你的摄影技巧——加入黄石公园的专职摄影师，参加一个动手实践项目，激发欣赏黄石之美与奇妙的新创意方式。\n\n6月19日——瀑布与广角；在艺术家点集合。\n\n7月10日——野花与白平衡；在奇特登停车区的沃什伯恩登山口集合。"},"528":{"q":"关于 Abby Jaramillo 我们知道什么？","o":["她做过医护工作者。","她在低收入家庭长大。","她拥有一家快餐店。","她是 Urban Sprouts 的发起人之一。"],"p":"翻土、拔草、收白菜，对中学生来说听起来是件苦差事。而一开始确实如此，Abby Jaramillo 说。她与另一位老师一起创办了 Urban Sprouts，一个在四所低收入学校开展的校园园圃项目。该项目旨在帮助学生培养科学技能、环境意识和健康的生活方式。\n\nJaramillo 的学生所住的社区里，新鲜食物和绿地都不易找到，快餐店的数量超过杂货店。“孩子们真的是带着一袋袋零食和大瓶汽水来上学的，”她说。“他们来到我们这里时，觉得蔬菜很糟糕，泥土很糟糕，昆虫很糟糕。”虽然有些孩子起初害怕昆虫、被泥土倒胃口，但大多数人都渴望尝试新事物。\n\nUrban Sprouts 的课程设在两所初中和两所高中，包括土壤检测、花与种子的解剖、新鲜或干制农产品的品尝以及园圃劳动等动手实验。每年有几次，学生用自己种的蔬菜做饭，偶尔还为全校做沙拉。\n\n项目评估显示，因为上了这些课，孩子们吃的蔬菜更多了。“有学生说，他们回家和父母谈了，现在饮食方式不一样了，”Jaramillo 说。\n\n她补充说，项目的好处不止于营养。有些学生对园艺产生了浓厚兴趣，把种子带回家开辟自己的菜园。此外，在园圃里劳动似乎对 Jaramillo 的特殊教育学生有安抚作用，他们中许多人存在情绪控制问题。“他们走到户外，”她说，“并且感到自己是成功的。”"},"529":{"q":"项目启动时 Jaramillo 面临的一个问题是什么？","o":["孩子们的家长不信任她。","学生很少有时间为她上课。","有些孩子不喜欢园圃劳动。","学校园圃没有场地。"],"p":"翻土、拔草、收白菜，对中学生来说听起来是件苦差事。而一开始确实如此，Abby Jaramillo 说。她与另一位老师一起创办了 Urban Sprouts，一个在四所低收入学校开展的校园园圃项目。该项目旨在帮助学生培养科学技能、环境意识和健康的生活方式。\n\nJaramillo 的学生所住的社区里，新鲜食物和绿地都不易找到，快餐店的数量超过杂货店。“孩子们真的是带着一袋袋零食和大瓶汽水来上学的，”她说。“他们来到我们这里时，觉得蔬菜很糟糕，泥土很糟糕，昆虫很糟糕。”虽然有些孩子起初害怕昆虫、被泥土倒胃口，但大多数人都渴望尝试新事物。\n\nUrban Sprouts 的课程设在两所初中和两所高中，包括土壤检测、花与种子的解剖、新鲜或干制农产品的品尝以及园圃劳动等动手实验。每年有几次，学生用自己种的蔬菜做饭，偶尔还为全校做沙拉。\n\n项目评估显示，因为上了这些课，孩子们吃的蔬菜更多了。“有学生说，他们回家和父母谈了，现在饮食方式不一样了，”Jaramillo 说。\n\n她补充说，项目的好处不止于营养。有些学生对园艺产生了浓厚兴趣，把种子带回家开辟自己的菜园。此外，在园圃里劳动似乎对 Jaramillo 的特殊教育学生有安抚作用，他们中许多人存在情绪控制问题。“他们走到户外，”她说，“并且感到自己是成功的。”"},"530":{"q":"下列哪一项最能描述该项目的影响？","o":["影响深远。","可预测的。","短暂的。","难以识别的。"],"p":"翻土、拔草、收白菜，对中学生来说听起来是件苦差事。而一开始确实如此，Abby Jaramillo 说。她与另一位老师一起创办了 Urban Sprouts，一个在四所低收入学校开展的校园园圃项目。该项目旨在帮助学生培养科学技能、环境意识和健康的生活方式。\n\nJaramillo 的学生所住的社区里，新鲜食物和绿地都不易找到，快餐店的数量超过杂货店。“孩子们真的是带着一袋袋零食和大瓶汽水来上学的，”她说。“他们来到我们这里时，觉得蔬菜很糟糕，泥土很糟糕，昆虫很糟糕。”虽然有些孩子起初害怕昆虫、被泥土倒胃口，但大多数人都渴望尝试新事物。\n\nUrban Sprouts 的课程设在两所初中和两所高中，包括土壤检测、花与种子的解剖、新鲜或干制农产品的品尝以及园圃劳动等动手实验。每年有几次，学生用自己种的蔬菜做饭，偶尔还为全校做沙拉。\n\n项目评估显示，因为上了这些课，孩子们吃的蔬菜更多了。“有学生说，他们回家和父母谈了，现在饮食方式不一样了，”Jaramillo 说。\n\n她补充说，项目的好处不止于营养。有些学生对园艺产生了浓厚兴趣，把种子带回家开辟自己的菜园。此外，在园圃里劳动似乎对 Jaramillo 的特殊教育学生有安抚作用，他们中许多人存在情绪控制问题。“他们走到户外，”她说，“并且感到自己是成功的。”"},"531":{"q":"本文合适的标题是什么？","o":["拯救学校园圃","体验乡村生活","培育蔬菜爱好者","改变当地景观"],"p":"翻土、拔草、收白菜，对中学生来说听起来是件苦差事。而一开始确实如此，Abby Jaramillo 说。她与另一位老师一起创办了 Urban Sprouts，一个在四所低收入学校开展的校园园圃项目。该项目旨在帮助学生培养科学技能、环境意识和健康的生活方式。\n\nJaramillo 的学生所住的社区里，新鲜食物和绿地都不易找到，快餐店的数量超过杂货店。“孩子们真的是带着一袋袋零食和大瓶汽水来上学的，”她说。“他们来到我们这里时，觉得蔬菜很糟糕，泥土很糟糕，昆虫很糟糕。”虽然有些孩子起初害怕昆虫、被泥土倒胃口，但大多数人都渴望尝试新事物。\n\nUrban Sprouts 的课程设在两所初中和两所高中，包括土壤检测、花与种子的解剖、新鲜或干制农产品的品尝以及园圃劳动等动手实验。每年有几次，学生用自己种的蔬菜做饭，偶尔还为全校做沙拉。\n\n项目评估显示，因为上了这些课，孩子们吃的蔬菜更多了。“有学生说，他们回家和父母谈了，现在饮食方式不一样了，”Jaramillo 说。\n\n她补充说，项目的好处不止于营养。有些学生对园艺产生了浓厚兴趣，把种子带回家开辟自己的菜园。此外，在园圃里劳动似乎对 Jaramillo 的特殊教育学生有安抚作用，他们中许多人存在情绪控制问题。“他们走到户外，”她说，“并且感到自己是成功的。”"},"532":{"q":"本文最可能出自哪里？","o":["一本书的引言。","一篇论写作艺术的散文。","一本博物馆指南。","一篇现代绘画评论。"],"p":"《阅读的艺术：给爱书人的艺术》是对一件日常物品——书——的礼赞，这里用来自世界各地博物馆的近三百件艺术作品来呈现它。阅读者的形象贯穿历史，出现在我们如今所知的书籍形成之前很久的艺术作品中。在艺术家对书与阅读的描绘中，我们看到了超越文化与时间的共同人性。\n\n在这本“关于书的书”中，艺术作品的挑选与编排方式强调不同时代与文化之间的这些联系。我们看到孩子在家里或学校学习阅读的场景，书成为代际关系的焦点。成年人则以各种场景和姿态被单独描绘——专注地读着一卷书，陷入沉思，或沉浸在悠闲的一刻。这些场景也许画于数百年前，却记录了我们都能够共情的时刻。\n\n书籍本身在绘画中也可能被用作象征，以显示画中人的才智、财富或信仰。在印刷机广泛使用之前，书是珍视之物，本身也可以是艺术品。晚近以来，随着书变得便宜甚至可随手丢弃，艺术家把它们当作艺术创作的材料——把封面、书页甚至整卷书变成绘画和雕塑。\n\n通信技术的持续发展一度被认为会让印刷页面过时。从 21 世纪的角度看，纸质书当然古老，但它仍像任何一台电池供电的电子阅读器一样具有互动性。为发挥其功能，书必须由使用者启动：翻开封面，分开书页，审视内容，或许还写下批注或画出重点。而且，与我们日益网络化、所接触的信息被监控和追踪的生活不同，纸质书仍然提供一种完全私密、“离线”活动的可能。"},"533":{"q":"书中所选艺术作品的主题是什么？","o":["财富与才智。","家庭与学校。","书与阅读。","工作与休闲。"],"p":"《阅读的艺术：给爱书人的艺术》是对一件日常物品——书——的礼赞，这里用来自世界各地博物馆的近三百件艺术作品来呈现它。阅读者的形象贯穿历史，出现在我们如今所知的书籍形成之前很久的艺术作品中。在艺术家对书与阅读的描绘中，我们看到了超越文化与时间的共同人性。\n\n在这本“关于书的书”中，艺术作品的挑选与编排方式强调不同时代与文化之间的这些联系。我们看到孩子在家里或学校学习阅读的场景，书成为代际关系的焦点。成年人则以各种场景和姿态被单独描绘——专注地读着一卷书，陷入沉思，或沉浸在悠闲的一刻。这些场景也许画于数百年前，却记录了我们都能够共情的时刻。\n\n书籍本身在绘画中也可能被用作象征，以显示画中人的才智、财富或信仰。在印刷机广泛使用之前，书是珍视之物，本身也可以是艺术品。晚近以来，随着书变得便宜甚至可随手丢弃，艺术家把它们当作艺术创作的材料——把封面、书页甚至整卷书变成绘画和雕塑。\n\n通信技术的持续发展一度被认为会让印刷页面过时。从 21 世纪的角度看，纸质书当然古老，但它仍像任何一台电池供电的电子阅读器一样具有互动性。为发挥其功能，书必须由使用者启动：翻开封面，分开书页，审视内容，或许还写下批注或画出重点。而且，与我们日益网络化、所接触的信息被监控和追踪的生活不同，纸质书仍然提供一种完全私密、“离线”活动的可能。"},"534":{"q":"第二段画线短语 relate to 是什么意思？","o":["理解。","描绘。","抓住。","转变。"],"p":"《阅读的艺术：给爱书人的艺术》是对一件日常物品——书——的礼赞，这里用来自世界各地博物馆的近三百件艺术作品来呈现它。阅读者的形象贯穿历史，出现在我们如今所知的书籍形成之前很久的艺术作品中。在艺术家对书与阅读的描绘中，我们看到了超越文化与时间的共同人性。\n\n在这本“关于书的书”中，艺术作品的挑选与编排方式强调不同时代与文化之间的这些联系。我们看到孩子在家里或学校学习阅读的场景，书成为代际关系的焦点。成年人则以各种场景和姿态被单独描绘——专注地读着一卷书，陷入沉思，或沉浸在悠闲的一刻。这些场景也许画于数百年前，却记录了我们都能够共情的时刻。\n\n书籍本身在绘画中也可能被用作象征，以显示画中人的才智、财富或信仰。在印刷机广泛使用之前，书是珍视之物，本身也可以是艺术品。晚近以来，随着书变得便宜甚至可随手丢弃，艺术家把它们当作艺术创作的材料——把封面、书页甚至整卷书变成绘画和雕塑。\n\n通信技术的持续发展一度被认为会让印刷页面过时。从 21 世纪的角度看，纸质书当然古老，但它仍像任何一台电池供电的电子阅读器一样具有互动性。为发挥其功能，书必须由使用者启动：翻开封面，分开书页，审视内容，或许还写下批注或画出重点。而且，与我们日益网络化、所接触的信息被监控和追踪的生活不同，纸质书仍然提供一种完全私密、“离线”活动的可能。"},"535":{"q":"作者提到电子阅读器是想说明什么？","o":["纸质书并未完全过时。","技术改变了我们的阅读方式。","我们 21 世纪的生活已网络化。","人们如今很少有耐心读书。"],"p":"《阅读的艺术：给爱书人的艺术》是对一件日常物品——书——的礼赞，这里用来自世界各地博物馆的近三百件艺术作品来呈现它。阅读者的形象贯穿历史，出现在我们如今所知的书籍形成之前很久的艺术作品中。在艺术家对书与阅读的描绘中，我们看到了超越文化与时间的共同人性。\n\n在这本“关于书的书”中，艺术作品的挑选与编排方式强调不同时代与文化之间的这些联系。我们看到孩子在家里或学校学习阅读的场景，书成为代际关系的焦点。成年人则以各种场景和姿态被单独描绘——专注地读着一卷书，陷入沉思，或沉浸在悠闲的一刻。这些场景也许画于数百年前，却记录了我们都能够共情的时刻。\n\n书籍本身在绘画中也可能被用作象征，以显示画中人的才智、财富或信仰。在印刷机广泛使用之前，书是珍视之物，本身也可以是艺术品。晚近以来，随着书变得便宜甚至可随手丢弃，艺术家把它们当作艺术创作的材料——把封面、书页甚至整卷书变成绘画和雕塑。\n\n通信技术的持续发展一度被认为会让印刷页面过时。从 21 世纪的角度看，纸质书当然古老，但它仍像任何一台电池供电的电子阅读器一样具有互动性。为发挥其功能，书必须由使用者启动：翻开封面，分开书页，审视内容，或许还写下批注或画出重点。而且，与我们日益网络化、所接触的信息被监控和追踪的生活不同，纸质书仍然提供一种完全私密、“离线”活动的可能。"},"536":{"q":"作者在文章开头描述了什么现象？","o":["袖珍公园现在很受欢迎。","在城市里很难找到野性自然。","许多城市人口过剩。","人们喜欢住在自然附近。"],"p":"随着城市不断膨胀，城市居民接触自然的机会越来越难找到。如果你运气好，家附近也许有个袖珍公园，但在城市里很难找到相对荒野的地方。\n\n过去的研究已发现自然对人类健康的益处，但一项新研究显示，城市中的野性对人类福祉极为重要。\n\n研究团队聚焦于一座大型城市公园。他们调查了数百名公园游客，请他们在网上提交一份书面描述，讲述自己在公园里与自然的一次有意义的互动。随后研究者查看这些来稿，把体验编码归入不同类别。例如，一位参与者“我们在海滩上坐了一会儿，听着海浪”的经历被归入“坐在海滩上”和“听海浪”两个类别。\n\n在 320 份来稿中，研究者称之为“自然语言”的类别模式开始显现。对所有来稿编码后，有六类被游客最频繁地视为重要。它们包括遇见野生动物、沿水边行走，以及走一条既有的步道。\n\n为每种自然体验命名，就创造出一种可用的语言，帮助人们识别并参与那些对他们最令人满意、最有意义的活动。例如，对一个周末在公园徒步的年轻职场人来说，沿水边行走的体验可能令人满足。工作日回到市中心，他们可以在午休时沿喷泉散步，享受这种互动更日常的形式。\n\n“我们试图创造一种语言，帮助把人与自然的互动带回我们的日常生活。而要使之实现，我们还需要保护自然，这样我们才能与它互动，”该研究的资深作者彼得·卡恩说。"},"537":{"q":"研究者为什么把参与者的来稿编码分类？","o":["为了比较不同类型的公园游客。","为了解释公园为何吸引游客。","为了分析公园的主要特征。","为了在游客的描述中找出规律。"],"p":"随着城市不断膨胀，城市居民接触自然的机会越来越难找到。如果你运气好，家附近也许有个袖珍公园，但在城市里很难找到相对荒野的地方。\n\n过去的研究已发现自然对人类健康的益处，但一项新研究显示，城市中的野性对人类福祉极为重要。\n\n研究团队聚焦于一座大型城市公园。他们调查了数百名公园游客，请他们在网上提交一份书面描述，讲述自己在公园里与自然的一次有意义的互动。随后研究者查看这些来稿，把体验编码归入不同类别。例如，一位参与者“我们在海滩上坐了一会儿，听着海浪”的经历被归入“坐在海滩上”和“听海浪”两个类别。\n\n在 320 份来稿中，研究者称之为“自然语言”的类别模式开始显现。对所有来稿编码后，有六类被游客最频繁地视为重要。它们包括遇见野生动物、沿水边行走，以及走一条既有的步道。\n\n为每种自然体验命名，就创造出一种可用的语言，帮助人们识别并参与那些对他们最令人满意、最有意义的活动。例如，对一个周末在公园徒步的年轻职场人来说，沿水边行走的体验可能令人满足。工作日回到市中心，他们可以在午休时沿喷泉散步，享受这种互动更日常的形式。\n\n“我们试图创造一种语言，帮助把人与自然的互动带回我们的日常生活。而要使之实现，我们还需要保护自然，这样我们才能与它互动，”该研究的资深作者彼得·卡恩说。"},"538":{"q":"从第五段所举的例子可以得知什么？","o":["步行是亲近自然的最佳方式。","年轻人太忙，没时间与自然互动。","同一种自然体验可以有不同的形式。","自然语言能提升工作表现。"],"p":"随着城市不断膨胀，城市居民接触自然的机会越来越难找到。如果你运气好，家附近也许有个袖珍公园，但在城市里很难找到相对荒野的地方。\n\n过去的研究已发现自然对人类健康的益处，但一项新研究显示，城市中的野性对人类福祉极为重要。\n\n研究团队聚焦于一座大型城市公园。他们调查了数百名公园游客，请他们在网上提交一份书面描述，讲述自己在公园里与自然的一次有意义的互动。随后研究者查看这些来稿，把体验编码归入不同类别。例如，一位参与者“我们在海滩上坐了一会儿，听着海浪”的经历被归入“坐在海滩上”和“听海浪”两个类别。\n\n在 320 份来稿中，研究者称之为“自然语言”的类别模式开始显现。对所有来稿编码后，有六类被游客最频繁地视为重要。它们包括遇见野生动物、沿水边行走，以及走一条既有的步道。\n\n为每种自然体验命名，就创造出一种可用的语言，帮助人们识别并参与那些对他们最令人满意、最有意义的活动。例如，对一个周末在公园徒步的年轻职场人来说，沿水边行走的体验可能令人满足。工作日回到市中心，他们可以在午休时沿喷泉散步，享受这种互动更日常的形式。\n\n“我们试图创造一种语言，帮助把人与自然的互动带回我们的日常生活。而要使之实现，我们还需要保护自然，这样我们才能与它互动，”该研究的资深作者彼得·卡恩说。"},"539":{"q":"按照卡恩的说法，我们与自然互动之前应先做什么？","o":["学习语言。","保护环境。","公众教育。","跨文化交流。"],"p":"随着城市不断膨胀，城市居民接触自然的机会越来越难找到。如果你运气好，家附近也许有个袖珍公园，但在城市里很难找到相对荒野的地方。\n\n过去的研究已发现自然对人类健康的益处，但一项新研究显示，城市中的野性对人类福祉极为重要。\n\n研究团队聚焦于一座大型城市公园。他们调查了数百名公园游客，请他们在网上提交一份书面描述，讲述自己在公园里与自然的一次有意义的互动。随后研究者查看这些来稿，把体验编码归入不同类别。例如，一位参与者“我们在海滩上坐了一会儿，听着海浪”的经历被归入“坐在海滩上”和“听海浪”两个类别。\n\n在 320 份来稿中，研究者称之为“自然语言”的类别模式开始显现。对所有来稿编码后，有六类被游客最频繁地视为重要。它们包括遇见野生动物、沿水边行走，以及走一条既有的步道。\n\n为每种自然体验命名，就创造出一种可用的语言，帮助人们识别并参与那些对他们最令人满意、最有意义的活动。例如，对一个周末在公园徒步的年轻职场人来说，沿水边行走的体验可能令人满足。工作日回到市中心，他们可以在午休时沿喷泉散步，享受这种互动更日常的形式。\n\n“我们试图创造一种语言，帮助把人与自然的互动带回我们的日常生活。而要使之实现，我们还需要保护自然，这样我们才能与它互动，”该研究的资深作者彼得·卡恩说。"},"540":{"q":"最适合填入第 36 空的句子是？","o":["走出你的舒适区。","制订职业规划并设定目标。","不要扔掉你初学时的画作。","如果你觉得自在，就分享你的作品。","你会遇到阻碍，有时也会感到气馁。","评估自己的表现，必要时重新界定你的角色。","你会形成那种只有靠反复练习才能获得的绘画肌肉记忆。"],"p":"作为一名在社交媒体上分享自己创作历程的艺术家，我常被好奇的关注者问到如何开始一段艺术之旅。遗憾的是，我拿不出什么神奇清单。不过我确实记得做一个完全的新手是什么感觉。所以我总结了几条开始艺术之旅的好建议。\n\n• 从小的开始。我建议用素描本做小幅习作。这些小习作能带来灵感，也可能成为日后更复杂作品的跳板。(36) 你会想回望自己的旅程，看看自己走了多远。\n\n• 多画，并且对着实物画。没有比投入大量用笔时间更好的提高方法。无论你画静物、肖像还是风景，都尽可能对着实物画。(37)\n\n• 不断挑战自己尝试新事物。(38) 艺术上的成长可能有点痛苦。欢迎加入这个俱乐部；我们都经历过。我喜欢接受挑战。我曾接受一项挑战：一个月里每天创作一幅画，并把作品发到网上。\n\n• (39) 寻求并接受建设性的反馈对成长至关重要。我把作品发到社交媒体上，也因此遇到了一些最善良的人。无论我的艺术水平如何，他们都让我感到被重视、被尊重。\n\n你正在走的旅程不会是一条直路。(40) 坚持下去，给它时间，付出努力。你会收获艺术人生带来的回报。"},"541":{"q":"最适合填入第 37 空的句子是？","o":["走出你的舒适区。","制订职业规划并设定目标。","不要扔掉你初学时的画作。","如果你觉得自在，就分享你的作品。","你会遇到阻碍，有时也会感到气馁。","评估自己的表现，必要时重新界定你的角色。","你会形成那种只有靠反复练习才能获得的绘画肌肉记忆。"],"p":"作为一名在社交媒体上分享自己创作历程的艺术家，我常被好奇的关注者问到如何开始一段艺术之旅。遗憾的是，我拿不出什么神奇清单。不过我确实记得做一个完全的新手是什么感觉。所以我总结了几条开始艺术之旅的好建议。\n\n• 从小的开始。我建议用素描本做小幅习作。这些小习作能带来灵感，也可能成为日后更复杂作品的跳板。(36) 你会想回望自己的旅程，看看自己走了多远。\n\n• 多画，并且对着实物画。没有比投入大量用笔时间更好的提高方法。无论你画静物、肖像还是风景，都尽可能对着实物画。(37)\n\n• 不断挑战自己尝试新事物。(38) 艺术上的成长可能有点痛苦。欢迎加入这个俱乐部；我们都经历过。我喜欢接受挑战。我曾接受一项挑战：一个月里每天创作一幅画，并把作品发到网上。\n\n• (39) 寻求并接受建设性的反馈对成长至关重要。我把作品发到社交媒体上，也因此遇到了一些最善良的人。无论我的艺术水平如何，他们都让我感到被重视、被尊重。\n\n你正在走的旅程不会是一条直路。(40) 坚持下去，给它时间，付出努力。你会收获艺术人生带来的回报。"},"542":{"q":"最适合填入第 38 空的句子是？","o":["走出你的舒适区。","制订职业规划并设定目标。","不要扔掉你初学时的画作。","如果你觉得自在，就分享你的作品。","你会遇到阻碍，有时也会感到气馁。","评估自己的表现，必要时重新界定你的角色。","你会形成那种只有靠反复练习才能获得的绘画肌肉记忆。"],"p":"作为一名在社交媒体上分享自己创作历程的艺术家，我常被好奇的关注者问到如何开始一段艺术之旅。遗憾的是，我拿不出什么神奇清单。不过我确实记得做一个完全的新手是什么感觉。所以我总结了几条开始艺术之旅的好建议。\n\n• 从小的开始。我建议用素描本做小幅习作。这些小习作能带来灵感，也可能成为日后更复杂作品的跳板。(36) 你会想回望自己的旅程，看看自己走了多远。\n\n• 多画，并且对着实物画。没有比投入大量用笔时间更好的提高方法。无论你画静物、肖像还是风景，都尽可能对着实物画。(37)\n\n• 不断挑战自己尝试新事物。(38) 艺术上的成长可能有点痛苦。欢迎加入这个俱乐部；我们都经历过。我喜欢接受挑战。我曾接受一项挑战：一个月里每天创作一幅画，并把作品发到网上。\n\n• (39) 寻求并接受建设性的反馈对成长至关重要。我把作品发到社交媒体上，也因此遇到了一些最善良的人。无论我的艺术水平如何，他们都让我感到被重视、被尊重。\n\n你正在走的旅程不会是一条直路。(40) 坚持下去，给它时间，付出努力。你会收获艺术人生带来的回报。"},"543":{"q":"最适合填入第 39 空的句子是？","o":["走出你的舒适区。","制订职业规划并设定目标。","不要扔掉你初学时的画作。","如果你觉得自在，就分享你的作品。","你会遇到阻碍，有时也会感到气馁。","评估自己的表现，必要时重新界定你的角色。","你会形成那种只有靠反复练习才能获得的绘画肌肉记忆。"],"p":"作为一名在社交媒体上分享自己创作历程的艺术家，我常被好奇的关注者问到如何开始一段艺术之旅。遗憾的是，我拿不出什么神奇清单。不过我确实记得做一个完全的新手是什么感觉。所以我总结了几条开始艺术之旅的好建议。\n\n• 从小的开始。我建议用素描本做小幅习作。这些小习作能带来灵感，也可能成为日后更复杂作品的跳板。(36) 你会想回望自己的旅程，看看自己走了多远。\n\n• 多画，并且对着实物画。没有比投入大量用笔时间更好的提高方法。无论你画静物、肖像还是风景，都尽可能对着实物画。(37)\n\n• 不断挑战自己尝试新事物。(38) 艺术上的成长可能有点痛苦。欢迎加入这个俱乐部；我们都经历过。我喜欢接受挑战。我曾接受一项挑战：一个月里每天创作一幅画，并把作品发到网上。\n\n• (39) 寻求并接受建设性的反馈对成长至关重要。我把作品发到社交媒体上，也因此遇到了一些最善良的人。无论我的艺术水平如何，他们都让我感到被重视、被尊重。\n\n你正在走的旅程不会是一条直路。(40) 坚持下去，给它时 否跟随那些最不愿改变想法的人？这种情况有时会出现，但并非主导反应。最常见的情况是，各组报告说他们分享论据、一起推理。不知怎的，这些论据和推理使错误总体上减少了。\n\n尽管纳瓦哈斯领导的研究存在局限、许多问题仍待解答，但它们对小组讨论与决策的潜在影响是巨大的。"},"557":{"q":"纳瓦哈斯的研究发现，即使____，平均准确度仍能提高。","o":["人群规模相对较小","偶尔出现低估","个体之间没有交流","估计并非完全独立"],"p":"1907 年 3 月 7 日，英国统计学家弗朗西斯·高尔顿发表了一篇论文，阐释了后来被称为「群体智慧」效应的现象。他做的估测实验表明，在某些情况下，大量独立估计值的平均值可能相当准确。\n\n这一效应利用的是这样一个事实：人们犯错时，错误并不总是一样。有人倾向于高估，有人倾向于低估。当足够多的这类误差被平均在一起时，它们会相互抵消，从而得到更准确的估计。如果人们彼此相似、倾向于犯同样的错误，那么这些误差就不会相互抵消。用更专业的说法，群体智慧要求人们的估计彼此独立。若因某种原因，人们的错误变得相关或相互依赖，估计的准确性就会下降。\n\n但华金·纳瓦哈斯领导的一项新研究为这一经典现象带来了有趣的转折。该研究的关键发现是：当人群被进一步分成可以讨论的小组时，这些小组的平均值比同等数量的独立个体的平均值更准确。例如，四个五人讨论小组的估计平均值，明显比二十个独立个体的平均值更准确。\n\n在一项针对一百名大学生的后续研究中，研究者试图更清楚地了解小组成员在讨论中究竟做了什么。他们是否倾向于听从那些对自己估计最有信心的人？是否跟随那些最不愿改变想法的人？这种情况有时会出现，但并非主导反应。最常见的情况是，各组报告说他们分享论据、一起推理。不知怎的，这些论据和推理使错误总体上减少了。\n\n尽管纳瓦哈斯领导的研究存在局限、许多问题仍待解答，但它们对小组讨论与决策的潜在影响是巨大的。"},"558":{"q":"后续研究关注的是什么？","o":["小组的规模。","处于主导地位的成员。","讨论的过程。","个人的估计结果。"],"p":"1907 年 3 月 7 日，英国统计学家弗朗西斯·高尔顿发表了一篇论文，阐释了后来被称为「群体智慧」效应的现象。他做的估测实验表明，在某些情况下，大量独立估计值的平均值可能相当准确。\n\n这一效应利用的是这样一个事实：人们犯错时，错误并不总是一样。有人倾向于高估，有人倾向于低估。当足够多的这类误差被平均在一起时，它们会相互抵消，从而得到更准确的估计。如果人们彼此相似、倾向于犯同样的错误，那么这些误差就不会相互抵消。用更专业的说法，群体智慧要求人们的估计彼此独立。若因某种原因，人们的错误变得相关或相互依赖，估计的准确性就会下降。\n\n但华金·纳瓦哈斯领导的一项新研究为这一经典现象带来了有趣的转折。该研究的关键发现是：当人群被进一步分成可以讨论的小组时，这些小组的平均值比同等数量的独立个体的平均值更准确。例如，四个五人讨论小组的估计平均值，明显比二十个独立个体的平均值更准确。\n\n在一项针对一百名大学生的后续研究中，研究者试图更清楚地了解小组成员在讨论中究竟做了什么。他们是否倾向于听从那些对自己估计最有信心的人？是否跟随那些最不愿改变想法的人？这种情况有时会出现，但并非主导反应。最常见的情况是，各组报告说他们分享论据、一起推理。不知怎的，这些论据和推理使错误总体上减少了。\n\n尽管纳瓦哈斯领导的研究存在局限、许多问题仍待解答，但它们对小组讨论与决策的潜在影响是巨大的。"},"559":{"q":"作者对纳瓦哈斯的研究持什么态度？","o":["态度不明。","轻蔑。","怀疑。","赞许。"],"p":"1907 年 3 月 7 日，英国统计学家弗朗西斯·高尔顿发表了一篇论文，阐释了后来被称为「群体智慧」效应的现象。他做的估测实验表明，在某些情况下，大量独立估计值的平均值可能相当准确。\n\n这一效应利用的是这样一个事实：人们犯错时，错误并不总是一样。有人倾向于高估，有人倾向于低估。当足够多的这类误差被平均在一起时，它们会相互抵消，从而得到更准确的估计。如果人们彼此相似、倾向于犯同样的错误，那么这些误差就不会相互抵消。用更专业的说法，群体智慧要求人们的估计彼此独立。若因某种原因，人们的错误变得相关或相互依赖，估计的准确性就会下降。\n\n但华金·纳瓦哈斯领导的一项新研究为这一经典现象带来了有趣的转折。该研究的关键发现是：当人群被进一步分成可以讨论的小组时，这些小组的平均值比同等数量的独立个体的平均值更准确。例如，四个五人讨论小组的估计平均值，明显比二十个独立个体的平均值更准确。\n\n在一项针对一百名大学生的后续研究中，研究者试图更清楚地了解小组成 ,"o":["按受欢迎程度。","按篇幅长短。","按主题。","按语言。"],"p":"你是否曾到了火车站才想起忘了带点可读的东西？是的，我们都有手机，但我们中许多人仍喜欢老派一点，读点印刷品。\n\n好在，至少在旧金山湾区，有专门为此设置的小亭。\n\n“你走进检票口，就会看到一个亮着灯的小亭，它告诉你可以选择一分钟、三分钟或五分钟的故事，”旧金山湾区捷运系统（简称 BART）首席传播官艾丽西亚·特罗斯特说，“你选好想要的长度，它就给你一个像收据一样的短篇故事。”\n\n就这么简单。自去年三月该项目启动以来，乘客已打印了近两万篇短篇小说和诗歌。有些是经典短篇，有些是全新的原创作品。\n\n特罗斯特还想让本地作家被本地乘客认识。“我们想做点事情，向湾区的艺术家征集故事参赛，”特罗斯特说，“截至目前，我们已收到约 120 份投稿。获奖故事会放进我们的小亭，你也就成了发表过作品的艺术家。”\n\n过去半个世纪，全国各地公共交通的客流量一直在下降，那么短篇小说能拯救公共交通吗？\n\n特罗斯特认为可以。\n\n“说到底，现在所有交通机构都在尽其所能改善乘客体验。所以我完全相信，仅凭短篇小说我们就能吸引更多乘客，”她说。\n\n而且你永远不会无东西可读。"},"570":{"q":"特罗斯特最近一直在做什么？","o":["组织故事比赛。","做顾客调查。","挑选印刷出版商。","采访艺术家。"],"p":"你是否曾到了火车站才想起忘了带点可读的东西？是的，我们都有手机，但我们中许多人仍喜欢老派一点，读点印刷品。\n\n好在，至少在旧金山湾区，有专门为此设置的小亭。\n\n“你走进检票口，就会看到一个亮着灯的小亭，它告诉你可以选择一分钟、三分钟或五分钟的故事，”旧金山湾区捷运系统（简称 BART）首席传播官艾丽西亚·特罗斯特说，“你选好想要的长度，它就给你一个像收据一样的短篇故事。”\n\n就这么简单。自去年三月该项目启动以来，乘客已打印了近两万篇短篇小说和诗歌。有些是经典短篇，有些是全新的原创作品。\n\n特罗斯特还想让本地作家被本地乘客认识。“我们想做点事情，向湾区的艺术家征集故事参赛，”特罗斯特说，“截至目前，我们已收到约 120 份投稿。获奖故事会放进我们的小亭，你也就成了发表过作品的艺术家。”\n\n过去半个世纪，全国各地公共交通的客流量一直在下降，那么短篇小说能拯救公共交通吗？\n\n特罗斯特认为可以。\n\n“说到底，现在所有交通机构都在尽其所能改善乘客体验。所以我完全相信，仅凭短篇小说我们就能吸引更多乘客，”她说。\n\n而且你永远不会无东西可读。"},"571":{"q":"特罗斯特对 BART 的未来持什么看法？","o":["它会倒闭。","它的利润会下滑。","它会在全国扩张。","它的客流量会增加。"],"p":"你是否曾到了火车站才想起忘了带点可读的东西？是的，我们都有手机，但我们中许多人仍喜欢老派一点，读点印刷品。\n\n好在，至少在旧金山湾区，有专门为此设置的小亭。\n\n“你走进检票口，就会看到一个亮着灯的小亭，它告诉你可以选择一分钟、三分钟或五分钟的故事，”旧金山湾区捷运系统（简称 BART）首席传播官艾丽西亚·特罗斯特说，“你选好想要的长度，它就给你一个像收据一样的短篇故事。”\n\n就这么简单。自去年三月该项目启动以来，乘客已打印了近两万篇短篇小说和诗歌。有些是经典短篇，有些是全新的原创作品。\n\n特罗斯特还想让本地作家被本地乘客认识。“我们想做点事情，向湾区的艺术家征集故事参赛，”特罗斯特说，“截至目前，我们已收到约 120 份投稿。获奖故事会放进我们的小亭，你也就成了发表过作品的艺术家。”\n\n过去半个世纪，全国各地公共交通的客流量一直在下降，那么短篇小说能拯救公共交通吗？\n\n特罗斯特认为可以。\n\n“说到底，现在所有交通机构都在尽其所能改善乘客体验。所以我完全相信，仅凭短篇小说我们就能吸引更多乘客，”她说。\n\n而且你永远不会无东西可读。"},"572":{"q":"从第一段可以了解到 BMF 的什么？","o":["它保证食物的多样性。","它需要日常照料。","它缩短了从农场到餐桌的距离。","它依赖农贸市场。"],"p":"我们都知道，就食物而言，新鲜最好。然而，商店里的大多数农产品在摆上餐桌之前，都经历了数周的运输、走了数百英里。农贸市场是缩短这段路程的可靠选择，而巴比伦微型农场（BMF）把它缩得更短。\n\nBMF 是一套室内园艺系统。它可以为一个家庭而设，也能服务医院、餐厅或学校等更大的群体。这一创新设计几乎不费力，就能实现每周稳定供应新鲜绿叶菜。\n\n具体来说，这是一座依靠新技术的农场。通过云端连接，BMF 可被远程监控。此外还有一个便捷的应用程序，实时提供生长数据。由于系统自动化，它大大减少了种植所需的水量。它不再是给整排土壤浇水，而是给每株植物提供恰好合适的水量。收获之后，用户只需换上新的预置种子容器，就能开启下一个生长周期。\n\n此外，把系统放在食用它的同一栋楼里，意味着从土壤到沙拉的运输零排放。而且，也无需使用农药和其他会污染传统农场及周边环境的化学物质。\n\nBMF 的员工在日常生活中践行可持续理念。约有一半人步行或骑车上班。在办公室内，他们通过减少垃圾桶数量、避免一次性塑料来鼓励回收与减废。“我们热衷于减少环境中的废弃物、碳排放和化学物质，”一位 BMF 员工说。"},"573":{"q":"这个便捷的应用程序提供什么信息？","o":["实时天气变化。","植物的当前状况。","土壤中的化学污染物。","预置种子容器的供应情况。"],"p":"我们都知道，就食物而言，新鲜最好。然而，商店里的大多数农产品在摆上餐桌之前，都经历了数周的运输、走了数百英里。农贸市场是缩短这段路程的可靠选择，而巴比伦微型农场（BMF）把它缩得更短。\n\nBMF 是一套室内园艺系统。它可以为一个家庭而设，也能服务医院、餐厅或学校等更大的群体。这一创新设计几乎不费力，就能实现每周稳定供应新鲜绿叶菜。\n\n具体来说，这是一座依靠新技术的农场。通过云端连接，BMF 可被远程监控。此外还有一个便捷的应用程序，实时提供生长数据。由于系统自动化，它大大减少了种植所需的水量。它不再是给整排土壤浇水，而是给每株植物提供恰好合适的水量。收获之后，用户只需换上新的预置种子容器，就能开启下一个生长周期。\n\n此外，把系统放在食用它的同一栋楼里，意味着从土壤到沙拉的运输零排放。而且，也无需使用农药和其他会污染传统农场及周边环境的化学物质。\n\nBMF 的员工在日常生活中践行可持续理念。约有一半人步行或骑车上班。在办公室内，他们通过减少垃圾桶数量、避免一次性塑料来鼓励回收与减废。“我们热衷于减少环境中的废弃物、碳排放和化学物质，”一位 BMF 员工说。"},"574":{"q":"关于 BMF 的员工可以得出什么结论？","o":["他们非常热爱运动。","他们致力于社区服务。","他们喜欢分享日常经历。","他们有很强的环保意识。"],"p":"我们都知道，就食物而言，新鲜最好。然而，商店里的大多数农产品在摆上餐桌之前，都经历了数周的运输、走了数百英里。农贸市场是缩短这段路程的可靠选择，而巴比伦微型农场（BMF）把它缩得更短。\n\nBMF 是一套室内园艺系统。它可以为一个家庭而设，也能服务医院、餐厅或学校等更大的群体。这一创新设计几乎不费力，就能实现每周稳定供应新鲜绿叶菜。\n\n具体来说，这是一座依靠新技术的农场。通过云端连接，BMF 可被远程监控。此外还有一个便捷的应用程序，实时提供生长数据。由于系统自动化，它大大减少了种植所需的水量。它不再是给整排土壤浇水，而是给每株植物提供恰好合适的水量。收获之后，用户只需换上新的预置种子容器，就能开启下一个生长周期。\n\n此外，把系统放在食用它的同一栋楼里，意味着从土壤到沙拉的运输零排放。而且，也无需使用农药和其他会污染传统农场及周边环境的化学物质。\n\nBMF 的员工在日常生活中践行可持续理念。约有一半人步行或骑车上班。在办公室内，他们通过减少垃圾桶数量、避免一次性塑料来鼓励回收与减废。“我们热衷于减少环境中的废弃物、碳排放和化学物质，”一位 BMF 员工说。"},"575":{"q":"这篇文章主要讲了什么？","o":["BMF 的主要优势。","BMF 的总体管理。","BMF 的全球影响。","BMF 的技术标准。"],"p":"我们都知道，就食物而言，新鲜最好。然而，商店里的大多数农产品在摆上餐桌之前，都经历了数周的运输、走了数百英里。农贸市场是缩短这段路程的可靠选择，而巴比伦微型农场（BMF）把它缩得更短。\n\nBMF 是一套室内园艺系统。它可以为一个家庭而设，也能服务医院、餐厅或学校等更大的群体。这一创新设计几乎不费力，就能实现每周稳定供应新鲜绿叶菜。\n\n具体来说，这是一座依靠新技术的农场。通过云端连接，BMF 可被远程监控。此外还有一个便捷的应用程序，实时提供生长数据。由于系统自动化，它大大减少了种植所需的水量。它不再是给整排土壤浇水，而是给每株植物提供恰好合适的水量。收获之后，用户只需换上新的预置种子容器，就能开启下一个生长周期。\n\n此外，把系统放在食用它的同一栋楼里，意味着从土壤到沙拉的运输零排放。而且，也无需使用农药和其他会污染传统农场及周边环境的化学物质。\n\nBMF 的员工在日常生活中践行可持续理念。约有一半人步行或骑车上班。在办公室内，他们通过减少垃圾桶数量、避免一次性塑料来鼓励回收与减废。“我们热衷于减少环境中的废弃物、碳排放和化学物质，”一位 BMF 员工说。"},"576":{"q":"第二段中的短语 In the wrong hands 可能是什么意思？","o":["如果被受教育程度低的人读到。","如果被心怀恶意的人审阅。","如果由能力较弱的人来写。","如果由非学术人士来翻译。"],"p":"鉴于人工智能改变我们生活的惊人潜力，我们都需要采取行动，应对这个由 AI 驱动的未来，而这正是《AI by Design：与人工智能共存的方案》一书的意义所在。这本引人入胜的新书出自卡特里奥娜·坎贝尔之手，是一份切实可行的路线图，用以应对即将到来的人工智能革命带来的挑战。\n\n这样一本书若落到不合适的人手里，可能会像驱动 AI 的计算机代码一样难以理解；但幸运的是，坎贝尔拥有二十多年的专业经验，能把艰深的内容讲得通俗易懂。她以商人的务实角度而非学者的角度写作，因此这本指南极具可读性和知识性，读到最后，你会觉得自己几乎和 AI 一样聪明。\n\n正如我们很快将从《AI by Design》中了解到的那样，AI 已经极为聪明，而且会变得更强，正从当前的“狭义 AI”迈向通用人工智能。坎贝尔说，再往后将出现“人工主导智能”。正因如此，她如今就开始着手提高人们对 AI 及其未来的认识——而这比这些发展预期发生的时间要早几十年。她说，我们必须保持对人工智能的控制，否则就有被边缘化、甚至更糟的风险。\n\n坎贝尔的用意是唤醒对 AI 负责的人——科技公司和世界各国领导人——使他们与所有正在开发 AI 的专家达成共识。她解释说，我们正处于历史的“临界点”，必须现在就行动，以防人类遭遇灭绝级事件。我们需要思考希望与 AI 共处的前景如何展开。这样的结构化思考，继之以全球性监管，将使我们成就伟大，而非走向衰亡。\n\nAI 将影响我们每一个人，如果你只读一本关于这个主题的书，那就是这本。"},"577":{"q":"根据文章，《AI by Design》的一个特点是什么？","o":["它满是复杂的代码。","它采用脚踏实地的写作风格。","它提供循序渐进的指导。","它是为人工智能专业人士写的。"],"p":"鉴于人工智能改变我们生活的惊人潜力，我们都需要采取行动，应对这个由 AI 驱动的未来，而这正是《AI by Design：与人工智能共存的方案》一书的意义所在。这本引人入胜的新书出自卡特里奥娜·坎贝尔之手，是一份切实可行的路线图，用以应对即将到来的人工智能革命带来的挑战。\n\n这样一本书若落到不合适的人手里，可能会像驱动 AI 的计算机代码一样难以理解；但幸运的是，坎贝尔拥有二十多年的专业经验，能把艰深的内容讲得通俗易懂。她以商人的务实角度而非学者的角度写作，因此这本指南极具可读性和知识性，读到最后，你会觉得自己几乎和 AI 一样聪明。\n\n正如我们很快将从《AI by Design》中了解到的那样，AI 已经极为聪明，而且会变得更强，正从当前的“狭义 AI”迈向通用人工智能。坎贝尔说，再往后将出现“人工主导智能”。正因如此，她如今就开始着手提高人们对 AI 及其未来的认识——而这比这些发展预期发生的时间要早几十年。她说，我们必须保持对人工智能的控制，否则就有被边缘化、甚至更糟的风险。\n\n坎贝尔的用意是唤醒对 AI 负责的人——科技公司和世界各国领导人——使他们与所有正在开发 AI 的专家达成共识。她解释说，我们正处于历史的“临界点”，必须现在就行动，以防人类遭遇灭绝级事件。我们需要思考希望与 AI 共处的前景如何展开。这样的结构化思考，继之以全球性监管，将使我们成就伟大，而非走向衰亡。\n\nAI 将影响我们每一个人，如果你只读一本关于这个主题的书，那就是这本。"},"578":{"q":"关于人工智能的发展，坎贝尔敦促人们做什么？","o":["遵守现行的相关法规。","重新考虑专家的意见。","共同努力把它控制住。","借鉴以往经验让它慢下来。"],"p":"鉴于人工智能改变我们生活的惊人潜力，我们都需要采取行动，应对这个由 AI 驱动的未来，而这正是《AI by Design：与人工智能共存的方案》一书的意义所在。这本引人入胜的新书出自卡特里奥娜·坎贝尔之手，是一份切实可行的路线图，用以应对即将到来的人工智能革命带来的挑战。\n\n这样一本书若落到不合适的人手里，可能会像驱动 AI 的计算机代码一样难以理解；但幸运的是，坎贝尔拥有二十多年的专业经验，能把艰深的内容讲得通俗易懂。她以商人的务实角度而非学者的角度写作，因此这本指南极具可读性和知识性，读到最后，你会觉得自己几乎和 AI 一样聪明。\n\n正如我们很快将从《AI by Design》中了解到的那样，AI 已经极为聪明，而且会变得更强，正从当前的“狭义 AI”迈向通 机应用很容易对不同物种进行观察，”该研究第一作者、斯坦福大学人文与科学学院生物学助理教授巴纳巴斯·达鲁说。“这些观察记录如今已超过来自实物标本的原始数据，而由于我们越来越多地用观察数据来研究物种如何应对全球变化，我想知道：它们可用吗？”\n\n达鲁和团队使用一个包含 19 亿条植物、昆虫、鸟类和动物记录的全球数据集，检验这些数据在多大程度上反映了真实的全球生物多样性格局。\n\n“我们特别想探究那些容易使数据产生偏差的取样环节，比如公民科学家更可能拍下一株开花的植物，而不是紧挨着它的草，”达鲁说。\n\n他们的研究显示，数量庞大的纯观察记录并未带来更好的全球覆盖。此外，这些数据存在偏差，偏向某些地区、时间段和物种。这可以理解，因为通过移动设备获取观察性生物多样性数据的人，往往是记录自己在附近区域与物种相遇的公民科学家。这些数据也偏向那些具有迷人、醒目特征的物种。\n\n那么，面对这些不完美的生物多样性数据集，我们能做什么呢？\n\n“能做很多，”达鲁解释说。“生物多样性应用可以利用我们的研究结果，告知用户哪些区域被过度采样，并引导他们去那些——甚至那些物种——采样不足的地方。为提高观察数据的质量，生物多样性应用还可以鼓励用户请专家确认其上传图片中的物种鉴定。”"},"597":{"q":"达鲁的研究聚焦于什么？","o":["受威胁的物种。","实物标本。","观察数据。","移动应用。"],"p":"在物种灭绝之前抢先把地球上的物种记录下来的竞赛中，研究者和公民科学家已收集了数十亿条记录。如今，大多数生物多样性记录常以照片、视频和其他数字记录的形式存在。尽管这些记录有助于发现某地区物种数量与种类的变化，但斯坦福大学的一项新研究却发现，这类记录并不完美。\n\n“随着技术的发展，人们借助手机应用很容易对不同物种进行观察，”该研究第一作者、斯坦福大学人文与科学学院生物学助理教授巴纳巴斯·达鲁说。“这些观察记录如今已超过来自实物标本的原始数据，而由于我们越来越多地用观察数据来研究物种如何应对全球变化，我想知道：它们可用吗？”\n\n达鲁和团队使用一个包含 19 亿条植物、昆虫、鸟类和动物记录的全球数据集，检验这些数据在多大程度上反映了真实的全球生物多样性格局。\n\n“我们特别想探究那些容易使数据产生偏差的取样环节，比如公民科学家更可能拍下一株开花的植物，而不是紧挨着它的草，”达鲁说。\n\n他们的研究显示，数量庞大的纯观察记录并未带来更好的全球覆盖。此外，这些数据存在偏差，偏向某些地区、时间段和物种。这可以理解，因为通过移动设备获取观察性生物多样性数据的人，往往是记录自己在附近区域与物种相遇的公民科学家。这些数据也偏向那些具有迷人、醒目特征的物种。\n\n那么，面对这些不完美的生物多样性数据集，我们能做什么呢？\n\n“能做很多，”达鲁解释说。“生物多样性应用可以利用我们的研究结果，告知用户哪些区域被过度采样，并引导他们去那些——甚至那些物种——采样不足的地方。为提高观察数据的质量，生物多样性应用还可以鼓励用户请专家确认其上传图片中的物种鉴定。”"},"598":{"q":"按研究结论，是什么导致了这些偏差？","o":["数据分析中的错误。","上传图片质量差。","不恰当的取样方式。","不可靠的数据采集设备。"],"p":"在物种灭绝之前抢先把地球上的物种记录下来的竞赛中，研究者和公民科学家已收集了数十亿条记录。如今，大多数生物多样性记录常以照片、视频和其他数字记录的形式存在。尽管这些记录有助于发现某地区物种数量与种类的变化，但斯坦福大学的一项新研究却发现，这类记录并不完美。\n\n“随着技术的发展，人们借助手机应用很容易对不同物种进行观察，”该研究第一作者、斯坦福大学人文与科学学院生物学助理教授巴纳巴斯·达鲁说。“这些观察记录如今已超过来自实物标本的原始数据，而由于我们越来越多地用观察数据来研究物种如何应对全球变化，我想知道：它们可用吗？”\n\n达鲁和团队使用一个包含 19 亿条植物、昆虫、鸟类和动物记录的全球数据集，检验这些数据在多大程度上反映了真实的全球生物多样性格局。\n\n“我们特别想探究那些容易使数据产生偏差的取样环节，比如公民科学家更可能拍下一株开花的植物，而不是紧挨着它的草，”达鲁说。\n\n他们的研究显示，数量庞大的纯观察记录并未带来更好的全球覆盖。此外，这些数据存在偏差，偏向某些地区、时间段和物种。这可以理解，因为通过移动设备获取观察性生物多样性数据的人，往往是记录自己在附近区域与物种相遇的公民科学家。这些数据也偏向那些具有迷人、醒目特征的物种。\n\n那么，面对这些不完美的生物多样性数据集，我们能做什么呢？\n\n“能做很多，”达鲁解释说。“生物多样性应用可以利用我们的研究结果，告知用户哪些区域被过 可能是一次很有收获的体验。"},"605":{"q":"在哪里可以看到《大宪章》的一份原件？","o":["在拉德洛城堡。","在英格兰美食中心。","在赫里福德大教堂。","在黑白屋博物馆。"],"p":"英国值得一游的集镇\n\n英国的集镇形态各异、大小不一。每座集镇的个性，都由数百年来生产与交易的货物和服务塑造而成。但每座镇的玩法都不止于购物。\n\n赫里福德（赫里福德郡）\n自 1189 年以来，赫里福德一直是座热闹的集镇。沿着城镇广场的边缘，你能找到漂亮的店铺、餐馆和“黑白屋”博物馆。赫里福德大教堂是镇上最气派的建筑，其中还有一座古老的图书馆。《大宪章》四份原件中的一份就陈列在那里。\n\n拉德洛（什罗普郡）\n拉德洛号称“英格兰美食中心”。肉铺、蔬果店、面包房和奶酪店在广场两侧一字排开。紧邻广场的拉德洛城堡是一座“必去探访”的中世纪要塞。每年九月，为期三天的拉德洛美食节在此举行。\n\n什鲁斯伯里（什罗普郡）\n从伦敦到什鲁斯伯里市中心并不轻松，但这份折腾值得。塞文河在城中拐了一个大弯，几乎把市中心围成一座岛。这一地形造就了理想的集市——人们可以把河当作公路，运进运出货物。这里处处是花：吊篮、窗台花箱和花槽，正是你想象中迷人英国集镇的模样。\n\n梅瓦吉西（康沃尔郡）\n即使你没去过梅瓦吉西这个小渔村，也可能在电影或英国电视剧里见过它。这座仍在使用的港口形成于 1774 年。渔民每天出海，在港边市场卖鱼。离开港口前，一定要尝一个传统的康沃尔馅饼，非常美味。"},"606":{"q":"什鲁斯伯里市中心的一个特点是什么？","o":["它位于一座大岛附近。","它几乎被水环绕。","它以花卉节闻名。","它从伦敦很容易到达。"],"p":"英国值得一游的集镇\n\n英国的集镇形态各异、大小不一。每座集镇的个性，都由数百年来生产与交易的货物和服务塑造而成。但每座镇的玩法都不止于购物。\n\n赫里福德（赫里福德郡）\n自 1189 年以来，赫里福德一直是座热闹的集镇。沿着城镇广场的边缘，你能找到漂亮的店铺、餐馆和“黑白屋”博物馆。赫里福德大教堂是镇上最气派的建筑，其中还有一座古老的图书馆。《大宪章》四份原件中的一份就陈列在那里。\n\n拉德洛（什罗普郡）\n拉德洛号称“英格兰美食中心”。肉铺、蔬果店、面包房和奶酪店在广场两侧一字排开。紧邻广场的拉德洛城堡是一座“必去探访”的中世纪要塞。每年九月，为期三天的拉德洛美食节在此举行。\n\n什鲁斯伯里（什罗普郡）\n从伦敦到什鲁斯伯里市中心并不轻松，但这份折腾值得。塞文河在城中拐了一个大弯，几乎把市中心围成一座岛。这一地形造就了理想的集市——人们可以把河当作公路，运进运出货物。这里处处是花：吊篮、窗台花箱和花槽，正是你想象中迷人英国集镇的模样。\n\n梅瓦吉西（康沃尔郡）\n即使你没去过梅瓦吉西这个小渔村，也可能在电影或英国电视剧里见过它。这座仍在使用的港口形成于 1774 年。渔民每天出海，在港边市场卖鱼。离开港口前，一定要尝一个传统的康沃尔馅饼，非常美味。"},"607":{"q":"作者建议游客在梅瓦吉西做什么？","o":["尝尝康沃尔馅饼。","看一部英国电视剧。","出海捕鱼。","给港口拍照。"],"p":"英国值得一游的集镇\n\n英国的集镇形态各异、大小不一。每座集镇的个性，都由数百年来生产与交易的货物和服务塑造而成。但每座镇的玩法都不止于购物。\n\n赫里福德（赫里福德郡）\n自 1189 年以来，赫里福德一直是座热闹的集镇。沿着城镇广场的边缘，你能找到漂亮的店铺、餐馆和“黑白屋”博物馆。赫里福德大教堂是镇上最气派的建筑，其中还有一座古老的图书馆。《大宪章》四份原件中的一份就陈列在那里。\n\n拉德洛（什罗普郡）\n拉德洛号称“英格兰美食中心”。肉铺、蔬果店、面包房和奶酪店在广场两侧一字排开。紧邻广场的拉德洛城堡是一座“必去探访”的中世纪要塞。每年九月，为期三天的拉德洛美食节在此举行。\n\n什鲁斯伯里（什罗普郡）\n从伦敦到什鲁斯伯里市中心并不轻松，但这份折腾值得。塞文河在城中拐了一个大弯，几乎把市中心围成一座岛。这一地形造就了理想的集市——人们可以把河当作公路，运进运出货物。这里处处是花：吊篮、窗台花箱和花槽，正是你想象中迷人英国集镇的模样。\n\n梅瓦吉西（康沃尔郡）\n即使你没去过梅瓦吉西这个小渔村，也可能在电影或英国电视剧里见过它。这座仍在使用的港口形成于 1774 年。渔民每天出海，在港边市场卖鱼。离开港口前，一定要尝一个传统的康沃尔馅饼，非常美味。"},"608":{"q":"何在 LPCH 教谁？","o":["生病的孩子。","年轻护士。","医学生。","患者的父母。"],"p":"医院里的高中老师\n\n凯西·何在南加州的斯坦福露西尔·帕卡德儿童医院（LPCH）里教高中课程。“有时我不太愿意说自己是老师，”何说，“人们脑子里对老师做什么自有一套想象，但在这里其实并非如此。”\n\n“这里”指 386 房间。每年约有 500 名 LPCH 的患者在这里同时成为学生。这所医院学校没有家长、没有医生，也没有医疗操作，是一个纯粹学习的地方。何的学生约有一半在此只待一周或更短，另一些则待一年以上。她的学生大多会康复，这意味着帮他们做好返校准备，正成为护理中越来越重要的一环。\n\n不过，在 386 房间，学业并不是第一位，身体健康与心理健康才是优先项。“如果你害怕某件事、满脑子只想着它，你根本没办法学习，”何说，“我既是教练，也是顾问，还是安慰者——这就是医院老师的意思。”\n\n任何时刻，何的班上最多有 30 名学生。她通常与学生原校的老师合作，拿到原校在用的课程和试题。有些老师不给孩子布置任何作业，只是一味表达同情。“我觉得这对孩子是一种伤害，”何说，“他们会以为老师根本不在乎自己的功课。”\n\n何认识到，帮助孩子跟上医院外同龄人的步伐有其心理上的益处。“其实我认为，对某些问题来说，药物只占很小一部分，”LPCH 疼痛管理服务主任朱莉·古德说，“关键在于围绕‘怎样才算完整的人生’去解决问题。这些孩子有梦想，而学校能给孩子一条学习和成长的路，让梦想继续活着。”"},"609":{"q":"何的工作有什么特点？","o":["以学业为先。","鼓励创新。","治疗各种疾病。","扮演多重角色。"],"p":"医院里的高中老师\n\n凯西·何在南加州的斯坦福露西尔·帕卡德儿童医院（LPCH）里教高中课程。“有时我不太愿意说自己是老师，”何说，“人们脑子里对老师做什么自有一套想象，但在这里其实并非如此。”\n\n“这里”指 386 房间。每年约有 500 名 LPCH 的患者在这里同时成为学生。这所医院学校没有家长、没有医生，也没有医疗操作，是一个纯粹学习的地方。何的学生约有一半在此只待一周或更短，另一些则待一年以上。她的学生大多会康复，这意味着帮他们做好返校准备，正成为护理中越来越重要的一环。\n\n不过，在 386 房间，学业并不是第一位，身体健康与心理健康才是优先项。“如果你害怕某件事、满脑子只想着它，你根本没办法学习，”何说，“我既是教练，也是顾问，还是安慰者——这就是医院老师的意思。”\n\n任何时刻，何的班上最多有 30 名学生。她通常与学生原校的老师合作，拿到原校在用的课程和试题。有些老师不给孩子布置任何作业，只是一味表达同情。“我觉得这对孩子是一种伤害，”何说，“他们会以为老师根本不在乎自己的功课。”\n\n何认识到，帮助孩子跟上医院外同龄人的步伐有其心理上的益处。“其实我认为，对某些问题来说，药物只占很小一部分，”LPCH 疼痛管理服务主任朱莉·古德说，“关键在于围绕‘怎样才算完整的人生’去解决问题。这些孩子有梦想，而学校能给孩子一条学习和成长的路，让梦想继续活着。”"},"610":{"q":"第四段画线词 it 指什么？","o":["照常上课。","给予额外关注。","不布置作业。","不表示同情。"],"p":"医院里的高中老师\n\n凯西·何在南加州的斯坦福露西尔·帕卡德儿童医院（LPCH）里教高中课程。“有时我不太愿意说自己是老师，”何说，“人们脑子里对老师做什么自有一套想象，但在这里其实并非如此。”\n\n“这里”指 386 房间。每年约有 500 名 LPCH 的患者在这里同时成为学生。这所医院学校没有家长、没有医生，也没有医疗操作，是一个纯粹学习的地方。何的学生约有一半在此只待一周或更短，另一些则待一年以上。她的学生大多会康复，这意味着帮他们做好返校准备，正成为护理中越来越重要的一环。\n\n不过，在 386 房间，学业并不是第一位，身体健康与心理健康才是优先项。“如果你害怕某件事、满脑子只想着它，你根本没办法学习，”何说，“我既是教练，也是顾问，还是安慰者——这就是医院老师的意思。”\n\n任何时刻，何的班上最多有 30 名学生。她通常与学生原校的老师合作，拿到原校在用的课程和试题。有些老师不给孩子布置任何作业，只是一味表达同情。“我觉得这对孩子是一种伤害，”何说，“他们会以为老师根本不在乎自己的功课。”\n\n何认识到，帮助孩子跟上医院外同龄人的步伐有其心理上的益处。“其实我认为，对某些问题来说，药物只占很小一部分，”LPCH 疼痛管理服务主任朱莉·古德说，“关键在于围绕‘怎样才算完整的人生’去解决问题。这些孩子有梦想，而学校能给孩子一条学习和成长的路，让梦想继续活着。”"},"611":{"q":"按古德的说法，这所医院学校如何让学生受益？","o":["它缓解同伴压力。","它帮他们怀着希望生活。","它让他们摆脱疼痛。","它用故事娱乐他们。"],"p":"医院里的高中老师\n\n凯西·何在南加州的斯坦福露西尔·帕卡德儿童医院（LPCH）里教高中课程。“有时我不太愿意说自己是老师，”何说，“人们脑子里对老师做什么自有一套想象，但在这里其实并非如此。”\n\n“这里”指 386 房间。每年约有 500 名 LPCH 的患者在这里同时成为学生。这所医院学校没有家长、没有医生，也没有医疗操作，是一个纯粹学习的地方。何的学生约有一半在此只待一周或更短，另一些则待一年以上。她的学生大多会康复，这意味着帮他们做好返校准备，正成为护理中越来越重要的一环。\n\n不过，在 386 房间，学业并不是第一位，身体健康与心理健康才是优先项。“如果你害怕某件事、满脑子只想着它，你根本没办法学习，”何说，“我既是教练，也是顾问，还是安慰者——这就是医院老师的意思。”\n\n任何时刻，何的班上最多有 30 名学生。她通常与学生原校的老师合作，拿到原校在用的课程和试题。有些老师不给孩子布置任何作业，只是一味表达同情。“我觉得这对孩子是一种伤害，”何说，“他们会以为老师根本不在乎自己的功课。”\n\n何认识到，帮助孩子跟上医院外同龄人的步伐有其心理上的益处。“其实我认为，对某些问题来说，药物只占很小一部分，”LPCH 疼痛管理服务主任朱莉·古德说，“关键在于围绕‘怎样才算完整的人生’去解决问题。这些孩子有梦想，而学校能给孩子一条学习和成长的路，让梦想继续活着。”"},"612":{"q":"德特里尼达的生意刚起步时情况如何？","o":["它面临激烈竞争。","它亏损严重。","它获得大量资金支持。","它出乎意料地顺利。"],"p":"植物如何改善你的状态\n\n索尼娅·德特里尼达开网店卖室内绿植时，并没抱多大希望。结果恰恰相反：订单如潮，仅 2020 年 6 月就发出 1200 单。过去一年里，她寄出了七万多株植物。她的成功只是“居家时间变多带动室内绿植产业爆发”的一个例子。\n\n“植物眼下正流行，”佛罗里达大学研究员梅琳达·克努斯博士说。“生活在植物环绕环境中的人，报告的生活满意度更高，”她说，“给环境增添更多自然元素，能改变我们的情绪和思维方式。”植物改善心境的方式有几种，但最主要的是降低体内皮质醇——即压力激素——的水平。\n\n“身边有植物的学生，学业表现优于在没有植物的教室里上课的学生，”克努斯说，“这种效率提升在成年人的职场中同样成立。我们的研究显示，在植物多的场所工作的人，病假减少了 30%。”\n\n如果你也是享受“被植物环绕”带来的身心益处的人，那么当有一株（或几株）没养活时，别太责怪自己。“医生要行医实践，律师要执业实践，你也应该允许自己经历养好一株植物所需的练习。照料植物是一种耐心与学习的锻炼。用心去照顾它，但如果它死了，再去买一株就是了，”德特里尼达说。"},"613":{"q":"克努斯关于植物的发现之一是什么？","o":["它们更受学生喜爱。","它们净化环境。","它们提高皮质醇水平。","它们提升效率。"],"p":"植物如何改善你的状态\n\n索尼娅·德特里尼达开网店卖室内绿植时，并没抱多大希望。结果恰恰相反：订单如潮，仅 2020 年 6 月就发出 1200 单。过去一年里，她寄出了七万多株植物。她的成功只是“居家时间变多带动室内绿植产业爆发”的一个例子。\n\n“植物眼下正流行，”佛罗里达大学研究员梅琳达·克努斯博士说。“生活在植物环绕环境中的人，报告的生活满意度更高，”她说，“给环境增添更多自然元素，能改变我们的情绪和思维方式。”植物改善心境的方式有几种，但最主要的是降低体内皮质醇——即压力激素——的水平。\n\n“身边有植物的学生，学业表现优于在没有植物的教室里上课的学生，”克努斯说，“这种效率提升在成年人的职场中同样成立。我们的研究显示，在植物多的场所工作的人，病假减少了 30%。”\n\n如果你也是享受“被植物环绕”带来的身心益处的人，那么当有一株（或几株）没养活时，别太责怪自己。“医生要行医实践，律师要执业实践，你也应该允许自己经历养好一株植物所需的练习。照料植物是一种耐心与学习的锻炼。用心去照顾它，但如果它死了，再去买一株就是了，”德特里尼达说。"},"614":{"q":"德特里尼达提到医生和律师是想说明什么？","o":["社交技能的必要性。","可持续的含义。","反复练习的重要性。","专业意见的价值。"],"p":"植物如何改善你的状态\n\n索尼娅·德特里尼达开网店卖室内绿植时，并没抱多大希望。结果恰恰相反：订单如潮，仅 2020 年 6 月就发出 1200 单。过去一年里，她寄出了七万多株植物。她的成功只是“居家时间变多带动室内绿植产业爆发”的一个例子。\n\n“植物眼下正流行，”佛罗里达大学研究员梅琳达· 务让你觉得自己有能力，并激励你充分利用每一天。"],"p":"一家人一起做志愿服务的意外好处\n\n你在寻找能让全家人更亲密的方法吗？想找一个小孩和大人都能一起玩的爱好吗？(36) 你也许知道帮助他人会带来“感觉真好”的情绪，但志愿服务对全家人的积极影响，还有更多意想不到的方式。\n\n● 你会觉得自己时间更多。\n人们常觉得自己太忙，没时间做志愿服务。然而研究发现，把时间投入社区公益，反而会让你觉得自己拥有更多时间。(37)\n\n● 经常做志愿服务能让你更长寿。\n(38) 华盛顿大学发现，55 岁及以上参加志愿服务的成年人，记忆力更好，整体健康状况也保持得更久。志愿者同样更可能关注自身健康，更注重在日常中加入体育活动。\n\n● (39)\n青少年时期做志愿服务与一些重要的积极影响相关，如成绩提高、自信心增强。这些影响并非短期，已被证明会影响青少年未来多年的身心健康。\n\n● 你会与家人共处更久。\n一起做志愿服务的家庭，有着为一个共同目标努力的独特经历。(40) 每个人都为这件事带来独特的东西，也能以新的方式彼此联结。而且，各种年龄和能力都有可做的任务，所以你的每个孩子都能为自己的付出感到自豪。"},"621":{"q":"第 37 空最合适的句子是？","o":["帮助社区能降低抑郁发生率。","全家一起做志愿服务，也许正是你需要的。","志愿服务对儿童和青少年有终身影响。","志愿服务可以成为消除偏见的第一步。","对成年人来说，志愿服务能带来显著的身体健康益处。","你甚至可能发现孩子有你此前不知道的才能。","志愿服务让你觉得自己有能力，并激励你充分利用每一天。"],"p":"一家人一起做志愿服务的意外好处\n\n你在寻找能让全家人更亲密的方法吗？想找一个小孩和大人都能一起玩的爱好吗？(36) 你也许知道帮助他人会带来“感觉真好”的情绪，但志愿服务对全家人的积极影响，还有更多意想不到的方式。\n\n● 你会觉得自己时间更多。\n人们常觉得自己太忙，没时间做志愿服务。然而研究发现，把时间投入社区公益，反而会让你觉得自己拥有更多时间。(37)\n\n● 经常做志愿服务能让你更长寿。\n(38) 华盛顿大学发现，55 岁及以上参加志愿服务的成年人，记忆力更好，整体健康状况也保持得更久。志愿者同样更可能关注自身健康，更注重在日常中加入体育活动。\n\n● (39)\n青少年时期做志愿服务与一些重要的积极影响相关，如成绩提高、自信心增强。这些影响并非短期，已被证明会影响青少年未来多年的身心健康。\n\n● 你会与家人共处更久。\n一起做志愿服务的家庭，有着为一个共同目标努力的独特经历。(40) 每个人都为这件事带来独特的东西，也能以新的方式彼此联结。而且，各种年龄和能力都有可做的任务，所以你的每个孩子都能为自己的付出感到自豪。"},"622":{"q":"第 38 空最合适的句子是？","o":["帮助社区能降低抑郁发生率。","全家一起做志愿服务，也许正是你需要的。","志愿服务对儿童和青少年有终身影响。","志愿服务可以成为消除偏见的第一步。","对成年人来说，志愿服务能带来显著的身体健康益处。","你甚至可能发现孩子有你此前不知道的才能。","志愿服务让你觉得自己有能力，并激励你充分利用每一天。"],"p":"一家人一起做志愿服务的意外好处\n\n你在寻找能让全家人更亲密的方法吗？想找一个小孩和大人都能一起玩的爱好吗？(36) 你也许知道帮助他人会带来“感觉真好”的情绪，但志愿服务对全家人的积极影响，还有更多意想不到的方式。\n\n● 你会觉得自己时间更多。\n人们常觉得自己太忙，没时间做志愿服务。然而研究发现，把时间投入社区公益，反而会让你觉得自己拥有更多时间。(37)\n\n● 经常做志愿服务能让你更长寿。\n(38) 华盛顿大学发现，55 岁及以上参加志愿服务的成年人，记忆力更好，整体健康状况也保持得更久。志愿者同样更可能关注自身健康，更注重在日常中加入体育活动。\n\n● (39)\n青少年时期做志愿服务与一些重要的积极影响相关，如成绩提高、自信心增强。这些影响并非短期，已被证明会影响青少年未来多年的身心健康。\n\n● 你会与家人共处更久。\n一起做志愿服务的家庭，有着为一个共同目标努力的独特经历。(40) 每个人都为这件事带来独特的东西，也能以新的方式彼此联结。而且，各种年龄和能力都有可做的任务，所以你的每个孩子都能为自己的付出感到自豪。"},"623":{"q":"第 39 空最合适的句子是？","o":["帮助社区能降低抑郁发生率。","全家一起做志愿服务，也许正是你需要的。","志愿服务对儿童和青少年有终身影响。","志愿服务可以成为消除偏见的第一步。","对成年人来说，志愿服务能带来显著的身体 。","火车。","船舶。"],"p":"飞机、火车与汽车的绿色化\n\n在世界范围内运送货物和人员，是造成全球二氧化碳排放的重要部分。当世界竞相实现各领域的脱碳时，交通运输面临着特别的难题——它约占我们能源相关温室气体排放的四分之一。以下是 2018 年不同运输方式排放量的构成情况。\n\n道路车辆 74.5%｜飞机 11.6%｜船舶 10.7%｜铁路 1%｜其他 2.2%\n\n交通燃料不仅要绿色、廉价、动力强劲，还必须足够轻便、安全，便于携带。每种运输方式都有其特定的燃料需求。许多问题仍有待解决，但以下是一些让我们走向绿色的方案。\n\n汽车——电池：电池能效高，且以电力驱动。新型电池能让汽车在一次充电后行驶得更远。\n\n飞机——合成碳氢化合物：最难脱碳的领域是航空。飞机可持续燃料最有前景的方案，是用回收空气中的二氧化碳制取碳氢化合物，这种燃料可直接用于现有航线。\n\n卡车——氢燃料电池：对卡车而言，氢燃料电池比电池更轻，但制取绿色氢的成本很高。\n\n船舶——液氨：液氨易于储存和运输，但难以点燃，且需要重新设计发动机。\n\n火车——电力：一些火车已通过轨道或电线实现电气化；另一些也能以非常简单的方式改用电驱动。\n\n这场能源转型是全球性的，世界所需的可再生能源数量“有点令人难以置信”，美国国家可再生能源实验室的机械工程师基思·威普克说。据估计，到 2050 年全球电力需求可能会翻一番以上。幸运的是，分析表明可再生能源足以胜任。“我们需要加快绿色能源的发展，而它终将全部被用上，”威普克说。"},"627":{"q":"关于能源转型，威普克提出了什么建议？","o":["限制燃料消耗。","加大可再生能源的开发力度。","提高能源效率。","让电力更便宜。"],"p":"飞机、火车与汽车的绿色化\n\n在世界范围内运送货物和人员，是造成全球二氧化碳排放的重要部分。当世界竞相实现各领域的脱碳时，交通运输面临着特别的难题——它约占我们能源相关温室气体排放的四分之一。以下是 2018 年不同运输方式排放量的构成情况。\n\n道路车辆 74.5%｜飞机 11.6%｜船舶 10.7%｜铁路 1%｜其他 2.2%\n\n交通燃料不仅要绿色、廉价、动力强劲，还必须足够轻便、安全，便于携带。每种运输方式都有其特定的燃料需求。许多问题仍有待解决，但以下是一些让我们走向绿色的方案。\n\n汽车——电池：电池能效高，且以电力驱动。新型电池能让汽车在一次充电后行驶得更远。\n\n飞机——合成碳氢化合物：最难脱碳的领域是航空。飞机可持续燃料最有前景的方案，是用回收空气中的二氧化碳制取碳氢化合物，这种燃料可直接用于现有航线。\n\n卡车——氢燃料电池：对卡车而言，氢燃料电池比电池更轻，但制取绿色氢的成本很高。\n\n船舶——液氨：液氨易于储存和运输，但难以点燃，且需要重新设计发动机。\n\n火车——电力：一些火车已通过轨道或电线实现电气化；另一些也能以非常简单的方式改用电驱动。\n\n这场能源转型是全球性的，世界所需的可再生能源数量“有点令人难以置信”，美国国家可再生能源实验室的机械工程师基思·威普克说。据估计，到 2050 年全球电力需求可能会翻一番以上。幸运的是，分析表明可再生能源足以胜任。“我们需要加快绿色能源的发展，而它终将全部被用上，”威普克说。"},"628":{"q":"第一段开头提到的人是谁？","o":["九年级学生。","学生的父母。","现代作家。","虚构人物。"],"p":"去年我教九年级写作课，遇见了一位拯救小镇的牛仔、一位要求儿子门门拿 A 的严父，还有一位现代版朱丽叶——她因父母拒绝她年轻时的爱人而心碎离世。不止一次，我心里纳闷：这些人物是学生们创造出来的，他们怎会对笔下的人了解得如此透彻？\n\n但他们第一篇作文的情况却大不一样。题目是：“写作为什么重要？”大多数作文不足一页，几乎没有一句能被看作论点句。我很震惊。随后我意识到，问题出在题目本身。他们本可以就电脑的必要性写好几页，但写作本身，他们并不觉得重要。这种情况必须改变。\n\n新单元开始时，我让大家就自己选择的健康话题写一篇议论文。这一次他们觉得这个练习有趣得多。接下来的两次作业，先是个人叙事单元，后是创意写作工作坊，我只要求文章符合其体裁规范并包含一个论点。结果令人惊叹。学生们选择了各种话题，交上来的故事每篇 10 到 20 页，其中的人物开阔了我的视野，也打动了我的心。\n\n我走进课堂时相信，写作作为一种交流手段很重要。然而，我的学生向我展示了更重要的东西。六月最后一声铃声响起时，我带走的是一本年鉴，里面写满了关于写作最强大意义的留言——它能连接人，让我们置身他人的处境，教我们何为“人”。"},"629":{"q":"学生第一篇作文为什么写得不好 \n\n城市街道上的生活几十年前就开始改变。整个街区被拆毁，为新道路网让路，孩子们只好到别处玩耍。一些社区奋起反抗。最著名的是，一位 20 世纪 50 年代初举家搬到曼哈顿的加拿大记者，发起了一场阻止拆除当地公园的运动。简·雅各布斯描述了自己得知公园将被一条高速公路取代时的惊恐，并呼吁市长捍卫“纽约作为一个宜居之地，而不只是一个匆匆穿过的地方”。20 世纪 60 年代末和 70 年代，澳大利亚也出现了类似的运动。\n\n尽管这些运动很广泛，但现实是，大多数西方城市已完全按照汽车的需求被重新设计。道路上的汽车数量迅速增长。在澳大利亚，我们现在有两千多万辆汽车，而人口刚过两千六百万，汽车拥有率位居世界前列。\n\n我们在让我们快速通行的道路上投入巨大，却没有计算真正的代价。当孩子们无法在我们的社区里安全活动时，我们是否真的认识到这对社会意味着什么？《移动》的作者说得对：是时候换个角度思考你家门外那条街了。"},"633":{"q":"那位加拿大记者和其他运动参与者试图做什么？","o":["保持城市的宜居性。","促进文化多样性。","帮助贫困家庭。","让高速公路更易通行。"],"p":"尽管近年来我们的街道在安全方面可能已有所改善，但交通研究也显示，行人的出行能力在下降，尤其是幼儿。许多家长说路上车太多，孩子无法安全步行上学，于是干脆把他们塞进车里。\n\n荷兰作家塔莉娅·韦尔卡德和马可·特·布雷梅尔斯特罗特为这类事实感到不安。在他们的新书《移动：如何夺回我们的街道、改变我们的生活》中，他们呼吁重新思考我们的街道及其在生活中的作用。\n\n城市街道上的生活几十年前就开始改变。整个街区被拆毁，为新道路网让路，孩子们只好到别处玩耍。一些社区奋起反抗。最著名的是，一位 20 世纪 50 年代初举家搬到曼哈顿的加拿大记者，发起了一场阻止拆除当地公园的运动。简·雅各布斯描述了自己得知公园将被一条高速公路取代时的惊恐，并呼吁市长捍卫“纽约作为一个宜居之地，而不只是一个匆匆穿过的地方”。20 世纪 60 年代末和 70 年代，澳大利亚也出现了类似的运动。\n\n尽管这些运动很广泛，但现实是，大多数西方城市已完全按照汽车的需求被重新设计。道路上的汽车数量迅速增长。在澳大利亚，我们现在有两千多万辆汽车，而人口刚过两千六百万，汽车拥有率位居世界前列。\n\n我们在让我们快速通行的道路上投入巨大，却没有计算真正的代价。当孩子们无法在我们的社区里安全活动时，我们是否真的认识到这对社会意味着什么？《移动》的作者说得对：是时候换个角度思考你家门外那条街了。"},"634":{"q":"关于 20 世纪 60 年代末和 70 年代澳大利亚的运动，可以推断出什么？","o":["它们提高了汽车销量。","它们基本没有奏效。","它们赢得了政府支持。","它们主张修建新公园。"],"p":"尽管近年来我们的街道在安全方面可能已有所改善，但交通研究也显示，行人的出行能力在下降，尤其是幼儿。许多家长说路上车太多，孩子无法安全步行上学，于是干脆把他们塞进车里。\n\n荷兰作家塔莉娅·韦尔卡德和马可·特·布雷梅尔斯特罗特为这类事实感到不安。在他们的新书《移动：如何夺回我们的街道、改变我们的生活》中，他们呼吁重新思考我们的街道及其在生活中的作用。\n\n城市街道上的生活几十年前就开始改变。整个街区被拆毁，为新道路网让路，孩子们只好到别处玩耍。一些社区奋起反抗。最著名的是，一位 20 世纪 50 年代初举家搬到曼哈顿的加拿大记者，发起了一场阻止拆除当地公园的运动。简·雅各布斯描述了自己得知公园将被一条高速公路取代时的惊恐，并呼吁市长捍卫“纽约作为一个宜居之地，而不只是一个匆匆穿过的地方”。20 世纪 60 年代末和 70 年代，澳大利亚也出现了类似的运动。\n\n尽管这些运动很广泛，但现实是，大多数西方城市已完全按照汽车的需求被重新设计。道路上的汽车数量迅速增长。在澳大利亚，我们现在有两千多万辆汽车，而人口刚过两千六百万，汽车拥有率位居世界前列。\n\n我们在让我们快速通行的道路上投入巨大，却没有计算真正的代价。当孩子们无法在我们的社区里安全活动时，我们是否真的认识到这对社会意味着什么？《移动》的作者说得对：是时候换个角度思考你家门外那条街了。"},"635":{"q":"哪个标题最适合这篇文章？","o":["为何如此匆忙？","接下来是什么？","该住在哪里？","该怪谁？"],"p":"尽管近年来我们的街道在安全方面可能已有所改善，但交通研究也显示，行人的出行能力在下降，尤其是幼儿。许多家长说路上车太多，孩子无法安全步行上学，于是干脆把他们塞进车里。\n\n荷兰作家塔莉娅·韦尔卡德和马可·特·布雷梅尔斯特罗特为这类事实感到不安。在他们的新书《移动：如何夺回我们的街道、改变我们的生活》中，他们呼吁重新思考我们的街道及其在生活中的作用。\n\n城市街道上的生活几十年前就开始改变。整个街区被拆毁，为新道路网让路，孩子们只好到别处玩耍。一些社区奋起反抗。最著名的是，一位 20 世纪 50 年代初举家搬到曼哈顿的加拿大记者，发起了一场阻止拆除当地公园的运动。简·雅各布斯描述了自己得知公园将被一条高速公路取代时的惊恐，并呼吁市长捍卫“纽约作为一个宜居之地，而不只是一个匆匆穿过的地方”。20 世纪 60 年代末和 70 年代，澳大利亚也出现了类似的运动。\n\n尽管这些运动很广泛，但现实是，大多数西方城市已完全按照汽车的需求被重新设计。道路上的汽车数量迅速增长。在澳大利亚，我们现在有两千多万辆汽车，而人口刚过两千六百万，汽车拥有率位居世界前列。\n\n我们在让我们快速通行的道路上投入巨大，却没有计算真正的代价。当孩子们无法在我们的社区里安全活动时，我们是否真的认识到这对社会意味着什么？《移动》的作者说得对：是时候换个角度思考你家门外那条街了。"},"636":{"q":"作者在第一段是如何呈现这个问题的？","o":["通过引用专家的话。","通过界定一个概念。","通过举例。","通过提供统计数据。"],"p":"微塑料已成为遍布地球的常见污染源——它们沉积在深海和喜马拉雅山上，卡在火山岩里，塞满海鸟的胃，甚至落进南极的新雪中。它们甚至正出现在人体内。\n\n如今，新研究表明，一个简单、廉价的措施也许能显著降低自来水中的微塑料水平：煮沸并过滤。在发表于《环境科学与技术快报》周三版的一项研究中，中国研究人员发现，把自来水煮沸仅五分钟——冷却后再过滤——就能去除其中至少 80% 的微塑料。\n\n关键在于，这一过程依赖水中含有足够的碳酸钙来“捕获”塑料。研究中，煮沸含 300 毫克碳酸钙的硬水，塑料含量下降近 90%；而在碳酸钙含量低于 60 毫克的样本中，煮沸只使塑料水平降低 25%。此外，该研究并未涵盖所有类型的塑料。团队只关注了三种常见类型——聚苯乙烯、聚乙烯和聚丙烯，也没有研究此前在水中发现的其他化学物质，如氯乙烯。\n\n不过，这些发现为减少微塑料暴露指明了一条可能的出路——而这项任务正变得越来越难。科学家今年早些时候发现，就连瓶装水中的微塑料也比原先以为的多 10 到 1000 倍。\n\n科学家仍在设法确定微塑料的危害程度，但他们已知的情况已引发担忧。这项新研究提示，煮沸自来水或可成为限制摄入的工具。“他们展示微塑料如何在煮沸过程中被捕获的方式很好，”未参与该研究的苏格兰格拉斯哥大学环境工程师卡罗琳·戈肖特-林赛对《新科学家》说，“我们应该考虑升级饮用水处理厂，使它们能去除微塑料。”"},"637":{"q":"什么决定了水中捕获微塑料的效果？","o":["水的硬度。","冷却时间的长短。","过滤的频率。","水中塑料的类型。"],"p":"微塑料已成为遍布地球的常见污染源——它们沉积在深海和喜马拉雅山上，卡在火山岩里，塞满海鸟的胃，甚至落进南极的新雪中。它们甚至正出现在人体内。\n\n如今，新研究表明，一个简单、廉价的措施也许能显著降低自来水中的微塑料水平：煮沸并过滤。在发表于《环境科学与技术快报》周三版的一项研究中，中国研究人员发现，把自来水煮沸仅五分钟——冷却后再过滤——就能去除其中至少 80% 的微塑料。\n\n关键在于，这一过程依赖水中含有足够的碳酸钙来“捕获”塑料。研究中，煮沸含 300 毫克碳酸钙的硬水，塑料含量下降近 90%；而在碳酸钙含量低于 60 毫克的样本中，煮沸只使塑料水平降低 25%。此外，该研究并未涵盖所有类型的塑料。团队只关注了三种常见类型——聚苯乙烯、聚乙烯和聚丙烯，也没有研究此前在水中发现的其他化学物质，如氯乙烯。\n\n不过，这些发现为减少微塑料暴露指明了一条可能的出路——而这项任务正变得越来越难。科学家今年早些时候发现，就连瓶装水中的微塑料也比原先以为的多 10 到 1000 倍。\n\n科学家仍在设法确定微塑料的危害程度，但他们已知的情况已引发担忧。这项新研究提示，煮沸自来水或可成为限制摄入的工具。“他们展示微塑料如何在煮沸过程中被捕获的方式很好，”未参与该研究的苏格兰格拉斯哥大学环境工程师卡罗琳·戈肖特-林赛对《新科学家》说，“我们应该考虑升级饮用水处理厂，使它们能去除微塑料。”"},"638":{"q":"第四段提到瓶装水，作者想说明什么？","o":["塑料回收的重要性。","微塑料问题的严重性。","过度使用纯净水的危险。","处理污水的难度。"],"p":"微塑料已成为遍布地球的常见污染源——它们沉积在深海和喜马拉雅山上，卡在火山岩里，塞满海鸟的胃，甚至落进南极的新雪中。它们甚至正出现在人体内。\n\n如今，新研究表明，一个简单、廉价的 给停车工作人员打电话。","预付停车费。","取得停车证。","自行挑选停车区。"],"p":"本月 SoFi 体育场赛事\n\nSoFi 体育场位于洛杉矶市中心，是体育迷的首选去处。它的日程表总是排满引人注目的大赛。\n\n即将举行的橄榄球赛事\n洛杉矶公羊队 vs 达拉斯牛仔队——8 月 9 日（周六）下午 4:00\n洛杉矶闪电队 vs 新奥尔良圣徒队——8 月 10 日（周日）下午 5:00\n洛杉矶闪电队 vs 洛杉矶公羊队——8 月 16 日（周六）下午 4:00\n洛杉矶公羊队 vs 休斯敦德州人队——8 月 24 日（周日）下午 1:25\n\n周边酒店\n到 SoFi 体育场看比赛时，只需步行或短途车程，就能住进几家舒适而有格调的酒店。街对面就是 Sonder Liim 酒店，提供宽敞客房和屋顶泳池；一英里外的 H Hotel Los Angeles 设计时尚，适合在两场比赛之间舒适小住；想要兼顾舒适与便利的人，开车不远即可到 Renaissance Los Angeles Airport Hotel；若愿意再多开一段路，丽思卡尔顿洛杉矶酒店有豪华客房与完善的休闲设施——正好把看球日变成一次愉快的周末出游。\n\n停车\nSoFi 体育场要求车辆严格停放在指定区域，客人必须从彩色数字停车证上标明的那个入口进入。若走错入口，会被要求掉头改道，所以要提前规划。每个停车区由多个停车场组成，以便高效疏导整个场馆区域的交通。抵达前请务必把停车证下载到手机上。进入正确区域后，停车工作人员会直接引导你就位。想和朋友停在一起的人，所有车辆必须持有同一区域的停车证并一同到达——车位不能预留。"},"648":{"q":"凯文通常怎样获知一个词的意思？","o":["使用电子设备。","查阅纸质词典。","根据上下文猜测。","向英语老师求助。"],"p":"词典里学不到的东西\n\n不久前，我上五年级的儿子凯文问我一本小说里某个词的意思。“查一下，”我答道。“可我的屏幕时间用完了，”他说。我意味深长地看向书架上至少三本词典，凯文夸张地叹了口气。“你就不能用手机吗？”他问。我忽然意识到，他根本不会用词典。\n\n我取下其中一本词典，和他一起读了几分钟，然后递给他。他试了好几次才找到那个词。翻页时，他瞪大眼睛不停地说：“怎么会有这么多词？”过了一会儿，他看着我问道：“妈妈，这些词你全都认识吗？”我笑了。“我当然不是全都认识，”我说，“但这正是它是我最喜欢的书之一的原因。”\n\n我的第一本词典是 13 岁生日的礼物。我下决心要尽可能多学单词，于是开始用铅笔标记每一个查过的词条，以此衡量自己的进步。这样的铅笔标记我做了好几年；上大学时，我把那本词典装进了行李箱。\n\n凯文想看看那本词典。我心里微微一痛——那本词典在我大一下学期末被偷了。“太可惜了，”他说，“可就算没有那本书，那些词你还是都认识。”我意识到他说得对。没有那本书，我照样读完了大学后三年。而且归根到底，把我送到那里的并不是那本词典——并非真的如此。\n\n现在我明白了：虽然儿子学习的方式可能不同，但他仍然在学习。重要的不是词汇本身，也不是我们怎样学，而是那种“想知道”的渴望，是好奇心与求知欲。"},"649":{"q":"查词典时凯文的感受如何？","o":["恼火。","失望。","受到鼓舞。","十分惊讶。"],"p":"词典里学不到的东西\n\n不久前，我上五年级的儿子凯文问我一本小说里某个词的意思。“查一下，”我答道。“可我的屏幕时间用完了，”他说。我意味深长地看向书架上至少三本词典，凯文夸张地叹了口气。“你就不能用手机吗？”他问。我忽然意识到，他根本不会用词典。\n\n我取下其中一本词典，和他一起读了几分钟，然后递给他。他试了好几次才找到那个词。翻页时，他瞪大眼睛不停地说：“怎么会有这么多词？”过了一会儿，他看着我问道：“妈妈，这些词你全都认识吗？”我笑了。“我当然不是全都认识，”我说，“但这正是它是我最喜欢的书之一的原因。”\n\n我的第一本词典是 13 岁生日的礼物。我下决心要尽可能多学单词，于是开始用铅笔标记每一个查过的词条，以此衡量自己的进步。这样的铅笔标记我做了好几年；上大学时，我把那本词典装进了行李箱。\n\n凯文想看看那本词典。我心里微微一痛——那本词典在我大一下学期末被偷了。“太可惜了，”他说，“可就算没有那本书，那些词你还是都认识。”我意识到他说得对。没有那本书，我照样读完了大学后三年。而且归根到底，把我送到那里的并不是那本词典——并非真的如此。\n\n现在我明白了：虽然儿子学习的方式可能不同，但他仍然在学习。重要的不是词汇本身，也不是我们怎样学，而是那种“想知道”的渴望，是好奇心与求知欲。"},"650":{"q":"关于作者的第一本词典，我们能得知什么？","o":["它帮她读完了大学。","它被当作礼物送给了凯文。","它见证了她的努力。","它是珍贵的限量版。"],"p":"词典里学不到的东西\n\n不久前，我上五年级的儿子凯文问我一本小说里某个词的意思。“查一下，”我答道。“可我的屏幕时间用完了，”他说。我意味深长地看向书架上至少三本词典，凯文夸张地叹了口气。“你就不能用手机吗？”他问。我忽然意识到，他根本不会用词典。\n\n我取下其中一本词典，和他一起读了几分钟，然后递给他。他试了好几次才找到那个词。翻页时，他瞪大眼睛不停地说：“怎么会有这么多词？”过了一会儿，他看着我问道：“妈妈，这些词你全都认识吗？”我笑了。“我当然不是全都认识，”我说，“但这正是它是我最喜欢的书之一的原因。”\n\n我的第一本词典是 13 岁生日的礼物。我下决心要尽可能多学单词，于是开始用铅笔标记每一个查过的词条，以此衡量自己的进步。这样的铅笔标记我做了好几年；上大学时，我把那本词典装进了行李箱。\n\n凯文想看看那本词典。我心里微微一痛——那本词典在我大一下学期末被偷了。“太可惜了，”他说，“可就算没有那本书，那些词你还是都认识。”我意识到他说得对。没有那本书，我照样读完了大学后三年。而且归根到底，把我送到那里的并不是那本词典——并非真的如此。\n\n现在我明白了：虽然儿子学习的方式可能不同，但他仍然在学习。重要的不是词汇本身，也不是我们怎样学，而是那种“想知道”的渴望，是好奇心与求知欲。"},"651":{"q":"关于学习，作者逐渐认识到什么？","o":["开始永远不晚。","动机才是真正重要的。","孩子需要榜样。","词典仍是好用的工具。"],"p":"词典里学不到的东西\n\n不久前，我上五年级的儿子凯文问我一本小说里某个词的意思。“查一下，”我答道。“可我的屏幕时间用完了，”他说。我意味深长地看向书架上至少三本词典，凯文夸张地叹了口气。“你就不能用手机吗？”他问。我忽然意识到，他根本不会用词典。\n\n我取下其中一本词典，和他一起读了几分钟，然后递给他。他试了好几次才找到那个词。翻页时，他瞪大眼睛不停地说：“怎么会有这么多词？”过了一会儿，他看着我问道：“妈妈，这些词你全都认识吗？”我笑了。“我当然不是全都认识，”我说，“但这正是它是我最喜欢的书之一的原因。”\n\n我的第一本词典是 13 岁生日的礼物。我下决心要尽可能多学单词，于是开始用铅笔标记每一个查过的词条，以此衡量自己的进步。这样的铅笔标记我做了好几年；上大学时，我把那本词典装进了行李箱。\n\n凯文想看看那本词典。我心里微微一痛——那本词典在我大一下学期末被偷了。“太可惜了，”他说，“可就算没有那本书，那些词你还是都认识。”我意识到他说得对。没有那本书，我照样读完了大学后三年。而且归根到底，把我送到那里的并不是那本词典——并非真的如此。\n\n现在我明白了：虽然儿子学习的方式可能不同，但他仍然在学习。重要的不是词汇本身，也不是我们怎样学，而是那种“想知道”的渴望，是好奇心与求知欲。"},"652":{"q":"这项新研究对橡树和枫香暗示了什么？","o":["它们影响其他树木的生长。","它们吸收的碳少于预期。","它们间接危害人的健康。","它们缓慢提高当地气温。"],"p":"纽约植树的一笔暗账\n\n为落实长期以来扩大绿地的举措，纽约市每年种下数万棵树。树木能提供荫凉、降低地表温度、吸收数量惊人的空气中碳、清除微小污染物、为野生动物提供栖息地，还带来纯粹的美感。\n\n不过，一项新研究显示，事情也可能出问题。目前占该市树木大多数的橡树和枫香，会释放大量名为异戊二烯的化学物质。异戊二烯本身无害，却会与车辆、建筑和工业排放的氮氧化物迅速反应，生成近地面臭氧——而这是许多呼吸问题的重要诱因。\n\n这项由哥伦比亚气候学院及其他机构科学家开展的研究发现，如果纽约在新植树时沿用过去的树种比例，未来几十年曼哈顿的异戊二烯释放量将上升约 140%，由此导致的夏季臭氧水平升幅可达 30%。\n\n“我们完全支持多植树，它们带来那么多好处，”研究合著者罗伊辛·康曼说，“但如果不加小心，我们可能让空气质量变得更糟。”\n\n公园管理局并非不知道这个问题。几年前该局一些研究人员所做的一项研究就得出结论：城市树木确实会释放异戊二烯。“我们没有把这件事大做文章，”公园管理局高级科学家诺文·奥扬说。她表示，不应把树木当成敌人。“只要能重新思考我们以汽车为中心的生活方式，我们想种什么树都可以，”她说。\n\n“我们不会去砍掉任何高大的老橡树，”奥扬说，该局也不会完全停止栽种新橡树，“你得想想那样做会失去什么。”她指出，橡树是“基石物种”，为本地昆虫、鸟类和其他动物提供食物与栖息地。"},"653":{"q":"基于他们的研究， ，“你得想想那样做会失去什么。”她指出，橡树是“基石物种”，为本地昆虫、鸟类和其他动物提供食物与栖息地。"},"656":{"q":"审美组被要求对陶艺作品做什么？","o":["画出它们的轮廓。","给每件作品打分。","比较它们的价格。","复制每件作品。"],"p":"欣赏美如何让思维变抽象\n\n剑桥大学的一个心理学家团队做了一项实验，比较“仅仅观看艺术”与“主动评判它有多美”两种情形带来的认知效果。\n\n研究中，187 人受邀在手工陶艺展期间参观凯特尔庭院美术馆。参与者被随机分成两组：“审美”组被要求认真品味并给每件作品的美感打分，对照组只需把作品的线描图与实物配对。随后，所有参与者都接受了测试，考察他们处理信息的方式——偏实用还是偏抽象。\n\n就全体参与者而言，审美组在抽象思维上的平均得分比对照组高近 14%。参与者被告知研究关乎认知过程，同时被问及兴趣爱好，约一半人说自己有艺术方面的爱好。在这部分人中，效应更强：有艺术爱好的审美组成员，抽象思维平均得分比对照组中有同样爱好的人高出 25% 以上。\n\n研究还通过询问参与者在完成美术馆任务时的感受，测量了他们的情绪状态。就全体参与者而言，审美组报告的“具有转化性与自我超越性的感受”——如被打动、受启发、被激励——平均比对照组高 23%。但重要的是，审美组并未报告比对照组更快乐，这说明影响抽象思维的是对美的投入，而不是这段经历带来的整体愉悦感。\n\n“我们在屏幕上做事时，通常想得很具体，”该研究资深作者西蒙娜·施纳尔说，“放空走神、让思绪漫游的机会越来越少了，而正是在那时，我们会以拓展心智的方式思考。欣赏艺术之美，也许是启动抽象认知过程的理想途径。”"},"657":{"q":"测试中哪组参与者的平均得分最高？","o":["有艺术爱好的审美组。","无艺术爱好的审美组。","有艺术爱好的对照组。","无艺术爱好的对照组。"],"p":"欣赏美如何让思维变抽象\n\n剑桥大学的一个心理学家团队做了一项实验，比较“仅仅观看艺术”与“主动评判它有多美”两种情形带来的认知效果。\n\n研究中，187 人受邀在手工陶艺展期间参观凯特尔庭院美术馆。参与者被随机分成两组：“审美”组被要求认真品味并给每件作品的美感打分，对照组只需把作品的线描图与实物配对。随后，所有参与者都接受了测试，考察他们处理信息的方式——偏实用还是偏抽象。\n\n就全体参与者而言，审美组在抽象思维上的平均得分比对照组高近 14%。参与者被告知研究关乎认知过程，同时被问及兴趣爱好，约一半人说自己有艺术方面的爱好。在这部分人中，效应更强：有艺术爱好的审美组成员，抽象思维平均得分比对照组中有同样爱好的人高出 25% 以上。\n\n研究还通过询问参与者在完成美术馆任务时的感受，测量了他们的情绪状态。就全体参与者而言，审美组报告的“具有转化性与自我超越性的感受”——如被打动、受启发、被激励——平均比对照组高 23%。但重要的是，审美组并未报告比对照组更快乐，这说明影响抽象思维的是对美的投入，而不是这段经历带来的整体愉悦感。\n\n“我们在屏幕上做事时，通常想得很具体，”该研究资深作者西蒙娜·施纳尔说，“放空走神、让思绪漫游的机会越来越少了，而正是在那时，我们会以拓展心智的方式思考。欣赏艺术之美，也许是启动抽象认知过程的理想途径。”"},"658":{"q":"为什么要测量参与者的情绪状态？","o":["了解他们对艺术的态度。","识别他们具体的思维模式。","检验任务的难度。","确定测试结果背后的因素。"],"p":"欣赏美如何让思维变抽象\n\n剑桥大学的一个心理学家团队做了一项实验，比较“仅仅观看艺术”与“主动评判它有多美”两种情形带来的认知效果。\n\n研究中，187 人受邀在手工陶艺展期间参观凯特尔庭院美术馆。参与者被随机分成两组：“审美”组被要求认真品味并给每件作品的美感打分，对照组只需把作品的线描图与实物配对。随后，所有参与者都接受了测试，考察他们处理信息的方式——偏实用还是偏抽象。\n\n就全体参与者而言，审美组在抽象思维上的平均得分比对照组高近 14%。参与者被告知研究关乎认知过程，同时被问及兴趣爱好，约一半人说自己有艺术方面的爱好。在这部分人中，效应更强：有艺术爱好的审美组成员，抽象思维平均得分比对照组中有同样爱好的人高出 25% 以上。\n\n研究还通过询问参与者在完成美术馆任务时的感受，测量了他们的情绪状态。就全体参与者而言，审美组报告的“具有转化性与自我超越性的感受”——如被打动、受启发、被激励——平均比对照组高 23%。但重要的是，审美组并未报告比对照组更快乐，这说明影响抽象思维的是对美的投入，而不是这段经历带来的整体愉悦感。\n\n“我们在屏幕上做事时，通常想得很具体，”该研究资 栋由这位著名建筑师设计的住宅明亮而通透的客厅里说道。\n\n赖斯利住了 73 年的这所房子位于纽约州韦斯特切斯特县的林间，距曼哈顿以北仅 30 英里。它是组成宁静的 20 世纪中叶现代风格村落乌索尼亚（Usonia）的 47 座住宅之一。\n\n1951 年，赖斯利年仅 26 岁，新婚不久，正准备扎根安家。他和妻子开始在曼哈顿找房子。但他们喜欢的，以他音响工程师的薪水买不起；买得起的，他们又不喜欢。后来他们听说了乌索尼亚。第一次前往时，已在那里安家的 10 户人家热情相迎，他们于是决定加入。\n\n这所房子带有赖特的标志性特征：用当地材料建造，平屋顶，木质护墙板，混凝土地面，还有定制家具。几十年来，赖斯利一直向访客敞开家门。这所房子如今已被列入《国家史迹名录》。赖斯利说，他尽力做一个好“管家”，不仅守护自己居住的这件赖特作品，也守护所有其他作品。他与他人共同创立了弗兰克·劳埃德·赖特建筑保护组织，该组织致力于保护赖特留存下来的所有建筑。赖斯利相信，正是对这座房子和这个社区的热爱，让他这些年来一直如此健康。"},"670":{"q":"关于赖斯利的房子，我们能了解到什么？","o":["它比主人更老。","它使用当地材料。","它有尖屋顶。","它正在出售。"],"p":"罗兰·赖斯利今年五月满 101 岁，身体好得出奇。但这并不是他引以为豪的事。“我是弗兰克·劳埃德·赖特最后一位原始客户，至今仍住在他为我设计的房子里，”赖斯利坐在那栋由这位著名建筑师设计的住宅明亮而通透的客厅里说道。\n\n赖斯利住了 73 年的这所房子位于纽约州韦斯特切斯特县的林间，距曼哈顿以北仅 30 英里。它是组成宁静的 20 世纪中叶现代风格村落乌索尼亚（Usonia）的 47 座住宅之一。\n\n1951 年，赖斯利年仅 26 岁，新婚不久，正准备扎根安家。他和妻子开始在曼哈顿找房子。但他们喜欢的，以他音响工程师的薪水买不起；买得起的，他们又不喜欢。后来他们听说了乌索尼亚。第一次前往时，已在那里安家的 10 户人家热情相迎，他们于是决定加入。\n\n这所房子带有赖特的标志性特征：用当地材料建造，平屋顶，木质护墙板，混凝土地面，还有定制家具。几十年来，赖斯利一直向访客敞开家门。这所房子如今已被列入《国家史迹名录》。赖斯利说，他尽力做一个好“管家”，不仅守护自己居住的这件赖特作品，也守护所有其他作品。他与他人共同创立了弗兰克·劳埃德·赖特建筑保护组织，该组织致力于保护赖特留存下来的所有建筑。赖斯利相信，正是对这座房子和这个社区的热爱，让他这些年来一直如此健康。"},"671":{"q":"从最后一段可以推断出关于赖斯利的什么信息？","o":["他对赖特的建筑怀有深厚感情。","他致力于健康教育。","他是家居装饰方面的专家。","他热衷于旅游。"],"p":"罗兰·赖斯利今年五月满 101 岁，身体好得出奇。但这并不是他引以为豪的事。“我是弗兰克·劳埃德·赖特最后一位原始客户，至今仍住在他为我设计的房子里，”赖斯利坐在那栋由这位著名建筑师设计的住宅明亮而通透的客厅里说道。\n\n赖斯利住了 73 年的这所房子位于纽约州韦斯特切斯特县的林间，距曼哈顿以北仅 30 英里。它是组成宁静的 20 世纪中叶现代风格村落乌索尼亚（Usonia）的 47 座住宅之一。\n\n1951 年，赖斯利年仅 26 岁，新婚不久，正准备扎根安家。他和妻子开始在曼哈顿找房子。但他们喜欢的，以他音响工程师的薪水买不起；买得起的，他们又不喜欢。后来他们听说了乌索尼亚。第一次前往时，已在那里安家的 10 户人家热情相迎，他们于是决定加入。\n\n这所房子带有赖特的标志性特征：用当地材料建造，平屋顶，木质护墙板，混凝土地面，还有定制家具。几十年来，赖斯利一直向访客敞开家门。这所房子如今已被列入《国家史迹名录》。赖斯利说，他尽力做一个好“管家”，不仅守护自己居住的这件赖特作品，也守护所有其他作品。他与他人共同创立了弗兰克·劳埃德·赖特建筑保护组织，该组织致力于保护赖特留存下来的所有建筑。赖斯利相信，正是对这座房子和这个社区的热爱，让他这些年来一直如此健康。"},"672":{"q":"作者在文章开头指出了什么？","o":["有些山正在变高。","可穿戴设备上的数据具有误导性。","高度是一个相对的概念。","参照点很难确定。"],"p":"珠穆朗玛峰峰顶，海拔 8849 米。钦博拉索山，6263 米；勃朗峰，4806 米；多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278 米。标注某地的高度是普遍做法。如今，简单的读数在手机和可穿戴设备上唾手可得。但高度必然是相对的；只有选定一个参照点，我们才能用数字表示一个物体或一个地点的高度。\n\n以海平面作为高度参照点的观念，至今已存在如此之久，以至于几乎无人留意——我们随口提到它，甚至不去想它意味着什么。这个概念有其历史，这一点很容易被忽视。我们往往忘记，海平面是技术与文化共同决定的假设的产物。在这本书里，我讲述的就是这些假设的故事。\n\n这本书恰如其分地成形于一个在山海之间度过的夏天。在游览法国里维埃拉、享受尼斯和芒通沙滩的一个月后，我和朋友们去帕拉山群徒步。在普拉迪达利小屋附近的一处山口休息时，我们开始讨论各自测高仪上的读数。为什么它们从一个仪器到另一个仪器会有极其细微的差异？这种不确定感让我开始思考“零”的含义。我就这样开始追寻海平面的概念史。\n\n在这本书中，我考察了平均海平面历史上的三个关键阶段。这些阶段映照出人类海洋观念的发展。自 2011 年 8 月我开始思考这个课题以来，海平面上升问题以及把它放在历史中看待的必要性只变得更加紧迫；从那时到 2022 年底，全球海平面上升了近 5 厘米，约为 1993 年以来卫星记录的总上升幅度的一半。"},"673":{"q":"第三段主要讲什么？","o":["测高仪是如何发明的。","是什么开启了作者的研究。","为什么数字读数会变化。","作者在哪里度假。"],"p":"珠穆朗玛峰峰顶，海拔 8849 米。钦博拉索山，6263 米；勃朗峰，4806 米；多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278 米。标注某地的高度是普遍做法。如今，简单的读数在手机和可穿戴设备上唾手可得。但高度必然是相对的；只有选定一个参照点，我们才能用数字表示一个物体或一个地点的高度。\n\n以海平面作为高度参照点的观念，至今已存在如此之久，以至于几乎无人留意——我们随口提到它，甚至不去想它意味着什么。这个概念有其历史，这一点很容易被忽视。我们往往忘记，海平面是技术与文化共同决定的假设的产物。在这本书里，我讲述的就是这些假设的故事。\n\n这本书恰如其分地成形于一个在山海之间度过的夏天。在游览法国里维埃拉、享受尼斯和芒通沙滩的一个月后，我和朋友们去帕拉山群徒步。在普拉迪达利小屋附近的一处山口休息时，我们开始讨论各自测高仪上的读数。为什么它们从一个仪器到另一个仪器会有极其细微的差异？这种不确定感让我开始思考“零”的含义。我就这样开始追寻海平面的概念史。\n\n在这本书中，我考察了平均海平面历史上的三个关键阶段。这些阶段映照出人类海洋观念的发展。自 2011 年 8 月我开始思考这个课题以来，海平面上升问题以及把它放在历史中看待的必要性只变得更加紧迫；从那时到 2022 年底，全球海平面上升了近 5 厘米，约为 1993 年以来卫星记录的总上升幅度的一半。"},"674":{"q":"最后一段中画线单词 it 指代什么？","o":["这本书。","这个课题。","这个问题。","这一发展。"],"p":"珠穆朗玛峰峰顶，海拔 8849 米。钦博拉索山，6263 米；勃朗峰，4806 米；多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278 米。标注某地的高度是普遍做法。如今，简单的读数在手机和可穿戴设备上唾手可得。但高度必然是相对的；只有选定一个参照点，我们才能用数字表示一个物体或一个地点的高度。\n\n以海平面作为高度参照点的观念，至今已存在如此之久，以至于几乎无人留意——我们随口提到它，甚至不去想它意味着什么。这个概念有其历史，这一点很容易被忽视。我们往往忘记，海平面是技术与文化共同决定的假设的产物。在这本书里，我讲述的就是这些假设的故事。\n\n这本书恰如其分地成形于一个在山海之间度过的夏天。在游览法国里维埃拉、享受尼斯和芒通沙滩的一个月后，我和朋友们去帕拉山群徒步。在普拉迪达利小屋附近的一处山口休息时，我们开始讨论各自测高仪上的读数。为什么它们从一个仪器到另一个仪器会有极其细微的差异？这种不确定感让我开始思考“零”的含义。我就这样开始追寻海平面的概念史。\n\n在这本书中，我考察了平均海平面历史上的三个关键阶段。这些阶段映照出人类海洋观念的发展。自 2011 年 8 月我开始思考这个课题以来，海平面上升问题以及把它放在历史中看待的必要性只变得更加紧迫；从那时到 2022 年底，全球海平面上升了近 5 厘米，约为 1993 年以来卫星记录的总上升幅度的一半。"},"675":{"q":"文中提到的那本书可以取什么书名？","o":["《测高仪：必备之物》","《海平面：一部历史》","《零的含义：虚无还是一切》","《从山到海：起起落落》"],"p":"珠穆朗玛峰峰顶，海拔 8849 米。钦博拉索山，6263 米；勃朗峰，4806 米；多洛米蒂山脉帕拉山群脚下的普拉迪达利小屋，2278 米。标注某地的高度是普遍做法。如今，简单的读数在手机和可穿戴设备上唾手可得。但高度必然是相对的；只有选定一个参照点，我们才能用数字表示一个物体
