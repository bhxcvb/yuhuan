function dateStr(d){ d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var pendingOk = null;
function askConfirm(title, text, okLabel, cb){
  pendingOk = cb;
  $("stitle").textContent = title;
  $("stext").textContent = text;
  $("sok").textContent = okLabel || "确定";
  $("sheet").className = "sheet on";
}
function closeSheet(){ $("sheet").className = "sheet"; pendingOk = null; }
function toast(m){
  var t=$("toast"); t.textContent=m; t.className="toast on";
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className="toast"; },1800);
}

function initStore(){
  return { q:{}, cat:{}, wrong:[], settings:{ daily:5, examDate:"", theme:"dark" }, log:{}, diag:false };
}
function loadStore(){
  var raw=null;
  try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ S=JSON.parse(raw); }catch(e){ S=null; } }
  if(!S || !S.q) S=initStore();
  if(!S.settings) S.settings={ daily:5, examDate:"", theme:"dark" };
  if(S.settings.theme!=="light" && S.settings.theme!=="dark") S.settings.theme="dark";
  if(typeof S.settings.daily!=="number") S.settings.daily=5;
  if(typeof S.settings.examDate!=="string") S.settings.examDate="";
  if(!S.cat) S.cat={};
  if(!S.wrong) S.wrong=[];
  if(!S.log) S.log={};
  CATS.forEach(function(c){ if(!S.cat[c]) S.cat[c]={n:0,right:0}; });
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("保存失败"); } }

function catStats(c){
  var o=S.cat[c]||{n:0,right:0};
  return { n:o.n, right:o.right, pct: o.n ? Math.round(o.right/o.n*100) : -1 };
}
function weakCat(){
  var best=null, bestPct=101;
  CATS.forEach(function(c){
    var s=catStats(c);
    if(s.n===0) return;
    if(s.pct<bestPct){ bestPct=s.pct; best=c; }
  });
  if(best) return best;
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    if(c.indexOf("真题")!==0 && c!=="短文改错") return c;
  }
  return CATS[0];
}
function examStats(){ var n=0,r=0,total=0; QS.forEach(function(q,i){ if(!q[5] || !/^20\d\d/.test(q[5])) return; total++; var x=S.q[i]; if(x){ n+=x.n; r+=x.right; } }); return {total:total, tried:n, right:r, pct:n?Math.round(r/n*100):-1}; }
function totalQ(){ var n=0; Object.keys(S.q).forEach(function(k){ n+=S.q[k].n||0; }); return n; }
function totalRight(){ var n=0; Object.keys(S.q).forEach(function(k){ n+=S.q[k].right||0; }); return n; }
function weekStats(offset){
  var n=0,r=0;
  for(var i=0;i<7;i++){
    var d=new Date(Date.now()-(offset*7+i)*DAY);
    var l=S.log[dateStr(d)]||{n:0,r:0};
    n+=l.n||0; r+=l.r||0;
  }
  return { n:n, right:r, pct: n?Math.round(r/n*100):-1 };
}
function dailyStats(days){
  var out=[];
  for(var i=days-1;i>=0;i--){
    var d=new Date(Date.now()-i*DAY); var k=dateStr(d);
    var l=S.log[k]||{n:0,r:0};
    out.push({ d:k.slice(5), n:l.n||0, r:l.r||0, pct: l.n ? Math.round((l.r||0)/l.n*100) : -1 });
  }
  return out;
}
function streak(){
  function has(k){ var l=S.log[k]; return !!(l && l.n); }
  var d=new Date();
  if(!has(dateStr(d))){ d.setDate(d.getDate()-1); }
  var n=0;
  while(has(dateStr(d)) && n<5000){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function daysLeft(){
  if(!S.settings.examDate) return null;
  var t=new Date(S.settings.examDate+"T00:00:00"); var n=new Date(); n.setHours(0,0,0,0);
  var d=Math.round((t-n)/DAY); return d>=0?d:null;
}
function todayCount(){ var l=S.log[dateStr()]; return l?l.n:0; }

function papers(){ var m={}; QS.forEach(function(q,i){ var s=q[5]; if(!s || !/^20\d\d/.test(s)) return; (m[s]=m[s]||[]).push(i); }); return m; }
function paperStats(src){ var ids=papers()[src]||[]; var n=0,r=0; ids.forEach(function(i){ var x=S.q[i]; if(x){ n+=x.n; r+=x.right; } }); return {n:ids.length, tried:n, right:r, pct:n?Math.round(r/n*100):-1}; }
function srcOf(qid){ return (QS[qid] && QS[qid][5]) ? QS[qid][5] : "仿真题"; }
function translationFor(qid){ return TR[qid] || null; }
function passageOf(qid){ return (QS[qid] && QS[qid][6]) ? QS[qid][6] : ""; }
function qText(t){
  return esc(t).replace(/_{3,}/g,"<u>____</u>");
}
function record(qid, ok){
  var qc = S.q[qid] || (S.q[qid]={n:0,right:0});
  qc.n++; if(ok) qc.right++;
  var cat = QS[qid][0];
  var cc = S.cat[cat] || (S.cat[cat]={n:0,right:0});
  cc.n++; if(ok) cc.right++;
  var day = dateStr();
  var lg = S.log[day] || (S.log[day]={n:0,r:0,w:[]});
  lg.n++; if(ok) lg.r = (lg.r||0)+1;
  if(!ok){ if(!lg.w) lg.w=[]; if(lg.w.indexOf(qid)<0) lg.w.push(qid); }
  if(!ok && S.wrong.indexOf(qid)<0) S.wrong.push(qid);
  if(ok){
    var w = S.wrong.indexOf(qid);
    if(w>=0 && qc.right>=2) S.wrong.splice(w,1);
  }
  save();
}

/* ---------- 组题 ---------- */
function byCat(c){ var a=[]; QS.forEach(function(q,i){ if(q[0]===c) a.push(i); }); return a; }
function startDaily(){
  var weak = weakCat();
  var pool = byCat(weak).concat(shuffle(wrongPool()), allIds());
  var picked = [], seen = {};
  pool.forEach(function(i){ if(picked.length>=S.settings.daily) return; if(seen[i]) return; seen[i]=1; picked.push(i); });
  begin("daily", picked, weak);
}
function wrongPool(){ return S.wrong.slice(); }
function allIds(){ var a=[]; QS.forEach(function(q,i){ a.push(i); }); return a; }
function startCat(c){
  var ids = shuffle(byCat(c));
  if(!ids.length){ toast("这个模块还没有题目"); return; }
  begin("cat", ids.slice(0, 8), c);
}
function startWrong(){
  if(!S.wrong.length){ toast("错题本是空的"); return; }
  begin("wrong", shuffle(S.wrong.slice()).slice(0,10), null);
}
function weakScore(c){
  var s=catStats(c);
  return s.n ? s.pct : 60;      /* 没测过的模块按中等偏下处理 */
}
function pickWeak(n){
  var ranked = CATS.filter(function(c){ return c.indexOf("真题")!==0; })
    .map(function(c){ return { c:c, p:weakScore(c) }; })
    .sort(function(a,b){ return a.p - b.p; });
  var cats = ranked.slice(0,3).map(function(x){ return x.c; });
  var pool = [];
  cats.forEach(function(c){
    byCat(c).forEach(function(i){ var q=S.q[i]; if(!q || (q.right||0) < 2) pool.push(i); });
  });
  var uniq = [];
  pool.forEach(function(i){ if(uniq.indexOf(i)<0) uniq.push(i); });
  if(uniq.length < n){
    allIds().forEach(function(i){ if(uniq.length < n && uniq.indexOf(i)<0) uniq.push(i); });
  }
  return shuffle(uniq).slice(0, n);
}
var tick = null;
function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }
function startTick(){
  stopTick();
  tick = setInterval(function(){
    if(phase !== "quiz" || !ses || ses.mode !== "timed"){ stopTick(); return; }
    ses.timer--;
    var m = Math.floor(ses.timer/60), sec = ses.timer % 60;
    var el2 = $("right");
    if(el2) el2.textContent = m + ":" + (sec<10?"0":"") + sec;
    if(ses.timer <= 0){ stopTick(); ses.timer = 0; phase = "result"; render(); }
  }, 1000);
}
function startTimedReading(){
  var groups = {};
  QS.forEach(function(q,i){
    if(q[0] !== "真题·阅读" || !q[6]) return;
    var k = (q[5]||"") + "|" + q[6].slice(0,40);
    (groups[k] = groups[k] || []).push(i);
  });
  var keys = Object.keys(groups).filter(function(k){ return groups[k].length >= 3; });
  if(!keys.length){ toast("还没有可用的阅读题"); return; }
  var k = keys[Math.floor(Math.random()*keys.length)];
  begin("timed", shuffle(groups[k].slice()), null);
  ses.timer = 360; ses.t0 = Date.now();
  startTick();
}
function startWeak(){ begin("weak", pickWeak(10), null); }
function pickMock(n){
  var ids = QS.map(function(q,i){ if(!q[5] || !/^20\d\d/.test(q[5])) return -1; var x=S.q[i]; return (x && x.n) ? -1 : i; })
              .filter(function(i){ return i>=0; });
  if(ids.length < n){
    ids = ids.concat(QS.map(function(q,i){ return (q[5] && /^20\d\d/.test(q[5])) ? i : -1; }).filter(function(i){ return i>=0; }));
  }
  var uniq=[]; ids.forEach(function(i){ if(uniq.indexOf(i)<0) uniq.push(i); });
  return shuffle(uniq).slice(0, n);
}
function startMock(){
  var ids = pickMock(20);
  if(ids.length < 5){ toast("还没有足够的真题"); return; }
  begin("mock", ids, null);
  ses.t0 = Date.now();
}
function startTodayWrong(){
  var w = todayWrong();
  if(!w.length){ toast("今天没有错题"); return; }
  begin("todayWrong", w, null);
}
function todayWrong(){
  var l = S.log[dateStr()];
  return (l && l.w) ? l.w.slice() : [];
}
function startDiag(){
  var picked=[];
  var cats = CATS.filter(function(c){ return c.indexOf("真题") !== 0; });
  var per = Math.ceil(20/cats.length);
  cats.forEach(function(c){ var ids=shuffle(byCat(c)); picked=picked.concat(ids.slice(0, per)); });
  picked = shuffle(picked).slice(0, 20);
  begin("diag", picked, null);
}
function begin(mode, list, cat){
  ses = { mode:mode, cat:cat, list:list, i:0, right:0, wrongIds:[], picked:null };
  nav("quiz");
}

/* ---------- 渲染 ---------- */
function setTrack(p){ $("track").style.width = Math.max(0,Math.min(100,Math.round(p*100)))+"%"; }
function nav(p){
  if(p === phase){ render(); return; }
  try { history.pushState({ phase: phase }, ""); } catch(e){}
  phase = p;
  render();
}
function navHTML(){
  var tabs=[["today","🏠","今日"],["cat","🎯","专项"],["outline","📚","总览"],["mine","👤","我的"]];
  return tabs.map(function(t){
    return '<button data-act="tab" data-tab="'+t[0]+'" class="'+(phase===t[0]+""?"on":"")+'"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
  }).join("");
}
function trHTML(qid){
  var t = translationFor(qid);
  if(!t) return "";
  var h = '<div class="trbox"><div class="trh">译文</div>';
  if(t.q) h += '<div class="trq"><b>题目：</b>' + esc(t.q) + '</div>';
  if(t.o && t.o.length){
    h += t.o.map(function(x,i){ return '<div class="tro"><b>' + "ABCDEFG".charAt(i) + '.</b> ' + esc(x) + '</div>'; }).join("");
  }
  if(t.p) h += '<details style="margin-top:8px"><summary style="font-size:12.5px;color:var(--acc);cursor:pointer;list-style:none">📄 原文译文</summary><div class="ptext">' + esc(t.p) + '</div></details>';
  return h + '</div>';
}
function wrongBookHTML(){
  var ws = S.wrong.slice();
  if(!ws.length) return '<div class="hint">还没有错题。做错会自动收进来，答对两次移出。</div>';
  var f = ui.wf || { y:"", c:"" };
  var years = {}, cats = {};
  ws.forEach(function(i){
    var s5 = QS[i][5] || "";
    if(/^20\d\d/.test(s5)) years[s5.slice(0,4)] = 1;
    cats[QS[i][0]] = 1;
  });
  var ylist = Object.keys(years).sort().reverse();
  var clist = Object.keys(cats).sort();
  if(f.y) ws = ws.filter(function(i){ return (QS[i][5]||"").slice(0,4) === f.y; });
  if(f.c) ws = ws.filter(function(i){ return QS[i][0] === f.c; });
  var chips = '<div class="chips">' +
    '<button class="chip' + (!f.y && !f.c ? " on" : "") + '" data-act="wfilter" data-y="" data-c="">全部</button>' +
    ylist.map(function(y){ return '<button class="chip' + (f.y===y&&!f.c?" on":"") + '" data-act="wfilter" data-y="' + y + '" data-c="">' + y + '</button>'; }).join("") +
    clist.map(function(c){ return '<button class="chip' + (f.c===c?" on":"") + '" data-act="wfilter" data-y="" data-c="' + esc(c) + '">' + esc(c.replace("真题·","")) + '</button>'; }).join("") +
    '</div>';
  var rows = ws.slice(0, 20).map(function(i){
    return '<div class="item" data-act="detailQ" data-q="' + i + '"><div style="flex:1;min-width:0">' +
      '<div style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(QS[i][1]) + '</div>' +
      '<div class="hint">' + esc(QS[i][5]||"仿真") + (NOS[i] ? " · 第 " + NOS[i] + " 题" : "") + '</div></div>' +
      '<div class="st">›</div></div>';
  }).join("");
  return chips + (ws.length ? '<div class="rows">' + rows + '</div>' : '<div class="hint">这个筛选下没有错题</div>') +
    (ws.length > 20 ? '<div class="hint center">只显示前 20 条</div>' : "") +
    '<div class="btns" style="margin-top:10px"><button class="btn good" data-act="wrongFiltered">重练这 ' + ws.length + ' 题</button>' +
    '<button class="btn ghost" data-act="clearWrong">清空</button></div>';
}
function startWrongFiltered(){
  var ws = S.wrong.slice();
  var f = ui.wf || { y:"", c:"" };
  if(f.y) ws = ws.filter(function(i){ return (QS[i][5]||"").slice(0,4) === f.y; });
  if(f.c) ws = ws.filter(function(i){ return QS[i][0] === f.c; });
  if(!ws.length){ toast("这个筛选下没有错题"); return; }
  begin("wrong", shuffle(ws).slice(0,20), null);
}
function tile(v,l){ return '<div class="tile"><b>'+v+'</b><span>'+l+'</span></div>'; }
function meter(c){
  var s=catStats(c);
  var pct = s.n ? s.pct : 0;
  var color = s.n===0 ? "#39415a" : (s.pct>=80 ? "linear-gradient(90deg,#3ecf8e,#5b9dff)" : (s.pct>=50 ? "linear-gradient(90deg,#f2b53d,#5b9dff)" : "linear-gradient(90deg,#ff6b6b,#f2b53d)"));
  return '<div class="meter"><div class="nm">'+esc(c)+'</div>' +
    '<div class="tr"><i style="width:'+pct+'%;background:'+color+'"></i></div>' +
    '<div class="pc">'+(s.n?s.pct+'%':'—')+'</div></div>';
}
function navOn(tab){ return phase===tab ? "on" : ""; }

function applyTheme(){
  document.body.className = (S.settings.theme === "light") ? "light" : "dark";
  var b=$("theme"); if(b) b.textContent = (S.settings.theme === "light") ? "🌙" : "☀️";
}
function render(){
  var v=$("view");
  applyTheme();
  var bk=$("back"); if(bk) bk.style.display = (phase === "today") ? "none" : "block";
  $("nav").innerHTML = (phase==="today"||phase==="cat"||phase==="outline"||phase==="mine") ? navHTML() : "";

  if(phase === "today"){
    $("lbl").textContent = "今日"; $("right").textContent = totalQ() + " 题累计";
    setTrack(todayCount()/Math.max(1,S.settings.daily));
    var weak = weakCat(), ws = catStats(weak);
    var dl = daysLeft();
    v.innerHTML =
      '<div class="card enter" style="padding:18px">' +
        '<div class="big">' + (todayCount() >= S.settings.daily ? "今天的量够了 👍" : "先测一测，再练不会的") + '</div>' +
        '<div class="hint mt">不再从头背规则：先做题暴露薄弱点，只补你错的。</div>' +
        (dl !== null ? '<div class="hint mt">距 ' + esc(S.settings.examDate) + ' 还有 ' + dl + ' 天</div>' : '') +
      '</div>' +
      '<div class="tiles">' + tile(todayCount()+'/'+S.settings.daily,"今日题量") + tile(totalQ()?Math.round(totalRight()/totalQ()*100)+"%":"—","总正确率") + tile(streak(),"连续天数") + '</div>' +
      (S.diag ? '' : '<div class="pick cta" data-act="diag">' +
        '<div><div style="font-weight:650">先做 20 题摸底</div><div class="hint">两分钟，测出 8 个模块的水平</div></div><div class="go">开始 ›</div></div>') +
      '<div class="pick" data-act="daily"><div><div style="font-weight:650">每日一练 · ' + S.settings.daily + ' 题</div>' +
        '<div class="hint">混合出题，优先你当前最弱的「' + esc(weak) + '」（' + (ws.n?ws.pct+'%':'还没测') + '）</div></div><div class="go">练 ›</div></div>' +
      '<div class="pick" data-act="timed"><div><div style="font-weight:650">限时阅读 · 6 分钟</div>' +
        '<div class="hint">随机一篇阅读，限时做完，练考场节奏</div></div><div class="go">开始 ›</div></div>' +
      '<div class="pick" data-act="mock"><div><div style="font-weight:650">模拟考 · 20 题真题</div>' +
        '<div class="hint">随机抽题、按套卷统计得分，接近真实考试</div></div><div class="go">开考 ›</div></div>' +
      (todayWrong().length ? '<div class="pick" data-act="todayWrong"><div><div style="font-weight:650">今天错了 ' + todayWrong().length + ' 题</div>' +
        '<div class="hint">趁热回顾，明天就不容易忘</div></div><div class="go">回顾 ›</div></div>' : '') +
      '<div class="pick" data-act="weak"><div><div style="font-weight:650">弱项组卷 · 10 题</div>' +
        '<div class="hint">从最弱的三个模块里抽还没掌握的题</div></div><div class="go">开练 ›</div></div>' +
      '<div class="pick" data-act="wrong"><div><div style="font-weight:650">错题重练</div>' +
        '<div class="hint">错题本 ' + S.wrong.length + ' 题，答对两次才会移出</div></div><div class="go">练 ›</div></div>' +
      '<div class="sec"><h3>薄弱地图（最近正确率）</h3>' + CATS.map(meter).join("") +
        '<div class="hint mt">做错的模块会自动下沉，每日一练会优先出它。</div></div>';
    return;
  }

  if(phase === "cat"){
    $("lbl").textContent = "专项突破"; $("right").textContent = QS.length + " 道仿真题";
    setTrack(totalQ()?totalRight()/totalQ():0);
    v.innerHTML = '<div class="pick" data-act="papers"><div><div style="font-weight:650">按真题试卷练</div>' +
        '<div class="hint">' + Object.keys(papers()).length + ' 套卷，按年份和卷别整套做</div></div><div class="go">选择 ›</div></div>' +
      '<div class="hint" style="margin:14px 0 12px">或者按模块突破，连续做 8 题：</div>' +
      CATS.map(function(c){
        var s = catStats(c);
        var qn = byCat(c).length;
        return '<div class="pick" data-act="c" data-c="' + esc(c) + '">' +
          '<div><div style="font-weight:650">' + esc(c) + '</div>' +
          '<div class="hint">' + qn + ' 题 · ' + (s.n ? "正确率 " + s.pct + "%（" + s.n + " 题）" : "还没练过") + '</div></div>' +
          '<div class="go">' + (s.n ? s.pct + "%" : "去练") + ' ›</div></div>';
      }).join("");
    return;
  }

  if(phase === "quiz"){
    if(!ses || ses.i >= ses.list.length){ nav("result"); return; }
    var qid = ses.list[ses.i], q = QS[qid];
    $("lbl").textContent = ({diag:"摸底",wrong:"错题重练",cat:ses.cat,paper:ses.cat,weak:"弱项组卷",mock:"模拟考",timed:"限时阅读",todayWrong:"今日错题回顾"})[ses.mode] || "每日一练";
    $("right").textContent = (ses.i+1) + " / " + ses.list.length;
    setTrack(ses.i / Math.max(1, ses.list.length));
    var opts = q[2].map(function(o,k){
      var cls = "opt enter";
      if(ses.picked !== null) cls += k === q[3] ? " ok" : (k === ses.picked ? " no" : "");
      return '<button class="' + cls + '" data-act="pick" data-i="' + k + '"><span class="k">' + "ABCDEFG".charAt(k) + '</span><span>' + esc(o) + '</span></button>';
    }).join("");
    v.innerHTML =
      '<div class="srcrow"><span class="src">' + esc(srcOf(qid)) + ' · ' + esc(q[0]) + (NOS[qid] ? ' · 第 ' + NOS[qid] + ' 题' : '') + '</span>' +
        (ttsOk() ? '<button class="spkmini" data-act="speak" data-w="' + esc(q[1]) + '">🔊 读题</button>' : '') +

document.addEventListener("click", function(ev){
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if(!el) return;
  var act = el.getAttribute("data-act");
  if(act === "speak"){ ev.stopPropagation(); speakText(el.getAttribute("data-w")||""); return; }
  if(act === "sheetYes"){ var fn = pendingOk; closeSheet(); if(fn) fn(); return; }
  if(act === "sheetNo"){ closeSheet(); return; }
  if(act === "theme"){ S.settings.theme = (S.settings.theme === "light") ? "dark" : "light"; save(); applyTheme(); return; }
  if(act === "tab"){ ui.search=""; stopTick(); nav(el.getAttribute("data-tab")); return; }
  if(act === "daily"){ startDaily(); return; }
  if(act === "weak"){ startWeak(); return; }
  if(act === "mock"){ startMock(); return; }
  if(act === "timed"){ startTimedReading(); return; }
  if(act === "todayWrong"){ startTodayWrong(); return; }
  if(act === "diag"){ startDiag(); return; }
  if(act === "wrong"){ startWrong(); return; }
  if(act === "c"){ startCat(el.getAttribute("data-c")); return; }
  if(act === "papers"){ nav("papers"); return; }
  if(act === "paper"){ var src=el.getAttribute("data-src"); begin("paper", shuffle((papers()[src]||[]).slice()), src); return; }
  if(act === "pick"){
    if(!ses || ses.picked !== null) return;
    var k=parseInt(el.getAttribute("data-i"),10), qid=ses.list[ses.i], q=QS[qid];
    ses.picked=k;
    var ok = k===q[3];
    if(ok) ses.right++; else ses.wrongIds.push(qid);
    record(qid, ok);
    render();
    return;
  }
  if(act === "next"){
    if(!ses) return;
    ses.i++; ses.picked=null;
    if(ses.i >= ses.list.length){ nav("result"); return; }
    render();
    return;
  }
  if(act === "detail"){ ui.detail=parseInt(el.getAttribute("data-i"),10); nav("detail"); return; }
  if(act === "detailQ"){ ui.q=parseInt(el.getAttribute("data-q"),10); nav("detailQ"); return; }
  if(act === "back2res"){
    if(ses && ses.i >= ses.list.length) nav("result"); else nav("mine");
    return;
  }
  if(act === "back"){ stopTick(); if(history.length > 1) history.back(); else nav("today"); return; }
  if(act === "wfilter"){ ui.wf = { y: el.getAttribute("data-y")||"", c: el.getAttribute("data-c")||"" }; render(); return; }
  if(act === "copydata"){
    var t=$("dump"); if(t){ t.select(); try{ document.execCommand("copy"); toast("已复制到剪贴板"); }catch(e){ toast("复制失败，请长按选择"); } }
    return;
  }
  if(act === "importdata"){
    var ta=$("dump"); if(!ta) return;
    try{
      var obj=JSON.parse(ta.value);
      if(!obj || !obj.q) throw new Error("格式不对");
      askConfirm("导入数据", "会覆盖当前全部学习进度，确定？", "导入", function(){
        var keep=S.settings;
        S=obj;
        if(!S.settings) S.settings=keep; else { S.settings.theme=S.settings.theme||keep.theme; }
        if(!S.cat) S.cat={};
        if(!S.wrong) S.wrong=[];
        if(!S.log) S.log={};
        save(); phase="mine"; render(); toast("导入成功");
      });
    }catch(e){ toast("导入失败：" + e.message); }
    return;
  }
  if(act === "wfilter"){ ui.wf = { y: el.getAttribute("data-y")||"", c: el.getAttribute("data-c")||"" }; render(); return; }
  if(act === "wrongFiltered"){ startWrongFiltered(); return; }
  if(act === "ttsTest"){ speakText("Hello, this is a reading test."); return; }
  if(act === "clearWrong"){
    askConfirm("清空错题本", "会清空所有错题记录，不影响练习统计。", "清空", function(){
      S.wrong=[]; save(); render(); toast("错题本已清空");
    });
    return;
  }
  if(act === "reset"){
    askConfirm("清空全部数据", "练习记录、正确率、错题本都会清空，无法恢复。", "全部清空", function(){
      var keep={ daily:S.settings.daily, examDate:S.settings.examDate, theme:S.settings.theme };
      S=initStore(); S.settings=keep; save(); phase="today"; try{ history.replaceState({phase:"today"},""); }catch(e){} render(); toast("已清空");
    });
    return;
  }
});

function ttsStatus(){
  if(!window.AndroidNative) return -1;
  try { return AndroidNative.status ? AndroidNative.status() : (AndroidNative.available() ? 0 : 1); } catch(e){ return -1; }
}
function ttsOk(){
  var st = ttsStatus();
  if(st === 0 || st === 2) return true;
  if(st === -1 && ("speechSynthesis" in window) && window.speechSynthesis) return true;
  return false;
}
function ttsHint(){
  var st = ttsStatus();
  if(st === 0 || st === 2) return "朗读引擎：可用";
  if(st === 1) return "朗读引擎：不可用（系统未安装文字转语音服务）";
  return "朗读引擎：未连接（网页预览模式）";
}
function speakText(t){
  t = String(t || "").trim();
  if(!t) return;
  if(window.AndroidNative && AndroidNative.speak){
    var st = ttsStatus();
    if(st === 0 || st === 2){ try { AndroidNative.speak(t); return; } catch(e){} }
    if(st === 1){
      toast("系统没有可用的文字转语音引擎：设置 → 语言与输入法 → 文字转语音，安装或启用一个引擎");
      return;
    }
  }
  if("speechSynthesis" in window && window.speechSynthesis){
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(t); u.lang="en-US"; u.rate=.9;
      speechSynthesis.speak(u); return;
    }catch(e){}
  }
  toast("当前环境无法朗读（请在 App 内使用）");
}

window.addEventListener("popstate", function(ev){
  var p = (ev.state && ev.state.phase) ? ev.state.phase : "today";
  phase = p;
  render();
});
loadStore();
try { history.replaceState({ phase: phase }, ""); } catch(e){}
render();
</script>
</body>
</html>
