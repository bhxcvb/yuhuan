name: 校验
on:
  push:
  pull_request:

jobs:
  unit:
    name: 基础回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 脚本语法
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('web/index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('找不到 script');fs.writeFileSync('/tmp/app.js',m[1]);"
          node --check /tmp/app.js
      - name: 构建一致性（模板 ↔ 产物）
        run: node tools/build-app.js --check

      - name: 题库结构校验
        run: node tools/extract-data.js /tmp/data.json && node tools/validate-data.js /tmp/data.json

      - name: 基础回归测试
        run: node tests/basic.test.js

  e2e:
    name: 端到端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: 运行端到端测试
        run: python tests/e2e.py
