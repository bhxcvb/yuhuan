name: 校验
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 提取并校验应用脚本语法
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('web/index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('找不到 script');fs.writeFileSync('/tmp/app.js',m[1]);"
          node --check /tmp/app.js
          echo "语法 OK"
      - name: 校验题库结构
        run: |
          node -e "
          const fs=require('fs');const src=fs.readFileSync('/tmp/app.js','utf8');
          const m=src.match(/var QS = (\[.*?\]);\nvar TR/s);
          if(!m) throw new Error('找不到 QS');
          const QS=JSON.parse(m[1]);
          let bad=0;
          for(const q of QS){
            if(!Array.isArray(q)||q.length<5) bad++;
            if(!Array.isArray(q[2])||q[2].length<2) bad++;
            if(typeof q[3]!=='number'||q[3]<0||q[3]>=q[2].length) bad++;
          }
          if(bad>0) throw new Error('题目结构异常 '+bad+' 条');
          console.log('题库 '+QS.length+' 题，结构全部合法');
          "
